ë sendi të ekzistojë kur bëhet, sepse zbatohet pas vdekjes. Shembull: «Frutat e pemëve të mia të vitit të ardhshëm janë për filanin».", "f": "٧٣"}, {"id": "D042", "k": 28, "lloji": "mcq", "q": "أوصى رجلٌ لآخر بمئة درهمٍ لا يملكها حين الوصيّة. فما حكمُ الوصيّة؟", "o": ["باطلة، لأنه لا يملكها", "صحيحة", "صحيحة إن أجازها الورثة فقط", "موقوفة على إذن الحاكم"], "a": 1, "q_sq": "Një njeri i la me testament tjetrit njëqind dirhemë që nuk i zotëron në kohën e testamentit. Cila është dispozita e testamentit?", "o_sq": ["I pavlefshëm, sepse nuk i zotëron", "I vlefshëm", "I vlefshëm vetëm nëse e miratojnë trashëgimtarët", "I pezulluar deri në lejen e gjykatësit"], "pse_ar": "لقول المؤلف: «وتصح بما لا يقدر على تسليمه كالطير في الهواء والسمك في الماء، وبما لا يملكه كمئة درهم لا يملكها».", "pse_sq": "E sakta: i vlefshëm. Autori thotë: «Ai është i vlefshëm me atë që nuk mund ta dorëzojë, si zogu në ajër dhe peshku në ujë; me atë që nuk e zotëron, si njëqind dirhemë që nuk i ka». Autori nuk e kushtëzon me miratimin e trashëgimtarëve apo me lejen e gjykatësit. Shembull: «I lë filanit 1.000 €», ndërsa tani nuk i ka këto para.", "f": "٧٣"}, {"id": "D043", "k": 28, "lloji": "mcq", "q": "أوصى رجلٌ لزيدٍ بعبدٍ من عبيده ولم يعيّنه، ولعمرٍو بجزءٍ من ماله ولم يبيّنه. فما الحكم؟", "o": ["يُعيَّن ذلك لكلٍّ منهما بالقرعة", "تبطل الوصيّتان للجهالة", "تصحّان، ويعطيهما الورثة ما شاؤوا", "يختار كلٌّ منهما ما شاء لنفسه"], "a": 2, "q_sq": "Një njeri i la me testament Zejdit një rob nga robërit e tij pa e përcaktuar, dhe Amrit një pjesë (xhuz') nga pasuria e tij pa e sqaruar. Cila është dispozita?", "o_sq": ["Caktohet me short për secilin prej tyre", "Të dy testamentet prishen për shkak të paqartësisë", "Janë të vlefshëm, dhe trashëgimtarët u japin atë që duan", "Secili prej tyre zgjedh për vete atë që do"], "pse_ar": "لقول المؤلف: «وبغير معيَّن كعبد من عبيده، ويعطيه الورثةُ منهم ما شاؤوا، وبالمجهول كحظ من ماله أو جزء، ويعطيه الورثة ما شاؤوا».", "pse_sq": "E sakta: janë të vlefshëm dhe trashëgimtarët u japin atë që duan. Autori thotë se testamenti është i vlefshëm «me diçka të papërcaktuar, si një rob nga robërit e tij, dhe trashëgimtarët i japin cilin të duan prej tyre; dhe me diçka të panjohur, si një pjesë (hadhdh) nga pasuria e tij ose një copë (xhuz'), dhe trashëgimtarët i japin sa të duan». Shorti është dispozita e lirimit të një robi të papërcaktuar në sëmundjen e vdekjes, jo e testamentit për dikë. Zgjedhja nuk u takon atyre që u është lënë testamenti, por trashëgimtarëve. Shembull: «I lë filanit një nga makinat e mia»: trashëgimtarët zgjedhin cilën t'i japin.", "f": "٧٣"}, {"id": "D044", "k": 28, "lloji": "mcq", "q": "خلّف رجلٌ ثلاثةَ بنين، وأوصى لزيدٍ بمثل نصيب أحدهم. فكم لزيدٍ من المال؟", "o": ["الربع", "الثلث", "السدس", "الخُمس"], "a": 0, "q_sq": "Një njeri la pas tre djem dhe i la me testament Zejdit sa pjesa e njërit prej tyre. Sa merr Zejdi nga pasuria?", "o_sq": ["Të katërtën", "Të tretën", "Të gjashtën", "Të pestën"], "pse_ar": "لقول المؤلف: «فلو خلَّف ثلاثة بنين ووصى بمثل نصيب أحدهم فله الربع».", "pse_sq": "E sakta: të katërtën. Autori thotë: «Nëse ia lë me testament sa pjesa e njërit nga trashëgimtarët e tij, ai merr sa pjesa e më të voglit prej tyre, e cila i shtohet ndarjes (së trashëgimisë); kështu, nëse lë tre djem dhe e lë me testament sa pjesa e njërit prej tyre, ai merr të katërtën». Zejdi llogaritet si një «djalë» i katërt: pasuria ndahet në 4, secili djalë 1/4 dhe Zejdi 1/4. E treta do të ishte pjesa e djalit pa e shtuar Zejdin në ndarje, gjë që është në kundërshtim me fjalën «i shtohet ndarjes». Shembull: pasuria 120.000 €: Zejdi 30.000 €, secili djalë 30.000 €.", "f": "٧٣"}, {"id": "D045", "k": 28, "lloji": "mcq", "q": "خلّف رجلٌ ابناً وبنتاً – وفريضتُهم من ثلاثة: للابن سهمان وللبنت سهم – وأوصى لزيدٍ بمثل نصيب أحد ورثته. فكم لزيدٍ من المال؟", "o": ["خُمسا المال", "ثلثُ المال", "نصفُ المال", "ربعُ المال"], "a": 3, "q_sq": "Një njeri la pas një djalë dhe një vajzë – ndarja e tyre është nga tre: djali dy pjesë, vajza një pjesë – dhe i la me testament Zejdit sa pjesa e njërit nga trashëgimtarët e tij. Sa merr Zejdi nga pasuria?", "o_sq": ["Dy të pestat e pasurisë", "Të tretën e pasurisë", "Gjysmën e pasurisë", "Të katërtën e pasurisë"], "pse_ar": "لقول المؤلف: «وإن وصى له بمثل نصيب أحد ورثته فله مثل أقلِّهم نصيبا يُزاد على الفريضة».", "pse_sq": "E sakta: të katërtën. Autori thotë: «Nëse ia lë me testament sa pjesa e njërit nga trashëgimtarët e tij, ai merr sa pjesa e më të voglit prej tyre, e cila i shtohet ndarjes». Më e vogla është pjesa e vajzës (1 nga 3). I shtohet ndarjes: 3 + 1 = 4; Zejdi 1/4, djali 2/4, vajza 1/4. Dy të pestat do të dilnin po të merrte sa djali (3 + 2 = 5), që është në kundërshtim me «sa më i vogli». E treta do të dilte po të mos i shtohej ndarjes. Shembull: pasuria 40.000 €: Zejdi 10.000 €, djali 20.000 €, vajza 10.000 €.", "f": "٧٣"}, {"id": "D046", "k": 28, "lloji": "mcq", "q": "خلّف رجلٌ أمًّا وثلاثةَ بنين، وأوصى لزيدٍ بمثل نصيب ابن. فمِن كم تصحّ المسألة مع الوصيّة؟", "o": ["من ثمانية عشر", "من ثلاثة وعشرين", "من أربعة وعشرين", "من واحدٍ وعشرين"], "a": 1, "q_sq": "Një njeri la pas nënën dhe tre djem, dhe i la me testament Zejdit sa pjesa e një djali. Nga sa pjesë zgjidhet çështja bashkë me testamentin?", "o_sq": ["Nga tetëmbëdhjetë", "Nga njëzet e tre", "Nga njëzet e katër", "Nga njëzet e një"], "pse_ar": "لقول المؤلف: «فإن كان معهم ذو فرض كأم صحَّحتَ مسألة الورثة بدون الوصية من ثمانية عشر، وزدتَ عليها بمثل نصيب ابن فصارت من ثلاثة وعشرين».", "pse_sq": "E sakta: nga njëzet e tre. Autori thotë: «e nëse bashkë me ta ka edhe një me pjesë të caktuar, si nëna, e zgjidh çështjen e trashëgimtarëve pa testamentin nga tetëmbëdhjetë (pjesë), dhe i shton asaj sa pjesa e një djali, kështu bëhet nga njëzet e tre». Pa testament: nëna 3 (1/6 e 18), secili djalë 5. Me testament shtohen 5 (pjesa e një djali): 18 + 5 = 23; nëna 3, secili djalë 5, Zejdi 5. Tetëmbëdhjetë është zgjidhja pa testament; 24 do të dilte po të shtohej pjesa e nënës (6 × 4), gjë që autori s'e thotë.", "f": "٧٣"}, {"id": "D047", "k": 28, "lloji": "mcq", "q": "خلّف رجلٌ ثلاثةَ بنين، وأوصى لزيدٍ بمثل نصيب أحدهم، ولعمرٍو بسدس باقي المال. فكم لعمرٍو على طريقة المؤلف؟", "o": ["خمسةُ أسهمٍ من ثلاثة وعشرين", "سهمٌ واحدٌ من تسعة وستين", "ثلاثةُ أسهمٍ من ثلاثة وعشرين", "أربعةُ أسهمٍ من أربعة وعشرين"], "a": 2, "q_sq": "Një njeri la pas tre djem, i la me testament Zejdit sa pjesa e njërit prej tyre, dhe Amrit një të gjashtën e pasurisë së mbetur. Sa merr Amri sipas metodës së autorit?", "o_sq": ["Pesë pjesë nga njëzet e tre", "Një pjesë nga gjashtëdhjetë e nëntë", "Tri pjesë nga njëzet e tre", "Katër pjesë nga njëzet e katër"], "pse_ar": "لقول المؤلف: «ولو وصى بمثل نصيب أحدهم ولآخرَ بسدسِ باقي المال جعلتَ صاحب سدس الباقي كذي فرض وصححتَها كالتي قبلها».", "pse_sq": "E sakta: tri pjesë nga njëzet e tre. Autori thotë: «Nëse e lë me testament sa pjesa e njërit prej tyre, dhe për një tjetër një të gjashtën e pasurisë së mbetur, atë me të gjashtën e mbetjes e konsideron si dikë me pjesë të caktuar dhe e zgjidh çështjen si ajo para saj». Pra Amri zë vendin e nënës në shembullin e mëparshëm: 18 pjesë (Amri 3, secili djalë 5), pastaj shtohet pjesa e një djali për Zejdin: 23. Amri 3, Zejdi 5, secili djalë 5. Verifikim: mbetja pas Zejdit = 23 − 5 = 18, e gjashta e saj = 3. Pesë pjesë është pjesa e Zejdit; 1 nga 69 është rasti i «së gjashtës së mbetjes së së tretës».", "f": "٧٣"}, {"id": "D048", "k": 28, "lloji": "mcq", "q": "خلّف رجلٌ ثلاثةَ بنين، وأوصى لزيدٍ بمثل نصيب أحدهم، ولعمرٍو بسدس باقي الثلث. فمِن كم تصحّ المسألة، وكم لعمرٍو منها؟", "o": ["من تسعة وستين، ولعمرٍو سهمٌ واحد", "من ثلاثة وعشرين، ولعمرٍو ثلاثة أسهم", "من تسعة وستين، ولعمرٍو ثلاثة أسهم", "من ستة وأربعين، ولعمرٍو سهمان"], "a": 0, "q_sq": "Një njeri la pas tre djem, i la me testament Zejdit sa pjesa e njërit prej tyre, dhe Amrit një të gjashtën e mbetjes së së tretës. Nga sa pjesë zgjidhet çështja dhe sa merr Amri prej saj?", "o_sq": ["Nga gjashtëdhjetë e nëntë, dhe Amri merr një pjesë", "Nga njëzet e tre, dhe Amri merr tri pjesë", "Nga gjashtëdhjetë e nëntë, dhe Amri merr tri pjesë", "Nga dyzet e gjashtë, dhe Amri merr dy pjesë"], "pse_ar": "لقول المؤلف: «فإن كانت وصية الثاني بسدس باقي الثلث صححتَها كما قلنا سواء، ثم زدتَ عليها مثليها فتصير تسعة وستين وتعطي صاحب السدس سهما واحداً والباقي بين البنين والوصيِّ الآخر أرباعاً».", "pse_sq": "E sakta: nga 69, dhe Amri merr një pjesë. Autori thotë: «e nëse testamenti i të dytit është me një të gjashtën e mbetjes së të tretës, e zgjidh njësoj siç thamë, pastaj i shton asaj dyfishin e saj, kështu bëhet gjashtëdhjetë e nëntë, dhe i jep atij me të gjashtën një pjesë, ndërsa pjesën tjetër e ndan ndërmjet djemve dhe (atij me) testamentin tjetër në të katërta». 23 + 46 = 69; Amri 1; mbeten 68, që ndahen në 4: secili djalë 17 dhe Zejdi 17. Verifikim: e treta = 23; mbetja e saj pas Zejdit = 23 − 17 = 6; e gjashta e saj = 1. Njëzet e tre me tri pjesë është rasti i «së gjashtës së mbetjes së pasurisë».", "f": "٧٣"}, {"id": "D049", "k": 28, "lloji": "tf", "q": "خلّف رجلٌ أربعةَ بنين، وأوصى لزيدٍ بمثل نصيب أحدهم، ولعمرٍو بسدس باقي الثلث؛ فلعمرٍو ممّا صحّت منه المسألة ثلاثةُ أسهم.", "a": 1, "q_sq": "Një njeri la pas katër djem, i la me testament Zejdit sa pjesa e njërit prej tyre, dhe Amrit një të gjashtën e mbetjes së së tretës; Amri merr tri pjesë nga numri prej të cilit zgjidhet çështja.", "pse_ar": "بل له سهمان، لقول المؤلف: «فإن كانوا أربعة أعطيتَه مما صحت منه المسألة سهمين، وإن كانوا خمسة فله ثلاثة».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «Nëse djemtë janë më shumë se tre, i shton atij me të gjashtën e mbetjes sipas masës së shtimit të tyre: nëse janë katër, i jep dy pjesë nga ajo nga e cila është zgjidhur çështja; e nëse janë pesë, ai merr tre». Pra me katër djem Amri merr dy pjesë; tri pjesë merr kur djemtë janë pesë. Verifikim: me katër djem çështja zgjidhet nga 87: secili djalë 17, Zejdi 17, Amri 2 (4 × 17 + 17 + 2 = 87); e treta = 29, mbetja e saj pas Zejdit = 12, e gjashta e saj = 2.", "f": "٧٤"}, {"id": "D050", "k": 28, "lloji": "mcq", "q": "خلّف رجلٌ خمسةَ بنين، وأوصى لزيدٍ بمثل نصيب أحدهم، ولعمرٍو بثلث باقي الربع. فكم سهماً لعمرٍو ممّا صحّت منه المسألة؟", "o": ["سهمٌ واحد", "سهمان", "ثلاثةُ أسهم", "خمسةُ أسهم"], "a": 1, "q_sq": "Një njeri la pas pesë djem, i la me testament Zejdit sa pjesa e njërit prej tyre, dhe Amrit një të tretën e mbetjes së së katërtës. Sa pjesë merr Amri nga numri prej të cilit zgjidhet çështja?", "o_sq": ["Një pjesë", "Dy pjesë", "Tri pjesë", "Pesë pjesë"], "pse_ar": "لقول المؤلف: «وإن كانت الوصية بثلث باقي الربع والبنون أربعة فله سهم واحد، وإن زاد البنون على أربعة زدتَه بكل واحد سهما».", "pse_sq": "E sakta: dy pjesë. Autori thotë: «Nëse testamenti është me një të tretën e mbetjes së të katërtës dhe djemtë janë katër, ai merr një pjesë; e nëse djemtë janë më shumë se katër, i shton për secilin një pjesë». Djemtë këtu janë pesë, pra një më shumë se katër: 1 + 1 = 2. Një pjesë është rasti i katër djemve; tri pjesë do të ishin me gjashtë djem. Verifikim: çështja zgjidhet nga 68: secili djalë 11, Zejdi 11, Amri 2 (5 × 11 + 11 + 2 = 68); e katërta = 17, mbetja e saj pas Zejdit = 6, e treta e saj = 2.", "f": "٧٤"}, {"id": "D051", "k": 28, "lloji": "tf", "q": "أوصى رجلٌ لزيدٍ بضِعفَي نصيب ابنه؛ فلزيدٍ مِثلا نصيب الابن.", "a": 0, "q_sq": "Një njeri i la me testament Zejdit dy dyfishat e pjesës së djalit të tij; Zejdi merr dy herë sa pjesa e djalit.", "pse_ar": "لقول المؤلف: «وإن وصى بضعف نصيب وارث أو ضعفيه فله مثلاَ نصيبه، وثلاثة أضعاف ثلاثة أمثاله».", "pse_sq": "Pohimi është i saktë. Autori thotë: «Nëse e lë me testament dyfishin e pjesës së një trashëgimtari, ose dy dyfishat e saj, ai merr dyfishin e pjesës së tij; e për trefishin, tre herë sa ajo». Pra sipas autorit «dyfishi» dhe «dy dyfishat» japin të njëjtën gjë: dy herë sa pjesa e djalit. Shembull: nëse pjesa e djalit është 10.000 €, Zejdi merr 20.000 €; me «trefishin» do të merrte 30.000 €.", "f": "٧٤"}, {"id": "D052", "k": 28, "lloji": "mcq", "q": "خلّف رجلٌ ثلاثةَ بنين، وأوصى لمسجدٍ بربع ماله، وتركتُه ألفٌ ومئتا درهم. فكم يأخذ كلُّ ابن؟", "o": ["أربعمئة درهم", "مئتان وخمسون درهماً", "ثلاثمئة درهم", "ثلاثمئة وخمسون درهماً"], "a": 2, "q_sq": "Një njeri la pas tre djem, la me testament për një xhami të katërtën e pasurisë së tij, dhe trashëgimia e tij është një mijë e dyqind dirhemë. Sa merr secili djalë?", "o_sq": ["Katërqind dirhemë", "Dyqind e pesëdhjetë dirhemë", "Treqind dirhemë", "Treqind e pesëdhjetë dirhemë"], "pse_ar": "لقول المؤلف: «وإن وصى بجزء مشاع كثلث أو ربع أخذتَه من مخرجه وقسمتَ الباقي على الورثة».", "pse_sq": "E sakta: treqind dirhemë. Autori thotë: «Nëse e lë me testament një pjesë të përbashkët, si një e treta ose një e katërta, e merr atë nga emëruesi i saj dhe pjesën tjetër e ndan ndërmjet trashëgimtarëve». Emëruesi i së katërtës është 4: pasuria ndahet në 4 pjesë nga 300; xhamia merr 1 pjesë (300), mbeten 900 për tre djemtë: 300 secili. Katërqind do të ishte ndarja pa testament; dyqind e pesëdhjetë dhe treqind e pesëdhjetë nuk dalin nga metoda e autorit.", "f": "٧٤"}, {"id": "D053", "k": 28, "lloji": "mcq", "q": "أوصى رجلٌ لزيدٍ بثلث ماله، ولعمرٍو بربعه، فردّ الورثةُ ما زاد على الثلث، وتركتُه واحدٌ وعشرون ألفَ درهم. فكم لزيد؟", "o": ["أربعةُ آلاف درهم", "سبعةُ آلاف درهم", "ثلاثةُ آلاف وخمسمئة درهم", "ثلاثةُ آلاف درهم"], "a": 0, "q_sq": "Një njeri i la me testament Zejdit të tretën e pasurisë së tij dhe Amrit të katërtën e saj; trashëgimtarët e refuzuan atë që kalon të tretën, dhe trashëgimia e tij është njëzet e një mijë dirhemë. Sa merr Zejdi?", "o_sq": ["Katër mijë dirhemë", "Shtatë mijë dirhemë", "Tre mijë e pesëqind dirhemë", "Tre mijë dirhemë"], "pse_ar": "لقول المؤلف: «وإن وصى بجزأين كثلث وربع أخذتَهما من مخرجهما، وهو اثنا عشر وقسمتَ الباقي على الورثة، فإن ردُّوا جعلتَ سهام الوصية ثلث المال وللورثة ضعف ذلك».", "pse_sq": "E sakta: katër mijë dirhemë. Autori thotë: «Nëse e lë me testament dy pjesë, si një e treta dhe një e katërta, i merr ato nga emëruesi i tyre (i përbashkët), që është dymbëdhjetë, dhe pjesën tjetër e ndan ndërmjet trashëgimtarëve; e nëse ata refuzojnë, pjesët e testamentit i bën një të tretën e pasurisë, dhe për trashëgimtarët dyfishin e saj». Nga 12: Zejdi 4, Amri 3, gjithsej 7. Me refuzim 7 pjesët bëhen e treta, trashëgimtarët marrin 14: gjithsej 21. Pjesa = 21.000 / 21 = 1.000; Zejdi 4.000, Amri 3.000, trashëgimtarët 14.000. Shtatë mijë do të ishte e gjithë e treta ose pjesa e Zejdit me miratim; tre mijë e pesëqind do të ishte ndarje e barabartë, jo sipas pjesëve 4 : 3.", "f": "٧٤"}, {"id": "D054", "k": 28, "lloji": "mcq", "q": "أوصى رجلٌ لزيدٍ بدارٍ معيّنة قيمتُها ستّون ألفاً، وثلثُ ماله أربعون ألفاً، ولم يُجز الورثة. فما لزيد؟", "o": ["الدارُ كلُّها", "ثلثا الدار", "نصفُ الدار", "لا شيء، لبطلان الوصيّة"], "a": 1, "q_sq": "Një njeri i la me testament Zejdit një shtëpi të caktuar me vlerë gjashtëdhjetë mijë, ndërsa e treta e pasurisë së tij është dyzet mijë, dhe trashëgimtarët nuk e miratuan. Çfarë merr Zejdi?", "o_sq": ["Të gjithë shtëpinë", "Dy të tretat e shtëpisë", "Gjysmën e shtëpisë", "Asgjë, sepse testamenti prishet"], "pse_ar": "لقول المؤلف: «وإن وصى بمعين من ماله فلم يخرج من الثلث فللموصى له قدر الثلث إلا أن يجيز الورثة».", "pse_sq": "E sakta: dy të tretat e shtëpisë. Autori thotë: «Nëse e lë me testament një send të caktuar nga pasuria e tij dhe ai nuk përfshihet në të tretën, ai të cilit i është lënë merr sa e treta, përveç nëse trashëgimtarët e miratojnë». Sa e treta = 40.000 nga një shtëpi që vlen 60.000, pra 2/3 e saj. Të gjithë shtëpinë do ta merrte vetëm me miratimin e trashëgimtarëve; testamenti nuk prishet, por kufizohet në të tretën.", "f": "٧٤"}, {"id": "D055", "k": 28, "lloji": "mcq", "q": "أوصى رجلٌ لزيدٍ بثلث ماله، ولعمرٍو بجميع ماله، وتركتُه ألفٌ ومئتا دينار، فردّ الورثةُ عليهما. فكم لعمرٍو؟", "o": ["تسعمئة دينار", "أربعمئة دينار", "مئتا دينار", "ثلاثمئة دينار"], "a": 3, "q_sq": "Një njeri i la me testament Zejdit të tretën e pasurisë së tij dhe Amrit të gjithë pasurinë e tij; trashëgimia e tij është një mijë e dyqind dinarë, dhe trashëgimtarët ua refuzuan. Sa merr Amri?", "o_sq": ["Nëntëqind dinarë", "Katërqind dinarë", "Dyqind dinarë", "Treqind dinarë"], "pse_ar": "لقول المؤلف: «ضممتَ الثلث إلى المال فصار أربعة أثلاث وقسمتَ التركة بينهما على أربعة إن أجيز لهما، والثلث على أربعة إن رُدَّ عليهما».", "pse_sq": "E sakta: treqind dinarë. Autori thotë: «Nëse testamentet e tejkalojnë pasurinë, si njeriu që ia lë me testament të tretën e pasurisë së tij një njeriu dhe tjetrit të gjithën, e bashkon të tretën me pasurinë dhe bëhen katër të treta, dhe trashëgiminë e ndan ndërmjet tyre në katër pjesë, nëse u miratohet atyre; e nëse u refuzohet, (ndan) të tretën në katër pjesë». E treta = 400; ndahet në 4: Zejdi 1 pjesë (100), Amri 3 pjesë (300). Nëntëqind do të ishte pjesa e Amrit me miratim (1.200 / 4 × 3); katërqind është e gjithë e treta.", "f": "٧٤"}, {"id": "D056", "k": 28, "lloji": "mcq", "q": "أوصى رجلٌ بسيّارته لزيد، ثم أوصى بها لعمرٍو. وأوصى آخرُ بداره لزيد، ثم قال: ما أوصيتُ به لزيدٍ فهو لعمرٍو. فما الحكم؟", "o": ["السيّارة بينهما، والدار لعمرٍو وحده", "السيّارة لعمرٍو وحده، والدار بينهما", "السيّارة بينهما، والدار بينهما", "السيّارة لعمرٍو وحده، والدار لعمرٍو وحده"], "a": 0, "q_sq": "Një njeri ia la me testament makinën e tij Zejdit, pastaj ia la të njëjtën Amrit. Një tjetër ia la me testament shtëpinë e tij Zejdit, pastaj tha: «Ajo që ia lashë me testament Zejdit, i takon Amrit». Cila është dispozita?", "o_sq": ["Makina është mes tyre, shtëpia është vetëm e Amrit", "Makina është vetëm e Amrit, shtëpia është mes tyre", "Makina është mes tyre, shtëpia është mes tyre", "Makina është vetëm e Amrit, shtëpia është vetëm e Amrit"], "pse_ar": "لقول المؤلف: «ولو وصى بمعين لرجل ثم وصى به لآخر أو أوصى به إلى رجل ثم أوصى إلى آخر فهو بينهما، وإن قال: ما أوصيت به للأول فهو للثاني، بطلت وصية الأول».", "pse_sq": "E sakta: makina është mes tyre, shtëpia vetëm e Amrit. Autori thotë: «Nëse ia lë me testament një send të caktuar një njeriu e pastaj ia lë të njëjtin dikujt tjetër, ose e ngarkon dikë me të (si administrues) e pastaj ngarkon një tjetër, ai është ndërmjet të dyve; e nëse thotë: ‹Ajo që ia lashë me testament të parit, i takon të dytit›, prishet testamenti i të parit». Te makina, testamenti i dytë nuk e anuloi të parin shprehimisht, prandaj ndahet. Te shtëpia, ai e kaloi qartë nga i pari te i dyti, prandaj testamenti i Zejdit prishet. Po kështu, nëse ngarkon dy veta njëri pas tjetrit si vasij për të njëjtën gjë, ata janë të dy bashkë.", "f": "٧٤"}, {"id": "D057", "k": 29, "lloji": "mcq", "q": "أوصى رجلٌ أن يُشترى عبدُ زيدٍ بمئةٍ فيُعتق، فأبى زيدٌ أن يبيعه. فلمن المئة؟", "o": ["تُصرف في شراء عبدٍ آخر يُعتق", "تُدفع إلى العبد نفسه", "للورثة", "تُدفع إلى زيدٍ سيّدِ العبد"], "a": 2, "q_sq": "Një njeri la me testament që të blihet robi i Zejdit me njëqind (dirhemë) dhe të lirohet, por Zejdi refuzoi ta shesë. Të kujt janë njëqindëshja?", "o_sq": ["Shpenzohen për të blerë një rob tjetër që lirohet", "I jepen vetë robit", "U takojnë trashëgimtarëve", "I jepen Zejdit, zotërisë së robit"], "pse_ar": "لقول المؤلف: «إذا بطلت الوصية أو بعضُها رجع إلى الورثة: فلو وصى أن يُشترى عبدُ زيد بمئة فيعتق فمات أو لم يبعه سيده فالمئة للورثة».", "pse_sq": "E sakta: u takojnë trashëgimtarëve. Autori thotë: «Kur prishet testamenti ose një pjesë e tij, ai (sendi) u kthehet trashëgimtarëve: nëse e lë me testament që të blihet robi i Zejdit me njëqind dhe të lirohet, e ai (robi) vdes ose zotëria i tij nuk e shet, njëqindëshja u takon trashëgimtarëve». Testamenti ishte për një rob të caktuar; kur qëllimi bëhet i pamundur, testamenti prishet dhe nuk kalon te një rob tjetër, as te robi, as te zotëria i tij. Po kështu nëse robi vdes para se të blihet.", "f": "٧٤"}, {"id": "D058", "k": 29, "lloji": "tf", "q": "أوصى رجلٌ بمئةٍ تُنفق على فرسٍ حبيس، فمات الفرس؛ فتُصرف المئة في النفقة على فرسٍ حبيسٍ آخر.", "a": 1, "q_sq": "Një njeri la me testament njëqind që të shpenzohen për një kalë habis (të vakëfuar për xhihad), dhe kali ngordhi; njëqindëshja shpenzohet për një kalë tjetër të vakëfuar.", "pse_ar": "بل هي للورثة، لقول المؤلف: «وإن وصى بمئة تُنفق على فرس حبيس فمات الفرس فهي للورثة».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «nëse e lë me testament njëqind që të shpenzohen për një kalë të vakëfuar dhe kali ngordh, ato u takojnë trashëgimtarëve». Kjo bie nën rregullin: «Kur prishet testamenti ose një pjesë e tij, ai (sendi) u kthehet trashëgimtarëve». Mos e ngatërro me vetë kalin e vakëfuar që s'është më për luftë: ai shitet dhe me të blihet ajo që është për xhihad. Shembull i sotëm: la 5.000 € për mirëmbajtjen e një ambulance të vakëfuar, por ambulanca u shkatërrua: paratë u kthehen trashëgimtarëve.", "f": "٧٤"}, {"id": "D059", "k": 29, "lloji": "mcq", "q": "أوصى رجلٌ أن يحجّ عنه زيدٌ بألف، فلم يحجّ زيد، وقال: أعطوني ما يزيد على نفقة الحجّ. فما الحكم؟", "o": ["يُعطى الزائدَ على نفقة الحجّ", "لا يُعطى شيئاً، والألفُ للورثة", "يُعطى الألفَ كلَّه، لأنه موصى له", "يُعطى نصفَ الألف، والباقي للورثة"], "a": 1, "q_sq": "Një njeri la me testament që Zejdi të bëjë haxh për të me një mijë, por Zejdi nuk e bëri haxhin dhe tha: «Më jepni atë që tepron mbi shpenzimet e haxhit». Cila është dispozita?", "o_sq": ["I jepet ajo që tepron mbi shpenzimet e haxhit", "Nuk i jepet asgjë, dhe një mijëshja u takon trashëgimtarëve", "I jepet e gjithë një mijëshja, sepse testamenti është për të", "I jepet gjysma e një mijëshes, dhe pjesa tjetër u takon trashëgimtarëve"], "pse_ar": "لقول المؤلف: «ولو وصى أن يحج عنه زيد بألف فلم يحج فهي للورثة، وإن قال الموصى له: أعطوني الزائد على نفقة الحج، لم يعط شيئاً».", "pse_sq": "E sakta: nuk i jepet asgjë dhe një mijëshja u takon trashëgimtarëve. Autori thotë: «nëse e lë me testament që Zejdi të bëjë haxh për të me një mijë dhe ai nuk e bën, ato u takojnë trashëgimtarëve; e nëse ai të cilit i është lënë thotë: ‹Më jepni atë që tepron mbi shpenzimet e haxhit›, nuk i jepet asgjë». Paratë ishin për kryerjen e haxhit, jo dhuratë e lirë për Zejdin; kur ai nuk e kryen, testamenti prishet dhe paratë u kthehen trashëgimtarëve.", "f": "٧٤"}, {"id": "D060", "k": 29, "lloji": "mcq", "q": "أوصى رجلٌ لزيدٍ بألف، فمات زيدٌ قبل موت الموصي، وأوصى لعمرٍو بألف، فردّ عمرٌو الوصيّةَ بعد موت الموصي. فلمن الألفان؟", "o": ["كلاهما لورثة الموصي", "ألفُ زيدٍ لورثة زيد، وألفُ عمرٍو لورثة الموصي", "كلاهما يُصرف إلى الفقراء والمساكين", "ألفُ زيدٍ لورثة الموصي، وألفُ عمرٍو للفقراء"], "a": 0, "q_sq": "Një njeri i la me testament Zejdit një mijë, por Zejdi vdiq para vdekjes së testamentlënësit; dhe i la Amrit një mijë, por Amri e refuzoi testamentin pas vdekjes së testamentlënësit. Të kujt janë dy mijëshet?", "o_sq": ["Të dyja u takojnë trashëgimtarëve të testamentlënësit", "Mijëshja e Zejdit u takon trashëgimtarëve të Zejdit, ajo e Amrit trashëgimtarëve të testamentlënësit", "Të dyja u jepen të varfërve dhe nevojtarëve", "Mijëshja e Zejdit u takon trashëgimtarëve të testamentlënësit, ajo e Amrit të varfërve"], "pse_ar": "لقول المؤلف: «ولو مات الموصى له قبل موت الموصي أو رد الوصية ردت إلى الورثة».", "pse_sq": "E sakta: të dyja u takojnë trashëgimtarëve të testamentlënësit. Autori thotë: «Nëse ai të cilit i është lënë vdes para vdekjes së testamentlënësit, ose e refuzon testamentin, ai u kthehet trashëgimtarëve». Testamenti hyn në fuqi pas vdekjes; nëse marrësi vdes para testamentlënësit, testamenti prishet dhe nuk kalon te trashëgimtarët e marrësit. Edhe refuzimi e prish. Të varfrit nuk përmenden; rregulli i përgjithshëm është: «Kur prishet testamenti ose një pjesë e tij, ai u kthehet trashëgimtarëve».", "f": "٧٤"}, {"id": "D061", "k": 29, "lloji": "mcq", "q": "أوصى رجلٌ بألفٍ لزيدٍ وعمرٍو، وكان عمرٌو ميّتاً. فكم لزيد؟", "o": ["الألفُ كلُّه", "ثلثُ الألف", "لا شيء، لبطلان الوصيّة", "نصفُ الألف"], "a": 3, "q_sq": "Një njeri la me testament një mijë për Zejdin dhe Amrin, ndërsa Amri ishte i vdekur. Sa merr Zejdi?", "o_sq": ["Të gjithë një mijëshen", "Të tretën e një mijëshes", "Asgjë, sepse testamenti prishet", "Gjysmën e një mijëshes"], "pse_ar": "لقول المؤلف: «ولو وصى لحي وميت فللحي نصف الوصية».", "pse_sq": "E sakta: gjysmën. Autori thotë: «nëse e lë me testament për një të gjallë dhe një të vdekur, i gjalli merr gjysmën e testamentit». Gjysma e të vdekurit prishet dhe u kthehet trashëgimtarëve të testamentlënësit, sipas rregullit: «Kur prishet testamenti ose një pjesë e tij, ai u kthehet trashëgimtarëve». I gjalli nuk merr gjithçka dhe testamenti nuk prishet i tëri. Shembull: «1.000 € për Aliun dhe Ahmedin», ndërsa Ahmedi kishte vdekur: Aliu merr 500 €.", "f": "٧٤"}, {"id": "D062", "k": 29, "lloji": "mcq", "q": "أوصى رجلٌ بثلث ماله لابنه ولجاره الأجنبي، وتركتُه ستّون ألفاً. فما الحكم؟", "o": ["للجار الثلثُ كلُّه، لبطلان الوصيّة للابن", "للجار عشرةُ آلاف، وتبطل حصّةُ الابن بكلّ حال", "للجار عشرةُ آلاف، وعشرةُ الابن موقوفةٌ على الإجازة", "لهما عشرون ألفاً بينهما، ولو لم يُجز الورثة"], "a": 2, "q_sq": "Një njeri la me testament të tretën e pasurisë së tij për djalin e tij dhe për fqinjin e tij (të huaj, jo-trashëgimtar), dhe trashëgimia e tij është gjashtëdhjetë mijë. Cila është dispozita?", "o_sq": ["Fqinji merr të gjithë të tretën, sepse testamenti për djalin prishet", "Fqinji merr dhjetë mijë, ndërsa pjesa e djalit prishet në çdo rast", "Fqinji merr dhjetë mijë, ndërsa dhjetë mijë e djalit varen nga miratimi", "Ata të dy marrin njëzet mijë mes tyre, edhe nëse trashëgimtarët nuk e miratojnë"], "pse_ar": "لقول المؤلف: «ولو وصى لوارثه ولأجنبي بثلث ماله فللأجنبي السدس ويوقف سدس الوارث على الإجازة».", "pse_sq": "E sakta: fqinji merr dhjetë mijë, ndërsa dhjetë mijë e djalit varen nga miratimi. Autori thotë: «e nëse e lë me testament të tretën e pasurisë së tij për trashëgimtarin e tij dhe për një të huaj, i huaji merr të gjashtën, ndërsa e gjashta e trashëgimtarit pezullohet deri në miratim». E treta = 20.000, ndahet mes dyve: i huaji 10.000 (1/6) pa kusht; djali 10.000 vetëm nëse e miratojnë trashëgimtarët e tjerë pas vdekjes, përndryshe ato u kthehen trashëgimtarëve. Pjesa e djalit nuk i shkon fqinjit, dhe nuk prishet «në çdo rast», por varet nga miratimi.", "f": "٧٤"}, {"id": "D063", "k": 30, "lloji": "mcq", "q": "أيُّ ما يلي **ليس** من الصفات التي ذكرها المؤلف فيمن تجوز الوصيّة إليه؟", "o": ["أن يكون مسلماً", "أن يكون عاقلاً", "أن يكون عدلاً", "أن يكون ذكراً"], "a": 3, "q_sq": "Cila nga këto **NUK** është ndër cilësitë që i përmend autori për atë që mund të ngarkohet me testament (vasijin)?", "o_sq": ["Të jetë musliman", "Të jetë me mend", "Të jetë i drejtë (adl)", "Të jetë mashkull"], "pse_ar": "لقول المؤلف: «تجوز الوصية إلى كل مسلم عاقل عدل من الذكور والإناث».", "pse_sq": "E sakta: të jetë mashkull (ky nuk është kusht). Autori thotë: «Lejohet ngarkimi me testament i çdo muslimani me mend dhe të drejtë, mashkull apo femër». Pra kushtet janë: islami, mendja dhe drejtësia (të jetë i besueshëm në fenë e tij); ndërsa vasiji mund të jetë burrë ose grua. Shembull: babai mund ta caktojë nënën e fëmijëve, nëse është muslimane, me mend dhe e besueshme, të kujdeset pas vdekjes së tij për fëmijët e vegjël dhe pasurinë e tyre.", "f": "٧٤"}, {"id": "D064", "k": 30, "lloji": "mcq", "q": "بمَ يجوز أن يوصي الرجلُ إلى غيره؟", "o": ["بكلّ شيء، ولو لم يجز للموصي فعلُه", "بما يجوز للموصي فعلُه، كقضاء ديونه", "بقضاء ديونه فقط، دون النظر في أطفاله", "بالنظر في أطفاله فقط، دون قضاء ديونه"], "a": 1, "q_sq": "Me çfarë lejohet që njeriu ta ngarkojë dikë tjetër me testament?", "o_sq": ["Me çdo gjë, edhe nëse testamentlënësi nuk ka të drejtë ta bëjë", "Me atë që testamentlënësi ka të drejtë ta bëjë, si shlyerja e borxheve të tij", "Vetëm me shlyerjen e borxheve të tij, jo me kujdesin për fëmijët e tij", "Vetëm me kujdesin për fëmijët e tij, jo me shlyerjen e borxheve të tij"], "pse_ar": "لقول المؤلف: «بما يجوز للموصي فعله من قضاء ديونه، وتفريق وصيته، والنظر في أمر أطفاله».", "pse_sq": "E sakta: me atë që testamentlënësi ka të drejtë ta bëjë. Autori thotë: «...me atë që testamentlënësi ka të drejtë ta bëjë: shlyerjen e borxheve të tij, shpërndarjen e testamentit të tij dhe kujdesin për çështjet e fëmijëve të tij». Pra nuk mund të ngarkojë me diçka që vetë nuk e ka të drejtë, dhe ngarkimi nuk kufizohet vetëm te borxhet ose vetëm te fëmijët. Shembull: babai shkruan: «Pas vdekjes sime, vëllai im le të m'i paguajë borxhet, t'ua japë 5.000 € xhamisë dhe të kujdeset për fëmijët e mi të vegjël».", "f": "٧٤"}, {"id": "D065", "k": 30, "lloji": "mcq", "q": "أوصى رجلٌ إلى أخيه بولاية أطفاله. فأيُّ ما يلي يجوز للوصيّ من التصرّف لهم؟", "o": ["دفعُ أموالهم مضاربةً بجزءٍ من الربح", "شراءُ شيءٍ من مالهم لنفسه بثمن مثله", "أن يوصي بولايتهم إلى غيره عند موته", "أخذُ جزءٍ من الربح إذا اتّجر لهم بنفسه"], "a": 0, "q_sq": "Një njeri e ngarkoi me testament vëllanë e tij me kujdestarinë e fëmijëve të tij. Cili nga këto veprime për ta i lejohet vasijit?", "o_sq": ["Dhënia e pasurive të tyre në mudarebe (dikujt që tregton me to) për një pjesë të fitimit", "Blerja për vete e diçkaje nga pasuria e tyre me çmimin e tregut", "Ngarkimi i dikujt tjetër me kujdestarinë e tyre me testament, në vdekjen e tij", "Marrja e një pjese të fitimit, kur tregton vetë për ta"], "pse_ar": "لقول المؤلف: «ونفذ تصرفُه لهم بما لهم فيه الحظ من البيع والشراء، وقبول ما يوهب لهم، والإنفاق عليهم... والتجارة لهم، ودفع أموالهم مضاربة بجزء من الربح».", "pse_sq": "E sakta: dhënia e pasurive të tyre në mudarebe. Autori thotë: «Kur e ngarkon me kujdestarinë e fëmijëve të tij ose të të çmendurve të tij, i vërtetohet kujdestaria mbi ta, dhe zbatohet disponimi i tij për ta në atë që është në dobi të tyre: shitja e blerja, pranimi i asaj që u dhurohet, shpenzimi për ta dhe për ata që ata kanë për detyrë t'i mbajnë sipas zakonit të mirë, tregtia për ta dhe dhënia e pasurive të tyre në mudarebe për një pjesë të fitimit». Tri opsionet e tjera i ndalon autori shprehimisht: «Ai nuk mund ta ngarkojë dikë tjetër me atë me të cilën është ngarkuar, as të shesë e të blejë për vete nga pasuria e tyre», dhe «nëse tregton vetë për ta, nuk merr asgjë nga fitimi».", "f": "٧٥"}, {"id": "D066", "k": 30, "lloji": "tf", "q": "إذا اتّجر الوصيّ لليتامى بأموالهم بنفسه، فله نصفُ الربح مقابلَ عمله.", "a": 1, "q_sq": "Kur vasiji tregton vetë për jetimët me pasuritë e tyre, ai merr gjysmën e fitimit në këmbim të punës së tij.", "pse_ar": "بل ليس له شيء، لقول المؤلف: «وإن اتجر لهم بنفسه فليس له من الربح شيء».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «e nëse tregton vetë për ta, nuk merr asgjë nga fitimi». I gjithë fitimi u takon jetimëve. Ndryshe është kur ua jep pasurinë një tjetri në mudarebe: atij tjetrit i caktohet një pjesë e fitimit. Shembull: vasiji vetë i investon 10.000 € të jetimëve dhe fiton 2.000 €: të 2.000 € u takojnë jetimëve.", "f": "٧٥"}, {"id": "D067", "k": 30, "lloji": "mcq", "q": "وصيٌّ على أيتام، وهو فقيرٌ محتاج، ويعمل في أموالهم. فما حكمُ أكله منها؟", "o": ["لا يأكل منها شيئاً", "يأكل منها، ويردّ بدلَه إذا أيسر", "يأكل بقدر عمله، ولا غُرم عليه", "يأكل ما شاء، ولو زاد على قدر عمله"], "a": 2, "q_sq": "Një vasij i jetimëve është i varfër dhe nevojtar, dhe punon me pasuritë e tyre. Cila është dispozita e ngrënies së tij prej tyre?", "o_sq": ["Nuk ha asgjë prej tyre", "Ha prej tyre, dhe e kthen vlerën kur të pasurohet", "Ha në masën e punës së tij, dhe nuk ka për detyrë ta kthejë", "Ha sa të dojë, edhe nëse kalon masën e punës së tij"], "pse_ar": "لقول المؤلف: «وله أن يأكل من مالهم عند الحاجة بقدر عمله ولا غرم عليه».", "pse_sq": "E sakta: ha në masën e punës së tij dhe nuk ka për detyrë ta kthejë. Autori thotë: «Ai mund të hajë nga pasuria e tyre kur ka nevojë, në masën e punës së tij, dhe nuk ka për detyrë ta kthejë; por nuk ha kur është i pasur, për shkak të fjalës së Allahut të Lartësuar: ‹Kush është i pasur le të ruhet (shfrytëzimit të pasurisë së jetimëve), e kush është i varfër, le të hajë me maturi.› [En-Nisa: 6]». Kthimi i vlerës (garantimi) e mohon autori shprehimisht; dhe ngrënia kufizohet me masën e punës.", "f": "٧٥"}, {"id": "D068", "k": 30, "lloji": "tf", "q": "الوصيّ الغنيّ لا يأكل من مال اليتامى، لقول الله تعالى: ﴿وَمَن كَانَ غَنِيًّا فَلْيَسْتَعْفِفْ ۖ وَمَن كَانَ فَقِيرًا فَلْيَأْكُلْ بِٱلْمَعْرُوفِ﴾.", "a": 0, "q_sq": "Vasiji i pasur nuk ha nga pasuria e jetimëve, për shkak të fjalës së Allahut të Lartësuar: «Kush është i pasur le të ruhet (shfrytëzimit të pasurisë së jetimëve), e kush është i varfër, le të hajë me maturi.» [En-Nisa: 6]", "pse_ar": "لقول المؤلف: «ولا يأكل إذا كان غنيًّا، لقول الله تعالى: ﴿وَمَن كَانَ غَنِيًّا فَلْيَسْتَعْفِفْ ۖ وَمَن كَانَ فَقِيرًا فَلْيَأْكُلْ بِٱلْمَعْرُوفِ﴾ [النساء: ٦]».", "pse_sq": "Pohimi është i saktë. Autori thotë: «por nuk ha kur është i pasur, për shkak të fjalës së Allahut të Lartësuar: ‹Kush është i pasur le të ruhet (shfrytëzimit të pasurisë së jetimëve), e kush është i varfër, le të hajë me maturi.› [En-Nisa: 6]». Pra ajeti e dallon të pasurin, që ruhet, nga i varfri, që ha me maturi (në masën e punës së tij). Shembull: vasiji ka rrogë e pasuri të mjaftueshme; ai nuk merr asgjë nga pasuria e jetimëve për punën e tij.", "f": "٧٥"}, {"id": "D069", "k": 30, "lloji": "mcq", "q": "أيُّ ما يلي يجوز للأب، ولا يجوز للوصيّ؟", "o": ["أن يدفع مالَ الصغير مضاربة", "أن يشتري من مال الصغير لنفسه", "أن يقبل ما يُوهب للصغير", "أن ينفق على الصغير بالمعروف"], "a": 1, "q_sq": "Cila nga këto i lejohet babait, por nuk i lejohet vasijit?", "o_sq": ["T'ia japë pasurinë e të miturit dikujt në mudarebe", "Të blejë për vete nga pasuria e të miturit", "Të pranojë atë që i dhurohet të miturit", "Të shpenzojë për të miturin sipas zakonit të mirë"], "pse_ar": "لقول المؤلف: «وليس له أن يوصي بما أوصي إليه به، ولا أن يبيع ويشتري من مالهم لنفسه، ويجوز ذلك للأب».", "pse_sq": "E sakta: blerja për vete nga pasuria e të miturit. Autori thotë për vasijin: «Ai nuk mund ta ngarkojë dikë tjetër me atë me të cilën është ngarkuar, as të shesë e të blejë për vete nga pasuria e tyre; ndërsa babait kjo i lejohet». Tri opsionet e tjera (mudarebeja, pranimi i dhuratës, shpenzimi sipas zakonit) i lejohen edhe vasijit, sepse autori i përmend ndër veprimet e tij që zbatohen. Shembull: vasiji nuk mund t'ia blejë vetes makinën e jetimit; babai mund ta blejë makinën e djalit të tij të mitur.", "f": "٧٥"}, {"id": "D070", "k": 30, "lloji": "tf", "q": "يجوز للوصيّ أن يوصي بما أُوصي إليه به إلى غيره، كما يجوز ذلك للأب.", "a": 1, "q_sq": "Vasiji lejohet ta ngarkojë dikë tjetër me testament me atë me të cilën është ngarkuar, ashtu siç i lejohet kjo babait.", "pse_ar": "بل ليس له ذلك، لقول المؤلف: «وليس له أن يوصي بما أوصي إليه به... ويجوز ذلك للأب».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «Ai nuk mund ta ngarkojë dikë tjetër me atë me të cilën është ngarkuar, as të shesë e të blejë për vete nga pasuria e tyre; ndërsa babait kjo i lejohet». Pra babai mund të caktojë vasij për fëmijët e tij, por vasiji nuk mund ta kalojë kujdestarinë te dikush tjetër me testament. Shembull: xhaxhai, që është vasij i jetimëve, para vdekjes nuk mund të shkruajë: «Pas meje, kujdestar i tyre le të jetë djali im».", "f": "٧٥"}, {"id": "D071", "k": 30, "lloji": "mcq", "q": "مات رجلٌ ولم يوصِ إلى أحد، وترك ابناً صغيراً له مال. فمَن يلي مالَ الصغير؟", "o": ["أمُّه", "أكبرُ إخوته البالغين", "جدُّه أبو أبيه", "الحاكم"], "a": 3, "q_sq": "Një njeri vdiq pa ngarkuar askënd me testament, dhe la një djalë të vogël që ka pasuri. Kush e administron pasurinë e të voglit?", "o_sq": ["Nëna e tij", "Më i madhi nga vëllezërit e tij të rritur", "Gjyshi i tij, babai i babait", "Gjykatësi (hakimi)"], "pse_ar": "لقول المؤلف: «فلا يلي مال الصبي والمجنون إلا الأب أو وصيه أو الحاكم».", "pse_sq": "E sakta: gjykatësi. Autori thotë: «Pasurinë e fëmijës dhe të të çmendurit nuk e administron askush përveç babait, atij që ai e ka ngarkuar me testament ose gjykatësit». Babai ka vdekur dhe nuk ka caktuar vasij, prandaj mbetet gjykatësi. Nëna, vëllai i madh dhe gjyshi nuk janë në këtë listë të autorit.", "f": "٧٥"}, {"id": "D072", "k": 31, "lloji": "mcq", "q": "ما المرادُ بالرشد في قول المؤلف: «ليختبر رشده»؟", "o": ["الصلاحُ في المال", "الصلاحُ في الدين", "البلوغُ بالسنّ", "الصلاحُ في الدين والمال معاً"], "a": 0, "q_sq": "Çfarë kuptohet me rushd (pjekuri) në fjalën e autorit: «për ta provuar pjekurinë e tij»?", "o_sq": ["Mbarëvajtja në pasuri", "Mbarëvajtja në fe", "Arritja e moshës së pjekurisë", "Mbarëvajtja në fe dhe në pasuri bashkë"], "pse_ar": "لقول المؤلف: «والرشد هنا الصلاح في المال».", "pse_sq": "E sakta: mbarëvajtja në pasuri. Autori thotë: «pjekuria (rushd) këtu është aftësia për ta mbarëvajtur pasurinë». Pra nuk është devotshmëria në fe, as mosha; mosha (bulugu) është kusht më vete: «ia jep pasurinë e tij kur arrin moshën e pjekurisë». Shembull: një i ri që i ruan paratë, di të blejë e të shesë pa u mashtruar dhe nuk i shpenzon kot, është «rashid» në këtë kuptim.", "f": "٧٥"}, {"id": "D073", "k": 31, "lloji": "tf", "q": "لوليّ الأيتام أن يأذن للمميِّز من الصبيان بالتصرّف، ليختبر رشدَه.", "a": 0, "q_sq": "Kujdestari i jetimëve mund t'i japë leje fëmijës mumejjiz (që dallon të mirën nga e keqja) të disponojë (të blejë e të shesë), për ta provuar pjekurinë e tij.", "pse_ar": "لقول المؤلف: «ولوليهم أن يأذن للمميز من الصبيان بالتصرف ليختبر رشده».", "pse_sq": "Pohimi është i saktë. Autori thotë: «Kujdestari i tyre mund t'i japë leje fëmijës që dallon (mumejjiz) të disponojë (me pasuri), për ta provuar pjekurinë e tij». Prova bëhet para moshës madhore, që kur të arrijë atë, të dihet a mund t'i jepet pasuria. Shembull: kujdestari i jep jetimit 12-vjeçar pak para që të blejë diçka për shtëpinë, për të parë si sillet me to.", "f": "٧٥"}, {"id": "D074", "k": 31, "lloji": "mcq", "q": "يتيمةٌ بلغت، وآنس وليُّها منها الرشد. فما الذي يفعله؟", "o": ["يُبقي مالَها عنده حتى تتزوّج", "لا يدفعه إليها إلا بحكم الحاكم", "يدفع إليها مالَها، ويُشهد على ذلك", "يدفع إليها نصفَ مالها، ويُبقي نصفَه"], "a": 2, "q_sq": "Një jetime arriti moshën e pjekurisë dhe kujdestari i saj vërejti tek ajo pjekurinë (rushdin). Çfarë bën ai?", "o_sq": ["E mban pasurinë e saj te vetja derisa ajo të martohet", "Nuk ia dorëzon veçse me vendim të gjykatësit", "Ia dorëzon pasurinë e saj dhe merr dëshmitarë për këtë", "Ia dorëzon gjysmën e pasurisë dhe mban gjysmën tjetër"], "pse_ar": "لقول المؤلف: «فمن آنس رشدَه دفع إليه ماله إذا بلغ وأشهد عليه ذكراً كان أو أنثى».", "pse_sq": "E sakta: ia dorëzon pasurinë dhe merr dëshmitarë. Autori thotë: «Kujt i vëren pjekurinë, ia jep pasurinë e tij kur arrin moshën e pjekurisë dhe merr dëshmitarë për këtë, qoftë mashkull apo femër». Fjala «qoftë mashkull apo femër» e rrëzon kushtin e martesës; dorëzimi është i plotë, jo gjysmë. Vendimi i gjykatësit kërkohet për heqjen e ndalimit të atij të cilit i është rikthyer mendjelehtësia, jo këtu.", "f": "٧٥"}, {"id": "D075", "k": 31, "lloji": "mcq", "q": "رجلٌ دُفع إليه مالُه بعد رشده، ثم عاود السفه. فما الحكم؟", "o": ["يُعاد عليه الحجر، ويليه وليُّه الأول، وينفكّ برشده", "يُحجر عليه، ولا ينظر في ماله ولا يفكّ حجرَه إلا الحاكم", "لا يُعاد عليه الحجر، لأنه قد دُفع إليه مالُه بعد رشده", "يُعاد عليه الحجر، وينظر في ماله أقربُ عصبته إليه"], "a": 1, "q_sq": "Një njeriu iu dorëzua pasuria pasi u pjekur, pastaj iu kthye mendjelehtësia (sefehu – shpërdorimi i pasurisë). Cila është dispozita?", "o_sq": ["I rivihet ndalimi, e administron kujdestari i tij i parë, dhe ndalimi hiqet kur ai pjeket", "I vihet ndalimi, dhe pasurinë ia administron e ndalimin ia heq vetëm gjykatësi", "Nuk i rivihet ndalimi, sepse pasuria i është dorëzuar pasi u pjekur", "I rivihet ndalimi, dhe pasurinë ia administron i afërmi i tij më i afërt nga babai"], "pse_ar": "لقول المؤلف: «فإن عاود السفه أعيد عليه الحجر، ولا ينظر في ماله إلا الحاكم، ولا ينفك عنه الحجر إلا بحكمه».", "pse_sq": "E sakta: i vihet ndalimi, dhe pasurinë ia administron e ndalimin ia heq vetëm gjykatësi. Autori thotë: «Nëse i kthehet mendjelehtësia, i rivihet ndalimi, dhe pasurinë e tij nuk e administron askush përveç gjykatësit; dhe ndalimi nuk i hiqet veçse me vendimin e tij». Pra ndalimi rikthehet (nuk mbetet i lirë), administrimi nuk i kthehet kujdestarit të parë apo të afërmve, dhe ndalimi nuk hiqet vetvetiu kur përmirësohet, por me vendim të gjykatësit. Shembull: një i rritur nis t'i shpërdorojë paratë në kumar e harxhime të kota; gjykatësi ia ndalon disponimin.", "f": "٧٥"}, {"id": "D076", "k": 31, "lloji": "tf", "q": "المحجورُ عليه لسفهٍ لا يُقبل إقرارُه في المال، ويُقبل إقرارُه في الحدود والقصاص والطلاق.", "a": 0, "q_sq": "Pohimi (ikrari) i atij që është nën ndalim për shkak të mendjelehtësisë nuk pranohet në pasuri, por pranohet në hudud (dënimet e caktuara në Sheriat), në kisas (ndëshkimi me të njëjtën masë) dhe në shkurorëzim.", "pse_ar": "لقول المؤلف: «ولا يُقبل إقراره في المال ويُقبل في الحدود والقصاص والطلاق».", "pse_sq": "Pohimi është i saktë. Autori thotë: «Pohimi i tij nuk pranohet në pasuri, por pranohet në hududet (dënimet e caktuara), në kisas dhe në shkurorëzim». Ndalimi është vënë për të ruajtur pasurinë e tij, prandaj pohimi i tij për borxhe nuk pranohet; ndërsa hududet, kisasi dhe shkurorëzimi nuk janë disponim me pasuri. Shembull: nëse thotë «I kam borxh filanit 5.000 €», kjo nuk pranohet; por nëse pohon se ka vjedhur, pohimi i tij pranohet.", "f": "٧٥"}, {"id": "D077", "k": 31, "lloji": "mcq", "q": "محجورٌ عليه لسفهٍ طلّق امرأتَه، وأعتق عبدَه. فما الحكم؟", "o": ["ينفذ إعتاقُه دون طلاقه", "ينفذان جميعاً", "لا ينفذ منهما شيء", "ينفذ طلاقُه دون إعتاقه"], "a": 3, "q_sq": "Një njeri nën ndalim për shkak të mendjelehtësisë e shkurorëzoi gruan e tij dhe e liroi robin e tij. Cila është dispozita?", "o_sq": ["Zbatohet lirimi i tij, por jo shkurorëzimi", "Zbatohen të dyja", "Nuk zbatohet asnjëra", "Zbatohet shkurorëzimi i tij, por jo lirimi"], "pse_ar": "لقول المؤلف: «فإن طلق أو عتق نفذ طلاقُه دون إعتاقه».", "pse_sq": "E sakta: zbatohet shkurorëzimi, por jo lirimi. Autori thotë: «e nëse shkurorëzon ose liron, shkurorëzimi i tij zbatohet, por jo lirimi i tij». Lirimi i robit është nxjerrje e pasurisë nga pronësia e tij, prandaj ndalimi e pengon; shkurorëzimi nuk është disponim me pasuri. Kjo përputhet me rregullin se pohimi i tij pranohet në shkurorëzim, por jo në pasuri.", "f": "٧٥"}, {"id": "D078", "k": 32, "lloji": "mcq", "q": "أذن سيّدٌ لعبده في التجارة، فباع العبدُ واشترى، وأقرّ بحقٍّ في تجارته. فما الحكم؟", "o": ["يصحّ بيعُه وشراؤه وإقرارُه", "يصحّ بيعُه وشراؤه دون إقراره", "لا يصحّ شيءٌ منها حتى يُجيزه السيّد", "يصحّ إقرارُه دون بيعه وشرائه"], "a": 0, "q_sq": "Një zotëri (sejjid – pronari i robit) i dha leje robit të tij për tregti; robi shiti, bleu dhe pohoi një të drejtë (borxh) në tregtinë e tij. Cila është dispozita?", "o_sq": ["Shitja, blerja dhe pohimi i tij janë të vlefshme", "Shitja dhe blerja e tij janë të vlefshme, por jo pohimi", "Asnjëra prej tyre nuk vlen derisa ta miratojë zotëria", "Pohimi i tij është i vlefshëm, por jo shitja dhe blerja"], "pse_ar": "لقول المؤلف: «وإذا أذن السيد لعبده في التجارة صح بيعُه وشراؤه وإقراره».", "pse_sq": "E sakta: të tria janë të vlefshme. Autori thotë: «Kur zotëria i jep leje robit të tij për tregti, shitja, blerja dhe pohimi i tij janë të vlefshëm». Robi në parim nuk disponon me pasuri pa lejen e zotërisë; kur i jepet leje, ai bëhet si përfaqësues në tregti. Leja e dhënë më parë mjafton; nuk kërkohet miratim i veçantë për çdo veprim. Krahasim i sotëm: punonjësi i autorizuar nga pronari i firmës shet e blen në emër të saj.", "f": "٧٥"}, {"id": "D079", "k": 32, "lloji": "tf", "q": "أذن سيّدٌ لعبده أن يتّجر في الثياب بألف درهم، فاتّجر بألفين؛ فينفذ تصرّفُه في الألفين، لأنه مأذونٌ له في التجارة.", "a": 1, "q_sq": "Një zotëri i dha leje robit të tij të tregtojë me rroba me një mijë dirhemë, por ai tregtoi me dy mijë; disponimi i tij zbatohet në të dy mijëshet, sepse ka leje për tregti.", "pse_ar": "بل لا ينفذ إلا في الألف، لقول المؤلف: «ولا ينفذ تصرفه إلا في قدر ما أذن له فيه».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «por disponimi i tij nuk zbatohet veçse në masën për të cilën i është dhënë leje». Leja ishte për një mijë, prandaj disponimi mbi këtë masë nuk zbatohet. Po kështu, po të tregtonte me ushqime në vend të rrobave, nuk do të zbatohej. Shembull: punonjësi i autorizuar për blerje deri në 1.000 € nuk mund të blejë në emër të firmës për 2.000 €.", "f": "٧٥"}, {"id": "D080", "k": 32, "lloji": "mcq", "q": "رأى السيّدُ عبدَه يبيع ويشتري، فسكت ولم ينهه. فما الحكم؟", "o": ["يصير مأذوناً له في كلّ تجارة", "يصير مأذوناً له فيما رآه فقط", "لا يصير بهذا مأذوناً له", "يصير مأذوناً له إن تكرّر سكوتُه"], "a": 2, "q_sq": "Zotëria e pa robin e tij duke shitur e blerë, heshti dhe nuk e ndaloi. Cila është dispozita?", "o_sq": ["Bëhet i lejuar në çdo tregti", "Bëhet i lejuar vetëm në atë që e pa", "Me këtë nuk bëhet i lejuar", "Bëhet i lejuar nëse heshtja e tij përsëritet"], "pse_ar": "لقول المؤلف: «وإن رآه سيده أو وليه يتصرف فلم ينهه لم يصر بهذا مأذوناً له».", "pse_sq": "E sakta: me këtë nuk bëhet i lejuar. Autori thotë: «e nëse zotëria ose kujdestari i tij e sheh duke disponuar dhe nuk e ndalon, me këtë ai nuk bëhet i lejuar». Heshtja nuk është leje, as e përgjithshme, as e kufizuar, as kur përsëritet; duhet leje e qartë. E njëjta vlen për kujdestarin që e sheh fëmijën nën kujdestari duke tregtuar dhe hesht.", "f": "٧٥"}];
const KAP = [["كتاب البيوع", "Libri i shitblerjeve"], ["البيوع المنهي عنها", "Shitjet e ndaluara"], ["باب الربا", "Kamata (riba)"], ["بيع الأصول والثمار", "Shitja e bazave dhe frutave"], ["بيع الثمار وصلاحها", "Pjekja e frutave"], ["باب الخيار", "Hijari"], ["باب السلم", "Selemi"], ["باب القرض", "Huaja"], ["أحكام الدين", "Borxhi"], ["الحوالة والضمان", "Havaleja dhe garancia"], ["باب الرهن", "Pengu"], ["باب الصلح", "Pajtimi"], ["باب الوكالة", "Vekaleja"], ["باب الشركة", "Ortakëria"], ["المساقاة والمزارعة", "Musakati dhe muzaraa"], ["إحياء الموات", "Ringjallja e tokës"], ["باب الجعالة", "Xhialeja"], ["باب اللقطة", "Lukata"], ["اللقيط", "Lakiti"], ["باب السبق", "Gara"], ["باب الوديعة", "Vedia"], ["كتاب الإجارة", "Qiraja"], ["باب الغصب", "Grabitja"], ["باب الشفعة", "Shuf'a"], ["كتاب الوقف", "Vakëfi"], ["باب الهبة", "Dhurata"], ["عطية المريض", "Dhurata e të sëmurit"], ["كتاب الوصايا", "Testamentet"], ["بطلان الوصية", "Prishja e testamentit"], ["الموصى إليه", "Vasiji"], ["الحجر والرشد", "Ndalimi dhe pjekuria"], ["الإذن للعبد", "Leja e robit"]];
const LS_KEY = "kuiz-buju-v1";
const KEYS = ["أ","ب","ج","د"];
const KEYS_SQ = ["A","B","C","D"];
const app = document.getElementById("app");
let state = null;
let N = 0;

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
function optsOf(q){ return q.lloji==="tf" ? ["صحيح","خطأ"] : q.o; }
function optsSq(q){ return q.lloji==="tf" ? ["Saktë","E pasaktë"] : q.o_sq; }
function kapName(k){const c=KAP[k-1];return c?c[0]:"";}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildPrepared(order){
  return order.map(origIdx=>{
    const q=QUESTIONS[origIdx];
    if(q.lloji==="tf") return {order:[0,1],correct:q.a};
    const idx=shuffle([0,1,2,3]);
    return {order:idx,correct:idx.indexOf(q.a)};
  });
}
function freshState(chs){
  chs=chs&&chs.length?chs:KAP.map((_,i)=>i+1);
  const pool=QUESTIONS.map((q,i)=>i).filter(i=>chs.indexOf(QUESTIONS[i].k)>=0);
  const order=shuffle(pool);
  return {chs,order,prepared:buildPrepared(order),answers:new Array(order.length).fill(null),cur:0,finished:false,screen:"start",nq:QUESTIONS.length};
}
function qAt(p){ return QUESTIONS[state.order[p]]; }
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function load(){try{const r=localStorage.getItem(LS_KEY);if(!r)return null;const s=JSON.parse(r);
  if(s&&s.nq===QUESTIONS.length&&Array.isArray(s.order)&&Array.isArray(s.answers)&&s.answers.length===s.order.length&&Array.isArray(s.prepared)&&s.prepared.length===s.order.length)return s;}catch(e){}return null;}
function score(){let c=0,w=0,b=0;for(let i=0;i<N;i++){const a=state.answers[i];if(a===null){b++;continue;}a===state.prepared[i].correct?c++:w++;}return {correct:c,wrong:w,blank:b};}
function render(){ N=state.order.length; if(state.screen==="start")return renderStart(); if(state.screen==="quiz")return renderQuiz(); if(state.screen==="result")return renderResult(); }

let selCh=null;
function renderStart(){
  const resumable=state.answers.some(a=>a!==null)&&!state.finished;
  const T=QUESTIONS.length, tfCount=QUESTIONS.filter(q=>q.lloji==="tf").length;
  if(!selCh) selCh=state.chs.slice();
  const cnt=k=>QUESTIONS.filter(q=>q.k===k).length;
  const chips=KAP.map((c,i)=>`<button class="chip ${selCh.indexOf(i+1)>=0?"on":""}" data-k="${i+1}" title="${esc(c[1])}"><span>${esc(c[0])}</span><small>${cnt(i+1)}</small></button>`).join("");
  const nSel=QUESTIONS.filter(q=>selCh.indexOf(q.k)>=0).length;
  app.innerHTML=`
  <div class="wrap">
    <div class="hero">
      <div class="hero-top">
        <div class="eyebrow">Fikh · Medhhebi hanbeli</div>
        <h1>Kuiz: Kitabu'l-Buju'</h1>
        <p class="hero-sub">Nga «عمدة الفقه» e Ibn Kudames, f. 53–75: nga Kitabu'l-Buju' deri te el-Musa ilejhi.</p>
      </div>
      <div class="meta-row" style="margin-top:20px">
        <div class="stat"><b>${T}</b><span>pyetje gjithsej</span></div>
        <div class="stat"><b>${T-tfCount}</b><span>me opsione (أ–د)</span></div>
        <div class="stat"><b>${tfCount}</b><span>«صحيح / خطأ»</span></div>
        <div class="stat"><b>${KAP.length}</b><span>kapituj</span></div>
      </div>
      <ul class="rules">
        <li><span>Pyetjet dhe opsionet janë <b>arabisht</b>. Butoni <b style="color:var(--gold)">🌐 Përkthimi · Përgjigjja · Sqarimi</b> te çdo pyetje të jep përkthimin shqip, përgjigjen e saktë dhe pse është e saktë: shkurt arabisht, plotësisht shqip.</span></li>
        <li><span>Nëse nuk e hap butonin, përgjigjet dalin vetëm në fund, me korrigjim pyetje për pyetje dhe rezultat për çdo kapitull.</span></li>
        <li><span>Zgjidh kapitujt që do të ushtrosh. Renditja e pyetjeve dhe e opsioneve është e rastësishme çdo herë.</span></li>
      </ul>
      <div class="chlbl">Kapitujt (${nSel} pyetje të zgjedhura)
        <button class="chip" id="allCh">Të gjithë</button><button class="chip" id="noneCh">Asnjë</button></div>
      <div class="chaps" id="chaps">${chips}</div>
      <div class="actions">
        ${resumable?`<button class="btn" id="contBtn">Vazhdo kuizin (${state.answers.filter(a=>a!==null).length}/${N})</button>`:""}
        <button class="btn ${resumable?"ghost":""}" id="startBtn" ${nSel?"":"disabled"}>${resumable?"Fillo nga e para":"Fillo kuizin"} (${nSel})</button>
        <button class="btn ghost" id="themeBtn">◑ Temë</button>
      </div>
      <p class="books">Libri: <b>عمدة الفقه</b> – Imam Muvaffeku'd-Din ibn Kudame el-Makdisi. Përgjigjet mbështeten vetëm te teksti i librit.</p>
    </div>
    <p class="foot">Allahu e di më së miri.</p>
  </div>`;
  document.querySelectorAll("#chaps .chip").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;const j=selCh.indexOf(k);if(j>=0)selCh.splice(j,1);else selCh.push(k);renderStart();});
  document.getElementById("allCh").onclick=()=>{selCh=KAP.map((_,i)=>i+1);renderStart();};
  document.getElementById("noneCh").onclick=()=>{selCh=[];renderStart();};
  const cb=document.getElementById("contBtn"); if(cb)cb.onclick=()=>{state.screen="quiz";save();render();};
  document.getElementById("startBtn").onclick=()=>{state=freshState(selCh.slice().sort((a,b)=>a-b));state.screen="quiz";save();render();};
  document.getElementById("themeBtn").onclick=toggleTheme;
}

function renderQuiz(){
  const i=state.cur,q=qAt(i),prep=state.prepared[i],opts=optsOf(q);
  const isTF=q.lloji==="tf";
  const answered=state.answers.filter(a=>a!==null).length;
  const pct=Math.round((i/N)*100);
  const optsHtml=prep.order.map((origIdx,pos)=>{
    const sel=state.answers[i]===pos;
    if(isTF){ const mark=origIdx===0?"✓":"✗";
      return `<button class="opt tfbtn rtl ${sel?"sel":""}" data-pos="${pos}"><span class="txt">${opts[origIdx]} ${mark}</span></button>`; }
    return `<button class="opt rtl ${sel?"sel":""}" data-pos="${pos}"><span class="key">${KEYS[pos]}</span><span class="txt">${fmt(opts[origIdx])}</span></button>`;
  }).join("");
  app.innerHTML=`
  <div class="topbar"><div class="topbar-in">
    <button class="iconbtn" id="homeBtn">⌂</button>
    <div class="counter">Pyetja ${i+1}<small> / ${N}</small></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <button class="iconbtn" id="themeBtn">◑</button>
  </div></div>
  <div class="wrap" style="padding-top:0">
    <div class="card">
      <div class="qtag"><span class="topic rtl" style="font-size:1rem;letter-spacing:0;text-transform:none">${esc(kapName(q.k))}</span><span class="kind">${isTF?"صحيح / خطأ":"اختر الإجابة الصحيحة"}</span></div>
      <p class="qtext rtl">${fmt(q.q)}</p>
      <div class="opts ${isTF?"tf":""}" id="opts" dir="rtl">${optsHtml}</div>
      <button class="btn ghost sm hintbtn" id="hintBtn">🌐 Përkthimi · Përgjigjja · Sqarimi</button>
      <div class="navbtns">
        <button class="btn ghost sm" id="prevBtn" ${i===0?"disabled":""}>‹ Mbrapa</button>
        <button class="btn ghost sm" id="jumpBtn">▦ Lista (${answered}/${N})</button>
        <span class="spacer"></span>
        ${i<N-1?`<button class="btn sm" id="nextBtn">Tjetra ›</button>`:`<button class="btn sm" id="finishBtn">Përfundo ✓</button>`}
      </div>
    </div>
    <div id="jumpWrap" hidden></div>
    <div style="margin-top:16px;text-align:center"><button class="btn ghost sm" id="finishAnytime">Përfundo kuizin tani</button></div>
  </div>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ state.answers[i]=parseInt(b.dataset.pos,10); save();
      document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel");
      setTimeout(()=>{ if(state.cur<N-1){state.cur++;render();} else render(); },180);
    };
  });
  document.getElementById("homeBtn").onclick=()=>{state.screen="start";selCh=null;save();render();};
  document.getElementById("themeBtn").onclick=toggleTheme;
  const p=document.getElementById("prevBtn"); if(p)p.onclick=()=>{if(i>0){state.cur--;render();}};
  const nx=document.getElementById("nextBtn"); if(nx)nx.onclick=()=>{if(i<N-1){state.cur++;render();}};
  const fn=document.getElementById("finishBtn"); if(fn)fn.onclick=confirmFinish;
  document.getElementById("finishAnytime").onclick=confirmFinish;
  document.getElementById("jumpBtn").onclick=toggleJump;
  document.getElementById("hintBtn").onclick=()=>showExplanation(i);
}

function explHtml(i){
  const q=qAt(i),prep=state.prepared[i],opts=optsOf(q),osq=optsSq(q),isTF=q.lloji==="tf";
  const pos=prep.correct, origIdx=prep.order[pos];
  const trOpts=isTF?"":`<ol type="A">${prep.order.map((o,p)=>`<li class="${p===pos?"ok":""}">${fmt(osq[o])}</li>`).join("")}</ol>`;
  const key=isTF?(origIdx===0?"✓":"✗"):KEYS[pos];
  const sqLbl=isTF?osq[origIdx]:(KEYS_SQ[pos]+". "+osq[origIdx]);
  return `<div class="sec tr"><b class="h">Përkthimi</b>${fmt(q.q_sq)}${trOpts}</div>
    <div class="sec" style="border-left:4px solid var(--correct)"><b class="h">Përgjigjja e saktë</b>
      <div class="ans rtl" style="margin-top:4px"><span class="key">${key}</span><span class="atx">${fmt(opts[origIdx])}<span class="sqa">${fmt(sqLbl)}</span></span></div></div>
    <div class="sec rtl"><b class="h">Pse – arabisht</b>${fmt(q.pse_ar)}</div>
    <div class="sec why"><b class="h">Pse – shqip</b>${fmt(q.pse_sq)}</div>
    <div class="ref">${esc(kapName(q.k))} · Libri, f. <span class="rtl">${esc(q.f||"")}</span></div>`;
}
function showExplanation(i){
  const q=qAt(i);
  const bk=document.createElement("div"); bk.className="modal-bk";
  bk.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <div class="mtag">Pyetja ${i+1}</div>
    <p class="mq rtl">${fmt(q.q)}</p>
    ${explHtml(i)}
    <div class="closeRow"><button class="btn sm" id="closeHint">Mbylle</button></div>
  </div>`;
  document.body.appendChild(bk);
  const close=()=>{bk.remove();document.removeEventListener("keydown",escK);};
  const escK=(e)=>{if(e.key==="Escape")close();};
  bk.addEventListener("click",e=>{if(e.target===bk)close();});
  bk.querySelector("#closeHint").onclick=close;
  document.addEventListener("keydown",escK);
}

function toggleJump(){
  const w=document.getElementById("jumpWrap"); if(!w)return;
  if(!w.hidden){w.hidden=true;return;}
  const cells=state.prepared.map((_,k)=>{
    const ans=state.answers[k]!==null, cur=k===state.cur;
    return `<button class="cell ${ans?"answered":""} ${cur?"current":""}" data-k="${k}">${k+1}</button>`;
  }).join("");
  w.innerHTML=`<div class="jump"><h3>Kërce te pyetja</h3><div class="grid-n">${cells}</div></div>`;
  w.hidden=false;
  w.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{state.cur=parseInt(c.dataset.k,10);render();});
  w.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function confirmFinish(){
  const blank=state.answers.filter(a=>a===null).length;
  const msg=blank>0?`Ke ${blank} pyetje pa përgjigje. Këto numërohen si gabim. A dëshiron të përfundosh?`:`I ke përgjigjur të gjitha pyetjeve. A dëshiron të shohësh rezultatin?`;
  const bar=document.createElement("div");
  bar.style.cssText="position:fixed;inset:auto 0 0 0;z-index:30;background:var(--surface);border-top:1px solid var(--border);box-shadow:var(--shadow);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))";
  bar.innerHTML=`<div class="wrap" style="padding:0;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="flex:1 1 14rem;min-width:0">${msg}</span><button class="btn ghost sm" id="cancelFin">Jo, kthehu</button><button class="btn sm" id="okFin">Po, përfundo</button></div>`;
  document.body.appendChild(bar);
  document.getElementById("cancelFin").onclick=()=>bar.remove();
  document.getElementById("okFin").onclick=()=>{bar.remove();state.finished=true;state.screen="result";state.cur=0;save();render();};
}

let revFilter="all";
function renderResult(){
  const s=score(),pct=N?Math.round((s.correct/N)*100):0;
  const cells=state.prepared.map((_,k)=>{
    const a=state.answers[k]; let cls="blank";
    if(a!==null)cls=(a===state.prepared[k].correct)?"correct":"wrong";
    return `<button class="cell ${cls}" data-k="${k}" aria-label="Pyetja ${k+1}">${k+1}</button>`;
  }).join("");
  const perK={};
  for(let k=0;k<N;k++){const q=qAt(k);const o=perK[q.k]||(perK[q.k]={c:0,n:0});o.n++;if(state.answers[k]!==null&&state.answers[k]===state.prepared[k].correct)o.c++;}
  const byK=Object.keys(perK).map(Number).sort((a,b)=>a-b).map(k=>{const o=perK[k];const p=Math.round(o.c/o.n*100);
    return `<span class="pill ${p>=80?"ok":p>=50?"sk":"no"}" style="font-weight:500"><span class="rtl">${esc(kapName(k))}</span> ${o.c}/${o.n}</span>`;}).join(" ");
  app.innerHTML=`
  <div class="wrap">
    <div class="score">
      <div class="eyebrow" style="color:var(--gold)">Rezultati</div>
      <div class="big">${s.correct}<span style="font-size:.4em;color:var(--muted)"> / ${N}</span></div>
      <div class="pct">${pct}% të sakta</div>
      <div class="tags"><span class="pill ok">✓ ${s.correct} saktë</span><span class="pill no">✕ ${s.wrong} gabim</span>${s.blank?`<span class="pill sk">○ ${s.blank} pa përgjigje</span>`:""}</div>
    </div>
    <div class="jump" style="margin:0 0 14px"><h3>Sipas kapitujve</h3><div style="display:flex;flex-wrap:wrap;gap:7px">${byK}</div></div>
    <div class="legend"><span><i class="dot c"></i> saktë</span><span><i class="dot w"></i> gabim</span><span><i class="dot b"></i> pa përgjigje</span><span style="margin-inline-start:auto">Prek numrin për ta parë pyetjen ↓</span></div>
    <div class="jump" style="margin-top:0"><div class="grid-n" id="resGrid">${cells}</div></div>
    <div class="filterbar">
      <button class="chip ${revFilter==="all"?"on":""}" data-f="all">Të gjitha</button>
      <button class="chip ${revFilter==="wrong"?"on":""}" data-f="wrong">Vetëm gabimet (${s.wrong+s.blank})</button>
      <button class="chip ${revFilter==="correct"?"on":""}" data-f="correct">Vetëm të saktat (${s.correct})</button>
    </div>
    <div class="review" id="review"></div>
    <div style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="btn" id="againBtn">Rifillo kuizin</button>
      <button class="btn ghost" id="homeBtn">Ballina</button>
      <button class="btn ghost" id="themeBtn">◑ Temë</button>
    </div>
    <p class="foot">Allahu e di më së miri.</p>
  </div>`;
  const reviewEl=document.getElementById("review");
  function revCard(k){
    const q=qAt(k),prep=state.prepared[k],a=state.answers[k],opts=optsOf(q);
    const isCorrect=a!==null&&a===prep.correct, isTF=q.lloji==="tf";
    const badge=a===null?`<span class="rev-badge sk">Pa përgjigje</span>`:isCorrect?`<span class="rev-badge ok">Saktë</span>`:`<span class="rev-badge no">Gabim</span>`;
    const o=prep.order.map((origIdx,pos)=>{
      let cls="",mark="";
      const keyTxt=isTF?(origIdx===0?"✓":"✗"):KEYS[pos];
      if(pos===prep.correct){cls="c";mark="E saktë";}
      if(a===pos&&pos!==prep.correct){cls="w";mark="Zgjedhja jote";}
      if(a===pos&&pos===prep.correct){mark="Zgjedhja jote ✓";}
      return `<div class="rev-opt rtl ${cls}"><span class="key">${keyTxt}</span><span class="txt" style="min-width:0">${fmt(opts[origIdx])}</span>${mark?`<span class="mark">${mark}</span>`:""}</div>`;
    }).join("");
    return `<div class="rev-card" id="rev-${k}"><div class="rev-head"><span class="rev-num">Pyetja ${k+1}</span>${badge}<span class="muted rtl" style="margin-inline-start:auto;font-size:.95rem">${esc(kapName(q.k))}</span></div><p class="rev-q rtl">${fmt(q.q)}</p><div class="rev-opts" dir="rtl">${o}</div><details style="margin-top:10px"><summary class="muted" style="cursor:pointer;font-size:.9rem">🌐 Përkthimi dhe sqarimi</summary>${explHtml(k)}</details></div>`;
  }
  function paintReview(){
    let ks=[];
    for(let k=0;k<N;k++){const a=state.answers[k];const ok=a!==null&&a===state.prepared[k].correct;
      if(revFilter==="all")ks.push(k); else if(revFilter==="wrong"&&!ok)ks.push(k); else if(revFilter==="correct"&&ok)ks.push(k);}
    reviewEl.innerHTML=ks.length?ks.map(revCard).join(""):`<p class="muted" style="text-align:center;padding:20px">S'ka pyetje në këtë kategori.</p>`;
  }
  paintReview();
  document.getElementById("resGrid").querySelectorAll(".cell").forEach(c=>{
    c.onclick=()=>{const k=parseInt(c.dataset.k,10);
      if(revFilter!=="all"){revFilter="all";document.querySelectorAll(".filterbar .chip").forEach(x=>x.classList.toggle("on",x.dataset.f==="all"));paintReview();}
      const el=document.getElementById("rev-"+k);
      if(el){el.scrollIntoView({behavior:"smooth",block:"start"});el.style.transition="box-shadow .4s";el.style.boxShadow="0 0 0 2px var(--gold)";setTimeout(()=>{el.style.boxShadow="";},1200);}
    };
  });
  document.querySelectorAll(".filterbar .chip").forEach(ch=>ch.onclick=()=>{revFilter=ch.dataset.f;document.querySelectorAll(".filterbar .chip").forEach(x=>x.classList.toggle("on",x===ch));paintReview();});
  document.getElementById("againBtn").onclick=()=>{state=freshState(state.chs);state.screen="quiz";save();render();};
  document.getElementById("homeBtn").onclick=()=>{state.screen="start";selCh=null;save();render();};
  document.getElementById("themeBtn").onclick=toggleTheme;
}

function toggleTheme(){
  const root=document.documentElement,cur=root.getAttribute("data-theme");
  let next; if(cur==="dark")next="light"; else if(cur==="light")next="dark";
  else next=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"light":"dark";
  root.setAttribute("data-theme",next);
  try{localStorage.setItem(LS_KEY+"-theme",next);}catch(e){}
}
(function(){try{const t=localStorage.getItem(LS_KEY+"-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();

state=load()||freshState();
if(state.finished)state.screen="result";
render();
</script>
</body>
</html>
