orizuesi e mohon; pranohet fjala e autorizuesit.", "pse_ar": "لقول المؤلف: «والقول قوله في الرد والتلف ونفي التعدي».", "pse_sq": "Pohimi është i pasaktë. Autori thotë për të autorizuarin: «dhe fjala e tij pranohet për kthimin, shkatërrimin dhe mohimin e tejkalimit». Ai është i besuar, prandaj në këto tri çështje besohet ai, jo autorizuesi. Shembull: autorizuesi thotë «S'ma ktheve paranë» ose «E humbe nga pakujdesia», ndërsa i autorizuari thotë «Ta ktheva» ose «Humbi pa fajin tim»: besohet i autorizuari.", "f": "٥٩"}, {"id": "B057", "k": 13, "lloji": "mcq", "q": "وكّله أن يقضي عنه دَيناً لزيد، فقضاه في غيبة الموكِّل بغير بيّنة، فأنكر زيدٌ القبض. فما حكم الوكيل؟", "o": ["لا يضمن، لأنه أمين", "لا يضمن إن حلف أنه قضاه", "يضمن نصفَ الدَّين", "عليه الضمان"], "a": 3, "q_sq": "E autorizoi t'ia shlyejë Zejdit një borxh në emër të tij; ai ia pagoi në mungesë të autorizuesit pa provë (dëshmitarë), dhe Zejdi e mohoi marrjen. Cila është dispozita e të autorizuarit?", "o_sq": ["Nuk e garanton, sepse është i besuar", "Nuk e garanton nëse betohet se e ka shlyer", "E garanton gjysmën e borxhit", "E garanton (e paguan)"], "pse_ar": "لقول المؤلف: «وإذا قضى الدينَ بغير بينة ضمن إلا أن يقضيه بحضرة الموكل».", "pse_sq": "E sakta: e garanton. Autori thotë: «e nëse e shlyen borxhin pa dëshmi, e garanton, përveç kur e shlyen në praninë e autorizuesit». Edhe pse i autorizuari në parim është i besuar dhe fjala e tij pranohet, këtu autori e bën përgjegjës, sepse pagoi pa provë dhe jo para autorizuesit; prandaj e garanton të gjithë shumën, dhe betimi i tij s'e liron. Nëse do ta kishte paguar para syve të autorizuesit, nuk do ta garantonte. Shembull: të autorizuan t'i paguash dikujt 1.000 €; i pagove pa dëshmitarë e pa dëftesë dhe ai e mohon: e paguan sërish.", "f": "٥٩"}, {"id": "B058", "k": 13, "lloji": "mcq", "q": "قال رجلٌ لآخر: «بِعْ هذه السلعة بعشرة دراهم، فما زاد فلك»، فباعها باثني عشر. فما الحكم؟", "o": ["يصحّ، وللوكيل الدرهمان الزائدان", "لا يصحّ، لجهالة ما يأخذه الوكيل", "يصحّ، والاثنا عشر كلُّها للموكِّل", "لا يصحّ، لأن الوكالة لا تكون بجُعل"], "a": 0, "q_sq": "Një njeri i tha tjetrit: «Shite këtë mall për dhjetë dirhemë, e ç'të teprojë është e jotja», dhe ai e shiti për dymbëdhjetë. Cila është dispozita?", "o_sq": ["Është e vlefshme, dhe dy dirhemët e tepërt janë të të autorizuarit", "Nuk është e vlefshme, sepse s'dihet sa merr i autorizuari", "Është e vlefshme, por të dymbëdhjetat janë të autorizuesit", "Nuk është e vlefshme, sepse vekaleja s'bëhet me shpërblim"], "pse_ar": "لقول المؤلف: «ويجوز التوكيل بجُعل وبغيره، فلو قال: بع هذا بعشرة فما زاد فلك، صح».", "pse_sq": "E sakta: është e vlefshme, dhe teprica është e të autorizuarit. Autori thotë: «Lejohet autorizimi me shpërblim dhe pa të; nëse thotë: «Shite këtë për dhjetë, e ç'të teprojë është e jotja», është e vlefshme». Pra vekaleja lejohet edhe me shpërblim, dhe kjo formë është shprehimisht e vlefshme sipas autorit, edhe pse teprica s'dihet që në fillim. Meqë teprica u kushtëzua për të autorizuarin, ajo i takon atij. Shembull: «Shite telefonin; mua më jep 300 €, e çfarë merr mbi 300 € është jotja»; e shet për 350 € dhe 50 € janë të tuat.", "f": "٥٩"}, {"id": "B059", "k": 14, "lloji": "mcq", "q": "دفع زيدٌ عشرةَ آلاف، ودفع عمرٌو عشرةَ آلاف، وفتحا متجراً يعملان فيه معاً. فما نوع هذه الشركة؟", "o": ["شركة العِنان", "شركة الوجوه", "المضاربة", "شركة الأبدان"], "a": 0, "q_sq": "Zejdi dha 10.000 dhe Amri 10.000, hapën një dyqan dhe punojnë të dy në të. Çfarë lloji ortakërie është kjo?", "o_sq": ["Ortakëria inan", "Ortakëria vuxhuh", "Mudarebeja", "Ortakëria ebdan"], "pse_ar": "لقول المؤلف: «شركة العِنان: وهي أن يشتركا بماليهما وبدنيهما».", "pse_sq": "E sakta: ortakëria inan. Autori thotë: «Ortakëria inan: që të bashkohen me pasuritë dhe me punën e tyre». Këtu secili dha pasuri dhe punojnë të dy. Te vuxhuhu s'ka pasuri, por blejnë me autoritetin e tyre; te mudarebeja pasuria është nga njëri dhe puna nga tjetri; te ebdani s'ka pasuri, por vetëm punë.", "f": "٥٩"}, {"id": "B060", "k": 14, "lloji": "mcq", "q": "ما شركة الوجوه عند المؤلف؟", "o": ["أن يشتركا بماليهما وبدنيهما", "أن يدفع أحدهما إلى الآخر مالاً يتّجر فيه", "أن يشتركا فيما يشتريان بجاهيهما", "أن يشتركا فيما يكسبان بأبدانهما من المباح"], "a": 2, "q_sq": "Çfarë është ortakëria vuxhuh sipas autorit?", "o_sq": ["Që të bashkohen me pasuritë dhe me punën e tyre", "Që njëri t'i japë tjetrit pasuri për të tregtuar me të", "Që të bashkohen në atë që blejnë me autoritetin (reputacionin) e tyre", "Që të bashkohen në atë që fitojnë me punën e tyre nga gjërat e lejuara"], "pse_ar": "لقول المؤلف: «وشركة الوجوه: وهي أن يشتركا فيما يشتريان بجاهيهما».", "pse_sq": "E sakta: të bashkohen në atë që blejnë me autoritetin e tyre. Autori thotë: «Ortakëria vuxhuh: që të bashkohen në atë që blejnë me autoritetin (kredibilitetin) e tyre». Përkufizimet e tjera janë të ortakërisë inan (pasuri dhe punë), të mudarebes (pasuri nga njëri, punë nga tjetri) dhe të ortakërisë ebdan (punë në të lejuarën). Shembull: dy tregtarë pa kapital, por të njohur e të besuar, marrin mall me borxh nga shitësit me shumicë, e shesin dhe e ndajnë fitimin.", "f": "٥٩"}, {"id": "B061", "k": 14, "lloji": "tf", "q": "دفع رجلٌ إلى آخر عشرين ألفاً يتّجر فيها، على أن يكون الربح بينهما نصفين؛ فهذه شركة العِنان.", "a": 1, "q_sq": "Një njeri i dha tjetrit 20.000 që të tregtojë me to, me kusht që fitimi të jetë mes tyre përgjysmë; kjo është ortakëria inan.", "pse_ar": "هذه مضاربة، لقول المؤلف: «والمضاربة: وهي أن يدفع أحدهما إلى الآخر مالاً يتجر فيه، ويشتركان في ربحه».", "pse_sq": "Pohimi është i pasaktë; kjo është mudarebe. Autori thotë: «Mudarebe: që njëri t'i japë tjetrit pasuri për të tregtuar me të, dhe ata janë ortakë në fitimin e saj». Këtu pasuria është vetëm nga njëri dhe puna nga tjetri. Ortakëria inan është kur të dy japin pasuri dhe punojnë: «që të bashkohen me pasuritë dhe me punën e tyre».", "f": "٥٩"}, {"id": "B062", "k": 14, "lloji": "mcq", "q": "استدلّ المؤلف بقول ابن مسعود رضي الله عنه: «اشتركت أنا وسعد وعمار يوم بدر، فجاء سعد بأسيرين ولم آت أنا وعمار بشيء» على نوعٍ من أنواع الشركة. فما هو؟", "o": ["شركة الأبدان", "شركة العِنان", "شركة الوجوه", "المضاربة"], "a": 0, "q_sq": "Autori argumenton me fjalën e Ibn Mes'udit – Allahu qoftë i kënaqur me të –: «U bëmë ortakë unë, Sa'di dhe Ammari ditën e Bedrit; Sa'di solli dy robër, ndërsa unë dhe Ammari nuk sollëm asgjë.» për një nga llojet e ortakërisë. Cili është ai?", "o_sq": ["Ortakëria ebdan (e punës)", "Ortakëria inan", "Ortakëria vuxhuh", "Mudarebeja"], "pse_ar": "ذكره المؤلف دليلاً لشركة الأبدان: «وهي أن يشتركا فيما يكسبان بأبدانهما من المباح إما بصناعة أو احتشاش أو اصطياد ونحوه».", "pse_sq": "E sakta: ortakëria ebdan. Autori thotë: «Ortakëria ebdan: që të bashkohen në atë që fitojnë me punën e tyre nga gjërat e lejuara, qoftë me zanat, me mbledhje bari, me gjueti e të ngjashme», pastaj sjell fjalën e Ibn Mes'udit si argument. Tre sahabët s'kishin vënë kapital, por u bënë ortakë në atë që do të fitonin me punën (luftën) e tyre; prandaj s'është inan (pasuri e punë), as vuxhuh (blerje me autoritet), as mudarebe (pasuri nga njëri). Shembull i sotëm: dy elektricistë që ndajnë gjithçka fitojnë nga punët e tyre.", "f": "٥٩"}, {"id": "B063", "k": 14, "lloji": "mcq", "q": "اشترك اثنان: لأحدهما سبعون في المئة من المال، وللآخر ثلاثون، وشرطا أن يكون الربح بينهما نصفين، ثم خسرا. فكيف تُقسم الخسارة؟", "o": ["على قدر المال: سبعون وثلاثون", "نصفين، كما شرطا في الربح", "على العامل منهما وحده", "على صاحب الأكثر وحده"], "a": 0, "q_sq": "Dy veta u bënë ortakë: njëri ka 70% të kapitalit dhe tjetri 30%, dhe kushtëzuan që fitimi të jetë mes tyre përgjysmë; pastaj patën humbje. Si ndahet humbja?", "o_sq": ["Sipas sasisë së kapitalit: 70% dhe 30%", "Përgjysmë, ashtu siç kushtëzuan për fitimin", "Vetëm mbi atë prej tyre që punon", "Vetëm mbi atë që ka më shumë kapital"], "pse_ar": "لقول المؤلف: «والربح في جميع ذلك على ما شرطاه، والوضيعة على قدر المال».", "pse_sq": "E sakta: sipas kapitalit, 70% dhe 30%. Autori thotë: «Fitimi në të gjitha këto është sipas asaj që kanë kushtëzuar, ndërsa humbja sipas sasisë së pasurisë (së secilit)». Prandaj kushti i tyre për fitimin përgjysmë është i vlefshëm, por nuk shtrihet te humbja: humbja ndahet sipas kapitalit dhe s'bie vetëm mbi njërin. Shembull: humbin 1.000 € → i pari mban 700 €, i dyti 300 €.", "f": "٦٠"}, {"id": "B064", "k": 14, "lloji": "mcq", "q": "أيُّ الشروط التالية يجوز في الشركة عند المؤلف؟", "o": ["أن يكون لأحدهما ألفُ درهمٍ من الربح", "أن يكون لأحدهما ربحُ الثياب دون غيرها", "أن يكون لأحدهما ربحُ هذه الصفقة بعينها", "أن يكون لأحدهما ثلثُ الربح"], "a": 3, "q_sq": "Cili nga këto kushte lejohet në ortakëri sipas autorit?", "o_sq": ["Që njëri prej tyre të ketë një mijë dirhemë nga fitimi", "Që njëri prej tyre të ketë fitimin e rrobave dhe jo të tjerave", "Që njëri prej tyre të ketë fitimin e kësaj tregtie të caktuar", "Që njëri prej tyre të ketë një të tretën e fitimit"], "pse_ar": "لقول المؤلف: «والربح في جميع ذلك على ما شرطاه ... ولا يجوز أن يُجعل لأحدهما دراهمُ معينةٌ ولا ربح بشيء معين».", "pse_sq": "E sakta: një e treta e fitimit. Autori thotë: «Fitimi ... është sipas asaj që kanë kushtëzuar», dhe: «Nuk lejohet t'i caktohen njërit prej tyre dirhemë të caktuar, as fitimi i një sendi të caktuar». Një e treta është pjesë e përbashkët në gjithë fitimin, prandaj lejohet. Një mijë dirhemë janë shumë e prerë (dirhemë të caktuar); fitimi i rrobave ose i një tregtie të caktuar është fitim i një sendi të caktuar: të dyja ndalohen. Shembull: «Ti merr 500 € në muaj nga fitimi» nuk lejohet; «Ti merr 40% të fitimit» lejohet.", "f": "٦٠"}, {"id": "B065", "k": 14, "lloji": "tf", "q": "إذا اجتمع في الشركة ربحٌ وخسارة، قُسم الربحُ كاملاً ولم تُجبَر الخسارةُ منه.", "a": 1, "q_sq": "Kur në ortakëri bashkohen fitimi dhe humbja, fitimi ndahet i plotë dhe humbja nuk kompensohet prej tij.", "pse_ar": "لقول المؤلف: «وتُجبر الوضيعة من الربح».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «dhe humbja kompensohet nga fitimi». Prandaj së pari mbulohet humbja me fitimin, dhe ndahet vetëm ajo që mbetet. Shembull: në një muaj fitojnë 1.000 € dhe në tjetrin humbin 400 €: humbja mbulohet nga fitimi, dhe ndahen vetëm 600 €.", "f": "٦٠"}, {"id": "B066", "k": 14, "lloji": "tf", "q": "ليس لأحد الشريكين أن يبيع نسيئةً، ولا أن يأخذ شيئاً من الربح، إلا بإذن الآخر.", "a": 0, "q_sq": "Asnjëri nga dy ortakët nuk mund të shesë me afat pagese (nesie), as të marrë diçka nga fitimi, përveç me lejen e tjetrit.", "pse_ar": "لقول المؤلف: «وليس لأحدهما البيع نسيئة ولا أخذ شيء من الربح إلا بإذن الآخر».", "pse_sq": "Pohimi është i saktë. Autori thotë: «Asnjëri prej tyre nuk mund të shesë me afat pagese as të marrë diçka nga fitimi përveç me lejen e tjetrit». Të dyja prekin të drejtën e ortakut në pasurinë e përbashkët, prandaj kërkojnë pëlqimin e tij. Shembull: njëri ortak s'mund t'ia shesë mallin dikujt me këste, as të marrë 200 € nga fitimi për vete, pa lejen e ortakut.", "f": "٦٠"}, {"id": "B067", "k": 15, "lloji": "mcq", "q": "دفع رجلٌ بستانَ زيتونٍ إلى آخر يقوم عليه، على أن للعامل مئةَ كيلو من الزيتون والباقي لصاحب البستان. فما حكم هذه المساقاة؟", "o": ["تجوز، لأن نصيب العامل معلوم", "تجوز إن كان الثمر يزيد على مئة كيلو", "لا تجوز، لأنه جعل للعامل قدراً معيَّناً", "لا تجوز، لأن المساقاة لا تكون في الزيتون"], "a": 2, "q_sq": "Një njeri ia dha tjetrit një ullishtë që të kujdeset për të, me kusht që punëtori të ketë 100 kg ullinj dhe pjesa tjetër të jetë e pronarit të ullishtes. Cila është dispozita e këtij musakati?", "o_sq": ["Lejohet, sepse pjesa e punëtorit është e njohur", "Lejohet nëse fryti i kalon 100 kg", "Nuk lejohet, sepse punëtorit i caktoi një sasi të prerë", "Nuk lejohet, sepse musakati nuk bëhet te ullinjtë"], "pse_ar": "لقول المؤلف: «تجوز المساقاةُ في كل شجر له ثمر بجزء من ثمره مشاعاً معلوماً»، وقال في الشركة: «ولا يجوز أن يُجعل لأحدهما دراهمُ معينةٌ ... والحكم في المساقاة والمزارعة كذلك».", "pse_sq": "E sakta: nuk lejohet, sepse punëtorit iu caktua sasi e prerë. Autori thotë se musakati lejohet «në çdo pemë që ka fryt, për një pjesë» nga fryti i saj, të përbashkët (si gjysma ose e treta e gjithë frytit) dhe të njohur; ndërsa në kapitullin e ortakërisë thotë se nuk lejohet t'i caktohet njërit shumë e caktuar, dhe: «Dispozita në musakat dhe muzaraa është e njëjtë». Njohja e sasisë s'mjafton kur pjesa s'është e përbashkët, dhe as fakti që fryti mund ta kalojë sasinë s'e ndryshon dispozitën. Ulliri është pemë me fryt, prandaj musakati në të lejohet kur pjesa është e drejtë. Shembull i lejuar: «Kujdesu për ullishtën time; një e treta e ullinjve është e jotja».", "f": "٦٠"}, {"id": "B068", "k": 15, "lloji": "tf", "q": "لا تصحّ المزارعة إلا أن يكون البَذْرُ من صاحب الأرض.", "a": 1, "q_sq": "Muzaraa nuk është e vlefshme, përveç nëse fara është nga pronari i tokës.", "pse_ar": "لقول المؤلف: «والمزارعةُ في الأرض بجزء من زرعها، سواء كان البذر منهما أو من أحدهما».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «...dhe muzaraa në tokë, për një pjesë të të mbjellave të saj, qoftë fara prej të dyve apo prej njërit prej tyre». Pra farën mund ta japë pronari i tokës, punëtori ose të dy bashkë. Shembull: «Mbille arën time me grurë, me farën tënde; gjysma e të korrave është e jotja» – lejohet.", "f": "٦٠"}, {"id": "B069", "k": 15, "lloji": "mcq", "q": "ما الدليل الذي ذكره المؤلف على جواز المساقاة والمزارعة؟", "o": ["قول ابن مسعود: «اشتركت أنا وسعد وعمار يوم بدر، فجاء سعد بأسيرين ولم آت أنا وعمار بشيء»", "قول رسول الله ﷺ: «مَن أحيَا أرضاً ميتةً فهي له»", "قول رسول الله ﷺ: «إذا أُتبعَ أحدُكم على مليءٍ فليتبعْ»", "قول ابن عمر: «عامل رسول الله ﷺ أهلَ خيبرَ بشطر ما يخرج منها من زرع وثمر»"], "a": 3, "q_sq": "Cili është argumenti që përmend autori për lejimin e musakatit dhe muzaraasë?", "o_sq": ["Fjala e Ibn Mes'udit: «U bëmë ortakë unë, Sa'di dhe Ammari ditën e Bedrit; Sa'di solli dy robër, ndërsa unë dhe Ammari nuk sollëm asgjë.»", "Fjala e të Dërguarit të Allahut ﷺ: «Kush e ringjall një tokë të vdekur, ajo është e tij.»", "Fjala e të Dërguarit të Allahut ﷺ: «Kur ndonjëri prej jush transferohet (për të marrë borxhin) te një i pasur, le ta pranojë.»", "Fjala e Ibn Umerit: «I Dërguari i Allahut ﷺ bëri marrëveshje me banorët e Hajberit (që ta punonin tokën) për gjysmën e asaj që del prej saj, drithëra apo fryte.»"], "pse_ar": "لقول المؤلف: «لقول ابن عمر: عامل رسول الله ﷺ أهلَ خيبرَ بشطر ما يخرج منها من زرع وثمر. وفي لفظ: على أن يعتملوها من أموالهم».", "pse_sq": "E sakta: fjala e Ibn Umerit për Hajberin. Autori, pasi lejon musakatin dhe muzaraanë, thotë: «për shkak të fjalës së Ibn Umerit: «I Dërguari i Allahut ﷺ bëri marrëveshje me banorët e Hajberit (që ta punonin tokën) për gjysmën e asaj që del prej saj, drithëra apo fryte.» Dhe në një formulim: «...me kusht që ta punojnë me pasuritë e tyre (me mjetet e veta).»» Fryti tregon musakatin dhe drithërat muzaraanë. Fjala e Ibn Mes'udit është argument për ortakërinë ebdan; hadithi i tokës së vdekur për ringjalljen e mevatit; hadithi i transferimit te i pasuri për havalenë.", "f": "٦٠"}, {"id": "B070", "k": 15, "lloji": "mcq", "q": "ما الذي يلزم العاملَ من العمل في المساقاة والمزارعة عند المؤلف؟", "o": ["عملُ ما جرت العادةُ بعمله", "كلُّ عملٍ يحتاجه الشجرُ أو الزرع", "السقيُ وحده، وما سواه على المالك", "لا يلزمه إلا ما سمّاه في العقد لفظاً"], "a": 0, "q_sq": "Çfarë pune ka për detyrë punëtori në musakat dhe muzaraa sipas autorit?", "o_sq": ["Atë punë që zakonisht bëhet (nga punëtori)", "Çdo punë që u nevojitet pemëve ose të mbjellave", "Vetëm ujitjen, kurse pjesa tjetër është mbi pronarin", "Vetëm atë që u përmend me fjalë në kontratë"], "pse_ar": "لقول المؤلف: «وعلى العامل عمل ما جرت العادة بعمله».", "pse_sq": "E sakta: atë punë që zakonisht bëhet. Autori thotë: «Punëtori ka për detyrë të bëjë atë që zakonisht bëhet (nga punëtori)». Pra detyrat përcaktohen sipas zakonit të vendit: jo çdo punë që u nevojitet pemëve, jo vetëm ujitja, dhe jo vetëm ajo që u tha me fjalë. Shembull: në shumë vende punëtori zakonisht ujit, krasit dhe vjel.", "f": "٦٠"}, {"id": "B071", "k": 15, "lloji": "tf", "q": "دفع رجلٌ إلى آخر دابّةً يعمل عليها، على أن ما حصل من كسبٍ فهو بينهما؛ فهذا جائز عند المؤلف قياساً على المساقاة والمزارعة.", "a": 0, "q_sq": "Një njeri i dha tjetrit një kafshë (pune) që të punojë me të, me kusht që ajo që fitohet të jetë mes tyre; kjo lejohet sipas autorit, me analogji me musakatin dhe muzaraanë.", "pse_ar": "لقول المؤلف: «ولو دفع إلى رجل دابة يعمل عليها وما حصل بينهما، جاز على قياس ذلك».", "pse_sq": "Pohimi është i saktë. Autori thotë: «dhe nëse i jep një njeriu një kafshë për të punuar me të, e ajo që fitohet të jetë mes tyre, lejohet duke e krahasuar me këtë». Siç pronari i pemës jep pemën dhe punëtori punon, e pastaj e ndajnë frytin, ashtu edhe këtu njëri jep kafshën dhe tjetri punon, dhe e ndajnë fitimin. Shembull: i jep dikujt kalin që të bartë ngarkesa me të, dhe fitimin e ndani në përqindje.", "f": "٦٠"}, {"id": "B072", "k": 16, "lloji": "mcq", "q": "ما الموات الذي يُملَك بالإحياء عند المؤلف؟", "o": ["الأرضُ الداثرة التي يُعرف لها مالكٌ غائب", "الأرضُ الداثرة التي لا يُعرف لها مالك", "الأرضُ المزروعة التي مات مالكها", "كلُّ أرضٍ لا ماءَ فيها ولو كان لها مالك"], "a": 1, "q_sq": "Çfarë është mevati (toka e vdekur) që merret në pronësi me ringjallje sipas autorit?", "o_sq": ["Toka e shkretuar që i dihet pronari, por ai mungon", "Toka e shkretuar së cilës nuk i dihet pronar", "Toka e mbjellë, pronari i së cilës ka vdekur", "Çdo tokë pa ujë, edhe nëse ka pronar"], "pse_ar": "لقول المؤلف: «وهي الأرض الداثرة التي لا يُعرف لها مالك».", "pse_sq": "E sakta: toka e shkretuar së cilës nuk i dihet pronar. Autori thotë: «Ajo është toka e shkretuar së cilës nuk i dihet pronar». Duhen dy cilësi: të jetë e shkretuar dhe të mos i dihet pronar. Toka me pronar të njohur, qoftë ai i munguar ose i vdekur, nuk është mevat; po ashtu mungesa e ujit vetëm nuk e bën tokën mevat. Shembull: një copë tokë e shkretë, pa ndërtime e pa të mbjella, që askush s'dihet se është pronari i saj.", "f": "٦٠"}, {"id": "B073", "k": 16, "lloji": "tf", "q": "مَن أحيا أرضاً مواتاً لم يملكها، وإنما له الانتفاعُ بها.", "a": 1, "q_sq": "Kush e ringjall një tokë të vdekur (mevat) nuk bëhet pronar i saj, por ka vetëm të drejtën ta shfrytëzojë.", "pse_ar": "لقول المؤلف: «فمن أحياها ملكها، لقول رسول الله ﷺ: مَن أحيَا أرضاً ميتةً فهي له».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «kush e ringjall (e punon), bëhet pronar i saj, për shkak të fjalës së të Dërguarit të Allahut ﷺ: «Kush e ringjall një tokë të vdekur, ajo është e tij.»» Fjala «ajo është e tij» tregon pronësi, jo vetëm të drejtë shfrytëzimi. Hadithin e transmetojnë Ebu Davudi dhe Tirmidhiu, i cili tha: hasen sahih.", "f": "٦٠"}, {"id": "B074", "k": 16, "lloji": "mcq", "q": "ما إحياءُ الموات عند المؤلف؟", "o": ["الإقامةُ فيها مدّةً من الزمن", "عمارتُها بما تتهيّأ به لِما يُراد منها", "وضعُ علاماتٍ على حدودها", "إذنُ الحاكم بتملّكها"], "a": 1, "q_sq": "Çfarë është ringjallja e tokës së vdekur sipas autorit?", "o_sq": ["Qëndrimi në të për një kohë", "Punimi (ndërtimi) i saj me atë me të cilën përgatitet për atë që synohet prej saj", "Vënia e shenjave në kufijtë e saj", "Leja e gjykatësit (pushtetit) për ta marrë në pronësi"], "pse_ar": "لقول المؤلف: «وإحياؤها عمارتها بما تتهيأ به لما يراد منها كالتحويط عليها، وسوق الماء إليها إن أرادها للزرع، وقلع أشجارها وأحجارها المانعة من غرسها وزرعها».", "pse_sq": "E sakta: punimi i saj me atë që e përgatit për qëllimin e synuar. Autori thotë: «Ringjallja e saj është ndërtimi (punimi) i saj me atë me të cilën përgatitet për atë që synohet prej saj, si rrethimi i saj me mur, sjellja e ujit në të nëse e do për mbjellje, dhe shkulja e pemëve e gurëve të saj që pengojnë mbjelljen dhe kultivimin e saj». Pra ringjallja varet nga qëllimi dhe kërkon punë që e bën tokën të përdorshme; qëndrimi në të ose vënia e shenjave nuk e përgatitin tokën, dhe autori nuk e përmend lejen e gjykatësit. Shembull: për ta mbjellë me grurë, i sjell ujin dhe e pastron nga gurët e shkurret.", "f": "٦٠"}, {"id": "B075", "k": 16, "lloji": "mcq", "q": "مَن حفر في الموات بئراً فوصل إلى الماء ملك حريمَها. فكم حريمُ البئر العاديّة والبئر البديء عند المؤلف؟", "o": ["العاديّة خمسةٌ وعشرون ذراعاً، والبديء خمسون ذراعاً من كلّ جانب", "كلتاهما خمسون ذراعاً من كلّ جانب", "العاديّة خمسون ذراعاً من كلّ جانب، والبديء خمسةٌ وعشرون ذراعاً", "كلتاهما خمسةٌ وعشرون ذراعاً"], "a": 2, "q_sq": "Kush hap një pus në tokë të vdekur dhe arrin në ujë, bëhet pronar i harimit të tij (zonës përreth që i takon). Sa është harimi i pusit adij (të vjetër, të cilit s'i dihet as pronari as hapësi) dhe i pusit bedi' (të ri, të hapur në kohën e Islamit) sipas autorit? (pashë = dhira', masë e vjetër gjatësie)", "o_sq": ["Adij 25 pashë, bedi' 50 pashë nga çdo anë", "Të dy 50 pashë nga çdo anë", "Adij 50 pashë nga çdo anë, bedi' 25 pashë", "Të dy 25 pashë"], "pse_ar": "لقول المؤلف: «وإن حفر فيها بئراً فوصل إلى الماء ملك حريمَه، وهو خمسون ذراعاً من كل جانب إن كانت عاديَّة، وحريم البئر البديءِ خمسة وعشرون ذراعاً».", "pse_sq": "E sakta: pusi adij 50 pashë nga çdo anë, pusi bedi' 25 pashë. Autori thotë: «Nëse hap në të një pus dhe arrin në ujë, bëhet pronar i harimit të tij, që është pesëdhjetë pashë (dhira') nga çdo anë nëse është pus i vjetër (adij), ndërsa harimi i pusit të ri (bedi') është njëzet e pesë pashë». Harimi fitohet kur pusi arrin në ujë, dhe i vjetri ka harim dyfish të të riut; opsionet e tjera i ndërrojnë ose i barazojnë.", "f": "٦٠"}, {"id": "C001", "k": 17, "lloji": "mcq", "q": "قال رجلٌ: مَن ردّ عليّ ضالّتي فله مئةُ درهم. فما اسمُ هذا التصرّف في كتاب المؤلف؟", "o": ["الإجارة", "الوديعة", "العاريّة", "الجعالة"], "a": 3, "q_sq": "Një njeri tha: «Kush ma kthen kafshën time të humbur (dal-len), i takojnë njëqind dirhemë». Si quhet ky veprim në librin e autorit?", "o_sq": ["Ixhare (qira)", "Vedia (amanet për ruajtje)", "Arijje (send i huazuar)", "Xhiale (shpërblim i premtuar)"], "pse_ar": "لأن المؤلف عرّف الجعالة بقوله: «وهي أن يقول: من رد لقطتي أو ضالتي أو بنى لي هذا الحائط فله كذا».", "pse_sq": "E sakta: xhialeja. Autori thotë: «Ajo është kur (dikush) thotë: ‹Kush ma kthen sendin tim të humbur ose kafshën time të humbur, ose ma ndërton këtë mur, i takon kaq›». Xhialeja është premtim i hapur për këdo që e kryen punën. Ixhareja (qiraja) sipas autorit është «kontratë mbi dobitë... e detyrueshme nga të dyja palët», me punëtor dhe punë të caktuar. Vedia është pasuri që i lihet dikujt ta ruajë si amanet, ndërsa arijje është sendi i huazuar për përdorim. Asnjëra prej tyre nuk është premtim shpërblimi për atë që kryen një punë. Shembull: «Kush ma gjen çantën e humbur, i jap 100 €».", "f": "٦١"}, {"id": "C002", "k": 17, "lloji": "tf", "q": "قال رجلٌ: مَن بنى لي هذا الحائطَ فله كذا، فبناه رجلٌ بعد أن سمع قولَه؛ فإنه يستحقّ الجُعل.", "a": 0, "q_sq": "Një njeri tha: «Kush ma ndërton këtë mur, i takon kaq», dhe një tjetër e ndërtoi pasi e dëgjoi fjalën e tij; ai e meriton shpërblimin (xhu'lin).", "pse_ar": "لقول المؤلف: «أو بنى لي هذا الحائط فله كذا، فمن فعل ذلك استحق الجعل».", "pse_sq": "Pohimi është i saktë. Autori thotë: «...ose ma ndërton këtë mur, i takon kaq; kush e bën këtë, e meriton shpërblimin». Këtu punëtori e dëgjoi premtimin dhe e kreu punën, prandaj shpërblimi i takon. Ndryshe është kur dikush e kryen punën para se t'i arrijë lajmi për shpërblimin. Shembull: një fermer shpall «Kush ma ndërton murin e oborrit, i jap 500 €»; një mjeshtër e dëgjon dhe e ndërton: i merr 500 €.", "f": "٦١"}, {"id": "C003", "k": 17, "lloji": "mcq", "q": "ما الدليلُ الذي ذكره المؤلف على مشروعيّة الجعالة؟", "o": ["حديثُ: «لا سَبَقَ إلا في نَصْلٍ أو خفٍّ أو حافرٍ» في المسابقة", "حديثُ أبي سعيد في الرُّقية بفاتحة الكتاب على قطيعٍ من الغنم", "حديثُ زيد بن خالد في لقطة الذهب والوَرِق وتعريفها سنةً", "حديثُ جابر في قضاء النبي ﷺ بالشفعة في كلّ ما لم يُقسَم"], "a": 1, "q_sq": "Cili është argumenti që e përmend autori për ligjshmërinë e xhialesë?", "o_sq": ["Hadithi: «Nuk ka shpërblim gare (sebek) përveç në shigjetë, në thundër deveje ose në thundër kali», për garën", "Hadithi i Ebu Seidit për rukjen me Fatihanë e Librit në këmbim të një tufe dhensh", "Hadithi i Zejd ibn Halidit për sendin e gjetur prej ari dhe argjendi dhe shpalljen e tij një vit", "Hadithi i Xhabirit se Pejgamberi ﷺ gjykoi për shuf'a në çdo gjë që nuk është ndarë"], "pse_ar": "لقول المؤلف بعد ذكر الجعالة: «لما روى أبو سعيد: أن قوماً لُدغَ رجل منهم...» إلى قوله ﷺ: «خذوا واضربُوا لي معكم بسهمٍ».", "pse_sq": "E sakta: hadithi i Ebu Seidit. Autori pasi e përkufizon xhialenë thotë: «...për shkak të asaj që ka transmetuar Ebu Seidi», dhe sjell ngjarjen e grupit që ua caktoi shokëve të Pejgamberit ﷺ një tufë dhensh që ta shëronin të pickuarin; njëri prej tyre lexoi Fatihanë dhe ai u shërua, e Pejgamberi ﷺ tha: «Merrini dhe më caktoni edhe mua një pjesë me ju». Shpërblimi u caktua për rezultatin (shërimin), dhe kjo është vetë xhialeja. Hadithi i Zejdit është argument për lukatën, hadithi i Xhabirit për shuf'anë, ndërsa hadithi «Nuk ka shpërblim gare...» për garën me shpërblim.", "f": "٦١"}, {"id": "C004", "k": 17, "lloji": "mcq", "q": "وجد رجلٌ محفظةً ضائعةً فالتقطها، ثم علم بعد التقاطها أن صاحبها قد جعل لمن يردّها مئةَ درهم، فردّها إليه. فما الحكم؟", "o": ["يستحقّه إن ردّها في يومه", "لا يستحقّ الجُعلَ", "يستحقّ الجُعلَ كاملاً", "يستحقّ نصفَ الجُعل"], "a": 1, "q_sq": "Një njeri gjeti një portofol të humbur dhe e mori; pasi e mori, mësoi se i zoti kishte caktuar njëqind dirhemë për atë që ia kthen, dhe ia ktheu. Cila është dispozita?", "o_sq": ["E meriton nëse ia kthen po atë ditë", "Nuk e meriton shpërblimin", "E meriton shpërblimin të plotë", "E meriton gjysmën e shpërblimit"], "pse_ar": "لقول المؤلف: «ولو التقط اللقطة قبل أن يبلغه الجعل لم يستحقه».", "pse_sq": "E sakta: nuk e meriton shpërblimin. Autori thotë: «Nëse e gjen sendin e humbur para se t'i arrijë lajmi për shpërblimin, nuk e meriton atë». Ai e mori portofolin pa qenë në dijeni të premtimit, pra nuk e bëri punën për shpërblimin, por si detyrë që e kishte gjithsesi (kthimin e sendit të gjetur). Autori nuk përmend as shpërblim të plotë, as gjysmë, as kusht kohe. Shembull: gjen një telefon, e merr, e pastaj lexon se i zoti ka shpallur 50 € për gjetësin: ia kthen, por s'i merr 50 €.", "f": "٦١"}, {"id": "C005", "k": 18, "lloji": "mcq", "q": "أيُّ ما يلي من اللقطة يجوز أخذُه والانتفاعُ به من غير تعريف؟", "o": ["عصاً أو سوطٌ مما تقلّ قيمتُه", "كيسٌ مربوطٌ فيه دنانيرُ كثيرة", "شاةٌ ضالّةٌ وجدها في الصحراء", "بعيرٌ ضالٌّ يرد الماء ويرعى"], "a": 0, "q_sq": "Cila nga këto lukata (sende të gjetura) lejohet të merret dhe të shfrytëzohet pa u shpallur?", "o_sq": ["Një shkop ose kamxhik, nga ato që kanë vlerë të vogël", "Një qese e lidhur me shumë dinarë brenda", "Një dele e humbur që e gjeti në shkretëtirë", "Një deve e humbur që shkon në ujë dhe kullot"], "pse_ar": "لقول المؤلف: «أحدها: ما تقل قيمته فيجوز أخذه والانتفاع به من غير تعريف».", "pse_sq": "E sakta: shkopi ose kamxhiku me vlerë të vogël. Autori thotë: «E para: ajo që ka vlerë të vogël; lejohet marrja dhe shfrytëzimi i saj pa e shpallur». (Autori sjell për këtë një transmetim nga Xhabiri për shkopin dhe kamxhikun, por fusnota e librit përmend se zinxhiri i tij është kritikuar.) Qesja me shumë dinarë dhe delja janë nga lloji i tretë (vlerë e madhe / kafshë që s'mbrohet nga grabitqarët e vegjël): merren, por është detyrë të shpallen. Deveja është nga lloji i dytë: nuk lejohet as të merret. Shembull sot: një stilolaps i lirë i gjetur në rrugë.", "f": "٦١"}, {"id": "C006", "k": 18, "lloji": "mcq", "q": "وجد رجلٌ في البرّيّة بعيراً ضالّاً. فما حكمُ أخذه؟", "o": ["يجوز أخذُه ويعرّفه حولاً", "يجوز أخذُه ويملكه في الحال", "يجب أخذُه ليحفظه لصاحبه", "لا يجوز أخذُه"], "a": 3, "q_sq": "Një njeri gjeti në shkretëtirë një deve të humbur. Cila është dispozita e marrjes së saj?", "o_sq": ["Lejohet ta marrë dhe e shpall një vit", "Lejohet ta marrë dhe bëhet pronar i saj menjëherë", "Është detyrë ta marrë që t'ia ruajë të zotit", "Nuk lejohet ta marrë"], "pse_ar": "لقول المؤلف: «الثاني: الحيوان الذي يمتنع بنفسه من صغار السباع كالإبل والخيل ونحوهما فلا يجوز أخذها».", "pse_sq": "E sakta: nuk lejohet ta marrë. Autori thotë: «E dyta: kafsha që mbrohet vetë nga grabitqarët e vegjël, si devetë, kuajt e të ngjashmit; nuk lejohet marrja e tyre», sepse Pejgamberi ﷺ u pyet për devenë e humbur dhe tha: «Ç'punë ke ti me të? Lëre, sepse ajo ka me vete këpucën dhe enën e ujit: shkon në ujë dhe ha nga drurët, derisa t'i vijë i zoti». Shpallja një vit është dispozita e llojit të tretë (sendet me vlerë të madhe), jo e devesë. As pronësia menjëherë, as detyrimi i marrjes nuk përmenden; përkundrazi, kush e merr nuk bëhet pronar dhe e garanton.", "f": "٦١"}, {"id": "C007", "k": 18, "lloji": "mcq", "q": "أخذ رجلٌ فرساً ضالّاً من المرعى، ثم أراد أن يبرأ من ضمانه. فبِمَ يبرأ منه؟", "o": ["بتعريفه حولاً كاملاً", "بالإشهاد على أنه أخذه لصاحبه", "بدفعه إلى نائب الإمام", "بردّه إلى الموضع الذي وجده فيه"], "a": 2, "q_sq": "Një njeri mori një kalë të humbur nga kullota, pastaj deshi të lirohej nga garantimi i tij. Me çfarë lirohet?", "o_sq": ["Duke e shpallur një vit të plotë", "Duke marrë dëshmitarë se e mori për të zotin", "Duke ia dorëzuar përfaqësuesit të prijësit", "Duke e kthyer në vendin ku e gjeti"], "pse_ar": "لقول المؤلف: «ومن أخذ هذا لم يملكه ولزمه ضمانه ولم يبرأ منه إلا بدفعه إلى نائب الإمام».", "pse_sq": "E sakta: duke ia dorëzuar përfaqësuesit të prijësit. Kali është nga lloji i dytë (kafshë që mbrohet vetë). Autori thotë: «Kush e merr këtë, nuk bëhet pronar i saj, ka për detyrë ta garantojë dhe nuk lirohet prej saj veçse duke ia dorëzuar përfaqësuesit të prijësit». Fjala «veçse» i përjashton të gjitha rrugët e tjera: as kthimi në kullotë, as shpallja një vit, as marrja e dëshmitarëve nuk e lirojnë. Sot: ia dorëzon organit zyrtar që e cakton pushteti për kafshët e humbura.", "f": "٦١"}, {"id": "C008", "k": 18, "lloji": "tf", "q": "مَن أخذ بعيراً ضالّاً فعرّفه حولاً فلم يأتِ صاحبُه، ملكه وصار كسائر ماله.", "a": 1, "q_sq": "Kush merr një deve të humbur dhe e shpall një vit, e i zoti nuk paraqitet, bëhet pronar i saj dhe ajo bëhet si pjesa tjetër e pasurisë së tij.", "pse_ar": "لقول المؤلف في الإبل والخيل: «ومن أخذ هذا لم يملكه ولزمه ضمانه».", "pse_sq": "Pohimi është i pasaktë. Për devenë, kalin e të ngjashmit autori thotë: «Kush e merr këtë, nuk bëhet pronar i saj, ka për detyrë ta garantojë dhe nuk lirohet prej saj veçse duke ia dorëzuar përfaqësuesit të prijësit». Fjalët «ajo është si pjesa tjetër e pasurisë së tij» pas një viti shpalljeje janë dispozita e llojit të tretë (paratë, mallrat dhe kafshët që s'mbrohen nga grabitqarët e vegjël), jo e devesë, marrja e së cilës nuk lejohet që në fillim.", "f": "٦١"}, {"id": "C009", "k": 18, "lloji": "mcq", "q": "وجد رجلٌ كيساً فيه دنانيرُ كثيرة فأخذه. فكم مدّةُ تعريفه، وأين يُعرّفه؟", "o": ["ثلاثةَ أيامٍ في مجامع الناس كالأسواق وأبواب المساجد", "حولاً في مجامع الناس كالأسواق وأبواب المساجد", "شهراً في مجامع الناس كالأسواق وأبواب المساجد", "ستّةَ أشهرٍ في مجامع الناس كالأسواق وأبواب المساجد"], "a": 1, "q_sq": "Një njeri gjeti një qese me shumë dinarë dhe e mori. Sa kohë e shpall dhe ku e shpall?", "o_sq": ["Tri ditë, në vendet ku mblidhen njerëzit, si tregjet dhe dyert e xhamive", "Një vit, në vendet ku mblidhen njerëzit, si tregjet dhe dyert e xhamive", "Një muaj, në vendet ku mblidhen njerëzit, si tregjet dhe dyert e xhamive", "Gjashtë muaj, në vendet ku mblidhen njerëzit, si tregjet dhe dyert e xhamive"], "pse_ar": "لقول المؤلف: «الثالث: ما تكثر قيمته من الأثمان... فيجوز أخذه، ويجب تعريفه حولاً في مجامع الناس كالأسواق وأبواب المساجد».", "pse_sq": "E sakta: një vit. Paratë e shumta janë nga lloji i tretë. Autori thotë: «E treta: ajo që ka vlerë të madhe, nga paratë, mallrat... lejohet marrja e saj, dhe është detyrë shpallja e saj një vit në vendet ku mblidhen njerëzit, si tregjet dhe dyert e xhamive». Edhe hadithi i Zejd ibn Halidit thotë: «...pastaj shpalle një vit». Një muaj, gjashtë muaj ose tri ditë nuk përmenden te autori. Shembull sot: shpall «Kush ka humbur një portofol në këtë lagje?» në vende të frekuentuara dhe në rrjete, gjatë një viti.", "f": "٦١"}, {"id": "C010", "k": 18, "lloji": "mcq", "q": "عرّف رجلٌ لقطةً كثيرةَ القيمة، فجاء رجلٌ فوصف وعاءها ووكاءها وصفتها وصفاً مطابقاً، ولا شهودَ معه. فما الحكم؟", "o": ["يدفعها إليه بغير بيّنة", "لا يدفعها إليه حتى يأتي ببيّنة", "يدفع إليه نصفَها حتى يأتي ببيّنة", "لا يدفعها إليه إلا بعد تمام الحول"], "a": 0, "q_sq": "Një njeri po e shpallte një send të gjetur me vlerë të madhe; erdhi dikush dhe ia përshkroi saktë qesen, lidhësen dhe cilësitë e tij, por pa dëshmitarë. Cila është dispozita?", "o_sq": ["Ia jep pa provë (bejjine)", "Nuk ia jep derisa të sjellë provë", "I jep gjysmën derisa të sjellë provë", "Nuk ia jep veçse pasi të mbushet viti"], "pse_ar": "لقول المؤلف: «فمتى جاء طالبه فوصفه دفعه إليه بغير بينة».", "pse_sq": "E sakta: ia jep pa provë. Autori thotë: «Sa herë që vjen ai që e kërkon dhe e përshkruan, ia jep pa provë». Përshkrimi i saktë mjafton; nuk kërkohen dëshmitarë, as nuk ndahet sendi, dhe fjala «sa herë» tregon se nuk pritet mbarimi i vitit. Prandaj gjetësi duhet ta shpallë gjetjen pa e përshkruar plotësisht, që shenjat t'i dijë vetëm i zoti. Shembull: dikush thotë «portofol i zi prej lëkure, me 300 € dhe një kartë brenda» dhe përputhet: ia jep.", "f": "٦١"}, {"id": "C011", "k": 18, "lloji": "tf", "q": "إذا عرّف اللقطةَ حولاً فلم تُعرَف، صارت كسائر ماله، وله أن يتصرّف فيها قبل أن يعرف وعاءها ووكاءها وصفتها.", "a": 1, "q_sq": "Nëse e shpall sendin e gjetur një vit dhe nuk njihet (nga i zoti), ai bëhet si pjesa tjetër e pasurisë së tij, dhe ai mund ta përdorë para se t'ia njohë enën (qesen), lidhësen dhe përshkrimin.", "pse_ar": "لقول المؤلف: «وإن لم يعرف فهو كسائر ماله، ولا يتصرف فيه حتى يعرف وعاءه ووكاءه وصفته».", "pse_sq": "Pohimi është i pasaktë. Pjesa e parë është e saktë, por autori shton: «...por nuk e përdor derisa ta njohë enën (qesen) e saj, lidhësen e saj dhe përshkrimin e saj». Kjo bëhet që, nëse vjen i zoti më vonë dhe e përshkruan, gjetësi ta njohë dhe t'ia kthejë atë ose të ngjashmen e saj. Shembull: para se t'i shpenzojë paratë e gjetura, shënon: «portofol i zi, me zinxhir, 300 €».", "f": "٦١"}, {"id": "C012", "k": 18, "lloji": "mcq", "q": "عرّف رجلٌ دراهمَ وجدها حولاً فلم يأتِ صاحبُها، فأنفقها، ثم جاء صاحبُها بعد سنتين فوصفها. فما الذي يلزم الملتقط؟", "o": ["لا شيء عليه، لأنها صارت من ماله", "أن يدفع إليه نصفَ مثلها", "لا شيء عليه إلا أن يأتي ببيّنة", "أن يدفع إليه مثلَها"], "a": 3, "q_sq": "Një njeri i shpalli një vit dirhemët që i gjeti, e i zoti s'u paraqit; pastaj i shpenzoi, dhe pas dy vjetësh erdhi i zoti dhe i përshkroi. Çfarë i bie gjetësit?", "o_sq": ["Asgjë, sepse u bënë pasuri e tij", "T'i japë gjysmën e të ngjashmeve", "Asgjë, përveç nëse ai sjell provë", "T'i japë të ngjashmet e tyre"], "pse_ar": "لقول المؤلف: «فمتى جاء طالبه فوصفه دفعه إليه أو مثله إن كان قد هلك».", "pse_sq": "E sakta: t'i japë të ngjashmet e tyre. Autori thotë: «...e sa herë që vjen ai që e kërkon dhe e përshkruan, ia jep atë ose të ngjashmen e saj nëse ajo ka humbur (shkatërruar)». Edhe hadithi i Zejdit thotë: «...e nëse vjen ai që e kërkon një ditë nga ditët e kohës, dorëzoja atij». Pra, edhe pse pas vitit lukata u bë «si pasuria e tij», e drejta e të zotit nuk bie kurrë; dhe për ta marrë mjafton përshkrimi, pa provë. Shembull: i shpenzove 300 € të gjetura; pas dy vjetësh vjen i zoti dhe i përshkruan: i kthen 300 €.", "f": "٦١"}, {"id": "C013", "k": 18, "lloji": "mcq", "q": "وجد رجلٌ طعاماً يُخشى فسادُه إن بقي. فما الذي له أن يفعله على قول المؤلف؟", "o": ["أن يتركه في موضعه، ولا يجوز له أخذُه", "أن يدفعه إلى نائب الإمام، ولا يأكله", "أن يأكله قبل التعريف، أو يبيعه ثم يعرّفه", "أن يحفظه حولاً كاملاً ولو فسد في يده"], "a": 2, "q_sq": "Një njeri gjeti ushqim që rrezikon të prishet nëse mbetet. Çfarë mund të bëjë sipas fjalës së autorit?", "o_sq": ["Ta lërë në vendin e vet, sepse nuk lejohet ta marrë", "T'ia dorëzojë përfaqësuesit të prijësit, dhe të mos e hajë", "Ta hajë para shpalljes, ose ta shesë e pastaj ta shpallë", "Ta ruajë një vit të plotë, edhe nëse prishet në dorën e tij"], "pse_ar": "لقول المؤلف: «وإن كان حيواناً يحتاج إلى مؤنة أو شيئاً يخشى تلفه فله أكله قبل التعريف، أو بيعه ثم يعرفه».", "pse_sq": "E sakta: ta hajë para shpalljes, ose ta shesë e pastaj ta shpallë. Autori thotë: «Nëse është kafshë që ka nevojë për mbajtje, ose diçka që ka frikë se do të prishet, ai mund ta hajë para shpalljes ose ta shesë e pastaj ta shpallë». Ruajtja derisa të prishet është humbje pasurie; lënia në vend është dispozita e devesë e jo e ushqimit; dorëzimi te përfaqësuesi i prijësit është për atë që merr devenë a kalin. Shembull: gjen një arkë me peshk të freskët: e shet dhe e ruan çmimin, pastaj e shpall gjetjen.", "f": "٦١"}, {"id": "C014", "k": 18, "lloji": "tf", "q": "إن هلكت اللقطةُ في حول التعريف من غير تعدٍّ من الملتقط، فلا ضمان عليه فيها.", "a": 0, "q_sq": "Nëse sendi i gjetur shkatërrohet gjatë vitit të shpalljes pa tejkalim (pakujdesi) nga gjetësi, ai nuk e garanton (s'paguan dëmshpërblim).", "pse_ar": "لقول المؤلف: «وإن هلكت اللقطة في حول التعريف من غير تعد فلا ضمان فيها».", "pse_sq": "Pohimi është i saktë. Autori thotë: «Nëse sendi i gjetur shkatërrohet gjatë vitit të shpalljes pa tejkalim, nuk ka garanci për të». Gjatë vitit të shpalljes sendi është amanet te gjetësi; ai përgjigjet vetëm nëse e tejkalon kufirin ose bën pakujdesi. Shembull: e ruante telefonin e gjetur në shtëpi dhe shtëpia u dogj: nuk e paguan.", "f": "٦٢"}, {"id": "C015", "k": 18, "lloji": "mcq", "q": "فرّق النبي ﷺ بين ضالّة الإبل والشاة. فما الذي قاله في الشاة في الحديث الذي ذكره المؤلف؟", "o": ["«خذْهَا فإنَّما هيَ لكَ أو لأخيكَ أو للذئبِ»", "«مالَكَ ولها؟ دعْهَا، معها حذاؤُها وسِقاؤُها»", "«اعرفْ وكاءَها وعِفاصَها ثم عرِّفها سنةً»", "«تردُ الماءَ وتأكلُ الشجرَ حتَّى يأتيَها ربُّها»"], "a": 0, "q_sq": "Pejgamberi ﷺ bëri dallim ndërmjet devesë së humbur dhe deles. Çfarë tha ai për delen në hadithin që e përmend autori?", "o_sq": ["«Merre, sepse ajo është ose e jotja, ose e vëllait tënd, ose e ujkut»", "«Ç'punë ke ti me të? Lëre, sepse ajo ka me vete këpucën dhe enën e ujit»", "«Mësoje lidhësen e saj dhe qesen e saj, pastaj shpalle një vit»", "«...shkon në ujë dhe ha nga drurët, derisa t'i vijë i zoti»"], "pse_ar": "لقول المؤلف: «وسأله عن الشاة، فقال: «خذْهَا فإنَّما هيَ لكَ أو لأخيكَ أو للذئبِ»».", "pse_sq": "E sakta: «Merre, sepse ajo është ose e jotja, ose e vëllait tënd, ose e ujkut». Delja nuk mbrohet nga grabitqarët e vegjël: nëse nuk e merr ti, e merr dikush tjetër ose e ha ujku; prandaj ajo hyn te lloji i tretë që lejohet të merret. Fjalët «Ç'punë ke ti me të? Lëre...» dhe «shkon në ujë dhe ha nga drurët...» u thanë për devenë, që nuk merret. «Mësoje lidhësen e saj dhe qesen e saj, pastaj shpalle një vit» u tha për sendin e gjetur prej ari dhe argjendi.", "f": "٦٢"}, {"id": "C016", "k": 19, "lloji": "mcq", "q": "وُجد طفلٌ منبوذٌ لا يُعرف أهلُه. فبِمَ يُحكم له؟", "o": ["بحرّيته وإسلامه", "برقّه وإسلامه", "بحرّيته، ويُوقَف دينُه حتى يبلغ", "برقّه، ويكون مملوكاً لملتقطه"], "a": 0, "q_sq": "U gjet një fëmijë i braktisur të cilit nuk i dihet familja. Çfarë gjykohet për të?", "o_sq": ["Se është i lirë dhe musliman", "Se është rob dhe musliman", "Se është i lirë, ndërsa feja e tij pezullohet derisa të bëhet i rritur", "Se është rob dhe bëhet pronë e atij që e gjeti"], "pse_ar": "لقول المؤلف: «هو الطفل المنبوذ، وهو محكوم بحريته وإسلامه».", "pse_sq": "E sakta: se është i lirë dhe musliman. Autori thotë: «Ai është fëmija i braktisur; për të gjykohet se është i lirë dhe musliman». Pra lakiti nuk konsiderohet rob, as pronë e gjetësit, dhe feja e tij nuk pezullohet, por trajtohet si musliman. Prandaj, siç thotë autori, nëse një jobesimtar pretendon se është fëmija i tij, i lidhet si prejardhje, por jo si fe.", "f": "٦٢"}, {"id": "C017", "k": 19, "lloji": "mcq", "q": "التقط رجلٌ طفلين منبوذين: أحدُهما وُجد عنده مالٌ، والآخر لا مالَ معه. فمن أين يُنفَق على كلٍّ منهما؟", "o": ["كلاهما من بيت المال", "الأوّل من ماله، والثاني على ملتقطه", "كلاهما على ملتقطهما", "الأوّل من ماله، والثاني من بيت المال"], "a": 3, "q_sq": "Një njeri gjeti dy fëmijë të braktisur: pranë njërit u gjet pasuri, ndërsa tjetri s'kishte asgjë. Nga mbahet secili prej tyre?", "o_sq": ["Të dy nga arka e shtetit", "I pari nga pasuria e vet, i dyti nga ai që e gjeti", "Të dy nga ai që i gjeti", "I pari nga pasuria e vet, i dyti nga arka e shtetit (bejtu'l-mal)"], "pse_ar": "لقول المؤلف: «وما وُجد عنده من المال فهو له... ونفقته في بيت المال إن لم يكن معه ما يُنفَق عليه».", "pse_sq": "E sakta: i pari nga pasuria e vet, i dyti nga arka e shtetit. Autori thotë: «Pasuria që gjendet pranë tij është e tij», dhe: «shpenzimet e tij janë nga arka e shtetit (bejtu'l-mal) nëse nuk ka me vete diçka me të cilën të mbahet». Kushti «nëse nuk ka me vete» tregon se ai që ka pasuri mbahet nga pasuria e vet. Gjetësi ka kujdestarinë, por autori nuk ia ngarkon atij shpenzimet. Shembull: foshnja gjendet me një zarf me 2.000 €: këto janë të fëmijës dhe shpenzohen për të.", "f": "٦٢"}, {"id": "C018", "k": 19, "lloji": "mcq", "q": "لمن تكون ولايةُ اللقيط على قول المؤلف؟", "o": ["لنائب الإمام دون ملتقطه", "لملتقطه مسلماً كان أو كافراً", "لملتقطه إذا كان مسلماً عدلاً", "لملتقطه ولو كان فاسقاً"], "a": 2, "q_sq": "Kujt i takon kujdestaria e lakitit (fëmijës së gjetur) sipas fjalës së autorit?", "o_sq": ["Përfaqësuesit të prijësit, jo gjetësit", "Atij që e gjen, qoftë musliman apo jobesimtar", "Atij që e gjen, kur është musliman i drejtë (adl)", "Atij që e gjen, edhe nëse është mëkatar i hapur (fasik)"], "pse_ar": "لقول المؤلف: «وولايته لملتقطه إذا كان مسلماً عدلاً».", "pse_sq": "E sakta: atij që e gjen, kur është musliman i drejtë. Autori thotë: «Kujdestaria e tij i takon atij që e gjen, kur është musliman i drejtë». Pra dy kushte: islami dhe drejtësia (besueshmëria). Kjo i rrëzon opsionet e fasikut dhe të jobesimtarit; po ashtu, kujdestaria nuk i hiqet gjetësit që i plotëson kushtet. Shembull: një burrë musliman i besueshëm gjen një foshnjë para xhamisë: ai ka të drejtë ta rrisë.", "f": "٦٢"}, {"id": "C019", "k": 19, "lloji": "tf", "q": "ما خلّفه اللقيطُ من مالٍ بعد موته فهو لملتقطه.", "a": 1, "q_sq": "Pasuria që lakiti (fëmija i gjetur) e lë pas vdekjes i takon atij që e ka gjetur.", "pse_ar": "لقول المؤلف: «وما خلَّفه فهو فيء».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «...ndërsa ajo që lë pas është fej», pra i takon arkës së shtetit (bejtu'l-malit), jo gjetësit. Ashtu siç shpenzimet e lakitit pa pasuri janë nga arka e shtetit, edhe ajo që lë pas shkon atje. Gjetësi ka vetëm kujdestarinë e tij.", "f": "٦٢"}, {"id": "C020", "k": 19, "lloji": "mcq", "q": "ادّعى رجلٌ كافرٌ أن اللقيطَ ولدُه. فما الحكم؟", "o": ["يُلحَق به نسباً، ويُسلَّم إليه ليربّيه", "يُلحَق به نسباً لا ديناً، ولا يُسلَّم إليه", "يُلحَق به نسباً وديناً، ويُسلَّم إليه", "لا يُلحَق به نسباً، لأن اللقيط محكومٌ بإسلامه"], "a": 1, "q_sq": "Një jobesimtar pretendoi se lakiti është fëmija i tij. Cila është dispozita?", "o_sq": ["I lidhet atij si prejardhje dhe i dorëzohet që ta rrisë", "I lidhet atij si prejardhje, por jo si fe, dhe nuk i dorëzohet atij", "I lidhet atij si prejardhje dhe si fe, dhe i dorëzohet atij", "Nuk i lidhet si prejardhje, sepse për lakitin gjykohet se është musliman"], "pse_ar": "لقول المؤلف: «ومن ادعى نسبه أُلحق به، إلا إن كان كافراً أُلحق به نسباً لا ديناً ولم يسلم إليه».", "pse_sq": "E sakta: i lidhet si prejardhje, jo si fe, dhe nuk i dorëzohet. Autori thotë: «Kush pretendon prejardhjen e tij, i lidhet atij; përveç nëse është jobesimtar: atëherë i lidhet si prejardhje, por jo si fe, dhe nuk i dorëzohet atij». Pra pretendimi i prejardhjes pranohet edhe nga jobesimtari (kjo e rrëzon opsionin «nuk i lidhet»), por fëmija mbetet musliman dhe nuk i jepet për ta rritur, që të mos ia ndryshojë fenë. Nëse pretenduesi është musliman, fëmija i lidhet plotësisht.", "f": "٦٢"}, {"id": "C021", "k": 20, "lloji": "tf", "q": "تجوز المسابقة بغير جُعلٍ في الأشياء كلّها.", "a": 0, "q_sq": "Gara pa shpërblim (xhu'l) lejohet në të gjitha gjërat.", "pse_ar": "لقول المؤلف: «تجوز المسابقة بغير جُعل في الأشياء كلها».", "pse_sq": "Pohimi është i saktë. Autori thotë: «Gara pa shpërblim lejohet në të gjitha gjërat». Kufizimi në kuaj, deve dhe shigjeta vlen vetëm për garën me shpërblim. Shembull: gara në vrapim, në not ose me biçikleta, pa çmim në para: lejohen.", "f": "٦٢"}, {"id": "C022", "k": 20, "lloji": "mcq", "q": "تسابق رجلان عَدْواً على الأقدام، وجعل لهما رجلٌ ثالثٌ مالاً للسابق منهما. فما حكمُ هذا الجُعل؟", "o": ["يجوز، لأن الجُعل من غير المتسابقَين", "يجوز إن أدخلا بينهما محلِّلاً", "يجوز إن حدّدا المسافة والغاية", "لا يجوز"], "a": 3, "q_sq": "Dy veta garuan në vrapim me këmbë, dhe një i tretë caktoi pasuri për atë që fiton prej tyre. Cila është dispozita e këtij shpërblimi?", "o_sq": ["Lejohet, sepse shpërblimi është nga dikush tjetër përveç garuesve", "Lejohet nëse futin mes tyre një muhal-lil", "Lejohet nëse e caktojnë largësinë dhe cakun", "Nuk lejohet"], "pse_ar": "لقول المؤلف: «ولا تجوز بجُعل إلا في الخيل والإبل والسهام».", "pse_sq": "E sakta: nuk lejohet. Autori thotë: «...ndërsa me shpërblim nuk lejohet veçse në kuaj, deve dhe shigjeta», duke u mbështetur te hadithi «Nuk ka shpërblim gare (sebek) përveç në shigjetë (nasl), në thundër deveje (huff) ose në thundër kali (hafir)». Vrapimi me këmbë nuk është nga këto tri, prandaj shpërblimi ndalohet, qoftë nga një i tretë, qoftë me muhal-lil, qoftë me largësi të caktuar. Dispozita e shpërblimit nga një i tretë dhe e muhal-lilit vlen vetëm brenda këtyre tri llojeve.", "f": "٦٢"}, {"id": "C023", "k": 20, "lloji": "mcq", "q": "ما الدليل الذي ذكره المؤلف على أن المسابقة بجُعلٍ لا تجوز إلا في الخيل والإبل والسهام؟", "o": ["«قضى رسولُ الله ﷺ بالشفعة في كل ما لم يُقسَم»", "«خذْهَا فإنَّما هيَ لكَ أو لأخيكَ أو للذئبِ»", "«لا سَبَقَ إلا في نَصْلٍ أو خفٍّ أو حافرٍ»", "«خذوا واضربُوا لي معكم بسهمٍ»"], "a": 2, "q_sq": "Cili është argumenti që e përmend autori se gara me shpërblim nuk lejohet veçse në kuaj, deve dhe shigjeta?", "o_sq": ["«I Dërguari i Allahut ﷺ gjykoi për shuf'a në çdo gjë që nuk është ndarë»", "«Merre, sepse ajo është ose e jotja, ose e vëllait tënd, ose e ujkut»", "«Nuk ka shpërblim gare (sebek) përveç në shigjetë, në thundër deveje ose në thundër kali»", "«Merrini dhe më caktoni edhe mua një pjesë me ju»"], "pse_ar": "لقول المؤلف: «ولا تجوز بجُعل إلا في الخيل والإبل والسهام، لقول رسول الله ﷺ: «لا سَبَقَ إلا في نَصْلٍ أو خفٍّ أو حافرٍ»».", "pse_sq": "E sakta: «Nuk ka shpërblim gare përveç në shigjetë, në thundër deveje ose në thundër kali». Autori e sjell këtë hadith menjëherë pas rregullit. Nasli i përgjigjet shigjetave, huffi deveve dhe hafiri kuajve; prandaj gara me shpërblim kufizohet në këto. Hadithi i dytë është argument për xhialenë (rukja), i treti për shuf'anë, i katërti për delen e humbur.", "f": "٦٢"}, {"id": "C024", "k": 20, "lloji": "mcq", "q": "قال رجلٌ لفارسَين: مَن سبق منكما فله ألفُ درهمٍ منّي. فما الحكم؟", "o": ["يجوز، ويُقسَم الجُعلُ بينهما", "لا يجوز، لأنه يُشبه القمار", "يجوز، والجُعلُ للسابق منهما", "لا يجوز إلا بمحلِّلٍ يكافئهما"], "a": 2, "q_sq": "Një njeri u tha dy kalorësve: «Kush prej jush fiton, merr një mijë dirhemë nga unë». Cila është dispozita?", "o_sq": ["Lejohet, dhe shpërblimi ndahet mes tyre", "Nuk lejohet, sepse i ngjan kumarit", "Lejohet, dhe shpërblimi i takon fituesit prej tyre", "Nuk lejohet veçse me një muhal-lil të barabartë me ta"], "pse_ar": "لقول المؤلف: «فإن كان الجعل من غير المستبقين جاز، وهو للسابق منهما».", "pse_sq": "E sakta: lejohet, dhe shpërblimi i takon fituesit. Gara është me kuaj (një nga tri llojet) dhe shpërblimi është nga një i tretë. Autori thotë: «Nëse shpërblimi është nga dikush tjetër përveç garuesve, lejohet, dhe ai i takon atij prej tyre që fiton». Garuesit nuk rrezikojnë asgjë, prandaj s'ka kumar dhe s'nevojitet muhal-lil; muhal-lili kërkohet vetëm kur shpërblimin e japin të dy garuesit. Shpërblimi nuk ndahet, por i jepet fituesit.", "f": "٦٢"}, {"id": "C025", "k": 20, "lloji": "mcq", "q": "تسابق زيدٌ وعمرٌو على فرسين، وأخرج زيدٌ وحده مئةَ درهم على أن عمراً إن سبقه أخذها، فجاءا معاً. فما الحكم؟", "o": ["يُحرز زيدٌ المئةَ ويأخذ مثلَها من عمرو", "يُحرز زيدٌ المئةَ، ولا شيء له سواها", "يأخذ عمرٌو المئةَ، لأنه لم يُسبَق", "تُقسَم المئةُ بينهما نصفين"], "a": 1, "q_sq": "Zejdi dhe Amri garuan me dy kuaj; vetëm Zejdi vuri njëqind dirhemë, me kusht që nëse Amri e mund, t'i marrë ato. Arritën të dy njëherësh. Cila është dispozita?", "o_sq": ["Zejdi i ruan njëqindshet dhe merr edhe aq nga Amri", "Zejdi i ruan njëqindshet dhe nuk merr asgjë tjetër", "Amri i merr njëqindshet, sepse nuk u mund", "Njëqindshet ndahen mes tyre përgjysmë"], "pse_ar": "لقول المؤلف: «وإن كان من أحدهما فسبق المخرِج أو جاءا معًا أحرزه، ولا شيء له سواه، وإن سبق الآخرُ أخذه».", "pse_sq": "E sakta: Zejdi i ruan njëqindshet dhe s'merr asgjë tjetër. Autori thotë: «...e nëse është nga njëri prej tyre, dhe fiton ai që e ka dhënë ose arrijnë të dy njëherësh, ai e ruan dhe nuk merr asgjë tjetër; e nëse fiton tjetri, e merr atë». Amri e merr shpërblimin vetëm nëse e mund Zejdin, jo kur barazojnë; ndarja nuk përmendet; dhe Zejdi nuk merr gjë nga Amri, sepse Amri s'ka vënë asgjë. Kjo formë lejohet, sepse rrezikon vetëm njëra palë.", "f": "٦٢"}, {"id": "C026", "k": 20, "lloji": "mcq", "q": "تسابق رجلان على بعيرين، وأخرج كلٌّ منهما مئةَ درهم على أن مَن سبق أخذ المالين، ولم يُدخلا بينهما أحداً. فما الحكم؟", "o": ["لا يجوز", "يجوز، لأنه في الإبل", "يجوز إن تساوى المالان", "يجوز إن حدّدا المسافة والغاية"], "a": 0, "q_sq": "Dy veta garuan me dy deve; secili vuri njëqind dirhemë, me kusht që fituesi t'i marrë të dyja shumat, dhe nuk futën askënd mes tyre. Cila është dispozita?", "o_sq": ["Nuk lejohet", "Lejohet, sepse është me deve", "Lejohet nëse shumat janë të barabarta", "Lejohet nëse e caktojnë largësinë dhe cakun"], "pse_ar": "لقول المؤلف: «وإن أخرجا جميعاً لم يجز إلا أن يُدخلا بينهما محلِّلاً يكافئُ فرسُه فرسيهما، أو بعيرُه بعيريهما».", "pse_sq": "E sakta: nuk lejohet. Autori thotë: «Nëse e japin të dy, nuk lejohet, përveç nëse futin mes tyre një muhal-lil, kali i të cilit është i barabartë me kuajt e tyre, ose deveja e tij me devetë e tyre...». Edhe pse gara është me deve, kur të dy vënë para dhe secili ose fiton ose humbet, kjo është kumar; barazia e shumave ose caktimi i largësisë nuk e ndryshojnë këtë. Rruga e vetme e lejuar që përmend autori është futja e muhal-lilit.", "f": "٦٢"}, {"id": "C027", "k": 20, "lloji": "mcq", "q": "إذا أخرج المتسابقان الجُعلَ جميعاً، فما الشرط في المحلِّل الذي يُدخلانه بينهما؟", "o": ["أن يُخرج جُعلاً مثلَ جُعلهما", "أن يأخذ نصفَ المالين وإن لم يسبق", "أن يكون فرسُه من غير جنس فرسيهما", "أن يكافئ فرسُه فرسيهما"], "a": 3, "q_sq": "Kur të dy garuesit e japin shpërblimin, cili është kushti te muhal-lili që e futin mes tyre?", "o_sq": ["Që të vërë edhe ai një shpërblim si i tyre", "Që të marrë gjysmën e dy shumave edhe nëse nuk fiton", "Që kali i tij të jetë i një lloji tjetër nga kuajt e tyre", "Që kali i tij të jetë i barabartë me kuajt e tyre"], "pse_ar": "لقول المؤلف: «إلا أن يُدخلا بينهما محلِّلاً يكافئُ فرسُه فرسيهما، أو بعيرُه بعيريهما، أو رميُه رميَهما».", "pse_sq": "E sakta: që kali i tij të jetë i barabartë me kuajt e tyre. Autori thotë: «...përveç nëse futin mes tyre një muhal-lil, kali i të cilit është i barabartë me kuajt e tyre, ose deveja e tij me devetë e tyre, ose gjuajtja e tij me gjuajtjen e tyre». Muhal-lili nuk vë asgjë (përndryshe do të ishte si ata), merr vetëm nëse fiton, dhe duhet të jetë në garë me të njëjtën kafshë/gjuajtje, me shanse të vërteta. Autori pas kësaj sjell hadithin: «Kush fut një kalë ndërmjet dy kuajve, dhe nuk është i sigurt se do të fitojë, nuk është kumar...».", "f": "٦٢"}, {"id": "C028", "k": 20, "lloji": "mcq", "q": "أخرج زيدٌ وعمرٌو مئةً مئة، وأدخلا بينهما محلِّلاً يكافئ فرسُه فرسيهما. فما الحكم إن سبق المحلِّل، وما الحكم إن سبق زيد؟", "o": ["إن سبق المحلِّلُ أخذ مئةً واحدة، وإن سبق زيدٌ أحرز مئتَه وأخذ مئةَ عمرو", "إن سبق المحلِّلُ أحرز المئتين، وإن سبق زيدٌ أحرز مئتَه ولم يأخذ شيئاً", "إن سبق المحلِّلُ أخذ مئةً واحدة، وإن سبق زيدٌ أحرز مئتَه ولم يأخذ شيئاً", "إن سبق المحلِّلُ أحرز المئتين، وإن سبق زيدٌ أحرز مئتَه وأخذ مئةَ عمرو"], "a": 3, "q_sq": "Zejdi dhe Amri vunë secili nga njëqind (dirhemë) dhe futën mes tyre një muhal-lil, kali i të cilit është i barabartë me kuajt e tyre. Cila është dispozita nëse fiton muhal-lili, dhe cila nëse fiton Zejdi?", "o_sq": ["Nëse fiton muhal-lili, merr vetëm një njëqindshe; nëse fiton Zejdi, ruan njëqindshen e vet dhe merr njëqindshen e Amrit", "Nëse fiton muhal-lili, i merr të dyja njëqindshet; nëse fiton Zejdi, ruan njëqindshen e vet dhe s'merr asgjë", "Nëse fiton muhal-lili, merr vetëm një njëqindshe; nëse fiton Zejdi, ruan njëqindshen e vet dhe s'merr asgjë", "Nëse fiton muhal-lili, i merr të dyja njëqindshet; nëse fiton Zejdi, ruan njëqindshen e vet dhe merr njëqindshen e Amrit"], "pse_ar": "لقول المؤلف: «فإن سبقهما أحرزَ سبقيهما، وإن سبق أحدُهما أحرز سبقَ نفسِه وأخذ سبقَ صاحبه».", "pse_sq": "E sakta: muhal-lili merr të dyja, Zejdi ruan të vetën dhe merr të Amrit. Autori thotë: «Nëse (muhal-lili) i mund të dy, i merr të dy shpërblimet e tyre; e nëse fiton njëri prej tyre, ruan shpërblimin e vet dhe merr shpërblimin e shokut të vet». Shembull: secili vë 100 €; fiton i treti: merr 200 €; fiton Zejdi: i mbeten 100 € të vetat dhe merr 100 € të Amrit.", "f": "٦٢"}, {"id": "C029", "k": 20, "lloji": "mcq", "q": "أيُّ ما يلي **ليس** مما نصّ المؤلف على أنه لا بدّ منه في المسابقة؟", "o": ["بيانُ قدر الإصابة وصفتها", "بيانُ عدد الرِّشق", "تساوي الجُعلين في القدر", "تحديدُ المسافة وبيانُ الغاية"], "a": 2, "q_sq": "Cila nga këto **NUK** është nga ato që autori i ka përmendur si të domosdoshme në garë?", "o_sq": ["Sqarimi i sasisë së goditjeve dhe i mënyrës së tyre", "Sqarimi i numrit të gjuajtjeve (rishk)", "Barazia e dy shpërblimeve në sasi", "Caktimi i largësisë dhe sqarimi i cakut"], "pse_ar": "لأن المؤلف قال: «ولا بد من تحديد المسافة وبيان الغاية وقدر الإصابة وصفتها وعدد الرشق»، ولم يذكر تساوي الجعلين.", "pse_sq": "E sakta: barazia e dy shpërblimeve në sasi. Autori thotë: «Patjetër duhet të caktohet largësia, të sqarohet caku, sasia e goditjeve dhe mënyra e tyre, si dhe numri i gjuajtjeve (rishk)». Barazia e shumave që vënë garuesit nuk është ndër këto. Shembull: «nga kjo pikë deri te ajo pemë, 2 km»; te gjuajtja: «secili gjuan 10 herë, fiton ai që qëllon shenjën 6 herë», dhe sqarohet çfarë llogaritet goditje.", "f": "٦٢"}, {"id": "C030", "k": 20, "lloji": "tf", "q": "المسابقة في الرمي تكون على البُعد لا على الإصابة.", "a": 1, "q_sq": "Gara në gjuajtje bëhet për largësinë, e jo për goditjen (e shenjës).", "pse_ar": "لقول المؤلف: «وإنما تكون المسابقة في الرمي على الإصابة لا على البعد».", "pse_sq": "Pohimi është i pasaktë; e ka përmbysur rregullin. Autori thotë: «...dhe gara në gjuajtje bëhet vetëm për goditjen (e shenjës), e jo për largësinë». Fiton ai që e qëllon shenjën më shumë herë, jo ai që e hedh shigjetën më larg, sepse qëllimi është saktësia.", "f": "٦٢"}, {"id": "C031", "k": 21, "lloji": "tf", "q": "الوديعةُ أمانةٌ عند المودَع، فإن تلفت عنده من غير تعدٍّ فلا ضمان عليه.", "a": 0, "q_sq": "Vedia (amaneti) është amanet te ai të cilit i është lënë; nëse shkatërrohet tek ai pa tejkalim, ai nuk e garanton.", "pse_ar": "لقول المؤلف: «وهي أمانة عند المودَع لا ضمان عليه فيها إلا أن يتعدى».", "pse_sq": "Pohimi është i saktë. Autori thotë: «Ajo është amanet te ai të cilit i është lënë, dhe ai nuk e garanton përveç nëse e tejkalon kufirin». Shembull: ia le fqinjit 2.000 € dhe ai i mbylli në kasafortë, por hajdutët e thyen kasafortën dhe i morën: nuk i paguan.", "f": "٦٣"}, {"id": "C032", "k": 21, "lloji": "mcq", "q": "أودع رجلٌ عند جاره ذهباً، فتركه الجارُ في فناء داره المكشوف – وليس ذلك حرزَ مثله –، فسُرق. فما الحكم؟", "o": ["يضمنه، لأنه لم يحفظه في حرز مثله", "لا يضمنه، لأن الوديعة أمانة", "لا يضمنه، لأنه لم يتصرّف فيه لنفسه", "يضمن نصفَ قيمته فقط"], "a": 0, "q_sq": "Një njeri i la fqinjit të vet ar si amanet; fqinji e la në oborrin e hapur të shtëpisë – i cili nuk është vendruajtje (hirz) për të tillë send – dhe u vodh. Cila është dispozita?", "o_sq": ["E garanton, sepse nuk e ruajti në vendruajtjen që i përshtatet", "Nuk e garanton, sepse vedia është amanet", "Nuk e garanton, sepse nuk e përdori për vete", "Garanton vetëm gjysmën e vlerës së tij"], "pse_ar": "لقول المؤلف: «وإن لم يحفظها في حِرز مثلِها... ضمنها».", "pse_sq": "E sakta: e garanton. Autori thotë: «Nëse nuk e ruan në vendruajtjen (hirz) që i përshtatet asaj... (në të gjitha këto raste) ai e garanton atë». Vedia është amanet që nuk garantohet veçse me tejkalim, dhe lënia e arit në vend të pasigurt është tejkalim. Për të qenë përgjegjës mjafton njëri nga rastet që përmend autori; s'ka nevojë që ta ketë përdorur për vete. Garantimi i gjysmës nuk përmendet.", "f": "٦٣"}, {"id": "C033", "k": 21, "lloji": "mcq", "q": "أمر صاحبُ الوديعة المودَعَ أن يحفظها في صندوقٍ مقفل، فحفظها في صندوقٍ مقفلٍ مثلِه، فسُرقت من غير تفريط. فما الحكم؟", "o": ["يضمن، لأنه خالف الصندوقَ الذي عيّنه له صاحبُها", "يضمن نصفَها، لأنه خالف في الصندوق دون الصفة", "لا يضمن إلا إن كان قد أخذ على حفظها أجرة", "لا يضمن، لأنه حفظها في مثل الحرز المأمور به"], "a": 3, "q_sq": "Pronari i vedias e urdhëroi atë që e ruan ta ruajë në një arkë të kyçur; ai e ruajti në një arkë tjetër të kyçur si ajo, dhe u vodh pa pakujdesi. Cila është dispozita?", "o_sq": ["E garanton, sepse e kundërshtoi arkën që ia caktoi pronari", "Garanton gjysmën, sepse e kundërshtoi arkën, por jo cilësinë", "Nuk e garanton, përveç nëse ka marrë pagesë për ruajtjen e saj", "Nuk e garanton, sepse e ruajti në një vendruajtje të ngjashme me atë që u urdhërua"], "pse_ar": "لقول المؤلف: «وإن لم يحفظها في حِرز مثلِها أو مثلِ الحرز الذي أُمر بإحرازها فيه... ضمنها»، فإذا حفظها في مثله لم يضمن.", "pse_sq": "E sakta: nuk e garanton. Autori thotë se ai garanton «nëse nuk e ruan në vendruajtjen që i përshtatet asaj, ose të ngjashme me vendruajtjen në të cilën është urdhëruar ta ruajë». Pra mjafton vendruajtja e ngjashme me atë që u urdhërua; ai që e ruan kështu nuk ka tejkaluar, dhe vedia mbetet amanet që nuk garantohet pa tejkalim. Pagesa për ruajtjen nuk është kusht te autori.", "f": "٦٣"}, {"id": "C034", "k": 21, "lloji": "mcq", "q": "في أيّ الحالات التالية **لا** يضمن المودَعُ الوديعةَ إذا تلفت؟", "o": ["أن يكسر ختمَ كيسها", "أن يتصرّف فيها لنفسه", "أن تُسرق من حرز مثلها", "أن يخلطها بما لا تتميّز منه"], "a": 2, "q_sq": "Në cilën nga këto gjendje ai që e ruan vedian **NUK** e garanton atë nëse shkatërrohet?", "o_sq": ["Kur ia thyen vulën qeses së saj", "Kur e përdor për vete", "Kur vidhet nga vendruajtja që i përshtatet", "Kur e përzien me diçka prej së cilës nuk dallohet"], "pse_ar": "لقول المؤلف: «وهي أمانة عند المودَع لا ضمان عليه فيها إلا أن يتعدى»، والسرقة من حرز مثلها ليست تعدياً.", "pse_sq": "E sakta: kur vidhet nga vendruajtja që i përshtatet. Vedia është amanet dhe autori thotë se ai «nuk e garanton përveç nëse e tejkalon kufirin»; vjedhja nga vendruajtja e duhur nuk është tejkalim. Ndërsa tri të tjerat i përmend autori qartë si raste garantimi: «...ose e përdor për vete, ose e përzien me diçka prej së cilës nuk dallohet, ... ose ia thyen vulën qeses së saj... ai e garanton atë». Shembull: i përzien paratë e amanetit me paratë e veta dhe humbin: i paguan.", "f": "٦٣"}, {"id": "C035", "k": 21, "lloji": "tf", "q": "إذا أخرج المودَعُ الوديعةَ لينفقها، ثم ردّها إلى مكانها، فلا ضمان عليه إن تلفت بعد ذلك.", "a": 1, "q_sq": "Nëse ai që e ruan vedian e nxjerr për ta shpenzuar, e pastaj e kthen në vendin e saj, nuk e garanton nëse shkatërrohet më pas.", "pse_ar": "لقول المؤلف: «أو أخرجها لينفقها ثم ردَّها... ضمنها».", "pse_sq": "Pohimi është i pasaktë. Autori e numëron këtë ndër rastet e garantimit: «...ose e nxjerr për ta shpenzuar e pastaj e kthen... ai e garanton atë». Me nxjerrjen për ta shpenzuar ai e tradhtoi besimin, dhe kthimi në vend nuk e heq përgjegjësinë. Shembull: merr paratë e amanetit për të blerë diçka, ndërron mendje dhe i kthen; më pas vidhen: i paguan.", "f": "٦٣"}, {"id": "C036", "k": 21, "lloji": "tf", "q": "إذا جحد المودَعُ الوديعةَ ثم أقرّ بها، صار ضامناً لها.", "a": 0, "q_sq": "Nëse ai që e ruan vedian e mohon atë dhe pastaj e pohon, ai bëhet garant (përgjegjës) për të.", "pse_ar": "لقول المؤلف: «أو جحدها ثم أقرَّ بها... ضمنها».", "pse_sq": "Pohimi është i saktë. Autori e numëron këtë ndër rastet e garantimit: «...ose e mohon e pastaj e pohon... ai e garanton atë». Me mohimin ai doli nga cilësia e të besuarit, dhe pohimi i mëvonshëm nuk ia kthen këtë cilësi; prandaj nëse vedia humbet më pas, edhe pa fajin e tij, e paguan.", "f": "٦٣"}, {"id": "C037", "k": 21, "lloji": "tf", "q": "مَن امتنع من ردّ الوديعة عند طلبها مع إمكانه، ضمنها.", "a": 0, "q_sq": "Kush refuzon ta kthejë vedian kur i kërkohet, ndërsa ka mundësi, e garanton atë.", "pse_ar": "لقول المؤلف: «أو امتنع من ردِّها عند طلبها مع إمكانه، ضمنها».", "pse_sq": "Pohimi është i saktë. Autori thotë: «...ose refuzon ta kthejë kur i kërkohet, ndërsa ka mundësi, (në të gjitha këto raste) ai e garanton atë». Kushti «ndërsa ka mundësi» do të thotë se nëse e vonon për shkak se s'ka mundësi (p.sh. vedia është në një vend tjetër), nuk bëhet garant për këtë arsye. Shembull: pronari i kërkon makinën dhe ai thotë «jo tani» pa arsye; makina dëmtohet: e paguan.", "f": "٦٣"}, {"id": "C038", "k": 21, "lloji": "mcq", "q": "ادُّعي على رجلين وديعتان: فقال الأوّل: «ما أودعتَني»، ثم ادّعى أنه ردّها، وقال الثاني: «ما لك عندي شيء»، ثم ادّعى أنه ردّها. فما الحكم؟", "o": ["يُقبل قولُ الأوّل، ولا يُقبل قولُ الثاني", "لا يُقبل قولُ واحدٍ منهما", "يُقبل قولُ كلِّ واحدٍ منهما", "لا يُقبل قولُ الأوّل، ويُقبل قولُ الثاني"], "a": 3, "q_sq": "Dy vetave u pretendohen dy vedia: i pari tha: «Nuk më ke lënë amanet», e pastaj pretendoi se e ka kthyer; i dyti tha: «Nuk ke asgjë te unë», e pastaj pretendoi se e ka kthyer. Cila është dispozita?", "o_sq": ["Fjala e të parit pranohet, ndërsa e të dytit nuk pranohet", "Nuk pranohet fjala e asnjërit prej tyre", "Pranohet fjala e secilit prej tyre", "Fjala e të parit nuk pranohet, ndërsa e të dytit pranohet"], "pse_ar": "لقول المؤلف: «وإن قال: ما أودعتني، ثم ادعى تلفها أو ردها لم يُقبل منه، وإن قال: ما لك عندي شيء، ثم ادعى ردَّها أو تلفها قُبل».", "pse_sq": "E sakta: fjala e të parit nuk pranohet, e të dytit pranohet. Autori thotë: «Nëse thotë: ‹Nuk më ke lënë amanet›, e pastaj pretendon se ai ka humbur ose se e ka kthyer, nuk i pranohet; e nëse thotë: ‹Nuk ke asgjë te unë›, e pastaj pretendon se e ka kthyer ose ka humbur, i pranohet». I pari e mohoi vetë marrjen, pastaj e kundërshtoi veten duke pranuar se e kishte; i dyti vetëm tha se tani s'ka asgjë te ai, gjë që përputhet me kthimin ose humbjen. E njëjta dispozitë vlen edhe për pretendimin e humbjes.", "f": "٦٣"}, {"id": "C039", "k": 21, "lloji": "tf", "q": "العاريّةُ لا يضمنها المستعير إلا أن يتعدّى فيها، كالوديعة.", "a": 1, "q_sq": "Sendin e huazuar (arijje) huamarrësi nuk e garanton përveç nëse e tejkalon kufirin me të, njësoj si vedia.", "pse_ar": "لقول المؤلف: «والعارية مضمونة وإن لم يتعدَّ فيها المستعير».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «Sendi i huazuar (arijje) është i garantuar, edhe nëse huamarrësi nuk e ka tejkaluar kufirin me të». Pra arijje ndryshon nga vedia: vedia nuk garantohet pa tejkalim, ndërsa arijje garantohet edhe pa tejkalim. Shembull: merr hua makinën e shokut për një ditë dhe ajo digjet pa fajin tënd: e paguan.", "f": "٦٣"}, {"id": "C040", "k": 22, "lloji": "tf", "q": "الإجارةُ عقدٌ على المنافع، جائزٌ من الطرفين، يملك كلُّ واحدٍ منهما فسخَها.", "a": 1, "q_sq": "Ixhareja (qiraja) është kontratë mbi dobitë, e lejueshme (jo e detyrueshme) nga të dyja palët, të cilën secila prej tyre mund ta prishë.", "pse_ar": "لقول المؤلف: «وهي عقدٌ على المنافع لازم من الطرفين لا يملك أحدُهما فسخَها».", "pse_sq": "Pohimi është i pasaktë. Pjesa e parë është e saktë, por autori thotë: «Ajo është kontratë mbi dobitë (shfrytëzimin), e detyrueshme nga të dyja palët, të cilën asnjëra prej tyre nuk mund ta prishë (njëanshëm)». Pra qiraja është kontratë e detyrueshme (lazim), jo e lejueshme (xhaiz). Shembull: pronari nuk mund ta nxjerrë qiramarrësin para afatit, dhe qiramarrësi nuk mund të largohet pa paguar.", "f": "٦٥"}, {"id": "C041", "k": 22, "lloji": "mcq", "q": "أيُّ ما يلي تنفسخ به الإجارة؟", "o": ["رغبةُ أحد الطرفين في الفسخ", "انقطاعُ نفع العين المؤجَّرة", "موتُ المؤجِّر أو المستأجر", "جنونُ أحد المتعاقدَين"], "a": 1, "q_sq": "Me cilën nga këto prishet qiraja?", "o_sq": ["Me dëshirën e njërës palë për ta prishur", "Me ndërprerjen e dobisë së sendit të dhënë me qira", "Me vdekjen e qiradhënësit ose të qiramarrësit", "Me çmendurinë e njërës nga palët e kontratës"], "pse_ar": "لقول المؤلف: «ولا تنفسخ بموته ولا جنونه، وتنفسخ بتلف العين المعقود عليها أو انقطاع نفعها».", "pse_sq": "E sakta: ndërprerja e dobisë së sendit. Autori thotë: «...ajo nuk prishet me vdekjen as me çmendurinë e (njërit prej) tij, por prishet me shkatërrimin e sendit mbi të cilin është lidhur ose me ndërprerjen e dobisë së tij». Dëshira e njërës palë nuk e prish, sepse qiraja është «e detyrueshme nga të dyja palët». Me vdekjen, trashëgimtarët zënë vendin e të vdekurit deri në fund të afatit. Shembull: shtëpia e marrë me qira shembet nga tërmeti: qiraja prishet.", "f": "٦٥"}, {"id": "C042", "k": 22, "lloji": "mcq", "q": "استأجر رجلٌ داراً سنةً، ثم حدث فيها بعد العقد عيبٌ يضرّ بالسكنى. فما الحكم؟", "o": ["له فسخُ الإجارة", "ليس له الفسخ، لأن العيب حادث", "ليس له الفسخ، لأن الإجارة لازمة", "له أن يُنقص من الأجرة دون الفسخ"], "a": 0, "q_sq": "Një njeri mori me qira një shtëpi për një vit; pas kontratës u shfaq në të një e metë që e dëmton banimin. Cila është dispozita?", "o_sq": ["Ka të drejtë ta prishë qiranë", "Nuk ka të drejtë ta prishë, sepse e meta është e re", "Nuk ka të drejtë ta prishë, sepse qiraja është e detyrueshme", "Ka të drejtë të ulë qiranë, por jo ta prishë"], "pse_ar": "لقول المؤلف: «وللمستأجر فسخُها بالعيب قديماً كان أو حادثاً».", "pse_sq": "E sakta: ka të drejtë ta prishë. Autori thotë: «...dhe qiramarrësi ka të drejtë ta prishë për shkak të një të mete, qoftë e vjetër apo e re». Pra edhe pse qiraja është kontratë e detyrueshme, e meta është përjashtim që ia jep qiramarrësit të drejtën e prishjes, pa dallim nëse ishte para kontratës apo u shfaq pas saj. Shembull: pas dy muajsh kulmi fillon të pikojë rëndë dhe ngrohja s'funksionon: qiramarrësi mund ta prishë kontratën.", "f": "٦٥"}, {"id": "C043", "k": 22, "lloji": "mcq", "q": "مثّل المؤلف للنفع المعلوم في الإجارة بسُكنى الدار وبخياطة ثوبٍ معيَّن. فبِمَ يُعلَم النفع في كلٍّ منهما؟", "o": ["الأوّل بالوصف، والثاني بالعرف", "كلاهما بالعرف", "كلاهما بالوصف", "الأوّل بالعرف، والثاني بالوصف"], "a": 3, "q_sq": "Autori dha si shembull të dobisë së njohur në qira banimin në shtëpi dhe qepjen e një rrobe të caktuar. Me çfarë njihet dobia në secilin prej tyre?", "o_sq": ["I pari me përshkrim, i dyti sipas zakonit", "Të dy sipas zakonit", "Të dy me përshkrim", "I pari sipas zakonit (urf), i dyti me përshkrim"], "pse_ar": "لقول المؤلف: «ولا تصح إلا على نفع معلوم، إما بالعرف كسكنى دار، أو بالوصف كخياطة ثوب معين».", "pse_sq": "E sakta: i pari sipas zakonit, i dyti me përshkrim. Autori thotë: «Ajo nuk është e vlefshme veçse mbi një dobi të njohur, qoftë sipas zakonit, si banimi në një shtëpi, ose me përshkrim, si qepja e një rrobe të caktuar, ndërtimi i një muri ose bartja e diçkaje në një vend të caktuar». Banimi kuptohet vetvetiu nga zakoni i njerëzve; ndërsa qepja duhet përshkruar (cila rrobë, si). Shembull: «banesë për banim» kundrejt «qep këtë kostum sipas këtyre masave».", "f": "٦٥"}, {"id": "C044", "k": 22, "lloji": "tf", "q": "إذا وقعت الإجارةُ على عينٍ – كدارٍ أو دابّة – فلا بدّ من معرفتها.", "a": 0, "q_sq": "Nëse qiraja lidhet mbi një send të caktuar – si një shtëpi ose një kafshë – patjetër duhet të njihet ai.", "pse_ar": "لقول المؤلف: «وإن وقعت على عين فلا بد من معرفتها».", "pse_sq": "Pohimi është i saktë. Autori thotë: «E nëse lidhet mbi një send (të caktuar), patjetër duhet të njihet ai». Kjo është pjesë e kushtit që gjithçka në kontratën e qirasë të jetë e njohur. Shembull: merr me qira një banesë: duhet ta kesh parë ose të të përshkruhet saktë.", "f": "٦٥"}, {"id": "C045", "k": 22, "lloji": "mcq", "q": "استأجر رجلٌ داراً للسكنى، ثم أراد أن يُسكنها غيرَه بإجارةٍ أو بغيرها. فمتى يجوز له ذلك؟", "o": ["إذا كان ذلك بغير أجرةٍ فقط", "لا يجوز له ذلك بحال", "إذا كان الساكنُ مثلَه أو دونَه", "إذا أذن له المؤجِّرُ فقط"], "a": 2, "q_sq": "Një njeri mori me qira një shtëpi për banim, pastaj deshi ta vendosë dikë tjetër në të, me qira ose ndryshe. Kur i lejohet kjo?", "o_sq": ["Vetëm kur bëhet pa pagesë", "Nuk i lejohet në asnjë mënyrë", "Kur banori i ri është si ai ose më pak (në dëmtim)", "Vetëm kur ia lejon qiradhënësi"], "pse_ar": "لقول المؤلف: «ومن استأجر شيئاً فله أن يقيم مقامه من يستوفيه بإجارته أو غيرها إذا كان مثلَه أو دونَه».", "pse_sq": "E sakta: kur ai është si ai ose më pak. Autori thotë: «Kush merr me qira diçka, mund të vërë në vendin e tij dikë që ta shfrytëzojë, me qira ose ndryshe, kur ky është si ai ose më pak (në dëmtim)». Fjalët «me qira ose ndryshe» e rrëzojnë kushtin «vetëm pa pagesë»; leja e qiradhënësit nuk kërkohet, sepse qiramarrësi e zotëron dobinë. Shembull: mund t'ia japësh banesën dikujt që do ta përdorë për banim si ti, por jo dikujt që do ta kthejë në punëtori që e dëmton më shumë.", "f": "٦٥"}, {"id": "C046", "k": 22, "lloji": "mcq", "q": "استأجر رجلٌ أرضاً ليزرعها قمحاً. أيُّ ما يلي صحيحٌ على قول المؤلف؟", "o": ["له أن يزرع ما هو أقلُّ ضرراً، فإن زرع ما يخالف ضررُه ضررَه انفسخت الإجارة", "له أن يزرع ما هو أقلُّ ضرراً من القمح، فإن زرع ما يخالف ضررُه ضررَه فعليه أجرةُ المثل", "ليس له أن يزرع غيرَ القمح ولو كان أقلَّ ضرراً، فإن فعل فعليه أجرةُ المثل", "له أن يزرع ما شاء، ولا يلزمه إلا الأجرةُ المسمّاة ولو كان أكثرَ ضرراً"], "a": 1, "q_sq": "Një njeri mori me qira një tokë që ta mbjellë me grurë. Cila nga këto është e saktë sipas fjalës së autorit?", "o_sq": ["Mund të mbjellë atë që është më pak e dëmshme; e nëse mbjell atë dëmi i së cilës ndryshon nga dëmi i tij, qiraja prishet", "Mund të mbjellë atë që është më pak e dëmshme se gruri; e nëse mbjell atë dëmi i së cilës ndryshon nga dëmi i tij, ka për detyrë qiranë e zakonshme", "Nuk mund të mbjellë tjetër veç grurit, edhe nëse është më pak e dëmshme; e nëse e bën, ka për detyrë qiranë e zakonshme", "Mund të mbjellë çfarë të dojë dhe nuk i bie veç qiraja e caktuar, edhe nëse është më e dëmshme"], "pse_ar": "لقول المؤلف: «وإن استأجر أرضاً لزرع فله زرع ما هو أقلُّ منه ضرراً، فإن زرع ما هو أكثر منه ضرراً أو يخالف ضررُه ضررَه فعليه أجرة المثل».", "pse_sq": "E sakta: e para. Autori thotë: «Nëse merr me qira një tokë për ta mbjellë (me diçka), mund të mbjellë atë që është më pak e dëmshme se ajo; e nëse mbjell atë që është më e dëmshme se ajo, ose dëmi i së cilës ndryshon nga dëmi i saj, ka për detyrë qiranë e zakonshme (ixhretu'l-mithl)». Pra mbjellja e më pak të dëmshmes lejohet; e më të dëmshmes ose e ndryshmes nuk e prish kontratën, por e detyron të paguajë qiranë e zakonshme. Shembull: more tokë për grurë dhe mbolle pemë me rrënjë të thella: paguan qiranë që merret zakonisht në treg për atë përdorim.", "f": "٦٥"}, {"id": "C047", "k": 22, "lloji": "mcq", "q": "اكترى رجلٌ دابّةً إلى بلدٍ معيَّن فجاوزه إلى غيره، فتلفت الدابّة. فما الذي يلزمه زيادةً على الأجرة المتّفق عليها؟", "o": ["أجرةُ المثل للزائد، وضمانُ الدابّة", "أجرةُ المثل للزائد، ولا ضمان عليه", "ضمانُ الدابّة، ولا أجرةَ للزائد", "لا أجرةَ للزائد، ولا ضمان عليه"], "a": 0, "q_sq": "Një njeri mori me qira një kafshë deri në një vend të caktuar, por e kaloi atë dhe shkoi më tej; kafsha ngordhi. Çfarë i bie atij përveç qirasë së marrëveshjes?", "o_sq": ["Qiraja e zakonshme për pjesën e tepërt dhe garantimi i kafshës", "Qiraja e zakonshme për pjesën e tepërt, pa garantim", "Garantimi i kafshës, pa qira për pjesën e tepërt", "As qira për pjesën e tepërt, as garantim"], "pse_ar": "لقول المؤلف: «وإن اكترى إلى موضع فجاوزه أو لحمل شيء فزاد عليه فعليه أجرة المثل للزائد وضمان العين إن تلفت».", "pse_sq": "E sakta: qiraja e zakonshme për të tepërtën dhe garantimi i kafshës. Autori thotë: «Nëse merr me qira (kafshë) deri në një vend dhe e kalon atë, ose për të bartur diçka dhe i shton (ngarkesës), ka për detyrë qiranë e zakonshme për të tepërtën dhe garancinë e sendit nëse shkatërrohet». Me kalimin e marrëveshjes ai u bë tejkalues, prandaj e garanton; ndryshe nga rasti kur sendi shkatërrohet pa tejkalim. Shembull: more makinë me qira për në Prishtinë dhe shkove deri në Shkup; nëse dëmtohet, e paguan, plus qiranë e tregut për rrugën e tepërt.", "f": "٦٥"}, {"id": "C048", "k": 22, "lloji": "tf", "q": "إن تلفت العينُ المستأجَرةُ عند المستأجر من غير تعدٍّ، فلا ضمان عليه.", "a": 0, "q_sq": "Nëse sendi i marrë me qira shkatërrohet te qiramarrësi pa tejkalim, ai nuk e garanton.", "pse_ar": "لقول المؤلف: «وإن تلفت من غير تعدٍّ فلا ضمان عليه».", "pse_sq": "Pohimi është i saktë. Pas rastit të kalimit të vendit ose të ngarkesës, autori thotë: «...e nëse shkatërrohet pa tejkalim, nuk ka garanci». Qiramarrësi është i besuar për sendin; përgjigjet vetëm kur e tejkalon marrëveshjen. Shembull: makina e marrë me qira dëmtohet nga një vërshim, ndërsa ti e përdore si u morët vesh: nuk e paguan.", "f": "٦٥"}, {"id": "C049", "k": 22, "lloji": "mcq", "q": "أيُّ هؤلاء يضمن ما تلف بعمله؟", "o": ["الأجيرُ الخاصّ إذا لم يفرّط فيما في يده", "الطبيبُ الحاذق الذي لم تجنِ يدُه", "الراعي الذي لم يتعدَّ في الغنم", "الخيّاطُ الذي يستقبل العملَ من الناس"], "a": 3, "q_sq": "Cili nga këta e garanton atë që shkatërrohet nga puna e tij?", "o_sq": ["Punëtori i veçantë (për një kohë të caktuar), kur nuk bën pakujdesi me atë që ka në dorë", "Mjeku i zoti, dora e të cilit nuk ka gabuar", "Bariu që nuk e ka tejkaluar kufirin me dhentë", "Rrobaqepësi që merr punë nga njerëzit"], "pse_ar": "لقول المؤلف: «ويضمن القصار والخياط ونحوُهما ممن يستقبل العملَ ما تلف بعمله».", "pse_sq": "E sakta: rrobaqepësi që merr punë nga njerëzit. Autori thotë: «Ndërsa zbardhuesi dhe rrobaqepësi e të ngjashmit, nga ata që marrin punë (nga shumë njerëz), garantojnë atë që shkatërrohet nga puna e tyre...». Të tjerët i përjashton: «Nuk ka garanci mbi punëtorin që e jep veten me qira për një kohë të caktuar, për atë që shkatërrohet në dorën e tij pa pakujdesi; as mbi atë që bën hixhame, synetuesin ose mjekun, kur dihet se është i zoti në zanatin e tij dhe duart e tyre nuk kanë gabuar; as mbi bariun, kur nuk e tejkalon kufirin». Shembull: rrobaqepësi e pret gabim kostumin: e paguan.", "f": "٦٥"}, {"id": "C050", "k": 22, "lloji": "tf", "q": "إذا سُرق الثوبُ من حرز الخيّاط الذي يستقبل العملَ من غير تفريطٍ منه، فلا ضمان عليه.", "a": 0, "q_sq": "Nëse rroba vidhet nga vendruajtja e rrobaqepësit që merr punë nga njerëzit, pa pakujdesi prej tij, ai nuk e garanton.", "pse_ar": "لقول المؤلف: «ويضمن القصار والخياط ونحوُهما ممن يستقبل العملَ ما تلف بعمله دون ما تلف من حرزه».", "pse_sq": "Pohimi është i saktë. Autori thotë se zbardhuesi, rrobaqepësi e të ngjashmit «garantojnë atë që shkatërrohet nga puna e tyre, por jo atë që shkatërrohet nga vendruajtja e tyre». Pra garantimi i tyre lidhet me punën; nëse sendi vidhet nga dyqani i mbyllur mirë pa fajin e tyre, nuk paguajnë. Shembull: lavanteria e djeg këmishën gjatë hekurosjes: e paguan; por nëse vidhet nga dyqani i kyçur: jo.", "f": "٦٥"}, {"id": "C051", "k": 23, "lloji": "mcq", "q": "بِمَ عرّف المؤلفُ الغصبَ؟", "o": ["أمانةٌ عند المودَع لا ضمان عليه فيها", "استيلاءُ الإنسان على مال غيره بغير حقّ", "استحقاقُ الإنسان انتزاعَ حصّة شريكه من يد مشتريها", "عقدٌ على المنافع لازمٌ من الطرفين"], "a": 1, "q_sq": "Si e përkufizoi autori gasbin (grabitjen)?", "o_sq": ["Amanet te ai që i është lënë, të cilin ai nuk e garanton", "Shtënia në dorë e pasurisë së tjetrit nga njeriu pa të drejtë", "E drejta e njeriut për ta marrë pjesën e ortakut të tij nga dora e blerësit të saj", "Kontratë mbi dobitë, e detyrueshme nga të dyja palët"], "pse_ar": "لقول المؤلف: «وهو: استيلاء الإنسان على مال غيره بغير حق».", "pse_sq": "E sakta: shtënia në dorë e pasurisë së tjetrit pa të drejtë. Autori thotë: «Ajo është: shtënia në dorë e pasurisë së tjetrit nga njeriu pa të drejtë». Opsionet e tjera janë përkufizime nga i njëjti libër, por të kapitujve të tjerë: e drejta e marrjes së pjesës së ortakut është shuf'a; kontrata mbi dobitë është ixhareja (qiraja); amaneti pa garanci është vedia. Shembull: dikush e merr me forcë makinën tënde ose zë tokën tënde.", "f": "٦٥"}, {"id": "C052", "k": 23, "lloji": "mcq", "q": "غصب رجلٌ دابّةً – ولمثلها أجرة – فبقيت عنده شهراً لم يركبها، ثم ردّها وقد نقصت قيمتُها. فما الذي يلزمه مع ردّها؟", "o": ["لا شيء عليه سوى ردّها إلى صاحبها", "أجرةُ مثلها مدّةَ بقائها عنده، وأرشُ نقصها", "أرشُ نقصها وحده، لأنه لم يركبها ولم ينتفع بها", "أجرةُ مثلها وحدها، دون أرش نقصها"], "a": 1, "q_sq": "Një njeri grabiti një kafshë – që zakonisht jepet me qira – dhe ajo qëndroi te ai një muaj pa e hipur; pastaj e ktheu, ndërsa vlera e saj ishte pakësuar. Çfarë i bie atij përveç kthimit të saj?", "o_sq": ["Asgjë, përveç kthimit të saj te pronari", "Qiraja e zakonshme e saj për kohën që qëndroi tek ai dhe dëmshpërblimi i pakësimit (ersh)", "Vetëm dëmshpërblimi i pakësimit, sepse as e hipi, as përfitoi prej saj", "Vetëm qiraja e zakonshme e saj, pa dëmshpërblimin e pakësimit"], "pse_ar": "لقول المؤلف: «من غصب شيئاً فعليه رده وأجرة مثله إن كان له أجرة مدة مقامه في يده، وإن نقص فعليه أرش نقصه».", "pse_sq": "E sakta: qiraja e zakonshme për kohën e qëndrimit dhe dëmshpërblimi i pakësimit. Autori thotë: «Kush grabit diçka, ka për detyrë ta kthejë atë dhe qiranë e zakonshme të saj, nëse ka qira, për kohën që ka qëndruar në dorën e tij; e nëse ajo pakësohet, ka për detyrë dëmshpërblimin e pakësimit». Autori e lidh qiranë me «kohën që ka qëndruar në dorën e tij», jo me përdorimin; prandaj e paguan edhe pse nuk e hipi. Shembull: grabit një makinë dhe e mban 3 muaj në garazh: kthen makinën, qiranë e tregut për 3 muaj dhe vlerën e dëmtimit.", "f": "٦٥"}, {"id": "C053", "k": 23, "lloji": "tf", "q": "إذا جنى العبدُ المغصوبُ على سيّده وهو في يد الغاصب، فأرشُ جنايته على الغاصب.", "a": 0, "q_sq": "Nëse robi i grabitur kryen një krim (dëmtim) ndaj zotërisë së vet ndërsa është në dorën e grabitësit, dëmshpërblimi i krimit të tij i bie grabitësit.", "pse_ar": "لقول المؤلف: «وإن جنى المغصوب فأرش جنايته عليه، سواء جنى على سيده أو أجنبي».", "pse_sq": "Pohimi është i saktë. Autori thotë: «Nëse (robi) i grabitur kryen një krim, dëmshpërblimi i krimit të tij i bie atij (grabitësit), qoftë kur krimi është ndaj zotërisë së tij apo ndaj një të huaji». Grabitësi është përgjegjës për çdo gjë që ndodh prej sendit të grabitur, dhe autori e thekson se nuk ka dallim nëse i dëmtuari është vetë zotëria.", "f": "٦٥"}, {"id": "C054", "k": 23, "lloji": "tf", "q": "إذا جنى أجنبيٌّ على العبد المغصوب، فليس لسيّده أن يُضمِّن إلا الجاني.", "a": 1, "q_sq": "Nëse një i huaj kryen krim (dëmtim) ndaj robit të grabitur, zotëria i tij nuk mund t'ia ngarkojë dëmshpërblimin askujt tjetër veç atij që e dëmtoi.", "pse_ar": "لقول المؤلف: «وإن جنى عليه أجنبي فلسيده تضمين من شاء منهما».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «Nëse një i huaj kryen krim ndaj tij, zotëria i tij mund t'ia ngarkojë dëmshpërblimin cilitdo prej të dyve», pra ose grabitësit (sepse sendi ishte në dorën e tij pa të drejtë), ose atij që e dëmtoi. Shembull: dikush ia thyen xhamin makinës së grabitur: pronari mund ta kërkojë dëmin nga grabitësi ose nga ai që e thyen.", "f": "٦٥"}, {"id": "C055", "k": 23, "lloji": "mcq", "q": "غصب رجلٌ بقرةً فسمِنت عنده وولدت عجلاً. فما الذي يلزمه ردُّه؟", "o": ["البقرةُ والعجلُ، ويأخذ من المالك قيمةَ السِّمَن", "البقرةُ وحدها، ويضمن للمالك قيمةَ العجل", "البقرةُ بسِمَنها، والعجلُ", "البقرةُ بسِمَنها، دون العجل"], "a": 2, "q_sq": "Një njeri grabiti një lopë; ajo u majm tek ai dhe lindi një viç. Çfarë ka për detyrë të kthejë?", "o_sq": ["Lopën dhe viçin, dhe merr nga pronari vlerën e majmërisë", "Vetëm lopën, dhe i paguan pronarit vlerën e viçit", "Lopën me majmërinë e saj, dhe viçin", "Lopën me majmërinë e saj, pa viçin"], "pse_ar": "لقول المؤلف: «وإن زاد المغصوب ردَّه بزيادته، سواء كانت متصلة أو منفصلة».", "pse_sq": "E sakta: lopën me majmërinë dhe viçin. Autori thotë: «Nëse sendi i grabitur shtohet, e kthen bashkë me shtesën e tij, qoftë e bashkuar apo e ndarë». Majmëria është shtesë e bashkuar, viçi shtesë e ndarë; të dyja i takojnë pronarit. Grabitësi nuk merr asgjë për shtesën dhe nuk mund ta mbajë viçin duke paguar vlerën e tij.", "f": "٦٥"}, {"id": "C056", "k"
