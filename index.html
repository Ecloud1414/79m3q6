<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuiz: Kitabu'l-Buju'</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: kolonë leximi; tri ekrane (fillim/kuiz/rezultate). Pal.: smerald + ar në ngjyrë letre. */
:root{
  --bg:#f3f1e9; --surface:#fffdf7; --surface-2:#f7f4ea;
  --fg:#23312b; --muted:#6a776f; --border:#e4ddcc;
  --accent:#0e6b52; --accent-ink:#0b5944; --accent-soft:#dcebe2;
  --gold:#b0842c;
  --correct:#0d7a4d; --correct-bg:#def1e5; --correct-bd:#9ad3b4;
  --wrong:#be392b; --wrong-bg:#fbe5e0; --wrong-bd:#eeb6ab;
  --idle:#ece7da; --idle-fg:#8a897c;
  --shadow:0 1px 2px rgba(20,40,32,.05),0 6px 20px rgba(20,40,32,.07);
  --maxw:50rem;
  --font-display:"Marcellus",Georgia,serif;
  --font-body:"Noto Sans","Amiri","Segoe UI",system-ui,sans-serif;
  --font-ar:"Amiri",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161b; --surface:#19211d; --surface-2:#202823;
  --fg:#e9ede9; --muted:#9db0a6; --border:#2d3a33;
  --accent:#43b78c; --accent-ink:#5ac79c; --accent-soft:#1c342b;
  --gold:#d6b25e;
  --correct:#54c48d; --correct-bg:#153626; --correct-bd:#2f6a4e;
  --wrong:#e67f70; --wrong-bg:#3d201b; --wrong-bd:#7a3a31;
  --idle:#232c27; --idle-fg:#7f8d84;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#19211d; --surface-2:#202823;
  --fg:#e9ede9; --muted:#9db0a6; --border:#2d3a33;
  --accent:#43b78c; --accent-ink:#5ac79c; --accent-soft:#1c342b;
  --gold:#d6b25e;
  --correct:#54c48d; --correct-bg:#153626; --correct-bd:#2f6a4e;
  --wrong:#e67f70; --wrong-bg:#3d201b; --wrong-bd:#7a3a31;
  --idle:#232c27; --idle-fg:#7f8d84;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;
  -webkit-font-smoothing:antialiased;font-size:16px}
.wrap{max-width:var(--maxw);margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px 56px}
.ar{font-family:var(--font-ar);font-size:1.12em;line-height:1.9}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-wrap:balance;margin:0}
.muted{color:var(--muted)}
button{font-family:inherit;cursor:pointer}

.hero{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.hero-top{padding:30px 26px 22px;background:radial-gradient(120% 120% at 100% 0,var(--accent-soft) 0,transparent 60%);border-bottom:1px solid var(--border)}
.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:.4rem 0 .3rem;color:var(--accent-ink)}
.hero-sub{color:var(--muted);font-size:1.02rem;max-width:44ch}
.creed{margin:22px 26px;padding:18px 20px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);border-left:4px solid var(--accent)}
.creed .lbl{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.creed p{margin:0;font-size:1.04rem;line-height:1.6}
.meta-row{display:flex;flex-wrap:wrap;gap:12px;margin:0 26px 8px}
.stat{flex:1 1 7rem;min-width:0;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.stat b{font-family:var(--font-display);font-size:1.5rem;color:var(--accent-ink);display:block;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.rules{margin:16px 26px 8px;padding:0;list-style:none;display:grid;gap:9px}
.rules li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.rules li::before{content:"";flex:0 0 7px;height:7px;border-radius:50%;background:var(--accent);margin-top:8px}
.actions{padding:20px 26px 28px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{border:1px solid transparent;border-radius:11px;padding:13px 22px;font-size:1rem;font-weight:600;background:var(--accent);color:#fff;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--accent-ink);border-color:var(--border)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:9px 15px;font-size:.9rem;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.books{margin:4px 26px 0;font-size:.82rem;color:var(--muted);line-height:1.7}
.books b{color:var(--fg);font-weight:600}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);margin-bottom:22px}
.topbar-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.counter{font-family:var(--font-display);font-size:1.05rem;white-space:nowrap}
.counter small{color:var(--muted);font-size:.8em}
.progress{flex:1 1 auto;min-width:0;height:8px;border-radius:99px;background:var(--idle);overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .25s}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:9px;padding:7px 11px;font-size:.85rem;font-weight:600}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:24px 22px}
.qtag{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qtag .topic{color:var(--gold)}
.qtag .kind{color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--border);border-radius:99px;padding:2px 9px;font-size:.66rem}
.qtext{font-size:1.22rem;line-height:1.5;margin:0 0 20px;font-weight:500}
.opts{display:grid;gap:11px}
.opts.tf{grid-template-columns:1fr 1fr}
@media(max-width:380px){.opts.tf{grid-template-columns:1fr}}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:start;width:100%;background:var(--surface-2);border:1.5px solid var(--border);border-radius:12px;padding:14px 15px;font-size:1.02rem;color:var(--fg);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt .key{flex:0 0 1.6rem;height:1.6rem;border-radius:50%;background:var(--surface);border:1.5px solid var(--border);display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--muted);font-family:var(--font-display)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .txt{min-width:0;padding-top:1px}
.opt.tfbtn{justify-content:center;text-align:center;font-weight:600;font-size:1.08rem;padding:18px 12px}
.opt.tfbtn .key{display:none}
.navbtns{display:flex;gap:11px;margin-top:20px;align-items:center;flex-wrap:wrap}
.spacer{flex:1 1 auto}
.hintbtn{margin-top:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--gold)}

.jump{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.jump h3{font-size:.95rem;margin-bottom:12px;color:var(--muted);letter-spacing:.04em}
.grid-n{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.2rem,1fr));gap:7px}
.cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);font-weight:600;font-size:.82rem;font-variant-numeric:tabular-nums;display:grid;place-items:center;transition:transform .05s}
.cell:hover{transform:translateY(-1px)}
.cell.answered{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.cell.current{outline:2px solid var(--gold);outline-offset:1px}
.cell.correct{background:var(--correct-bg);color:var(--correct);border-color:var(--correct-bd)}
.cell.wrong{background:var(--wrong-bg);color:var(--wrong);border-color:var(--wrong-bd)}
.cell.blank{background:var(--idle);color:var(--idle-fg)}

.score{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:26px;text-align:center;margin-bottom:18px;background-image:radial-gradient(130% 120% at 50% -10%,var(--accent-soft) 0,transparent 55%)}
.score .big{font-family:var(--font-display);font-size:clamp(2.6rem,10vw,4rem);line-height:1;color:var(--accent-ink)}
.score .pct{font-size:1.1rem;color:var(--muted);margin-top:6px}
.score .tags{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.pill{border-radius:99px;padding:7px 14px;font-size:.88rem;font-weight:600;border:1px solid var(--border)}
.pill.ok{background:var(--correct-bg);color:var(--correct);border-color:var(--correct-bd)}
.pill.no{background:var(--wrong-bg);color:var(--wrong);border-color:var(--wrong-bd)}
.pill.sk{background:var(--idle);color:var(--idle-fg)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:4px 2px 14px;font-size:.84rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:13px;height:13px;border-radius:4px;border:1px solid var(--border)}
.dot.c{background:var(--correct-bg);border-color:var(--correct-bd)}
.dot.w{background:var(--wrong-bg);border-color:var(--wrong-bd)}
.dot.b{background:var(--idle)}

.review{margin-top:18px;display:grid;gap:14px}
.rev-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 17px;scroll-margin-top:72px}
.rev-head{display:flex;gap:10px;align-items:baseline;margin-bottom:4px;flex-wrap:wrap}
.rev-num{font-family:var(--font-display);font-size:1.05rem;color:var(--accent-ink)}
.rev-badge{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em}
.rev-badge.ok{background:var(--correct-bg);color:var(--correct)}
.rev-badge.no{background:var(--wrong-bg);color:var(--wrong)}
.rev-badge.sk{background:var(--idle);color:var(--idle-fg)}
.rev-q{font-weight:500;font-size:1.08rem;margin:6px 0 13px;line-height:1.45}
.rev-opts{display:grid;gap:8px}
.rev-opt{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;font-size:.98rem;background:var(--surface-2)}
.rev-opt .key{flex:0 0 1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;font-family:var(--font-display);border:1.5px solid var(--border);background:var(--surface);color:var(--muted)}
.rev-opt.c{background:var(--correct-bg);border-color:var(--correct-bd);color:var(--correct)}
.rev-opt.c .key{background:var(--correct);border-color:var(--correct);color:#fff}
.rev-opt.w{background:var(--wrong-bg);border-color:var(--wrong-bd);color:var(--wrong)}
.rev-opt.w .key{background:var(--wrong);border-color:var(--wrong);color:#fff}
.rev-opt .mark{margin-inline-start:auto;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;align-self:center}
.rev-why{margin-top:12px;padding:11px 14px;background:var(--surface-2);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:9px;font-size:.92rem;line-height:1.5}
.rev-why b{color:var(--gold);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;margin-inline-end:6px}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 2px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:99px;padding:7px 14px;font-size:.86rem;font-weight:600}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:.82rem;line-height:1.7}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.modal-bk{position:fixed;inset:0;z-index:40;background:rgba(10,22,17,.55);display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(min-width:560px){.modal-bk{align-items:center;padding:20px}}
.modal{background:var(--surface);border:1px solid var(--border);width:100%;max-width:34rem;border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.35);padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow:auto}
@media(min-width:560px){.modal{border-radius:18px}}
.modal .mtag{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
.modal .mq{font-weight:500;font-size:1.1rem;margin:0 0 15px;line-height:1.45}
.modal .ans{display:flex;gap:11px;align-items:flex-start;background:var(--correct-bg);border:1.5px solid var(--correct-bd);border-radius:12px;padding:13px 14px;color:var(--correct)}
.modal .ans .key{flex:0 0 1.6rem;height:1.6rem;border-radius:50%;background:var(--correct);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--font-display)}
.modal .ans .atx{min-width:0;padding-top:1px;font-weight:600}
.modal .why{margin-top:14px;padding:13px 15px;background:var(--surface-2);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:10px;font-size:.98rem;line-height:1.55}
.modal .why b{color:var(--gold);display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
.modal .closeRow{display:flex;justify-content:flex-end;margin-top:18px}
@media (max-width:420px){.creed,.meta-row,.rules,.actions,.books{margin-left:18px;margin-right:18px}.card{padding:20px 16px}}
</style>
<style>
.rtl{direction:rtl;text-align:right;font-family:var(--font-ar)}
.qtext.rtl{font-size:1.45rem;line-height:1.9}
.opt.rtl{font-size:1.25rem;line-height:1.8}
.opt.rtl .key{font-family:var(--font-ar);font-size:1rem}
.rev-q.rtl{font-size:1.3rem;line-height:1.9}
.rev-opt.rtl{font-size:1.15rem;line-height:1.8}
.rev-opt.rtl .mark{margin-inline-start:auto;font-family:var(--font-body);direction:ltr}
.sec{margin-top:14px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:.98rem;line-height:1.55}
.sec>b.h{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;font-family:var(--font-body);direction:ltr;text-align:left}
.sec.tr{border-left:4px solid var(--accent)}
.sec.why{border-left:4px solid var(--gold)}
.sec.rtl{border-left:1px solid var(--border);border-right:4px solid var(--gold);font-size:1.15rem;line-height:1.9}
.sec ol{margin:.4rem 0 0;padding-inline-start:1.4rem}
.sec ol li{margin:.15rem 0}
.sec ol li.ok{color:var(--correct);font-weight:600}
.modal{max-width:40rem}
.ans.rtl{font-size:1.2rem}
.ans .sqa{display:block;font-family:var(--font-body);font-size:.92rem;direction:ltr;text-align:left;margin-top:4px;font-weight:500}
.ref{font-size:.8rem;color:var(--muted);margin-top:10px}
.chaps{margin:12px 26px 6px;display:flex;flex-wrap:wrap;gap:7px}
.chaps .chip{font-family:var(--font-ar);font-size:.95rem;font-weight:400;padding:5px 12px}
.chaps .chip{display:inline-flex;gap:.45em;align-items:center}
.chaps .chip small{font-family:var(--font-body);font-size:.72rem;opacity:.8;direction:ltr}
.chlbl{margin:16px 26px 0;font-weight:700;font-size:.9rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:420px){.chaps,.chlbl{margin-left:18px;margin-right:18px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== Kuiz: Kitabu'l-Buju' – Umdetu'l-Fikh (Ibn Kudame), f. 53–75 =====
   lloji:"tf" => pohim (a: 0=صحيح, 1=خطأ); "mcq" => 4 opsione (a = indeksi i saktë) */
const QUESTIONS = [{"id": "A001", "k": 1, "lloji": "mcq", "q": "ما تعريفُ البيع عند المؤلف؟", "o": ["تمليكُ المال بغير عِوَض", "دفعُ المال لمن ينتفع به ثم يردّ بدله", "تقديمُ الثمن وتأخيرُ المبيع الموصوف", "معاوضةُ المال بالمال"], "a": 3, "q_sq": "Si e përkufizon autori shitjen (bej')?", "o_sq": ["Kalimi i pronësisë së pasurisë pa kundërvlerë", "Dhënia e pasurisë dikujt që ta shfrytëzojë dhe pastaj ta kthejë zëvendësimin e saj", "Pagesa paraprake e çmimit dhe vonimi i mallit të përshkruar", "Këmbimi i pasurisë me pasuri"], "pse_ar": "لقول المؤلف: «والبيعُ معاوضةُ المال بالمال».", "pse_sq": "E sakta: «këmbimi i pasurisë me pasuri». Autori thotë: «Shitja është këmbimi i pasurisë me pasuri», d.m.th. secila palë jep diçka me vlerë dhe merr diçka me vlerë në këmbim. Kalimi i pronësisë pa kundërvlerë është dhurim, jo shitje, sepse në të s'ka këmbim. Dhënia e pasurisë që të shfrytëzohet e të kthehet zëvendësimi i saj është huaja (karz), kurse pagesa paraprake e çmimit me mallin e përshkruar që dorëzohet më vonë është selemi; secila ka kapitullin e vet. Shembull: jep 20 € dhe merr një libër.", "f": "٥٣"}, {"id": "A002", "k": 1, "lloji": "tf", "q": "البيعُ حلالٌ، وقد استدلّ له المؤلف بقوله تعالى: ﴿وَأَحَلَّ ٱللَّهُ ٱلْبَيْعَ﴾.", "a": 0, "q_sq": "Shitja është e lejuar (hallall), dhe autori ka argumentuar për të me fjalën e Allahut të Lartësuar: «e Allahu e ka lejuar shitblerjen».", "pse_ar": "صدّر المؤلف كتاب البيوع بقوله تعالى: ﴿وَأَحَلَّ ٱللَّهُ ٱلْبَيْعَ﴾ [البقرة: ٢٧٥].", "pse_sq": "Pohimi është i saktë. Autori e nis Librin e shitblerjeve me ajetin «e Allahu e ka lejuar shitblerjen» [El-Bekare: 275], që tregon se shitblerja në parim është e lejuar; ndalohet vetëm ajo që Sheriati e ka ndaluar në mënyrë të veçantë, si kamata dhe shitjet e ndaluara që autori i përmend më pas.", "f": "٥٣"}, {"id": "A003", "k": 1, "lloji": "mcq", "q": "ما الضابطُ الذي ذكره المؤلف لِما يجوز بيعُه؟", "o": ["كلُّ مملوكٍ فيه نفعٌ مباح", "كلُّ مملوكٍ ولو لم يكن فيه نفع", "كلُّ ما فيه نفعٌ ولو كان نفعُه محرّماً", "كلُّ مطعومٍ مكيلٍ أو موزون"], "a": 0, "q_sq": "Cili është kriteri që përmend autori për atë që lejohet të shitet?", "o_sq": ["Çdo send në pronësi që ka dobi të lejuar", "Çdo send në pronësi, edhe nëse nuk ka dobi", "Çdo send që ka dobi, edhe nëse dobia e tij është e ndaluar", "Çdo ushqim që matet me vëllim ose me peshë"], "pse_ar": "لقول المؤلف: «ويجوز بيع كل مملوك فيه نفعٌ مباحٌ».", "pse_sq": "E sakta: çdo send në pronësi që ka dobi të lejuar. Autori thotë: «Lejohet shitja e çdo gjëje që është në pronësi dhe ka dobi të lejuar». Pra duhen dy cilësi bashkë: pronësia dhe dobia e lejuar. Ajo që s'ka dobi (si insektet) nuk shitet, as ajo dobia e së cilës është e ndaluar (si alkooli dhe ngordhësira). «Çdo ushqim që matet me vëllim ose me peshë» është kriteri i pasurive ku hyn kamata, jo kriteri i asaj që lejohet të shitet. Shembull: rrobat, telefoni, makina.", "f": "٥٣"}, {"id": "A004", "k": 1, "lloji": "tf", "q": "كلبُ الصيد يجوز بيعُه، لأن فيه نفعاً مباحاً.", "a": 1, "q_sq": "Qeni i gjuetisë lejohet të shitet, sepse ka dobi të lejuar.", "pse_ar": "لقول المؤلف: «إلا الكلبَ، فإنه لا يجوز بيعه»، لأن النبي ﷺ نهى عن ثمن الكلب.", "pse_sq": "Pohimi është i pasaktë. Autori, pasi thotë se lejohet shitja e çdo sendi në pronësi me dobi të lejuar, e përjashton qenin: «përveç qenit: shitja e tij nuk lejohet», sepse Pejgamberi ﷺ e ndaloi çmimin e qenit. Përjashtimi është i përgjithshëm, prandaj përfshin edhe qenin që lejohet të mbahet. Hadithi «Atij që mban qen, në përjashtim të qenit për ruajtjen e bagëtisë ose për gjueti, për çdo ditë i pakësohen nga dy kiratë nga (shpërblimi i) veprave të tij.» tregon se qeni i gjuetisë lejohet të mbahet, jo të shitet.", "f": "٥٣"}, {"id": "A005", "k": 1, "lloji": "mcq", "q": "قتل رجلٌ كلبَ ماشيةٍ لجاره، فما الحكم في غُرم قيمته على قول المؤلف؟", "o": ["لا غُرمَ عليه، وإن كان اقتناؤه مباحاً", "يغرم نصفَ قيمته", "يغرم قيمتَه كاملة", "يغرم قيمتَه لأن اقتناءه مباح"], "a": 0, "q_sq": "Një njeri ia vrau fqinjit qenin e ruajtjes së bagëtisë. Cila është dispozita për pagimin e vlerës së tij sipas fjalës së autorit?", "o_sq": ["Nuk ka detyrim pagese (gurm), edhe pse mbajtja e tij është e lejuar", "E paguan gjysmën e vlerës së tij", "E paguan vlerën e plotë të tij", "E paguan vlerën e tij, sepse mbajtja e tij është e lejuar"], "pse_ar": "لقول المؤلف في الكلب: «ولا غرمَ على متلفه».", "pse_sq": "E sakta: nuk ka detyrim pagese (gurm). Autori thotë për qenin: «...dhe ai që e shkatërron (vret) nuk ka për detyrë ta paguajë». Arsyeja: Pejgamberi ﷺ e ndaloi çmimin e qenit, prandaj qeni nuk ka vlerë që të paguhet. Edhe pse mbajtja e qenit të bagëtisë është e lejuar, kjo nuk i jep atij çmim. Pagimi i plotë ose i gjysmës nuk ka bazë në libër.", "f": "٥٣"}, {"id": "A006", "k": 1, "lloji": "tf", "q": "وليُّ اليتيم يجوز له أن يبيع مالَ اليتيم الذي تحت ولايته، وإن لم يكن مملوكاً له.", "a": 0, "q_sq": "Kujdestari i jetimit lejohet ta shesë pasurinë e jetimit që është nën kujdestarinë (velajen) e tij, edhe pse ajo nuk është pronë e tij.", "pse_ar": "لقول المؤلف: «ولا يجوز بيع ما ليس بمملوك لبائعه إلا بإذن مالكه أو ولايةٍ عليه».", "pse_sq": "Pohimi është i saktë. Autori thotë: «Nuk lejohet shitja e asaj që nuk është pronë e shitësit, përveç me lejen e pronarit të saj ose me kujdestari (velaje) mbi të». Pra përjashtimet janë dy: leja e pronarit dhe velaja. Kujdestari i jetimit ka velaje mbi pasurinë e tij, prandaj ia shet atë në interes të jetimit. Ndërsa pa leje dhe pa velaje nuk lejohet: p.sh. nuk mund ta shesësh makinën e shokut pa lejen e tij.", "f": "٥٣"}, {"id": "A007", "k": 1, "lloji": "mcq", "q": "أيُّ ما يلي فيه تعليلٌ صحيحٌ لمنع البيع بحسب تقسيم المؤلف؟", "o": ["الخمر: لأنه لا نفعَ فيه أصلاً", "الحَمل: لأنه ليس مملوكاً للبائع", "الحشرات: لأن نفعها محرّم", "الآبق: لأنه معجوزٌ عن تسليمه"], "a": 3, "q_sq": "Cila nga këto e ka arsyetimin e saktë të ndalimit të shitjes, sipas ndarjes së autorit?", "o_sq": ["Alkooli: sepse nuk ka fare dobi", "Fetusi në bark: sepse nuk është pronë e shitësit", "Insektet: sepse dobia e tyre është e ndaluar", "Robi i arratisur (abik): sepse nuk mund të dorëzohet"], "pse_ar": "لقول المؤلف: «ولا معجوزٍ عن تسليمه كالآبق والشارد...»، وجعل الحشرات مثالاً لما لا نفع فيه، والخمر لما نفعه محرم، والحمل للمجهول.", "pse_sq": "E sakta: robi i arratisur – sepse nuk mund të dorëzohet. Autori thotë: «as e asaj që nuk mund të dorëzohet, si robi i arratisur, kafsha e ikur, zogu në ajër dhe peshku në ujë». Arsyetimet e tjera janë ngatërruar: autori i sjell insektet si shembull për «atë që s'ka dobi», alkoolin si shembull për «atë dobia e së cilës është e ndaluar», ndërsa fetusin si shembull për «të panjohurën», jo për diçka që s'është pronë e shitësit. Shembull i sotëm: shitja e një deleje që ka ikur në mal dhe s'dihet ku është.", "f": "٥٣"}, {"id": "A008", "k": 1, "lloji": "tf", "q": "لا يجوز بيعُ الحشرات لأنه لا نفعَ فيها، ولا بيعُ الخمر والميتة لأن نفعهما محرّم.", "a": 0, "q_sq": "Nuk lejohet shitja e insekteve, sepse nuk kanë dobi; as shitja e alkoolit dhe e ngordhësirës, sepse dobia e tyre është e ndaluar.", "pse_ar": "لقول المؤلف: «ولا بيعُ ما لا نفع فيه كالحشرات، ولا ما نفعُه محرم كالخمر والميتة».", "pse_sq": "Pohimi është i saktë. Autori thotë: «as shitja e asaj që nuk ka dobi, si insektet; as e asaj dobia e së cilës është e ndaluar, si alkooli dhe ngordhësira». Këto janë dy anët e kushtit të dobisë: dobia duhet të ekzistojë dhe duhet të jetë e lejuar. Shembull: shitja e birrës ose e mishit të kafshës së ngordhur pa therje nuk lejohet.", "f": "٥٣"}, {"id": "A009", "k": 1, "lloji": "mcq", "q": "قال رجلٌ لآخر: بعتُك ما ستحمله شجرتي هذه في العام القادم بمئة. فما حكم هذا البيع؟", "o": ["يجوز، إذا وصف الثمرة وصفاً دقيقاً", "لا يجوز، لأن نفع الثمرة محرّم", "لا يجوز، لأن المبيع لم يوجد بعد", "يجوز، لأن الشجرة مملوكة للبائع"], "a": 2, "q_sq": "Një njeri i tha tjetrit: «Ta shes për njëqind atë që do të mbartë (prodhojë) kjo pemë imja vitin e ardhshëm». Cila është dispozita e kësaj shitjeje?", "o_sq": ["Lejohet, nëse e përshkruan frytin me përshkrim të saktë", "Nuk lejohet, sepse dobia e frytit është e ndaluar", "Nuk lejohet, sepse malli ende nuk ekziston", "Lejohet, sepse pema është pronë e shitësit"], "pse_ar": "لأن المؤلف منع بيع ما لم يوجد بعد، ومثّل له بالذي تحمل أمتُه أو شجرتُه.", "pse_sq": "E sakta: nuk lejohet, sepse malli ende nuk ekziston. Autori e ndalon shitjen e asaj që ende nuk ekziston dhe jep si shembull «ajo që do të mbartë robëresha e tij apo pema e tij (në të ardhmen)». Fakti që pema është pronë e shitësit nuk mjafton, sepse shitet fryti i ardhshëm, jo pema; as përshkrimi nuk e lejon, sepse vetë libri e sjell pikërisht këtë rast si shembull të ndaluar. Dobia e frytit nuk është e ndaluar; arsyeja është mosekzistenca. Shembull i sotëm: shitja e viçit që do ta lindë lopa vitin tjetër.", "f": "٥٣"}, {"id": "A010", "k": 1, "lloji": "mcq", "q": "بِمَ مثّل المؤلف للمجهول الذي لا يجوز بيعُه؟", "o": ["عبدٌ من عبيده، وشاةٌ من قطيعه", "الحَمل، والغائب الذي لم يوصف ولم يُرَ قبلُ", "الخمر، والميتة، وسائر ما نفعه محرّم", "الآبق، والشارد، والطير في الهواء"], "a": 1, "q_sq": "Me çfarë shembujsh e ilustroi autori të panjohurën që nuk lejohet të shitet?", "o_sq": ["Një rob nga robërit e tij dhe një dele nga kopeja e tij", "Fetusi në bark dhe malli që mungon, i cili s'është përshkruar dhe s'është parë më parë", "Alkooli, ngordhësira dhe gjithçka dobia e së cilës është e ndaluar", "Robi i arratisur, kafsha e ikur dhe zogu në ajër"], "pse_ar": "لقول المؤلف: «أو مجهولٍ كالحمل والغائب الذي لم يوصف ولم تتقدم رؤيتُه».", "pse_sq": "E sakta: fetusi dhe malli që mungon, i papërshkruar e i paparë më parë. Autori thotë: «ose e diçkaje të panjohur, si fetusi në bark dhe malli që mungon, i cili nuk është përshkruar dhe nuk është parë më parë». Opsionet e tjera janë shembuj të rregullave fqinje: robi i arratisur e zogu në ajër janë shembuj për atë që s'mund të dorëzohet; alkooli e ngordhësira për atë dobia e së cilës është e ndaluar; rob nga robërit e dele nga kopeja për atë që s'është e caktuar. Shembull: «Ta shes atë që kam në depo», pa e përshkruar dhe pa e pasur parë blerësi.", "f": "٥٣"}, {"id": "A011", "k": 1, "lloji": "mcq", "q": "أيُّ ما يلي يجوز بيعُه عند المؤلف؟", "o": ["الحَملُ في بطن الشاة", "قفيزٌ من صُبرةٍ معيّنة", "شاةٌ من قطيعه دون تعيين", "عبدٌ من عبيده دون تعيين"], "a": 1, "q_sq": "Cila nga këto lejohet të shitet sipas autorit?", "o_sq": ["Fetusi në barkun e deles", "Një kafiz (masë vëllimi = 12 sa') nga një subre (grumbull drithi) e caktuar", "Një dele nga kopeja e tij, pa e caktuar", "Një rob nga robërit e tij, pa e caktuar"], "pse_ar": "لقول المؤلف: «ولا بيعُ غيرِ معينٍ كعبد من عبيده أو شاة من قطيعه إلا فيما تتساوى أجزاؤه كقفيزٍ من صُبْرَة».", "pse_sq": "E sakta: një kafiz nga një grumbull drithi. Autori e ndalon shitjen e asaj që s'është e caktuar, si një rob nga robërit ose një dele nga kopeja, sepse ato ndryshojnë nga njëra-tjetra dhe s'dihet çfarë blihet; por e përjashton «atë pjesët e të cilit janë të barabarta, si një kafiz nga një subre (grumbull drithi)», sepse çdo pjesë e grumbullit është njësoj. Fetusi në bark nuk shitet, sepse është i panjohur. Shembull: «Ta shes 50 kg nga ky grumbull gruri» lejohet; «Ta shes një nga këto dele» nuk lejohet.", "f": "٥٣"}, {"id": "A012", "k": 1, "lloji": "mcq", "q": "غُصبت سيارةُ رجلٍ، فأراد أن يبيعها وهي في يد الغاصب، فلمن يجوز له بيعُها؟", "o": ["لكلِّ مشترٍ يرضى بذلك ولو عجز عن أخذها", "لا يجوز بيعها لأحدٍ حتى تعود إلى يده", "لغاصبها أو لمن يقدر على أخذها منه", "لمن يقدر على أخذها منه دون غاصبها"], "a": 2, "q_sq": "Një njeriu iu grabit makina dhe ai dëshiron ta shesë ndërsa është në dorën e grabitësit. Kujt i lejohet t'ia shesë?", "o_sq": ["Çdo blerësi që pajtohet me këtë, edhe nëse s'mund ta marrë", "Nuk lejohet t'ia shesë askujt derisa t'i kthehet në dorë", "Grabitësit të saj ose atij që mund ta marrë prej tij", "Atij që mund ta marrë prej tij, por jo grabitësit"], "pse_ar": "لقول المؤلف: «ولا بيعُ المغصوب إلا لغاصبه أو من يقدر على أخذه منه».", "pse_sq": "E sakta: grabitësit ose atij që mund ta marrë prej tij. Autori thotë: «as shitja e asaj që është grabitur, përveç grabitësit të saj ose atij që mund ta marrë prej tij». Ndalimi lidhet me pamundësinë e dorëzimit: kush s'mund ta marrë mallin, paguan për diçka që ndoshta s'do ta marrë kurrë, edhe nëse pajtohet. Grabitësi e ka në dorë, ndërsa i fuqishmi mund ta marrë, prandaj për ta lejohet. Shembull: ta kanë marrë telefonin me forcë; mund t'ia shesësh vetë atij që e mori, ose dikujt që ka fuqi ta marrë prej tij.", "f": "٥٣"}, {"id": "A013", "k": 2, "lloji": "mcq", "q": "ما المُلامَسة التي نهى عنها رسول الله ﷺ كما فسّرها المؤلف؟", "o": ["أن يقول: ارمِ الحصاةَ، فأيَّ ثوبٍ وقعتْ عليه فهو بكذا", "أن يقول: أيَّ ثوبٍ لمستَه فهو لك بكذا", "أن يقول: أيَّ ثوبٍ نبذتَه إليَّ فهو عليَّ بكذا", "أن يقول: بعتُك هذا بعشرةٍ صحاحٍ أو عشرين مكسّرة"], "a": 1, "q_sq": "Çfarë është mulamesja që e ndaloi i Dërguari i Allahut ﷺ, siç e shpjegoi autori?", "o_sq": ["Të thotë: «Hidhe guralecin, e cilado rrobë mbi të cilën bie, ajo është për kaq»", "Të thotë: «Cilëndo rrobë që ta prekësh, është e jotja për kaq»", "Të thotë: «Cilëndo rrobë që ma hedhësh, është imja (e blerë) për kaq»", "Të thotë: «Ta shes këtë për dhjetë (monedha) të plota ose për njëzet të thyera»"], "pse_ar": "لقول المؤلف: «ونهى رسول الله ﷺ عن الملامَسة، وهي: أن يقول: أيَّ ثوب لمستَه فهو لك بكذا».", "pse_sq": "E sakta: «Cilëndo rrobë që ta prekësh, është e jotja për kaq». Kështu e shpjegon autori mulamesen: malli caktohet me prekje, pa u parë e zgjedhur, prandaj blerësi s'e di saktë çfarë blen. Opsioni me hedhjen e rrobës është munabedheja, ai me guralecin është shitja me guralec, ndërsa ai me dy çmime është forma e parë e «dy shitjeve në një shitje». Shembull: «Cilëndo bluzë që ta prekësh me dorë, është e jotja për 10 €».", "f": "٥٣"}, {"id": "A014", "k": 2, "lloji": "mcq", "q": "قال تاجرٌ لرجل: ارمِ هذه الحصاة، فأيُّ ثوبٍ وقعتْ عليه فهو لك بعشرة. فما اسمُ هذا البيع؟", "o": ["المُلامَسة", "المُنابَذة", "النَّجْش", "بيعُ الحصاة"], "a": 3, "q_sq": "Një tregtar i tha një njeriu: «Hidhe këtë guralec, e cilado rrobë mbi të cilën të bjerë, është e jotja për dhjetë». Si quhet kjo shitje?", "o_sq": ["Mulamese", "Munabedhe", "Nexhsh", "Shitja me guralec"], "pse_ar": "لقول المؤلف: «وعن بيع الحصاة، وهو: أن يقول: ارم الحصاة، فأيَّ ثوب وقعتْ عليه فهو بكذا».", "pse_sq": "E sakta: shitja me guralec, që e ndaloi Pejgamberi ﷺ. Autori e shpjegon: «Hidhe guralecin, e cilado rrobë mbi të cilën bie, ajo është për kaq». Këtu malli caktohet nga vendi ku bie guri, jo nga zgjedhja e blerësit. Munabedheja caktohet me hedhjen e rrobës, mulamesja me prekjen e saj, ndërsa nexhshi është rritja e çmimit nga ai që s'do të blejë. Shembull i sotëm: «Hidhe këtë gur: cilindo telefon të godasë, është yti për 100 €».", "f": "٥٣"}, {"id": "A015", "k": 2, "lloji": "tf", "q": "المُنابَذة: أن يزيد في ثمن السلعة مَن لا يريد شراءها.", "a": 1, "q_sq": "Munabedheja është: ta rrisë çmimin e mallit ai që nuk ka ndërmend ta blejë.", "pse_ar": "المنابذة عند المؤلف: «أن يقول: أيَّ ثوب نبذتَه إليّ فهو عليَّ بكذا»، وأما الزيادة ممن لا يريد الشراء فهي النجش.", "pse_sq": "Pohimi është i pasaktë. Autori e shpjegon munabedhen kështu: «Cilëndo rrobë që ma hedhësh, është imja (e blerë) për kaq», pra malli caktohet me hedhje. Ajo që përshkruhet në pohim – rritja e çmimit nga ai që s'do ta blejë mallin – është nexhshi, një shitje tjetër e ndaluar që autori e përmend në vazhdim.", "f": "٥٣"}, {"id": "A016", "k": 2, "lloji": "mcq", "q": "ما النَّجْش كما فسّره المؤلف؟", "o": ["أن يزيد في السلعة مَن لا يريد شراءها", "أن يكون الحاضرُ سمساراً للبادي", "أن يبيع الطعامَ قبل أن يستوفيه", "أن يتلقّى السلعَ قبل أن يُهبط بها السوق"], "a": 0, "q_sq": "Çfarë është nexhshi, siç e shpjegoi autori?", "o_sq": ["Ta rrisë çmimin e mallit ai që nuk ka ndërmend ta blejë", "Që vendasi të bëhet ndërmjetës (simsar) i atij që vjen nga shkretëtira", "Ta shesë ushqimin para se ta marrë plotësisht në dorë", "Të dalë përpara mallrave para se të zbriten në treg"], "pse_ar": "لقول المؤلف: «وعن النَّجْش وهو: أن يزيد في السلعة من لا يريد شراءها».", "pse_sq": "E sakta: rritja e çmimit nga ai që s'do ta blejë mallin. Autori thotë: «...dhe nexhshin, që është kur e rrit çmimin e mallit ai që nuk ka ndërmend ta blejë». Kjo është mashtrim, sepse i shtyn të tjerët të paguajnë më shtrenjtë. Opsionet e tjera janë shitje të tjera të ndaluara në të njëjtën pjesë: shitja e vendasit për atë që vjen nga shkretëtira, dalja përpara mallrave dhe shitja e ushqimit para marrjes. Shembull: në një ankand dikush ofron më shumë vetëm që blerësit e tjerë të paguajnë më shtrenjtë.", "f": "٥٤"}, {"id": "A017", "k": 2, "lloji": "mcq", "q": "فسّر المؤلف «بيعَ حاضرٍ لبادٍ» بأن:", "o": ["يكون الحاضرُ سمساراً للبادي", "يخرج الحاضرُ فيشتري من البادي قبل السوق", "يزيد الحاضرُ في سلعة البادي ولا يريد شراءها", "يشترط الحاضرُ على البادي بيعاً في بيع"], "a": 0, "q_sq": "Autori e shpjegoi «shitjen e vendasit për atë që vjen nga shkretëtira» me atë që:", "o_sq": ["Vendasi të bëhet ndërmjetës (simsar) i atij që vjen nga shkretëtira", "Vendasi të dalë e të blejë nga ai që vjen nga shkretëtira para tregut", "Vendasi ta rrisë çmimin e mallit të atij që vjen nga shkretëtira pa dashur ta blejë", "Vendasi t'i kushtëzojë atij që vjen nga shkretëtira një shitje brenda një shitjeje"], "pse_ar": "لقول المؤلف: «وعن بيع حاضر لباد، وهو: أن يكون له سِمساراً».", "pse_sq": "E sakta: vendasi të bëhet ndërmjetës (simsar) i tij. Kështu e shpjegon autori: «dhe shitjen e vendasit për atë që vjen nga shkretëtira, që është që ai të bëhet ndërmjetës (simsar) i tij». Dalja për të blerë para tregut është «dalja përpara mallrave», rritja e çmimit pa dashur të blejë është nexhshi, ndërsa kushtëzimi i një shitjeje brenda shitjes është «dy shitje në një shitje». Shembull: një fshatar vjen në qytet me mall dhe një banor i qytetit i thotë: «Lëre te unë, do ta shes unë për ty».", "f": "٥٤"}, {"id": "A018", "k": 2, "lloji": "mcq", "q": "أيُّ ما يلي **ليس** من البيوع التي ذكر المؤلف نهيَ النبي ﷺ عنها؟", "o": ["الإقالةُ في السَّلَم", "بيعُ الرجل على بيع أخيه", "بيعُ حاضرٍ لبادٍ", "بيعتان في بيعة"], "a": 0, "q_sq": "Cila nga këto **NUK** është ndër shitjet për të cilat autori përmendi ndalimin e Pejgamberit ﷺ?", "o_sq": ["Ikaleja (prishja e shitjes me pëlqim) në selem", "Shitja e njeriut mbi shitjen e vëllait të tij", "Shitja e vendasit për atë që vjen nga shkretëtira", "Dy shitje në një shitje"], "pse_ar": "الإقالة في السلم جائزة لقول المؤلف: «وتجوز الإقالة فيه أو في بعضه، لأنها فسخ»، وأما البقية فقد ذكر النهي عنها في فصل البيوع المنهي عنها.", "pse_sq": "E sakta: ikaleja në selem. Ajo nuk është e ndaluar; përkundrazi, autori thotë në kapitullin e selemit: «lejohet ikaleja për të ose për një pjesë të tij, sepse ajo është prishje». Ndërsa tri të tjerat i përmend autori në pjesën e shitjeve të ndaluara: Pejgamberi ﷺ ndaloi «që njeriu të shesë mbi shitjen e vëllait të tij», «shitjen e vendasit për atë që vjen nga shkretëtira» dhe «dy shitje në një shitje». Shembull i sotëm i shitjes mbi shitjen e vëllait: dikush ka blerë një telefon dhe ende mund ta kthejë, e ti i thua: «Ktheje, unë ta shes një të ngjashëm më lirë».", "f": "٥٤"}, {"id": "A019", "k": 2, "lloji": "mcq", "q": "قال رجلٌ: بعتُك داري هذه على أن تبيعني سيارتك. فهذا من:", "o": ["بيع حاضرٍ لبادٍ", "تلقّي السلع", "المُنابَذة", "بيعتين في بيعة"], "a": 3, "q_sq": "Një njeri tha: «Ta shes këtë shtëpinë time me kusht që të ma shesësh makinën tënde». Kjo është nga:", "o_sq": ["Shitja e vendasit për atë që vjen nga shkretëtira", "Dalja përpara mallrave", "Munabedheja", "Dy shitje në një shitje"], "pse_ar": "لقول المؤلف في بيعتين في بيعة: «أو يقول: بعتك هذا على أن تبيعني هذا أو تشتري مني هذا».", "pse_sq": "E sakta: dy shitje në një shitje, që e ndaloi Pejgamberi ﷺ. Autori përmend dy forma të saj; e dyta është: «Ta shes këtë me kusht që të më shesësh këtë ose të blesh prej meje këtë», pra kushtëzohet një shitje brenda një shitjeje, pikërisht si në pyetje. Munabedheja është caktimi i mallit me hedhje; shitja e vendasit për atë që vjen nga shkretëtira është ndërmjetësimi; dalja përpara mallrave është blerja para se mallrat të arrijnë në treg.", "f": "٥٤"}, {"id": "A020", "k": 2, "lloji": "tf", "q": "من صور بيعتين في بيعة: أن يقول: بعتُك هذا بعشرةٍ صحاحٍ أو عشرين مكسّرة.", "a": 0, "q_sq": "Nga format e «dy shitjeve në një shitje» është të thotë: «Ta shes këtë për dhjetë (monedha) të plota ose për njëzet të thyera (copa monedhash)».", "pse_ar": "لقول المؤلف: «وعن بيعتين في بيعة، وهو: أن يقول: بعتك هذا بعشرة صحاح أو عشرين مكسرة».", "pse_sq": "Pohimi është i saktë. Kjo është forma e parë që përmend autori për «dy shitje në një shitje»: mallit i vihen dy çmime, njëri ose tjetri, dhe çmimi mbetet i paqartë. Forma e dytë është kushtëzimi i një shitjeje brenda një shitjeje («Ta shes këtë me kusht që të më shesësh këtë»). Shembull i sotëm: «Ta shes këtë telefon për 100 € në dorë ose për 120 € me këste», dhe ndahen pa u vendosur për njërin.", "f": "٥٤"}, {"id": "A021", "k": 2, "lloji": "mcq", "q": "خرج رجلٌ إلى مدخل البلد فاشترى من الفلاحين سلعَهم قبل أن يصلوا بها إلى السوق. فبأيِّ حديثٍ استدلّ المؤلف على النهي عن ذلك؟", "o": ["«فمن زادَ أو استزادَ فقد أربَى»", "«لا تلقَّوا السِّلعَ حتى يُهبطَ بها الأسواقُ»", "«لا تُصَرُّوا الإبلَ والغنمَ»", "«مَن اشترَى طعاماً فلا يبعْه حتَّى يستوفيَه»"], "a": 1, "q_sq": "Një njeri doli në hyrje të qytetit dhe bleu mallrat e fshatarëve para se ata të arrinin me to në treg. Me cilin hadith argumentoi autori për ndalimin e kësaj?", "o_sq": ["«Kush jep më shumë ose kërkon më shumë, ka bërë kamatë.»", "«Mos dilni përpara mallrave (për t'i blerë) derisa të zbriten në tregje»", "«Mos ua mbani qumështin në gji deveve dhe deleve (që të duken më qumështore)»", "«Kush blen ushqim, të mos e shesë derisa ta marrë plotësisht në dorë.»"], "pse_ar": "لقوله ﷺ فيما أورده المؤلف: «لا تلقَّوا السِّلعَ حتى يُهبطَ بها الأسواقُ».", "pse_sq": "E sakta: «Mos dilni përpara mallrave (për t'i blerë) derisa të zbriten në tregje». Rasti në pyetje është pikërisht «dalja përpara mallrave»: blerja e tyre para se të arrijnë në treg, kur shitësit ende s'e dinë çmimin e tregut. Hadithet e tjera janë argumente për çështje të tjera në libër: i dyti për ndalimin e shitjes së ushqimit para marrjes në dorë, i treti për ndalimin e tasrijes (mbajtjes së qumështit në gji), i katërti për kamatën.", "f": "٥٤"}, {"id": "A022", "k": 2, "lloji": "mcq", "q": "اشترى رجلٌ طعاماً، ثم أراد أن يبيعه قبل أن يستوفيَه. فما الحكم؟", "o": ["لا يبيعه حتى يستوفيَه", "يجوز إن باعه بمثل الثمن أو أقل", "يجوز إن كان الطعام من غير الأصناف الستة", "يجوز، لأنه دخل في ملكه بالعقد"], "a": 0, "q_sq": "Një njeri bleu ushqim dhe pastaj deshi ta shesë para se ta marrë plotësisht në dorë. Cila është dispozita?", "o_sq": ["Nuk e shet derisa ta marrë plotësisht në dorë", "Lejohet nëse e shet me të njëjtin çmim ose më lirë", "Lejohet nëse ushqimi nuk është nga gjashtë llojet (e hadithit të kamatës)", "Lejohet, sepse ka hyrë në pronësinë e tij me kontratë"], "pse_ar": "لقوله ﷺ: «مَن اشترَى طعاماً فلا يبعْه حتَّى يستوفيَه».", "pse_sq": "E sakta: nuk e shet derisa ta marrë plotësisht në dorë. Autori e sjell hadithin: «Kush blen ushqim, të mos e shesë derisa ta marrë plotësisht në dorë.» Hadithi është i përgjithshëm: nuk bën dallim ndërmjet shitjes me fitim ose pa fitim, as ndërmjet gjashtë llojeve të kamatës dhe ushqimeve të tjera. Fakti që ka hyrë në pronësinë e tij nuk e lejon shitjen para marrjes. Shembull: blen 1 ton grurë nga një fermer dhe, para se ta marrësh në dorë, ia shet dikujt tjetër me fitim – kjo nuk lejohet.", "f": "٥٤"}, {"id": "A023", "k": 3, "lloji": "tf", "q": "الأرزُّ من الأصناف الستة المذكورة في حديث عبادة بن الصامت في الربا.", "a": 1, "q_sq": "Orizi është nga gjashtë llojet e përmendura në hadithin e Ubade ibn Samitit për kamatën.", "pse_ar": "الأصناف الستة في حديث عبادة: «الذهبُ بالذهبِ، والفضةُ بالفضةِ، والبرُّ بالبرِّ، والشعيرُ بالشعيرِ، والتمرُ بالتمرِ، والملحُ بالملحِ»، وليس فيها الأرز.", "pse_sq": "Pohimi është i pasaktë. Gjashtë llojet e hadithit janë: ari, argjendi, gruri, elbi, hurmat dhe kripa. Megjithatë kamata hyn edhe te orizi, jo sepse përmendet në hadith, por sepse autori thotë: «Nuk lejohet shitja e ushqimit – që matet me vëllim ose me peshë – me llojin e vet, përveçse në sasi të barabartë».", "f": "٥٤"}, {"id": "A024", "k": 3, "lloji": "mcq", "q": "باع رجلٌ عشرةَ آصُعٍ من الأرز – وهو مطعومٌ مكيل – بأحدَ عشرَ صاعاً من الأرز يداً بيد. فما الحكم عند المؤلف؟", "o": ["يجوز إن كان الصاع الزائد أردأ من غيره", "يجوز، لأن التقابض قد حصل في المجلس", "يجوز، لأن الأرز ليس من الأصناف الستة المذكورة", "لا يجوز، لأنه مطعومٌ مكيلٌ بيع بجنسه متفاضلاً"], "a": 3, "q_sq": "Një njeri shiti dhjetë sa' oriz – që është ushqim që matet me vëllim – me njëmbëdhjetë sa' oriz, dorë me dorë. Cila është dispozita sipas autorit?", "o_sq": ["Lejohet nëse sa'-ja e tepërt është më e dobët se të tjerat", "Lejohet, sepse marrja në dorë u bë në vend", "Lejohet, sepse orizi nuk është nga gjashtë llojet e përmendura", "Nuk lejohet, sepse është ushqim që matet me vëllim, i shitur me llojin e vet me shtesë"], "pse_ar": "لقول المؤلف: «ولا يجوز بيع مطعوم – مكيل أو موزون – بجنسه إلا مثلاً بمثل».", "pse_sq": "E sakta: nuk lejohet. Autori nuk e kufizon kamatën te gjashtë llojet e hadithit, por thotë: «Nuk lejohet shitja e ushqimit – që matet me vëllim ose me peshë – me llojin e vet, përveçse në sasi të barabartë». Orizi është ushqim që matet me vëllim, prandaj oriz me oriz duhet të jetë në sasi të barabartë. Marrja dorë me dorë nuk mjafton kur lloji është i njëjtë, sepse kërkohet edhe barazia; dhe dallimi në cilësi nuk e lejon shtesën. Shembull: 10 kg oriz me 12 kg oriz është kamatë.", "f": "٥٤"}, {"id": "A025", "k": 3, "lloji": "tf", "q": "يجوز بيعُ صاعٍ من التمر الجيّد بصاعين من التمر الرديء يداً بيد، لاختلافهما في الجودة.", "a": 1, "q_sq": "Lejohet shitja e një sa' hurmash të mira me dy sa' hurma të dobëta, dorë me dorë, sepse ndryshojnë në cilësi.", "pse_ar": "لقول المؤلف: «وكلُّ شيئين جمعهما اسم خاص فهما جنس واحد»، والجنس بجنسه لا يجوز «إلا مثلاً بمثل».", "pse_sq": "Pohimi është i pasaktë. Hurmat, sado varietete e cilësi të kenë, i bashkon një emër i veçantë («hurma»), prandaj janë një lloj; autori thotë: «Çdo dy gjëra që i bashkon një emër i veçantë janë një lloj». Lloji me llojin e vet nuk shitet veçse në sasi të barabartë, siç thotë hadithi i Ubades: «...duhet të jenë në sasi e në masë të njëjtë... Kush jep më shumë ose kërkon më shumë, ka bërë kamatë.» Dallimi në cilësi nuk e lejon shtesën.", "f": "٥٤"}, {"id": "A026", "k": 3, "lloji": "mcq", "q": "البُرُّ مكيل، فإذا بيع ببُرٍّ فبأيِّ شيءٍ تُعتبر المماثلة بينهما؟", "o": ["بالقيمة لا بالقدر", "بالكيل أو بالوزن أيّهما شاءا", "بالوزن لا بالكيل", "بالكيل لا بالوزن"], "a": 3, "q_sq": "Gruri matet me vëllim; nëse shitet me grurë, me çfarë llogaritet barazia ndërmjet tyre?", "o_sq": ["Me vlerë, jo me sasi", "Me vëllim ose me peshë, cilëndo që të duan", "Me peshë, jo me vëllim", "Me vëllim, jo me peshë"], "pse_ar": "لقول المؤلف: «ولا يجوز بيع مكيل من ذلك بشيء من جنسه وزناً ولا موزون كيلاً».", "pse_sq": "E sakta: me vëllim, jo me peshë. Autori thotë: «nuk lejohet shitja e asaj që matet me vëllim me diçka nga lloji i vet me peshë, as e asaj që matet me peshë me vëllim». Pra barazia matet me masën e vetë mallit: ajo që matet me vëllim (si gruri) barazohet me vëllim, kurse ajo që matet me peshë barazohet me peshë. Dy sasi gruri mund të jenë të barabarta në peshë, por të ndryshme në vëllim. Shembull: 1 sa' grurë me 1 sa' grurë.", "f": "٥٤"}, {"id": "A027", "k": 3, "lloji": "mcq", "q": "باع رجلٌ صاعاً من البُرّ بصاعين من الشعير، وتقابضا قبل التفرّق. فما الحكم؟", "o": ["لا يجوز، لوجود الزيادة في الشعير", "لا يجوز، لأن البرّ والشعير جنسٌ واحد", "يجوز بشرط أن يكون الشعير أردأ من البرّ", "يجوز، لاختلاف الجنسين مع التقابض"], "a": 3, "q_sq": "Një njeri shiti një sa' grurë me dy sa' elb dhe i morën në dorë para se të ndaheshin. Cila është dispozita?", "o_sq": ["Nuk lejohet, sepse ka shtesë te elbi", "Nuk lejohet, sepse gruri dhe elbi janë një lloj", "Lejohet me kusht që elbi të jetë më i dobët se gruri", "Lejohet, sepse llojet ndryshojnë dhe u bë marrja në dorë"], "pse_ar": "لقول المؤلف: «وإن اختلف الجنسان جاز بيعه كيف شاء يداً بيد».", "pse_sq": "E sakta: lejohet. Autori thotë: «e nëse dy llojet ndryshojnë, lejohet shitja si të dojë, dorë me dorë», dhe në hadith: «Nëse ndryshojnë këto lloje mes vete, atëherë shitini si të doni, nëse shitja bëhet dorë me dorë.» Gruri dhe elbi janë dy lloje të veçanta (secili përmendet veçmas në hadith), prandaj shtesa lejohet; kushti është marrja në dorë para ndarjes, dhe kjo u plotësua. Cilësia nuk është kusht.", "f": "٥٤"}, {"id": "A028", "k": 3, "lloji": "tf", "q": "يجوز بيعُ صاعٍ من التمر بصاعين من الملح، على أن يُسلَّم الملحُ بعد شهر.", "a": 1, "q_sq": "Lejohet shitja e një sa' hurmash me dy sa' kripë, me kusht që kripa të dorëzohet pas një muaji.", "pse_ar": "لقول المؤلف في الجنسين المختلفين: «جاز بيعه كيف شاء يداً بيد، ولم يجز النسأ فيه، ولا التفرق قبل القبض».", "pse_sq": "Pohimi është i pasaktë. Hurmat dhe kripa janë dy lloje të ndryshme, prandaj shtesa (një me dy) lejohet; por autori thotë: «lejohet shitja si të dojë, dorë me dorë, por nuk lejohet vonesa (nese') në të, as ndarja para marrjes në dorë». Këtu dorëzimi i kripës shtyhet një muaj, pra ka vonesë, dhe shitja nuk lejohet. Rast i ngjashëm: grurë sot me oriz pas një muaji.", "f": "٥٤"}, {"id": "A029", "k": 3, "lloji": "mcq", "q": "ما ضابطُ الجنس الواحد عند المؤلف؟", "o": ["ما اتّفقا في الكيل أو الوزن وإن اختلف اسماهما", "ما جمعهما اسمٌ خاصٌّ ولم يكونا من أصلين مختلفين", "ما تقاربت قيمتاهما في السوق وإن اختلف اسماهما", "ما اتّفقا في الطعم والمنفعة وإن اختلف أصلاهما"], "a": 1, "q_sq": "Cili është kriteri i llojit të njëjtë (xhinsit) sipas autorit?", "o_sq": ["Dy gjëra që përputhen në vëllim ose peshë, edhe nëse emrat u ndryshojnë", "Dy gjëra që i bashkon një emër i veçantë dhe nuk vijnë nga dy burime të ndryshme", "Dy gjëra që kanë vlerë të përafërt në treg, edhe nëse emrat u ndryshojnë", "Dy gjëra që përputhen në shije e dobi, edhe nëse burimet u ndryshojnë"], "pse_ar": "لقول المؤلف: «وكلُّ شيئين جمعهما اسم خاص فهما جنس واحد إلا أن يكونا من أصلين مختلفين».", "pse_sq": "E sakta: dy gjëra që i bashkon një emër i veçantë, përveç nëse vijnë nga dy burime të ndryshme. Autori thotë: «Çdo dy gjëra që i bashkon një emër i veçantë janë një lloj, përveç nëse vijnë nga dy burime të ndryshme». Kriteri është emri i veçantë (p.sh. «hurma», «grurë»), jo masa, shija apo vlera. Shembull: hurmat e të gjitha varieteteve janë një lloj; por mielli i grurit dhe mielli i elbit janë dy lloje, sepse burimet e tyre ndryshojnë.", "f": "٥٤"}, {"id": "A030", "k": 3, "lloji": "mcq", "q": "باع رجلٌ صاعاً من دقيق البُرّ بصاعين من دقيق الشعير يداً بيد. فما الحكم؟", "o": ["لا يجوز إلا مِثلاً بمثلٍ كيلاً", "يجوز ولو تفرّقا قبل القبض", "لا يجوز، لأن اسمهما واحد وهو الدقيق", "يجوز، لأن فروع الأجناس أجناس"], "a": 3, "q_sq": "Një njeri shiti një sa' miell gruri me dy sa' miell elbi, dorë me dorë. Cila është dispozita?", "o_sq": ["Nuk lejohet veçse në sasi të barabartë me vëllim", "Lejohet edhe nëse ndahen para marrjes në dorë", "Nuk lejohet, sepse emri i tyre është i njëjtë: miell", "Lejohet, sepse degët e llojeve janë lloje (më vete)"], "pse_ar": "لقول المؤلف: «فإن فروع الأجناس أجناس وإن اتفقت أسماؤها كالأدقة والأدهان».", "pse_sq": "E sakta: lejohet. Edhe pse të dyja quhen «miell», autori thotë: «sepse degët (prodhimet) e llojeve janë lloje (të veçanta), edhe nëse emrat e tyre përputhen, si mielli (i llojeve të ndryshme) dhe vajrat». Mielli i grurit ndjek grurin dhe mielli i elbit ndjek elbin, pra janë dy lloje; te dy lloje të ndryshme lejohet shtesa, por vetëm dorë me dorë, prandaj ndarja para marrjes në dorë nuk lejohet.", "f": "٥٤"}, {"id": "A031", "k": 3, "lloji": "tf", "q": "زيتُ الزيتون وزيتُ السمسم جنسٌ واحد لاتفاق اسمهما، فلا يُباع أحدهما بالآخر إلا مِثلاً بمثل.", "a": 1, "q_sq": "Vaji i ullirit dhe vaji i susamit janë një lloj, sepse emri i tyre përputhet; prandaj njëri nuk shitet me tjetrin veçse në sasi të barabartë.", "pse_ar": "لقول المؤلف: «فإن فروع الأجناس أجناس وإن اتفقت أسماؤها كالأدقة والأدهان».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «sepse degët (prodhimet) e llojeve janë lloje (të veçanta), edhe nëse emrat e tyre përputhen, si mielli (i llojeve të ndryshme) dhe vajrat». Vaji i ullirit vjen nga ulliri, kurse vaji i susamit nga susami – dy burime të ndryshme – prandaj janë dy lloje. Rrjedhimisht lejohet këmbimi i tyre me sasi të ndryshme, me kusht që të jetë dorë me dorë.", "f": "٥٤"}, {"id": "A032", "k": 3, "lloji": "mcq", "q": "باع رجلٌ صاعاً من الرُّطَب بصاعٍ من التمر اليابس يداً بيد. فما الحكم عند المؤلف؟", "o": ["لا يجوز، لأنه بيعُ رطبٍ بيابسٍ من جنسه", "يجوز، لأنهما متساويان في الكيل", "يجوز، لأن الرطب والتمر جنسان مختلفان", "لا يجوز إلا أن يزيد الرطبُ لأنه ينقص إذا جفّ"], "a": 0, "q_sq": "Një njeri shiti një sa' hurma të freskëta (rutab) me një sa' hurma të thata, dorë me dorë. Cila është dispozita sipas autorit?", "o_sq": ["Nuk lejohet, sepse është shitje e të njomës me të thatën nga lloji i vet", "Lejohet, sepse janë të barabarta në vëllim", "Lejohet, sepse hurmat e freskëta dhe të thata janë dy lloje të ndryshme", "Nuk lejohet, përveç nëse hurmat e freskëta janë më shumë, sepse pakësohen kur thahen"], "pse_ar": "لقول المؤلف: «ولا يجوز بيع رَطب منها بيابس من جنسه».", "pse_sq": "E sakta: nuk lejohet. Autori thotë: «Nuk lejohet shitja e të njomës prej tyre me të thatën nga lloji i vet». Hurmat e freskëta dhe hurmat e thata janë një lloj; e freskëta pakësohet kur thahet, kështu që barazia e tyre nuk mund të dihet, edhe nëse tani janë të barabarta në vëllim. As shtimi i sasisë së të freskëtave nuk e lejon, sepse ndalimi në libër është i prerë.", "f": "٥٤"}, {"id": "A033", "k": 3, "lloji": "mcq", "q": "أيُّ ما يلي **لا** يجوز عند المؤلف؟", "o": ["بُرٌّ صافٍ ببُرٍّ مخلوطٍ بترابٍ مِثلاً بمثل", "صاعُ شعيرٍ بصاعين من التمر يداً بيد", "صاعُ بُرٍّ جيّدٍ بصاعِ بُرٍّ رديءٍ مِثلاً بمثلٍ يداً بيد", "صاعُ تمرٍ بصاعين من الملح يداً بيد"], "a": 0, "q_sq": "Cila nga këto **NUK** lejohet sipas autorit?", "o_sq": ["Grurë i pastër me grurë të përzier me dhe, në sasi të barabartë", "Një sa' elb me dy sa' hurma, dorë me dorë", "Një sa' grurë i mirë me një sa' grurë të dobët, në sasi të barabartë, dorë me dorë", "Një sa' hurma me dy sa' kripë, dorë me dorë"], "pse_ar": "لقول المؤلف: «ولا خالصةٍ بمشوبة».", "pse_sq": "E sakta: gruri i pastër me grurin e përzier me dhe. Autori thotë: «as e të pastrës me të përzierën», sepse pjesa e përzier (dheu) e prish barazinë, edhe nëse sasitë duken të barabarta. Hurma me kripë dhe elb me hurma janë lloje të ndryshme, prandaj lejohet shtesa dorë me dorë; ndërsa grurë me grurë në sasi të barabartë, dorë me dorë, lejohet edhe nëse cilësia ndryshon. Shembull: grurë i pastër me grurë të përzier me kashtë.", "f": "٥٤"}, {"id": "A034", "k": 3, "lloji": "tf", "q": "لا يجوز بيعُ اللحم النيء باللحم المطبوخ من جنسه، ولو تساويا وزناً.", "a": 0, "q_sq": "Nuk lejohet shitja e mishit të gjallë (të papjekur) me mish të gatuar nga lloji i vet, edhe nëse janë të barabartë në peshë.", "pse_ar": "لقول المؤلف: «ولا نيئه بمطبوخه».", "pse_sq": "Pohimi është i saktë. Autori thotë: «as e të gjallës (të papjekurës) me të gatuarën». Zjarri e ndryshon peshën e mallit, kështu që barazia e vërtetë ndërmjet të gjallës dhe të gatuarës nuk mund të dihet, edhe nëse në çast peshojnë njësoj. Shembull: mish i gjallë me mish të pjekur, ose grurë me bukë.", "f": "٥٤"}, {"id": "A035", "k": 3, "lloji": "mcq", "q": "ما المُزابنة التي نهى عنها رسول الله ﷺ كما فسّرها المؤلف؟", "o": ["بيع الرطب بالتمر فيما دون خمسة أوسق", "بيع الثمرة قبل بدوّ صلاحها", "شراء التمر بالتمر في رؤوس النخل", "شراء الطعام وبيعه قبل استيفائه"], "a": 2, "q_sq": "Çfarë është muzabeneja që e ndaloi i Dërguari i Allahut ﷺ, siç e shpjegoi autori?", "o_sq": ["Shitja e hurmave të freskëta me hurma të thata në më pak se pesë vesk", "Shitja e frytit para se të duket pjekja e tij", "Blerja e hurmave me hurma, ndërsa (të parat) janë ende në majat e palmave", "Blerja e ushqimit dhe shitja e tij para se të merret plotësisht në dorë"], "pse_ar": "لقول المؤلف: «وقد نهى رسول الله ﷺ عن المزابنة، وهو شراء التمر بالتمر في رؤوس النخل».", "pse_sq": "E sakta: blerja e hurmave me hurma ndërsa janë ende në majat e palmave. Autori thotë: «I Dërguari i Allahut ﷺ e ndaloi muzabenen, që është blerja e hurmave (në degë) me hurma (të thata), ndërsa janë ende në majat e hurmave». Ndalohet sepse janë i njëjti lloj dhe barazia nuk dihet saktë. Shitja e frytit para pjekjes është ndalim tjetër (pjesa e frutave); shitja në më pak se pesë vesk është lehtësimi i arajave; shitja e ushqimit para marrjes është ndalim tjetër.", "f": "٥٤"}, {"id": "A036", "k": 3, "lloji": "mcq", "q": "أيُّ ما يلي من شروط العرايا كما في الكتاب؟", "o": ["أن تكون خمسة أوسق فما دونها", "أن تكون فيما دون خمسة أوسق", "أن تُباع كيلاً لا خرصاً", "أن يأكلها أهلها تمراً يابساً"], "a": 1, "q_sq": "Cili nga këto është nga kushtet e arajave, siç janë në libër?", "o_sq": ["Të jenë pesë vesk ose më pak", "Të jenë në më pak se pesë vesk", "Të shiten me matje vëllimi, jo me vlerësim me sy (hars)", "T'i hanë pronarët e tyre si hurma të thata"], "pse_ar": "لقول المؤلف: «ورخص في بيع العرايا – فيما دون خمسة أوسق – أن تباع بخرصها يأكلها أهلها رُطباً».", "pse_sq": "E sakta: të jenë në më pak se pesë vesk. Autori thotë: «dhe lejoi shitjen e arajave – në më pak se pesë vesk –, që të shiten sipas vlerësimit me sy (hars), e t'i hanë pronarët e tyre si hurma të freskëta». Pra kushtet janë: (1) më pak se pesë vesk – jo pesë vesk vetë; (2) shitja me hars (vlerësim me sy), jo me matje; (3) të hahen të freskëta (rutab), jo të thata. 1 vesk = 60 sa'. Arajat janë lehtësim nga ndalimi i muzabenes.", "f": "٥٤"}, {"id": "A037", "k": 4, "lloji": "mcq", "q": "باع رجلٌ نخلاً بعد أن أُبِّر، ولم يشترط المشتري ثمرته. فلمن تكون الثمرة؟", "o": ["للمشتري إن لم تنضج بعد", "بينهما نصفين", "للمشتري", "للبائع، والنخلُ للمشتري"], "a": 3, "q_sq": "Një njeri shiti palma hurmash pasi ishin pllenuar, dhe blerësi nuk e kushtëzoi frytin e tyre. Kujt i takon fryti?", "o_sq": ["Blerësit, nëse ende nuk është pjekur", "Të dyve, gjysmë për gjysmë", "Blerësit", "Shitësit, ndërsa palmat blerësit"], "pse_ar": "لقوله ﷺ: «مَن باعَ نخلاً بعد أن تُؤبَّر فثمرتُها للبائعِ إلا أن يشترطَها المبتاعُ».", "pse_sq": "E sakta: shitësit. Autori sjell hadithin: «Kush shet hurma pasi janë pllenuar, fryti i tyre i takon shitësit, përveç nëse blerësi e kushtëzon (për vete).» Këtu blerësi nuk e kushtëzoi, prandaj fryti mbetet i shitësit, kurse palmat i kalojnë blerësit. Pjekja ose jo e frytit nuk ndikon në këtë rregull. Te'bir (pllenimi) = vendosja e polenit të palmës mashkull te palma femër.", "f": "٥٥"}, {"id": "A038", "k": 4, "lloji": "tf", "q": "إذا باع شجراً ثمرُه بادٍ فالثمرُ للبائع، إلا أن يشترطه المشتري.", "a": 0, "q_sq": "Nëse shet pemë, fryti i të cilave është i dukshëm, fryti i takon shitësit, përveç nëse e kushtëzon blerësi.", "pse_ar": "لقول المؤلف بعد حديث التأبير: «وكذلك بيع الشجر إذا كان ثمره بادياً».", "pse_sq": "Pohimi është i saktë. Pas hadithit të pllenimit të palmave, autori thotë: «Po ashtu edhe shitja e pemëve kur fryti i tyre është i dukshëm», pra marrin të njëjtën dispozitë: fryti i takon shitësit, përveç nëse blerësi e kushtëzon për vete. Shembull: shet një pemishte mollësh kur mollët kanë dalë në degë – mollët e këtij sezoni mbeten të shitësit.", "f": "٥٥"}, {"id": "A039", "k": 4, "lloji": "mcq", "q": "باع رجلٌ أرضاً فيها قمحٌ لا يُحصد إلا مرة، ولم يشترطه المشتري. فلمن يكون القمح؟", "o": ["للمشتري إن لم يُسنبل بعد", "بينهما نصفين", "للبائع، والأرضُ للمشتري", "للمشتري تبعاً للأرض"], "a": 2, "q_sq": "Një njeri shiti një tokë në të cilën kishte grurë që korret vetëm një herë, dhe blerësi nuk e kushtëzoi. Kujt i takon gruri?", "o_sq": ["Blerësit, nëse ende nuk ka lidhur kallinj", "Të dyve, gjysmë për gjysmë", "Shitësit, ndërsa toka blerësit", "Blerësit, si pjesë e tokës"], "pse_ar": "لقول المؤلف: «فإن باع الأرض وفيها زرع لا يُحصد إلا مرة فهو للبائع ما لم يشترطه المبتاع».", "pse_sq": "E sakta: shitësit. Autori thotë: «Nëse e shet tokën dhe në të ka të mbjella që korren vetëm një herë, ato i takojnë shitësit, përderisa blerësi nuk i kushtëzon». Toka i kalon blerësit, por kjo korrje mbetet e shitësit. Nëse blerësi do ta kishte kushtëzuar, gruri do të ishte i tij. Shembull: arë me grurë ose me misër.", "f": "٥٥"}, {"id": "A040", "k": 4, "lloji": "mcq", "q": "باع رجلٌ أرضاً فيها بِرسيمٌ يُجَزُّ مرةً بعد مرة. فما الحكم في أصوله وفي الجزّة الظاهرة عند البيع؟", "o": ["الأصول للبائع، والجزّة الظاهرة للمشتري", "الأصول والجزّة الظاهرة كلاهما للمشتري", "الأصول للمشتري، والجزّة الظاهرة للبائع", "الأصول والجزّة الظاهرة كلاهما للبائع"], "a": 2, "q_sq": "Një njeri shiti një tokë me tërfil që pritet herë pas here. Cila është dispozita për rrënjët e tij dhe për prerjen e dukshme në kohën e shitjes?", "o_sq": ["Rrënjët i takojnë shitësit, kurse prerja e dukshme blerësit", "Rrënjët dhe prerja e dukshme i takojnë të dyja blerësit", "Rrënjët i takojnë blerësit, kurse prerja e dukshme shitësit", "Rrënjët dhe prerja e dukshme i takojnë të dyja shitësit"], "pse_ar": "لقول المؤلف: «وإن كان يُجزُّ مرة بعد مرة أخرى فالأصول للمشتري والجزَّة الظاهرة عند البيع للبائع».", "pse_sq": "E sakta: rrënjët blerësit, prerja e dukshme shitësit. Autori thotë: «e nëse priten herë pas here, rrënjët i takojnë blerësit, ndërsa prerja e dukshme në kohën e shitjes i takon shitësit». Ndryshe nga gruri që korret një herë (i gjithi i shitësit), këtu rrënjët mbeten në tokë e prodhojnë vazhdimisht, prandaj i kalojnë blerësit bashkë me tokën; vetëm ajo që është rritur e duket në kohën e shitjes i takon shitësit. Shembull: tërfili, jonxha.", "f": "٥٥"}, {"id": "A041", "k": 5, "lloji": "mcq", "q": "باع رجلٌ عنبَ كرمه في الربيع والحبُّ أخضرُ صلبٌ لم يتموّه بعد. فما حكم هذا البيع؟", "o": ["جائز، لأن النهي خاصٌّ بثمر النخل", "جائز إن شرط تركه إلى الجذاذ", "منهيٌّ عنه، لأنه قبل بدوّ صلاحه", "جائز إن كان دون خمسة أوسق"], "a": 2, "q_sq": "Një njeri shiti rrushin e vreshtit të tij në pranverë, kur kokrrat ishin ende të gjelbra e të forta dhe s'ishin mbushur me lëng. Cila është dispozita e kësaj shitjeje?", "o_sq": ["E lejuar, sepse ndalimi vlen vetëm për frytin e palmës", "E lejuar, nëse kushtëzon që të lihet deri në vjelje", "E ndaluar, sepse është para se të duket pjekja e tij", "E lejuar, nëse është më pak se pesë vesk"], "pse_ar": "لأن رسول الله ﷺ «نهى عن بيع الثمرة حتى يبدوَ صلاحها»، وصلاح العنب «أن يتموَّه».", "pse_sq": "E sakta: e ndaluar. Autori thotë: «I Dërguari i Allahut ﷺ e ndaloi shitjen e frutit derisa të duket pjekja e tij», dhe sqaron se pjekja e rrushit është «të mbushet me lëng» (temevvuh). Këtu rrushi ende s'është mbushur me lëng, pra pjekja s'është dukur. Ndalimi vlen për çdo fryt, jo vetëm për hurmat (autori i përmend shenjat e pjekjes edhe për rrushin e frutat e tjera). Kushti i lënies deri në vjelje lejohet vetëm pas dukjes së pjekjes, ndërsa pesë veskët lidhen me arajat.", "f": "٥٥"}, {"id": "A042", "k": 5, "lloji": "tf", "q": "إذا باع الثمرة بعد بدوّ صلاحها على الترك إلى الجِذاذ جاز البيع.", "a": 0, "q_sq": "Nëse e shet frytin pasi është dukur pjekja e tij, me kusht që të lihet (në pemë) deri në vjelje (xhidhadh), shitja lejohet.", "pse_ar": "لقول المؤلف: «ولو باع الثمرة بعد بدو صلاحها على الترك إلى الجذاذ جاز».", "pse_sq": "Pohimi është i saktë. Autori thotë: «Nëse e shet frutin pasi është dukur pjekja e tij, me kusht që të lihet (në pemë) deri në vjelje (xhidhadh), lejohet». Ndalimi i hadithit ishte deri në dukjen e pjekjes; pasi ajo duket, shitja lejohet edhe me kushtin që fryti të qëndrojë në pemë deri në vjelje. Shembull: blen rrushin e një vreshti pasi ka filluar të piqet dhe merr vesh që ta lërë në hardhi derisa ta vjelësh.", "f": "٥٥"}, {"id": "A043", "k": 5, "lloji": "mcq", "q": "اشترى رجلٌ ثمرةً بعد بدوّ صلاحها على أن تُترك إلى الجذاذ، فأصابها بَرَدٌ فأتلفها. فعلى مَن تكون الخسارة؟", "o": ["يرجع بها المشتري على البائع", "هي على المشتري لأنه رضي بتركها", "هي على المشتري لأنه ملكها بالعقد", "يتقاسمانها بينهما نصفين"], "a": 0, "q_sq": "Një njeri bleu frytin pasi ishte dukur pjekja e tij, me kusht që të lihej deri në vjelje, dhe e goditi breshri e e shkatërroi. Mbi kë bie humbja?", "o_sq": ["Blerësi ia kërkon (dëmin) shitësit", "Mbi blerësin, sepse ai pranoi që fryti të lihej (në pemë)", "Mbi blerësin, sepse e bëri pronë të tij me kontratë", "E ndajnë ndërmjet tyre, gjysmë për gjysmë"], "pse_ar": "لقول المؤلف: «فإن أصابتها جائحة رجع بها على البائع»، لقوله ﷺ: «لو بعتَ مِن أخيكَ تمراً فأصابتْه جائحةٌ فلا يحل لكَ أن تأخذَ منه شيئاً».", "pse_sq": "E sakta: blerësi ia kërkon shitësit. Autori thotë: «e nëse e godet ndonjë fatkeqësi natyrore (xha'iha), (blerësi) ia kërkon dëmin shitësit», dhe argumenton me hadithin: «Nëse i shet vëllait tënd hurma dhe i godet një fatkeqësi, nuk të lejohet të marrësh prej tij asgjë. Me çfarë do ta merrje pasurinë e vëllait tënd pa të drejtë?» Pra as pronësia me kontratë, as pranimi i lënies në pemë nuk e hedhin dëmin mbi blerësin, dhe dëmi nuk ndahet përgjysmë. Xha'iha: breshri, ngrica, thatësira etj.", "f": "٥٥"}, {"id": "A044", "k": 5, "lloji": "mcq", "q": "أيُّ ما يلي وصفٌ صحيحٌ لبُدوّ الصلاح كما ذكره المؤلف؟", "o": ["العنب: أن يتموّه", "العنب: أن يحمرّ أو يصفرّ", "سائر الثمر: أن يحمرّ أو يصفرّ", "ثمر النخل: أن يتموّه"], "a": 0, "q_sq": "Cili nga këto është përshkrim i saktë i dukjes së pjekjes, siç e përmend autori?", "o_sq": ["Rrushi: të mbushet me lëng (temevvuh)", "Rrushi: të skuqet ose të zverdhet", "Frutat e tjera: të skuqen ose të zverdhen", "Fryti i palmës: të mbushet me lëng"], "pse_ar": "لقول المؤلف: «وصلاح ثمر النخل أن يحمرَّ أو يصفرَّ، والعنبِ أن يتمَوه، وسائر الثمر أن يبدوَ فيه النضج ويَطيب أكلُه».", "pse_sq": "E sakta: rrushi – të mbushet me lëng. Autori thotë: «Pjekja e frytit të hurmës është të skuqet ose të zverdhet; e rrushit, të mbushet me lëng (temevvuh – të zbutet e të ëmbëlsohet); e frutave të tjera, të duket pjekja në to dhe të bëhen të shijshme për t'u ngrënë». Opsionet e tjera i ngatërrojnë shenjat: skuqja ose zverdhja është shenja e hurmës, jo e rrushit as e frutave të tjera; mbushja me lëng është shenja e rrushit, jo e hurmës.", "f": "٥٥"}, {"id": "A045", "k": 5, "lloji": "tf", "q": "صلاحُ سائر الثمر – غيرِ ثمر النخل والعنب – أن يبدوَ فيه النضج ويطيبَ أكلُه.", "a": 0, "q_sq": "Pjekja e frutave të tjera – përveç frytit të palmës dhe rrushit – është të duket pjekja në to dhe të bëhen të shijshme për t'u ngrënë.", "pse_ar": "لقول المؤلف: «وسائر الثمر أن يبدوَ فيه النضج ويَطيب أكلُه».", "pse_sq": "Pohimi është i saktë. Pasi përmend shenjën e hurmës (skuqja ose zverdhja) dhe të rrushit (mbushja me lëng), autori thotë: «e frutave të tjera, të duket pjekja në to dhe të bëhen të shijshme për t'u ngrënë». Shembull: mollët, kur fillojnë të piqen e të hahen.", "f": "٥٥"}, {"id": "A046", "k": 6, "lloji": "mcq", "q": "تبايع رجلان في دكّان، ثم أراد المشتري فسخَ البيع قبل أن يتفرّقا بأبدانهما. فما الحكم؟", "o": ["له ذلك، لأنهما بالخيار ما لم يتفرّقا", "ليس له ذلك، لأن البيع لزم بالعقد", "ليس له ذلك إلا برضا البائع", "له ذلك إلى ثلاثة أيام ولو تفرّقا"], "a": 0, "q_sq": "Dy njerëz lidhën një shitje në një dyqan, pastaj blerësi deshi ta prishë shitjen para se të ndaheshin trupërisht. Cila është dispozita?", "o_sq": ["Ka të drejtë, sepse kanë hijar derisa të ndahen", "Nuk ka të drejtë, sepse shitja u bë e detyrueshme me kontratë", "Nuk ka të drejtë, përveç me pëlqimin e shitësit", "Ka të drejtë deri në tri ditë, edhe nëse ndahen"], "pse_ar": "لقول المؤلف: «البيِّعان بالخيار ما لم يتفرقا بأبدانهما».", "pse_sq": "E sakta: ka të drejtë. Autori thotë: «Shitësi dhe blerësi kanë të drejtë zgjedhjeje (ta prishin shitjen) për sa kohë që nuk ndahen trupërisht». Ky është hijari i mexhlisit: shitja nuk bëhet e detyrueshme me vetë kontratën, por me ndarjen trupore; dhe e drejta i takon secilit, pa pasur nevojë për pëlqimin e tjetrit. Afati i tri ditëve nuk përmendet në libër. Shembull: blen një telefon dhe, ende në dyqan, thua «E anuloj».", "f": "٥٥"}, {"id": "A047", "k": 6, "lloji": "tf", "q": "إذا تفرّق المتبايعان بأبدانهما ولم يترك أحدُهما البيعَ فقد وجب البيع.", "a": 0, "q_sq": "Nëse shitësi dhe blerësi ndahen trupërisht dhe asnjëri nuk e ka lënë (anuluar) shitjen, shitja është bërë e detyrueshme.", "pse_ar": "لقول المؤلف: «فإن تفرقا ولم يترك أحدهما البيع فقد وجب البيع».", "pse_sq": "Pohimi është i saktë. Autori thotë: «e nëse ndahen dhe asnjëri nuk e ka anuluar shitjen, shitja është bërë e detyrueshme». Me ndarjen trupore mbaron hijari i mexhlisit, dhe asnjëri nuk mund ta anulojë më shitjen me këtë hijar (përveç nëse kanë kushtëzuar hijar me afat, ose del ndonjë arsye tjetër si e meta).", "f": "٥٥"}, {"id": "A048", "k": 6, "lloji": "mcq", "q": "اشترى رجلٌ سيارةً واشترط لنفسه الخيارَ شهرين. فما حكم هذا الشرط؟", "o": ["يبطل البيع، لجهالة مدة الخيار", "يصحّ، ويكونان على شرطهما وإن طالت المدة", "لا يصحّ، لأن مدته لا تزيد على ثلاثة أيام", "لا يصحّ، لأنه لم يُشترط للبائع أيضاً"], "a": 1, "q_sq": "Një njeri bleu një makinë dhe kushtëzoi për vete hijarin (të drejtën e zgjedhjes) për dy muaj. Cila është dispozita e këtij kushti?", "o_sq": ["Shitja prishet, sepse afati i hijarit është i panjohur", "Është i vlefshëm, dhe ata janë sipas kushtit të tyre edhe nëse afati është i gjatë", "Nuk është i vlefshëm, sepse afati i tij nuk e kalon tri ditë", "Nuk është i vlefshëm, sepse nuk u kushtëzua edhe për shitësin"], "pse_ar": "لقول المؤلف: «إلا أن يشترطا الخيار لهما أو لأحدهما مدة معلومة فيكونان على شرطهما، وإن طالت المدة».", "pse_sq": "E sakta: kushti është i vlefshëm. Autori thotë: «përveç nëse kushtëzojnë të drejtën e zgjedhjes për të dy ose për njërin prej tyre për një afat të caktuar: atëherë ata janë sipas kushtit të tyre, edhe nëse afati është i gjatë». Pra lejohet për njërën palë, afati s'kufizohet në tri ditë, dhe dy muaj është afat i caktuar (jo i panjohur). Shembull: «E blej, por me kusht që brenda dy muajve mund ta kthej».", "f": "٥٥"}, {"id": "A049", "k": 6, "lloji": "mcq", "q": "أيُّ ما يلي صحيحٌ في خيار الشرط عند المؤلف؟", "o": ["لا تزيد مدته على ثلاثة أيام بلياليها", "لا يكون إلا للمتبايعين معاً", "يسقط إذا قطعاه قبل انقضاء المدة", "يصحّ ولو لم تكن مدته معلومة"], "a": 2, "q_sq": "Cila nga këto është e saktë për hijarin e kushtit sipas autorit?", "o_sq": ["Afati i tij nuk e kalon tri ditë me netët e tyre", "Nuk mund të jetë veçse për të dyja palët bashkë", "Bie nëse e ndërpresin para mbarimit të afatit", "Është i vlefshëm edhe nëse afati i tij nuk është i caktuar"], "pse_ar": "لقول المؤلف: «فيكونان على شرطهما، وإن طالت المدة إلا أن يقطعاه».", "pse_sq": "E sakta: bie nëse e ndërpresin. Autori thotë: «atëherë ata janë sipas kushtit të tyre, edhe nëse afati është i gjatë, përveç nëse e ndërpresin». Opsionet e tjera e kundërshtojnë tekstin: afati lejohet «edhe nëse afati është i gjatë», hijari mund të kushtëzohet «për të dy ose për njërin prej tyre», dhe afati duhet të jetë «i caktuar». Shembull: kushtëzuan 7 ditë hijar, e në ditën e tretë thanë: «E heqim kushtin» – shitja bëhet e prerë.", "f": "٥٥"}, {"id": "A050", "k": 6, "lloji": "mcq", "q": "اشترى رجلٌ سيارةً، ثم وجد فيها عيباً لم يكن يعلمه. فما الذي له؟", "o": ["يُخيَّر بين ردّها وأخذ أرش العيب", "له ردّها فقط، وليس له أخذ الأرش", "ليس له شيءٌ، لأن البيع لزم بالتفرّق", "له أخذ الأرش فقط، وليس له ردّها"], "a": 0, "q_sq": "Një njeri bleu një makinë, pastaj gjeti në të një të metë për të cilën nuk dinte. Çfarë të drejte ka?", "o_sq": ["Zgjedh ndërmjet kthimit të saj dhe marrjes së ershit (dëmshpërblimit) të së metës", "Ka të drejtë vetëm ta kthejë, jo të marrë ershin", "Nuk ka asgjë, sepse shitja u bë e detyrueshme me ndarjen", "Ka të drejtë vetëm të marrë ershin, jo ta kthejë"], "pse_ar": "لقول المؤلف: «وإن وجد أحدُهما بما اشتراه عيبًا لم يكن علِمه فله رده أو أخذ أرْشِ العيب».", "pse_sq": "E sakta: zgjedh ndërmjet kthimit dhe ershit. Autori thotë: «Nëse njëri prej tyre gjen në atë që ka blerë një të metë për të cilën nuk dinte, ka të drejtë ta kthejë ose të marrë dëmshpërblimin e të metës (ersh)». Ndarja trupore e mbyll vetëm hijarin e mexhlisit, jo hijarin e të metës. Ershi = diferenca e vlerës që i bie mallit për shkak të së metës. Shembull: makina pa të metë vlen 5.000 €, me të metë 4.000 € (20% më pak) – merr 20% të çmimit që ka paguar.", "f": "٥٥"}, {"id": "A051", "k": 6, "lloji": "mcq", "q": "اشترى رجلٌ داراً فأجّرها وقبض أجرتها قبل أن يعلم بعيبٍ قديمٍ فيها، ثم علم به فردّها. فلمن تكون الأجرة؟", "o": ["للبائع، لأنها نماء ملكه", "للبائع، لأن البيع قد فُسخ بالردّ", "تُقسم بين البائع والمشتري", "للمشتري، لأن الخراج بالضمان"], "a": 3, "q_sq": "Një njeri bleu një shtëpi, e dha me qira dhe e mori qiranë para se të mësonte për një të metë të vjetër në të; pastaj e mësoi dhe e ktheu. Kujt i takon qiraja?", "o_sq": ["Shitësit, sepse është shtim i pronës së tij", "Shitësit, sepse shitja u prish me kthimin", "Ndahet ndërmjet shitësit dhe blerësit", "Blerësit, sepse të ardhurat i takojnë atij që mban përgjegjësinë"], "pse_ar": "لقول المؤلف: «وما كسبه المبيع أو حدث فيه من نماء منفصل قبل علمه بالعيب فهو له، لأن الخراج بالضمان».", "pse_sq": "E sakta: blerësit. Autori thotë: «ndërsa ajo që ka fituar malli i shitur ose shtimi i ndarë që ka ndodhur në të para se ta mësojë të metën, i takon atij (blerësit), sepse të ardhurat i takojnë atij që mban përgjegjësinë (për dëmin)». Qiraja është fitim i mallit para se të mësohej e meta. Gjatë asaj kohe, po të shkatërrohej shtëpia, dëmi do të ishte i blerësit; prandaj edhe fitimi është i tij, edhe pse e kthen shtëpinë. Shembull tjetër: qumështi i lopës së blerë.", "f": "٥٥"}, {"id": "A052", "k": 6, "lloji": "mcq", "q": "اشترى رجلٌ عبداً فأعتقه، ثم علم بعيبٍ قديمٍ فيه. فما الذي له؟", "o": ["يردّ قيمةَ العبد ويستردّ الثمن", "له أرشُ العيب، لتعذّر الردّ", "لا شيء له، لأنه أعتقه باختياره", "يبطل العتقُ ويردّ العبد"], "a": 1, "q_sq": "Një njeri bleu një rob dhe e liroi, pastaj mësoi për një të metë të vjetër në të. Çfarë të drejte ka?", "o_sq": ["E kthen vlerën e robit dhe e merr mbrapsht çmimin", "Ka të drejtë për ershin e së metës, sepse kthimi është i pamundur", "Nuk ka asgjë, sepse e liroi me vullnetin e vet", "Lirimi anulohet dhe e kthen robin"], "pse_ar": "لقول المؤلف: «وإن تلفت السلعة أو عتق العبد أو تعذر ردُّه فله أرشُ العيب».", "pse_sq": "E sakta: ka të drejtë për ershin. Autori thotë: «Nëse malli shkatërrohet, ose robi lirohet, ose kthimi i tij bëhet i pamundur, ai ka të drejtë për dëmshpërblimin e të metës». Pasi robi u lirua, kthimi u bë i pamundur, por e drejta e blerësit nuk humbet: i mbetet ershi. Kjo vlen edhe kur malli shkatërrohet. Shembull i sotëm: ushqimi u konsumua, e pastaj mësove se kishte të metë – nuk e kthen dot, por merr ershin.", "f": "٥٥"}, {"id": "A053", "k": 6, "lloji": "mcq", "q": "اشترى رجلٌ شاةً مُصرّاة، فلما حلبها تبيّن له ذلك ولم يرضَها. فما الحكم؟", "o": ["يردّها ومعها صاعٌ من تمر", "يردّها ومعها قيمةُ اللبن الذي حلبه", "يردّها ولا شيء معها", "يردّها ومعها صاعان من تمر"], "a": 0, "q_sq": "Një njeri bleu një dele musarrat (me qumësht të mbajtur në gji); kur e mjeli, e kuptoi këtë dhe nuk ishte i kënaqur me të. Cila është dispozita?", "o_sq": ["E kthen bashkë me një sa' hurma", "E kthen bashkë me vlerën e qumështit që ka mjelë", "E kthen pa asgjë tjetër", "E kthen bashkë me dy sa' hurma"], "pse_ar": "لقوله ﷺ: «فهو بخيرِ النظَرَينِ بعد أن يحلبَها، إن رضيَها أمسكَها وإن سخطَها ردَّها وصواعًا من تمر».", "pse_sq": "E sakta: e kthen bashkë me një sa' hurma. Autori sjell hadithin: «Mos ua mbani qumështin në gji deveve dhe deleve (që të duken më qumështore); kush i blen ato pas kësaj, ka të drejtë të zgjedhë më të mirën nga dy mundësitë pasi t'i mjelë: nëse është i kënaqur, i mban; e nëse nuk është i kënaqur, i kthen bashkë me një sa' hurma.» Kthimi pa asgjë është rasti kur e kupton para se ta mjelë. Hadithi e cakton një sa' hurma, jo dy, as vlerën e qumështit. Sa' = masë vëllimi (rreth 2–3 kg hurma).", "f": "٥٥"}, {"id": "A054", "k": 6, "lloji": "tf", "q": "إذا علم المشتري بتصرية الشاة قبل أن يحلبها ردّها ومعها صاعٌ من تمر.", "a": 1, "q_sq": "Nëse blerësi e kupton se deles i është mbajtur qumështi në gji para se ta mjelë, e kthen atë bashkë me një sa' hurma.", "pse_ar": "لقول المؤلف: «فإن علم بتصريتها قبل حلبها ردها ولا شيء معها».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «Nëse e kupton se i është mbajtur qumështi para se ta mjelë, e kthen atë pa asgjë tjetër». Sa'-ja e hurmave jepet vetëm kur e kthen pasi e ka mjelë, sepse ka marrë qumështin; para mjeljes s'ka marrë asgjë, prandaj s'jep asgjë.", "f": "٥٥"}, {"id": "A055", "k": 6, "lloji": "mcq", "q": "أيُّ ما يلي مثالٌ للتدليس الذي ذكره المؤلف؟", "o": ["ثمنٌ أخبر به البائعُ فظهر أنه زاد عليه", "عبدٌ وصفه البائع بأنه كاتب فلم يجده كذلك", "سلعةٌ ظهر أن ثمنها كان مؤجَّلاً ولم يُخبر به", "رحىً ضُمّ ماؤها وأُرسل عند عرضها للبيع"], "a": 3, "q_sq": "Cila nga këto është shembull i tedlisit (mashtrimit me fshehje) që përmend autori?", "o_sq": ["Një çmim (blerjeje) që shitësi e tregoi, e doli se ia kishte shtuar", "Një rob që shitësi e përshkroi se di të shkruajë, e blerësi nuk e gjeti të tillë", "Një mall që doli se çmimi i tij (i blerjes) kishte qenë me afat, e nuk u tregua", "Një mulli uji, ujin e të cilit e grumbulluan dhe e lëshuan kur e nxorën për shitje"], "pse_ar": "لقول المؤلف: «وكذلك كلُّ مدلَّس لا يعلم تدليسه فله رده، كجارية حمَّر وجهها أو سوَّد شعرها أو جعَّده، أو رحىً ضمَّ الماءَ وأرسله عليها عند عرضها على المشتري».", "pse_sq": "E sakta: mulliri. Autori thotë: «po kështu çdo mall i mashtruar (mudel-les), mashtrimin (tedlis) e të cilit (blerësi) nuk e di, ai ka të drejtë ta kthejë: si një robëreshë së cilës (shitësi) ia ka skuqur fytyrën, ia ka nxirë flokët ose ia ka bërë kaçurrela; ose një mulli (uji) për të cilin e ka grumbulluar ujin dhe e ka lëshuar mbi të kur ia ka treguar blerësit». Robi i përshkruar si shkrimtar është shembull i mungesës së cilësisë së përmendur; çmimi i shtuar dhe afati i fshehur janë raste të tregimit të çmimit. Tedlisi = shitësi e fsheh të metën ose e zbukuron mallin që të duket më i mirë. Shembull i sotëm: kthimi prapa i kilometrave të makinës.", "f": "٥٦"}, {"id": "A056", "k": 6, "lloji": "mcq", "q": "باع رجلٌ طائراً وأخبر أنه مُصوِّت، فلم يجده المشتري كذلك. فما الحكم؟", "o": ["لا ردّ له، وإنما له أرشُ الصفة", "لا ردّ له، لأنه ليس عيباً في خِلقته", "لا ردّ له إذا كانا قد تفرّقا", "للمشتري الردّ، لفوات الصفة المذكورة"], "a": 3, "q_sq": "Një njeri shiti një zog dhe tha se ai këndon, e blerësi nuk e gjeti të tillë. Cila është dispozita?", "o_sq": ["Nuk ka të drejtë ta kthejë, por ka vetëm ershin e cilësisë", "Nuk ka të drejtë ta kthejë, sepse kjo s'është e metë në krijimin e tij", "Nuk ka të drejtë ta kthejë nëse janë ndarë", "Blerësi ka të drejtë ta kthejë, sepse mungon cilësia e përmendur"], "pse_ar": "لقول المؤلف: «وكذلك لو وصف المبيعَ بصفة يزيد بها ثمنُه فلم يجدها فيه... أو أن الطائر مصوِّت ونحوه».", "pse_sq": "E sakta: blerësi ka të drejtë ta kthejë. Autori thotë: «po ashtu nëse e përshkruan mallin me një cilësi me të cilën i rritet çmimi, e (blerësi) nuk e gjen atë në të», dhe ndër shembujt përmend «se zogu këndon». «Po ashtu» do të thotë: ka të drejtë ta kthejë, si te tedlisi. Nuk ka rëndësi që kjo s'është e metë në krijim, sepse u përmend një cilësi që e rrit çmimin; dhe ndarja nga vendi i shitjes nuk e heq këtë të drejtë. Shembuj të tjerë në libër: zanati ose shkrimi te robi, kafsha që ecën shpejt e butë (himlaxhe), leopardi gjuetar. Shembull i sotëm: «Ky kompjuter ka 16 GB memorie», e del se ka 8.", "f": "٥٦"}, {"id": "A057", "k": 6, "lloji": "mcq", "q": "قال البائع: اشتريتُ هذه السلعة بمئة، وأبيعكها مرابحةً بربح العُشر (بمئةٍ وعشرة)، ثم ظهر أنه اشتراها بتسعين. فبِمَ يرجع المشتري؟", "o": ["بالعشرة الزائدة وحصّتها من الربح", "بالربح كلِّه دون العشرة الزائدة", "لا يرجع بشيء، وإنما يُخيَّر بين الردّ والإمساك", "بالعشرة الزائدة فقط دون شيءٍ من الربح"], "a": 0, "q_sq": "Shitësi tha: «Këtë mall e bleva njëqind, dhe ta shes me murabaha me një të dhjetën fitim (njëqind e dhjetë)»; pastaj doli se e kishte blerë nëntëdhjetë. Çfarë i kërkon blerësi?", "o_sq": ["Dhjetëshen e shtuar dhe pjesën e saj nga fitimi", "Gjithë fitimin, pa dhjetëshen e shtuar", "Nuk kërkon asgjë, por zgjedh ndërmjet kthimit dhe mbajtjes", "Vetëm dhjetëshen e shtuar, pa asgjë nga fitimi"], "pse_ar": "لقول المؤلف: «ولو أخبره بثمن المبيع فزاد عليه رجع عليه بالزيادة وحطِّها من الربح إن كان مرابحة».", "pse_sq": "E sakta: dhjetëshen e shtuar dhe pjesën e saj nga fitimi. Autori thotë: «Nëse ia tregon (blerësit) çmimin (e blerjes) së mallit dhe i shton mbi të (gënjeshtër), ky ia kërkon shtesën dhe pjesën përkatëse të fitimit, nëse shitja ka qenë murabaha». Llogaria: çmimi i vërtetë 90, fitimi 10% = 9, gjithsej 99; blerësi pagoi 110, pra kërkon 11: 10 shtesën dhe 1 fitimin mbi të. Zgjedhja ndërmjet kthimit dhe mbajtjes është dispozita kur fshihet afati i pagesës, jo kur shtohet çmimi.", "f": "٥٦"}, {"id": "A058", "k": 6, "lloji": "tf", "q": "إذا أخبر البائعُ بثمن المبيع ثم بان أنه غلط على نفسه، خُيِّر المشتري بين ردّ المبيع وإعطائه ما غلط به.", "a": 0, "q_sq": "Nëse shitësi e tregon çmimin (e blerjes) së mallit dhe pastaj del se ka gabuar në dëm të vetes, blerësi ka zgjedhje ndërmjet kthimit të mallit dhe dhënies (shitësit) të asaj në të cilën ka gabuar.", "pse_ar": "لقول المؤلف: «وإن بان أنه غلط على نفسه خيِّر المشتري بين رده وإعطائه ما غلط به».", "pse_sq": "Pohimi është i saktë. Autori thotë: «e nëse del se ka gabuar në dëm të vetes, blerësi ka zgjedhje ndërmjet kthimit të mallit dhe dhënies (shitësit) të asaj në të cilën ka gabuar». Shembull: shitësi tha «e bleva 100», por në fakt e kishte blerë 120; blerësi ose e kthen mallin, ose i jep shitësit 20 në të cilat gaboi.", "f": "٥٦"}, {"id": "A059", "k": 6, "lloji": "mcq", "q": "باع رجلٌ سلعةً وأخبر المشتري بثمنها الذي اشتراها به، ثم ظهر أنه كان قد اشتراها بثمنٍ مؤجَّل ولم يُخبره بتأجيله. فما الحكم؟", "o": ["يلزم البيعُ ولا خيار للمشتري", "يرجع المشتري بالفرق وبحصّته من الربح", "يبطل البيع من أصله", "للمشتري الخيار بين الردّ والإمساك"], "a": 3, "q_sq": "Një njeri shiti një mall dhe i tregoi blerësit çmimin me të cilin e kishte blerë; pastaj doli se e kishte blerë me çmim me afat pagese dhe nuk ia kishte treguar afatin. Cila është dispozita?", "o_sq": ["Shitja është e detyrueshme dhe blerësi s'ka zgjedhje", "Blerësi kërkon diferencën dhe pjesën e saj nga fitimi", "Shitja është e pavlefshme që nga
