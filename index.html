: 23, "lloji": "mcq", "q": "غصب رجلٌ خشبةً فنجرها باباً، فكانت قيمةُ الباب أقلَّ من قيمة الخشبة. فما الحكم؟", "o": ["يملك البابَ ويغرم قيمةَ الخشبة", "يردّ البابَ ويأخذ أجرةَ عمله", "يردّ البابَ ويضمن نقصَه", "يردّ البابَ ولا يضمن نقصَه، لأنه زاد فيه عملاً"], "a": 2, "q_sq": "Një njeri grabiti një tra dhe e punoi në derë, por vlera e derës doli më e vogël se vlera e trarit. Cila është dispozita?", "o_sq": ["Bëhet pronar i derës dhe paguan vlerën e trarit", "E kthen derën dhe merr pagesë për punën e vet", "E kthen derën dhe garanton pakësimin", "E kthen derën dhe nuk garanton pakësimin, sepse shtoi punë në të"], "pse_ar": "لقول المؤلف: «فلو نجر الخشبةَ باباً أو عملَ الحديد إبراً ردهما بزيادتهما وضمن نقصهما إن نقصا».", "pse_sq": "E sakta: e kthen derën dhe garanton pakësimin. Autori thotë: «Nëse shtohet ose pakësohet, e kthen bashkë me shtesën dhe garanton pakësimin, qoftë shtesa me veprimin e tij apo jo. Nëse e punon trarin dhe e bën derë, ose hekurin e bën gjilpëra, i kthen ato bashkë me shtesën e tyre dhe garanton pakësimin e tyre nëse pakësohen». Puna e grabitësit u bë pa të drejtë, prandaj nuk merr pagesë për të, nuk bëhet pronar dhe nuk lirohet nga pakësimi. Shembull: grabit dru dhe e bën dollap: ia jep pronarit pa marrë gjë për punën.", "f": "٦٥"}, {"id": "C057", "k": 23, "lloji": "tf", "q": "مَن غصب بيضاً فصار عنده فراخاً، فالفراخُ للغاصب، وعليه قيمةُ البيض.", "a": 1, "q_sq": "Kush grabit vezë dhe ato bëhen zogj tek ai, zogjtë i takojnë grabitësit, dhe ai ka për detyrë vlerën e vezëve.", "pse_ar": "لقول المؤلف: «ولو غصب قطناً فغزله... أو حبًّا فصار زرعاً أو نوىً فصار شجراً أو بيضاً فصار فراخاً فكذلك».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «Po kështu, nëse grabit pambuk dhe e tjerr, ose fije dhe i end, ose rrobë dhe e zbardh, ose e pret dhe e qep, ose kokërr dhe ajo bëhet të mbjella, ose bërthamë dhe ajo bëhet pemë, ose vezë dhe ato bëhen zogj», pra dispozita është si te trari që bëhet derë: i kthen pronarit bashkë me shtesën dhe garanton pakësimin nëse ka. Zogjtë janë të pronarit të vezëve, jo të grabitësit.", "f": "٦٦"}, {"id": "C058", "k": 23, "lloji": "mcq", "q": "غصب رجلٌ عبداً فتعلّم عنده صنعةً زادت بها قيمتُه، ثم نسيها فذهبت الزيادة، ثم ردّه. فما الذي يلزم الغاصب؟", "o": ["ردُّه وقيمةُ الزيادة", "ردُّه فقط، لأنه ردّه كما أخذه", "ردُّه ونصفُ قيمة الزيادة", "ردُّه، ويأخذ من السيّد أجرةَ تعليمه"], "a": 0, "q_sq": "Një njeri grabiti një rob, i cili mësoi tek ai një zanat që ia rriti vlerën; pastaj e harroi dhe shtesa iku, e më pas grabitësi e ktheu. Çfarë i bie grabitësit?", "o_sq": ["Kthimi i tij dhe vlera e shtesës", "Vetëm kthimi i tij, sepse e ktheu ashtu siç e mori", "Kthimi i tij dhe gjysma e vlerës së shtesës", "Kthimi i tij, dhe merr nga zotëria pagesën e mësimit"], "pse_ar": "لقول المؤلف: «وإن غصب عبداً فزاد في بدنه أو بتعليمه ثم ذهبت الزيادة ردَّه وقيمة الزيادة».", "pse_sq": "E sakta: kthimi dhe vlera e shtesës. Autori thotë: «Nëse grabit një rob dhe ai shtohet në trup ose me mësim, e pastaj shtesa zhduket, e kthen atë dhe vlerën e shtesës». Shtesa, sapo lindi, ishte pronë e pronarit; kur iku në dorën e grabitësit, ai e garanton, edhe pse e ktheu në gjendjen kur e mori. Pagesa për mësimin nuk i takon, sepse çdo punë e tij mbi sendin e grabitur është pa të drejtë.", "f": "٦٦"}, {"id": "C059", "k": 23, "lloji": "mcq", "q": "غصب رجلٌ قفيزاً من قمح – وهو مكيل – فأكله، وغصب ثوباً – وليس مكيلاً ولا موزوناً – فأحرقه. فما الذي يلزمه؟", "o": ["قيمةُ القمح، ومثلُ الثوب", "قيمتُهما جميعاً", "مثلُهما جميعاً", "مثلُ القمح، وقيمةُ الثوب"], "a": 3, "q_sq": "Një njeri grabiti një kafiz (masë vëllimi) gruri – që matet me vëllim – dhe e hëngri, dhe grabiti një rrobë – që nuk matet as me vëllim as me peshë – dhe e dogji. Çfarë i bie atij?", "o_sq": ["Vlera e grurit dhe rroba e ngjashme", "Vlera e të dyve", "I ngjashmi i të dyve", "Gruri i ngjashëm dhe vlera e rrobës"], "pse_ar": "لقول المؤلف: «وإن تلف المغصوب أو تعذر ردُّه فعليه مثلُه إن كان مكيلاً أو موزوناً وقيمتُه إن لم يكن كذلك».", "pse_sq": "E sakta: gruri i ngjashëm dhe vlera e rrobës. Autori thotë: «Nëse sendi i grabitur shkatërrohet ose kthimi i tij bëhet i pamundur, ka për detyrë të ngjashmen e tij nëse matet me vëllim ose peshë, dhe vlerën e tij nëse nuk është i tillë». Gruri matet me vëllim, prandaj kthehet sasi e njëjtë gruri; rroba jo, prandaj paguhet vlera e saj. Shembull: grabit 100 kg grurë dhe e ha: kthen 100 kg grurë; thyen një telefon të grabitur: paguan vlerën e tij në treg.", "f": "٦٦"}, {"id": "C060", "k": 23, "lloji": "tf", "q": "إذا تعذّر ردُّ المغصوب فدفع الغاصبُ قيمتَه، ثم قدر على ردّه، ردّه وأخذ القيمة.", "a": 0, "q_sq": "Nëse kthimi i sendit të grabitur bëhet i pamundur dhe grabitësi paguan vlerën e tij, e pastaj bëhet i mundur kthimi, e kthen atë dhe e merr mbrapsht vlerën.", "pse_ar": "لقول المؤلف: «ثم إن قدر على ردِّه ردَّه وأخذ القيمة».", "pse_sq": "Pohimi është i saktë. Pasi thotë se kur kthimi bëhet i pamundur grabitësi paguan të ngjashmen ose vlerën, autori shton: «...pastaj, nëse bëhet e mundur ta kthejë, e kthen atë dhe merr (mbrapsht) vlerën». Pagimi i vlerës nuk e bën grabitësin pronar të sendit. Shembull: kafsha e grabitur iku dhe grabitësi pagoi vlerën e saj; më vonë kafsha gjendet: ia kthen pronarit dhe merr paratë që pagoi.", "f": "٦٦"}, {"id": "C061", "k": 23, "lloji": "mcq", "q": "غصب رجلٌ صاعين من زيت الزيتون، فخلط أحدَهما بزيت زيتونٍ له، وخلط الآخرَ بزيتٍ من غير جنسه، ولا يتميّز المغصوبُ في الحالين. فما الذي يلزمه؟", "o": ["مثلُه من المخلوط في الحالين", "مثلُه من حيث شاء في الحالين", "في الأوّل مثلُه من المخلوط، وفي الثاني مثلُه من حيث شاء", "في الأوّل مثلُه من حيث شاء، وفي الثاني مثلُه من المخلوط"], "a": 2, "q_sq": "Një njeri grabiti dy sa' vaj ulliri; njërin e përzieu me vajin e vet të ullirit, ndërsa tjetrin me vaj të një lloji tjetër, dhe sendi i grabitur nuk dallohet në asnjërin rast. Çfarë i bie atij?", "o_sq": ["Të ngjashmin nga përzierja në të dy rastet", "Të ngjashmin nga ku të dojë në të dy rastet", "Në të parin, të ngjashmin nga përzierja; në të dytin, të ngjashmin nga ku të dojë", "Në të parin, të ngjashmin nga ku të dojë; në të dytin, të ngjashmin nga përzierja"], "pse_ar": "لقول المؤلف: «وإن خلط المغصوبَ بما لا يتميز به جنسُه فعليه مثلُه منه، وإن خلطه بغير جنسه فعليه مثلُه من حيث شاء».", "pse_sq": "E sakta: e para. Autori thotë: «Nëse e përzien sendin e grabitur me diçka nga lloji i tij nga e cila nuk dallohet, ka për detyrë të ngjashmen e tij nga ajo (përzierje); e nëse e përzien me diçka të një lloji tjetër, ka për detyrë të ngjashmen e tij nga ku të dojë». Kur përzierja është me të njëjtin lloj, vaji i pronarit është brenda saj, prandaj i jepet prej saj; kur është me lloj tjetër, përzierja s'është më vaj ulliri i pastër, prandaj i jep vaj ulliri nga kudo. Shembull: 10 litra vaj ulliri të përzier me vaj luledielli: i jep pronarit 10 litra vaj ulliri nga kudo.", "f": "٦٦"}, {"id": "C062", "k": 23, "lloji": "mcq", "q": "غصب رجلٌ أرضاً فغرس فيها نخلاً. فما الذي يُلزَم به؟", "o": ["إبقاءُ غرسه فيها بأجرة المثل، ثم ردُّها", "قلعُ غرسه، وردُّها، وأرشُ نقصها، وأجرتُها", "ردُّها بغرسها، ويأخذ من مالكها قيمةَ الغرس كاملة", "قلعُ غرسه وردُّها، ولا أجرةَ عليه لمدّة بقائها"], "a": 1, "q_sq": "Një njeri grabiti një tokë dhe mbolli në të hurma (pemë). Çfarë detyrohet të bëjë?", "o_sq": ["T'i lërë pemët në të me qira të zakonshme, e pastaj ta kthejë", "T'i shkulë pemët e tij, ta kthejë tokën, të paguajë dëmshpërblimin e pakësimit dhe qiranë e saj", "Ta kthejë tokën me pemët, dhe të marrë nga pronari vlerën e plotë të pemëve", "T'i shkulë pemët dhe ta kthejë tokën, pa qira për kohën që e mbajti"], "pse_ar": "لقول المؤلف: «وإن غصب أرضاً فغرسها أُخذ بقلع غرسه وردها وأرش نقصها وأجرتها».", "pse_sq": "E sakta: e para. Autori thotë: «Nëse grabit një tokë dhe e mbjell me pemë, detyrohet t'i shkulë pemët e tij, ta kthejë atë dhe të paguajë dëmshpërblimin e pakësimit dhe qiranë e saj». Pemët janë të grabitësit, por ai s'ka të drejtë t'i mbajë në tokën e tjetrit; ai nuk mund ta detyrojë pronarin t'ia blejë pemët, as t'i lërë ato me qira. Kjo dallon nga rasti kur blerësi me shuf'a ka mbjellë pemë: atje ai mbolli me të drejtë, prandaj shufi'u i paguan vlerën.", "f": "٦٦"}, {"id": "C063", "k": 23, "lloji": "mcq", "q": "غصب رجلٌ أرضاً فزرعها قمحاً، فأدرك المالكُ الزرعَ قائماً قبل حصاده. فما الحكم؟", "o": ["يُخيَّر المالكُ بين أخذ الأرض وأجرتها، وبين أخذ الزرع بقيمته", "الزرعُ للمالك بلا عوض، لأنه نبت في أرضه", "يُلزَم الغاصبُ بقلع الزرع، وردِّ الأرض وأرشِ نقصها وأجرتِها", "الزرعُ للغاصب، ولا شيء عليه سوى ردّ الأرض"], "a": 0, "q_sq": "Një njeri grabiti një tokë dhe e mbolli me grurë; pronari e gjeti të mbjellën në këmbë para korrjes. Cila është dispozita?", "o_sq": ["Pronari zgjedh ndërmjet marrjes së tokës me qiranë e saj dhe marrjes së të mbjellës me vlerën e saj", "E mbjella i takon pronarit pa kompensim, sepse mbiu në tokën e tij", "Grabitësi detyrohet ta shkulë të mbjellën, ta kthejë tokën dhe të paguajë dëmin dhe qiranë", "E mbjella i takon grabitësit, dhe nuk i bie gjë përveç kthimit të tokës"], "pse_ar": "لقول المؤلف: «وإن زرعها وأخذ الغاصبُ الزرعَ ردَّها وأجرتَها، وإن أدرك مالكُها الزرعَ قبل حصاده خيِّر بين ذلك وبين أخذِ الزرع بقيمته».", "pse_sq": "E sakta: pronari zgjedh. Autori thotë: «...nëse e mbjell me të lashta dhe grabitësi i korr të lashtat, e kthen atë dhe qiranë e saj; e nëse pronari i saj i gjen të lashtat para korrjes, ka zgjedhje ndërmjet kësaj dhe marrjes së të lashtave me vlerën e tyre». «Kjo» = të lashtat i mbeten grabitësit, ndërsa pronari merr tokën dhe qiranë. Shkulja e detyruar është dispozita e pemëve (gars), jo e të lashtave; dhe grabitësi në çdo rast e paguan qiranë.", "f": "٦٦"}, {"id": "C064", "k": 23, "lloji": "mcq", "q": "غصب رجلٌ جاريةً فوطئها وأولدها. أيُّ ما يلي **لا** يلزم الغاصبَ؟", "o": ["قيمةُ ولدها بدلَ ردِّه", "إقامةُ الحدّ عليه", "ردُّها وردُّ ولدها", "مهرُ مثلها وأجرةُ مثلها"], "a": 0, "q_sq": "Një njeri grabiti një robëreshë, kreu marrëdhënie me të dhe ajo i lindi fëmijë. Cila nga këto **NUK** i bie grabitësit?", "o_sq": ["Vlera e fëmijës së saj në vend të kthimit të tij", "Zbatimi i dënimit (hadd) mbi të", "Kthimi i saj dhe kthimi i fëmijës së saj", "Mehri i një gruaje si ajo dhe qiraja e zakonshme e saj"], "pse_ar": "لقول المؤلف: «وإن غصب جاريةً فوطئها وأولدها لزمه الحدُّ وردُّها وردُّ ولدها ومهرُ مثلِها وأرشُ نقصها وأجرةُ مثلها».", "pse_sq": "E sakta: vlera e fëmijës në vend të kthimit të tij. Autori thotë: «...i bie dënimi (hadd), kthimi i saj, kthimi i fëmijës së saj, mehri i një gruaje si ajo, dëmshpërblimi i pakësimit të saj dhe qiraja e zakonshme e saj». Grabitësi e kthen vetë fëmijën, sepse nuk i lidhet atij. Pagimi i vlerës së fëmijës është dispozita e blerësit që nuk e dinte se ishte e grabitur, sepse fëmija i tij lind i lirë dhe i lidhet atij.", "f": "٦٦"}, {"id": "C065", "k": 23, "lloji": "mcq", "q": "باع الغاصبُ الجاريةَ، فوطئها المشتري – وهو لا يعلم أنها مغصوبة – فأولدها. فما الحكم؟", "o": ["على المشتري الحدُّ، وردُّها وردُّ ولدها، ولا يرجع على الغاصب بشيء", "على المشتري مهرُها وقيمةُ ولدها وأجرةُ مثلها، ولا يرجع على الغاصب بشيء", "لا شيء على المشتري ابتداءً، وإنما يغرم الغاصبُ للمالك ذلك كلَّه", "على المشتري مهرُها وقيمةُ ولدها وأجرةُ مثلها، ويرجع بذلك كلِّه على الغاصب"], "a": 3, "q_sq": "Grabitësi e shiti robëreshën; blerësi kreu marrëdhënie me të – pa e ditur se ishte e grabitur – dhe ajo i lindi fëmijë. Cila është dispozita?", "o_sq": ["Blerësit i bie dënimi, kthimi i saj dhe kthimi i fëmijës, dhe nuk i kërkon gjë grabitësit", "Blerësi paguan mehrin e saj, vlerën e fëmijës dhe qiranë e zakonshme të saj, dhe nuk i kërkon gjë grabitësit", "Blerësi nuk paguan asgjë që në fillim; vetëm grabitësi ia paguan pronarit të gjitha këto", "Blerësi paguan mehrin e saj, vlerën e fëmijës dhe qiranë e zakonshme të saj, dhe të gjitha këto ia kërkon grabitësit"], "pse_ar": "لقول المؤلف: «وإن باعها فوطئها المشتري – وهو لا يعلم – فعليه مهرُها وقيمةُ ولدها إن أولدها وأجرةُ مثلها، ويرجع بذلك كلِّه على الغاصب».", "pse_sq": "E sakta: e para. Autori thotë: «...e nëse e shet atë dhe blerësi kryen marrëdhënie me të – pa e ditur –, ky ka për detyrë mehrin e saj, vlerën e fëmijës së saj nëse i lind fëmijë dhe qiranë e zakonshme të saj, dhe për të gjitha këto i kërkon grabitësit». Blerësi që s'e dinte nuk dënohet dhe fëmija i lidhet atij, prandaj paguan vlerën e fëmijës në vend që ta kthejë; ai i paguan pronarit, pastaj ia kërkon grabitësit që e mashtroi.", "f": "٦٦"}, {"id": "C066", "k": 24, "lloji": "mcq", "q": "أرضٌ مشتركةٌ مُشاعةٌ تقبل القسمة. في أيّ الصور التالية تثبت الشفعة للشريك؟", "o": ["جعل شريكُه نصيبَه منها صداقاً لامرأته", "جعلت شريكتُه نصيبَها منها عوضاً في خُلع", "باع شريكُه نصيبَه منها بثمنٍ معلوم", "وهب شريكُه نصيبَه منها لرجلٍ أجنبي"], "a": 2, "q_sq": "Një tokë e përbashkët e pandarë që mund të ndahet. Në cilën nga këto forma ortaku ka të drejtë shuf'aje?", "o_sq": ["Ortaku i tij ia dha pjesën e vet gruas së vet si mehr", "Ortakja e tij e dha pjesën e saj si kompensim në hul' (ndarje)", "Ortaku i tij e shiti pjesën e vet për një çmim të caktuar", "Ortaku i tij ia dhuroi pjesën e vet një të huaji"], "pse_ar": "لقول المؤلف: «أحدها: البيع، فلا تجب في موهوب ولا موقوف ولا عوضِ خلعٍ ولا صداق».", "pse_sq": "E sakta: shitja. Autori thotë: «I pari (nga kushtet): shitja; prandaj nuk ka shuf'a në atë që dhurohet, as në atë që vakëfohet, as në kompensimin e hul'it, as në mehr». Shuf'a është marrja e pjesës «nga dora e blerësit të saj», prandaj vlen vetëm kur pjesa kalon me shitje. Dhurata, vakëfi, mehri dhe kompensimi i hul'it nuk japin shuf'a.", "f": "٦٦"}, {"id": "C067", "k": 24, "lloji": "mcq", "q": "قطيعٌ من الغنم مُشاعٌ بين شريكين، فباع أحدُهما نصيبَه لأجنبي. فما حكمُ الشفعة فيه؟", "o": ["فيه الشفعة إن طلبها على الفور", "لا شفعة فيه، لأنه ليس عقاراً", "فيه الشفعة، لأنه مُشاعٌ لم يُقسم", "فيه الشفعة، لأنه مما ينقسم"], "a": 1, "q_sq": "Një tufë dhensh e përbashkët e pandarë ndërmjet dy ortakëve; njëri ia shiti pjesën e vet një të huaji. Cila është dispozita e shuf'as në të?", "o_sq": ["Ka shuf'a nëse e kërkon menjëherë", "Nuk ka shuf'a në të, sepse nuk është pronë e paluajtshme (akar)", "Ka shuf'a, sepse është e përbashkët dhe e pandarë", "Ka shuf'a, sepse është nga ato që ndahen"], "pse_ar": "لقول المؤلف: «الثاني: أن يكون عقاراً، أو ما يتصل به من البناء والغِراس».", "pse_sq": "E sakta: nuk ka shuf'a, sepse s'është akar. Autori thotë: «I dyti: që të jetë pronë e paluajtshme (akar), ose ajo që lidhet me të, si ndërtesat dhe pemët e mbjella». Kushtet e shuf'as janë shtatë dhe duhen të gjitha; që tufa është e pandarë, që mund të ndahet ose që kërkohet menjëherë nuk mjafton kur mungon kushti i akarit. Shembull: makina, kafshët dhe mallrat nuk kanë shuf'a.", "f": "٦٦"}, {"id": "C068", "k": 24, "lloji": "mcq", "q": "أرضٌ كانت بين شريكين فقُسمت، ووقعت الحدودُ وصُرّفت الطرق، ثم باع أحدُهما نصيبَه. فهل لصاحبه الشفعة؟", "o": ["له الشفعة إن طلبها ساعةَ يعلم", "لا شفعة له", "له الشفعة، لأنه جارٌ ملاصق", "له الشفعة، لأنه كان شريكاً قبل القسمة"], "a": 1, "q_sq": "Një tokë ishte ndërmjet dy ortakëve dhe u nda; u vunë kufijtë dhe u ndanë rrugët; pastaj njëri e shiti pjesën e vet. A ka tjetri të drejtë shuf'aje?", "o_sq": ["Ka shuf'a nëse e kërkon në çastin që e mëson", "Nuk ka shuf'a", "Ka shuf'a, sepse është fqinj ngjitur", "Ka shuf'a, sepse ishte ortak para ndarjes"], "pse_ar": "لقول المؤلف: «الثالث: أن يكون شِقْصًا مُشاعاً، فأما المقسوم المحدود فلا شفعةَ فيه، لقول جابر: «قضى رسولُ الله ﷺ بالشفعة في كل ما لم يُقسَم، فإذا وقعت الحدودُ وصُرفت الطرقُ فلا شفعةَ»».", "pse_sq": "E sakta: nuk ka shuf'a. Autori thotë: «I treti: që të jetë një pjesë e përbashkët e pandarë; ndërsa në atë që është ndarë e kufizuar nuk ka shuf'a, për shkak të fjalës së Xhabirit: ‹I Dërguari i Allahut ﷺ gjykoi për shuf'a në çdo gjë që nuk është ndarë; e kur vihen kufijtë dhe ndahen rrugët, atëherë nuk ka shuf'a›». Fqinjësia nuk jep shuf'a sipas këtij teksti, ortakëria e dikurshme ka mbaruar me ndarjen, dhe kërkimi i menjëhershëm s'e plotëson kushtin që mungon.", "f": "٦٦"}, {"id": "C069", "k": 24, "lloji": "tf", "q": "تجب الشفعة فيما لا ينقسم، كما تجب فيما ينقسم.", "a": 1, "q_sq": "Shuf'a vërtetohet në atë që nuk mund të ndahet, ashtu siç vërtetohet në atë që ndahet.", "pse_ar": "لقول المؤلف: «الرابع: أن يكون مما ينقسم، فأما ما لا ينقسم فلا شفعةَ فيه».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «I katërti: që të jetë nga ajo që mund të ndahet; ndërsa në atë që nuk ndahet nuk ka shuf'a». Shembull: një arë e madhe e përbashkët ka shuf'a; ndërsa një pus ose një dyqan i vogël që nuk ndahet dot nuk ka.", "f": "٦٦"}, {"id": "C070", "k": 24, "lloji": "mcq", "q": "باع أحدُ الشريكين نصيبَه المُشاعَ من أرض، فطلب الشفيعُ أن يأخذ نصفَ الشقص المبيع فقط. فما الحكم؟", "o": ["يأخذ النصفَ الذي طلبه", "يأخذ النصفَ، ويُخيَّر المشتري في الباقي", "يأخذ النصفَ إن رضي المشتري بذلك", "تسقط شفعتُه"], "a": 3, "q_sq": "Njëri nga dy ortakët e shiti pjesën e vet të pandarë nga një tokë, dhe shufi'u (ai që ka të drejtën e parablerjes) kërkoi të marrë vetëm gjysmën e pjesës së shitur. Cila është dispozita?", "o_sq": ["E merr gjysmën që e kërkoi", "E merr gjysmën, dhe blerësi zgjedh për pjesën tjetër", "E merr gjysmën nëse pajtohet blerësi", "I bie e drejta e shuf'as"], "pse_ar": "لقول المؤلف: «الخامس: أن يأخذ الشقصَ كلَّه، فإن طلب بعضه سقطت شفعتُه».", "pse_sq": "E sakta: i bie e drejta e shuf'as. Autori thotë: «I pesti: që ta marrë të gjithë pjesën; e nëse kërkon një pjesë të saj, i bie e drejta e shuf'as». Marrja e një pjese do t'i ndante blerësit pronën dhe do t'i bënte dëm; prandaj autori nuk e lejon dhe nuk përmend zgjedhje për blerësin. Pra shufi'u ose e merr të gjithë pjesën, ose e humbet të drejtën.", "f": "٦٦"}, {"id": "C071", "k": 24, "lloji": "mcq", "q": "أرضٌ مُشاعةٌ بين ثلاثة: لزيدٍ نصفُها، ولعمرٍو ثلثُها، ولبكرٍ سدسُها، فباع زيدٌ نصيبَه، وطلب عمرٌو وبكرٌ الشفعة. فكيف تكون بينهما؟", "o": ["لعمرٍو وحده، لأنه أكثرُ سهماً", "لعمرٍو ثلثُها، ولبكرٍ ثلثاها", "لعمرٍو ثلثاها، ولبكرٍ ثلثُها", "بينهما نصفين بالسويّة"], "a": 2, "q_sq": "Një tokë e pandarë ndërmjet tre vetave: Zejdi ka gjysmën, Amri një të tretën, Bekri një të gjashtën. Zejdi e shiti pjesën e vet, dhe Amri e Bekri kërkuan shuf'anë. Si ndahet ajo mes tyre?", "o_sq": ["Vetëm Amri, sepse ka pjesë më të madhe", "Amri merr një të tretën e saj, Bekri dy të tretat", "Amri merr dy të tretat e saj, Bekri një të tretën", "Ndahet përgjysmë mes tyre në mënyrë të barabartë"], "pse_ar": "لقول المؤلف: «ولو كان له شفيعان فالشفعة بينهما على قدر سهامهما».", "pse_sq": "E sakta: Amri dy të tretat, Bekri një të tretën. Autori thotë: «Nëse ai ka dy pretendues të shuf'as, shuf'a ndahet mes tyre sipas pjesëve të tyre». Pjesa e Amrit (1/3 = 2/6) është dyfishi i pjesës së Bekrit (1/6), prandaj raporti është 2 me 1: Amri merr 2/3 e pjesës së shitur, Bekri 1/3. Ndarja e barabartë ose përjashtimi i Bekrit bien ndesh me «sipas pjesëve të tyre».", "f": "٦٧"}, {"id": "C072", "k": 24, "lloji": "tf", "q": "إذا كان للشقص شفيعان فترك أحدُهما شفعتَه، فللآخر أن يأخذ قدرَ حصّته منه فقط.", "a": 1, "q_sq": "Nëse pjesa ka dy pretendues të shuf'as dhe njëri heq dorë nga e drejta e tij, tjetri mund të marrë vetëm aq sa i takon atij prej saj.", "pse_ar": "لقول المؤلف: «فإن ترك أحدهما شفعته لم يكن للآخر إلا أخذُ الكلِّ أو التركُ».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «...e nëse njëri prej tyre heq dorë nga e drejta e tij, tjetri nuk ka zgjedhje tjetër veç marrjes së të gjithës ose heqjes dorë». Kjo lidhet me kushtin e pestë: shuf'a merret e plotë, që blerësit të mos i ndahet pjesa. Shembull: Bekri heq dorë; Amri ose e merr të gjithë pjesën e Zejdit, ose s'merr asgjë.", "f": "٦٧"}, {"id": "C073", "k": 24, "lloji": "mcq", "q": "اشترى رجلٌ شقصاً من أرضٍ مُشاعة بثوبٍ – والثوبُ ليس مثليّاً –. فبِمَ يأخذه الشفيع؟", "o": ["بما يتراضى عليه مع المشتري", "بقيمة الثوب", "بمثل الثوب", "بقيمة الشقص يومَ الأخذ"], "a": 1, "q_sq": "Një njeri bleu një pjesë nga një tokë e pandarë duke dhënë një rrobë – dhe rroba nuk është nga sendet që kanë të ngjashëm (mithli) –. Me çfarë e merr shufi'u?", "o_sq": ["Me atë për të cilën pajtohet me blerësin", "Me vlerën e rrobës", "Me një rrobë të ngjashme", "Me vlerën e pjesës në ditën e marrjes"], "pse_ar": "لقول المؤلف: «وإذا كان الثمن مثليًّا فعليه مثلُه، وإن لم يكن مثليًّا فعليه قيمتُه».", "pse_sq": "E sakta: me vlerën e rrobës. Autori thotë: «Kur çmimi është nga ato që kanë të ngjashme, ka për detyrë të ngjashmen e tij; e nëse nuk ka të ngjashme, ka për detyrë vlerën e tij». Shufi'u e merr pjesën me çmimin me të cilin e bleu blerësi, jo me vlerën e vetë pjesës dhe jo me pazar të ri. Shembull: nëse blerësi pagoi 50.000 €, shufi'u paguan 50.000 €; nëse pagoi me një makinë, paguan vlerën e makinës.", "f": "٦٧"}, {"id": "C074", "k": 24, "lloji": "tf", "q": "إذا عجز الشفيعُ عن بعض الثمن، سقطت شفعتُه.", "a": 0, "q_sq": "Nëse shufi'u nuk mund ta paguajë një pjesë të çmimit, i bie e drejta e shuf'as.", "pse_ar": "لقول المؤلف: «السادس: إمكان أداء الثمن، فإن عَجَز عنه أو عن بعضه سقطت شفعته».", "pse_sq": "Pohimi është i saktë. Autori thotë: «I gjashti: mundësia e pagimit të çmimit; nëse nuk mund ta paguajë atë ose një pjesë të tij, i bie e drejta e shuf'as». Ai nuk merr pjesë të pjesës sipas parave që ka, sepse shuf'a merret e plotë dhe me çmimin e plotë. Shembull: çmimi është 50.000 € dhe ortaku ka vetëm 30.000 €: e humbet shuf'anë.", "f": "٦٧"}, {"id": "C075", "k": 24, "lloji": "tf", "q": "إذا اختلف الشفيعُ والمشتري في قدر الثمن ولا بيّنةَ لهما، فالقولُ قولُ الشفيع مع يمينه.", "a": 1, "q_sq": "Nëse shufi'u dhe blerësi bien në kundërshtim për sasinë e çmimit dhe nuk kanë provë, pranohet fjala e shufi'ut me betimin e tij.", "pse_ar": "لقول المؤلف: «وإن اختلفا في قدره ولا بينةَ لهما فالقولُ قولُ المشتري مع يمينه».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «...e nëse bien në kundërshtim për sasinë e tij dhe nuk kanë provë, pranohet fjala e blerësit me betimin e tij». Blerësi e lidhi kontratën dhe e di më mirë çmimin. Shembull: blerësi thotë «e bleva për 60.000», ortaku thotë «për 50.000»; pa dëshmitarë, besohet blerësi me betim.", "f": "٦٧"}, {"id": "C076", "k": 24, "lloji": "mcq", "q": "علم الشفيعُ بالبيع وهو حاضرٌ صحيحٌ قادرٌ على الطلب، فأخّر المطالبةَ أيّاماً بلا عذر. فما الحكم؟", "o": ["له الشفعة ما لم يمضِ حولٌ", "له الشفعة ما لم يبنِ المشتري فيه", "له الشفعة إن أشهد على طلبه بعد ذلك", "بطلت شفعتُه"], "a": 3, "q_sq": "Shufi'u e mësoi shitjen ndërsa ishte i pranishëm, i shëndoshë dhe në gjendje ta kërkonte, por e vonoi kërkesën disa ditë pa arsye. Cila është dispozita?", "o_sq": ["E ka shuf'anë derisa të kalojë një vit", "E ka shuf'anë derisa blerësi të mos ndërtojë në të", "E ka shuf'anë nëse merr dëshmitarë për kërkesën më pas", "I prishet e drejta e shuf'as"], "pse_ar": "لقول المؤلف: «السابع: المطالبة بها على الفور ساعةَ يعلمُ، فإن أخرها بطَلت شفعته».", "pse_sq": "E sakta: i prishet e drejta e shuf'as. Autori thotë: «I shtati: kërkimi i saj menjëherë, në çastin kur e mëson; nëse e vonon, i prishet e drejta e shuf'as». Përjashtim janë vetëm ata që s'kanë mundësi (mungesa, burgu, sëmundja, mosha e vogël), kurse ky s'ka asnjë arsye. Afati prej një viti është i lukatës, jo i shuf'as; dhe dëshmitarët e mëvonshëm s'e kthejnë të drejtën që ra.", "f": "٦٧"}, {"id": "C077", "k": 24, "lloji": "mcq", "q": "كان الشفيعُ غائباً حين البيع، فعلم به وأمكنه أن يُشهد على طلبه فلم يُشهد، ثم قدم بعد شهرٍ فطالب. فما الحكم؟", "o": ["هو على شفعته إن طالب بها ساعةَ قدومه", "هو على شفعته إن حلف أنه لم يُرد تركها", "بطلت شفعتُه، لأنه أمكنه الإشهادُ فلم يُشهد", "هو على شفعته، لأنه كان معذوراً بالغيبة"], "a": 2, "q_sq": "Shufi'u mungonte kur u bë shitja; e mësoi atë dhe kishte mundësi të merrte dëshmitarë për kërkesën e tij, por nuk mori; pastaj u kthye pas një muaji dhe e kërkoi. Cila është dispozita?", "o_sq": ["E ka të drejtën nëse e kërkon në çastin që kthehet", "E ka të drejtën nëse betohet se nuk deshi të hiqte dorë", "I prishet e drejta, sepse kishte mundësi të merrte dëshmitarë dhe nuk mori", "E ka të drejtën, sepse ishte i justifikuar me mungesë"], "pse_ar": "لقول المؤلف: «إلا أن يكون عاجزاً عنها لغيبة أو حبسٍ أو مرضٍ أو صغرٍ فيكون على شفعته متى قدر عليها، إلا أنه إن أمكنه الإشهادُ على الطلب بها فلم يُشهد بطَلت شفعته».", "pse_sq": "E sakta: i prishet e drejta. Autori thotë: «...përveç nëse nuk ka mundësi për të për shkak të mungesës, burgut, sëmundjes ose moshës së vogël: atëherë ai mbetet me të drejtën e tij sa herë që të ketë mundësi; por nëse ka mundësi të marrë dëshmitarë për kërkimin e saj dhe nuk merr, i prishet e drejta e shuf'as». Mungesa e justifikon vetëm kur s'mund të bëjë as kaq; këtu mundi të merrte dëshmitarë dhe s'e bëri, prandaj kërkesa në çastin e kthimit ose betimi nuk e shpëtojnë.", "f": "٦٧"}, {"id": "C078", "k": 24, "lloji": "mcq", "q": "باع أحدُ الشريكين نصيبَه المُشاعَ، ولم يعلم الشفيعُ حتى تبايعه ثلاثةٌ واحداً بعد واحد. فما الحكم؟", "o": ["سقطت شفعتُه بتكرّر البيع", "له أن يطالب مَن شاء منهم", "لا يطالب إلا المشتري الأوّل", "لا يطالب إلا المشتري الأخير"], "a": 1, "q_sq": "Njëri nga dy ortakët e shiti pjesën e vet të pandarë, dhe shufi'u nuk e mësoi derisa e shitën tre veta njëri pas tjetrit. Cila është dispozita?", "o_sq": ["I ra e drejta e shuf'as për shkak të përsëritjes së shitjes", "Mund t'ia kërkojë cilitdo prej tyre që të dojë", "Nuk ia kërkon veçse blerësit të parë", "Nuk ia kërkon veçse blerësit të fundit"], "pse_ar": "لقول المؤلف: «فإن لم يعلم حتى تبايع ثلاثة فأكثر فله مطالبةُ من شاء منهم، فإن أخذ من الأول رجع الثاني عليه بما أخذ منه، والثالث على الثاني».", "pse_sq": "E sakta: mund t'ia kërkojë cilitdo. Autori thotë: «Nëse nuk e mëson derisa tre veta ose më shumë e kanë shitur me radhë njëri-tjetrit, ai mund t'ia kërkojë cilitdo prej tyre; nëse e merr nga i pari, i dyti i kërkon atij atë që i ka marrë, dhe i treti të dytit». E drejta nuk i bie, sepse nuk e dinte. Shembull: ortaku shet te A, A te B, B te C; ti zgjedh shitjen e parë: paguan çmimin e A-së, C-ja i kërkon B-së paratë e veta, dhe B-ja i kërkon A-së.", "f": "٦٧"}, {"id": "C079", "k": 24, "lloji": "mcq", "q": "أخذ الشفيعُ الشقصَ، وكان المشتري قد بنى فيه بناءً وزرع فيه زرعاً لم يُحصد. فما الحكم؟", "o": ["للمشتري قيمةُ بنائه إلا أن يختار قلعَه بلا ضرر، وزرعُه له إلى الحصاد", "للمشتري قيمةُ بنائه إلا أن يختار قلعَه بلا ضرر، وزرعُه للشفيع", "يُلزَم المشتري بقلع بنائه بلا عوض، وزرعُه له إلى الحصاد", "يُلزَم المشتري بقلع بنائه بلا عوض، وزرعُه للشفيع"], "a": 0, "q_sq": "Shufi'u e mori pjesën, ndërsa blerësi kishte ndërtuar në të një ndërtesë dhe kishte mbjellë të lashta që s'ishin korrur. Cila është dispozita?", "o_sq": ["Blerësi merr vlerën e ndërtesës, përveç nëse zgjedh ta heqë pa dëm; të lashtat janë të tijat deri në korrje", "Blerësi merr vlerën e ndërtesës, përveç nëse zgjedh ta heqë pa dëm; të lashtat i takojnë shufi'ut", "Blerësi detyrohet ta heqë ndërtesën pa kompensim; të lashtat janë të tijat deri në korrje", "Blerësi detyrohet ta heqë ndërtesën pa kompensim; të lashtat i takojnë shufi'ut"], "pse_ar": "لقول المؤلف: «ومتى أخذه وفيه غرسٌ أو بناء للمشتري أعطاه الشفيعُ قيمتَه إلا أن يختار المشتري قلْعَه من غير ضرر فيه، وإن كان فيه زرع أو ثمر بادٍ فهو للمشتري يبقى إلى الحصاد أو الجذاذ».", "pse_sq": "E sakta: e para. Autori thotë: «Kur e merr dhe në të ka pemë të mbjella ose ndërtesa të blerësit, shufi'u i jep vlerën e tyre, përveç nëse blerësi zgjedh t'i heqë pa dëm në të; e nëse në të ka të lashta ose fryt të dukshëm, ato i takojnë blerësit dhe mbeten deri në korrje ose vjelje». Blerësi ndërtoi në pronën e vet me të drejtë, prandaj nuk detyrohet ta heqë pa kompensim – ndryshe nga grabitësi që detyrohet t'i shkulë pemët.", "f": "٦٧"}, {"id": "C080", "k": 24, "lloji": "mcq", "q": "اشترى رجلٌ شقصاً من أرضٍ مُشاعة وسيفاً في عقدٍ واحدٍ بثمنٍ واحد. فما حقُّ الشفيع؟", "o": ["أخذُ الشقص بحصّته من الثمن", "لا يأخذ الشقصَ إلا مع السيف", "أخذُ الشقص بالثمن كلِّه", "لا شفعة له، لاجتماعهما في عقدٍ واحد"], "a": 0, "q_sq": "Një njeri bleu një pjesë nga një tokë e pandarë dhe një shpatë me një kontratë të vetme dhe me një çmim. Cila është e drejta e shufi'ut?", "o_sq": ["Ta marrë pjesën me pjesën përkatëse të çmimit", "Nuk e merr pjesën veçse bashkë me shpatën", "Ta marrë pjesën me të gjithë çmimin", "Nuk ka shuf'a, sepse u bashkuan në një kontratë"], "pse_ar": "لقول المؤلف: «وإن اشترى شقصًا وسيفًا في عقدٍ واحدٍ فللشفيع أخذُ الشقص بحصته».", "pse_sq": "E sakta: ta marrë pjesën me pjesën përkatëse të çmimit. Autori thotë: «Nëse blen një pjesë (toke) dhe një shpatë me një kontratë të vetme, shufi'u mund ta marrë pjesën me pjesën përkatëse të çmimit». Shpata nuk ka shuf'a sepse nuk është akar, prandaj nuk merret; çmimi ndahet sipas vlerës. Shembull: toka dhe një makinë u blenë bashkë për 60.000 €; nëse toka vlen 5/6 e totalit, shufi'u paguan 50.000 € dhe merr vetëm tokën.", "f": "٦٧"}, {"id": "D001", "k": 25, "lloji": "mcq", "q": "ما تعريفُ الوقف عند المؤلف؟", "o": ["تمليكُ المال في الحياة بغير عوض", "تسبيلُ الأصل وتحبيسُ الثمرة", "تحبيسُ الأصل وتسبيلُ الثمرة", "تمليكُ الثمرة للموقوف عليه مدّةَ حياته"], "a": 2, "q_sq": "Si e përkufizon autori vakëfin?", "o_sq": ["Dhënia e pronësisë së pasurisë gjatë jetës, pa kompensim", "Lëshimi i bazës në rrugën e mirë dhe ndalimi i frytit", "Ndalimi i bazës dhe lëshimi i frytit në rrugën e mirë", "Dhënia e pronësisë së frytit atij për të cilin është vakëfi, për gjithë jetën e tij"], "pse_ar": "لقول المؤلف في أول كتاب الوقف: «وهو تحبيسُ الأصل وتسبيلُ الثمرة».", "pse_sq": "E sakta: ndalimi i bazës dhe lëshimi i frytit në rrugën e mirë. Autori thotë në fillim të Librit të vakëfit: «Ai është ruajtja (ndalimi) i bazës (nga shitja e trashëgimia) dhe dhënia e frytit (të ardhurave) në rrugën e Allahut (tesbil)». Baza (vetë prona) ndalohet: nuk shitet, nuk dhurohet dhe nuk trashëgohet; ndërsa fryti (të ardhurat) shkon për qëllimin e mirë. «Dhënia e pronësisë së pasurisë gjatë jetës pa kompensim» është përkufizimi i hibes (dhuratës) te autori, jo i vakëfit. Opsioni i dytë i ka këmbyer vendet: te vakëfi baza ruhet, nuk lëshohet. Opsioni i katërt nuk është përkufizim i autorit: vakëfi nuk është dhënie e frytit në pronësi për një kohë të kufizuar. Shembull: dikush e bën vakëf një dyqan; dyqani mbetet përgjithmonë, ndërsa qiraja e tij shkon për të varfrit.", "f": "٦٩"}, {"id": "D002", "k": 25, "lloji": "mcq", "q": "أراد رجلٌ أن يقف شيئاً على الفقراء. فأيُّ ما يلي يصحّ وقفُه؟", "o": ["دنانيرُ يُنفَق منها عليهم", "طعامٌ يُقسَم بينهم كلَّ يوم", "رياحينُ يُتصدَّق بها عليهم", "دارٌ تُصرف أجرتُها إليهم"], "a": 3, "q_sq": "Një njeri dëshiron të bëjë vakëf diçka për të varfrit. Cila nga këto lejohet të bëhet vakëf?", "o_sq": ["Dinarë (monedha ari), nga të cilët shpenzohet për ta", "Ushqim që ndahet mes tyre çdo ditë", "Rejahin (bimë me erë të mirë, si trëndafili) që u jepen sadaka", "Një shtëpi, qiraja e së cilës shkon për ta"], "pse_ar": "لقول المؤلف: «ويجوز في كل عين يجوز بيعها ويُنتفع بها دائماً مع بقاء عينها، ولا يصح في غير ذلك مثلِ الأثمان والمطعومات والرياحين».", "pse_sq": "E sakta: shtëpia, qiraja e së cilës shkon për të varfrit. Autori thotë: «Ai lejohet në çdo send që lejohet të shitet dhe nga i cili përfitohet vazhdimisht, ndërsa vetë sendi mbetet; dhe nuk është i vlefshëm në të tjera, si paratë, ushqimet dhe bimët aromatike (rejahin)». Shtëpia lejohet të shitet dhe prej saj përfitohet vazhdimisht (me qira), ndërsa ajo vetë mbetet; edhe qëllimi (të varfrit) është mirësi, siç e kushtëzon autori. Dinarët janë para (ethman): përfitimi prej tyre bëhet duke i shpenzuar, pra mbarojnë. Ushqimi mbaron kur hahet, ndërsa rejahinët thahen shpejt. Prandaj autori i përmend të tria si shembuj të asaj që nuk bëhet vakëf. Shembull i sotëm: dikush e bën vakëf një apartament dhe qiraja mujore shkon për familjet e varfra.", "f": "٦٩"}, {"id": "D003", "k": 25, "lloji": "tf", "q": "يصحّ الوقف على كلّ جهةٍ، ولو لم تكن برًّا ولا معروفاً.", "a": 1, "q_sq": "Vakëfi është i vlefshëm për çdo qëllim, edhe nëse nuk është as mirësi (birr), as vepër e mirë (ma'ruf).", "pse_ar": "بل لا يصح إلا على برّ أو معروف، لقول المؤلف: «ولا يصح إلا على بِر أو معروف».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «Ai nuk është i vlefshëm veçse për mirësi ose për vepër të mirë», dhe pastaj sjell si shembull vakëfin e Umerit, i cili «e dha atë sadaka për të varfrit, për të afërmit, për lirimin e robërve, në rrugën e Allahut, për udhëtarin dhe për mysafirin». Pra qëllimi i vakëfit duhet të jetë mirësi; kushti nuk plotësohet për çdo qëllim. Shembull: vakëfi për një xhami, për nxënësit e dijes ose për të varfrit vlen; vakëfi për një vend ku bëhet e ndaluar nuk vlen.", "f": "٦٩"}, {"id": "D004", "k": 25, "lloji": "mcq", "q": "ما الحديثُ الذي استدلّ به المؤلف على مشروعيّة الوقف؟", "o": ["حديثُ سعدٍ في الوصيّة: «الثلثُ والثلثُ كثيرٌ»", "حديثُ عمر: «إن شئتَ حبَستَ أصلَها وتصدَّقتَ بها»", "حديثُ: «اتقُوا الله واعدلُوا بين أولادِكم»", "حديثُ: «لا يحلُّ لأحدٍ أن يُعطيَ عطيةً فيرجعَ فيها»"], "a": 1, "q_sq": "Cili është hadithi me të cilin autori argumenton ligjshmërinë e vakëfit?", "o_sq": ["Hadithi i Sa'dit për testamentin: «Të tretën, por edhe e treta është shumë»", "Hadithi i Umerit: «Nëse dëshiron, ruaje bazën e saj dhe jepe sadaka (frytin e) saj»", "Hadithi: «Frikësojuni Allahut dhe bëhuni të drejtë ndaj fëmijëve tuaj!»", "Hadithi: «Askujt nuk i lejohet të japë një dhuratë e pastaj ta kthejë (ta marrë mbrapsht)»"], "pse_ar": "لقول المؤلف: «مثلُ ما روي عن عمر أنه قال: يا رسول الله إني أصبتُ مالاً بخيبرَ ... فما تأمرني فيه؟ قال: إن شئتَ حبَستَ أصلَها وتصدَّقتَ بها، غيرَ أنها لا يُباعُ أصلُها ولا يوهبُ ولا يورثُ».", "pse_sq": "E sakta: hadithi i Umerit. Autori sjell: «si ajo që transmetohet nga Umeri, i cili tha: ‹O i Dërguari i Allahut! Kam marrë një pasuri në Hajber; kurrë nuk kam marrë pasuri më të çmuar për mua se ajo. Çfarë më urdhëron për të?› Tha: ‹Nëse dëshiron, ruaje bazën e saj dhe jepe sadaka (frytin e) saj, me kusht që baza e saj të mos shitet, të mos dhurohet dhe të mos trashëgohet.›» Kjo është vetë thelbi i vakëfit: baza ruhet, fryti jepet. Hadithi i Sa'dit është argumenti i autorit për kufirin e testamentit (e treta). Hadithi «Frikësojuni Allahut dhe bëhuni të drejtë ndaj fëmijëve tuaj!» është për drejtësinë në dhuratat për fëmijët, ndërsa hadithi «Askujt nuk i lejohet të japë një dhuratë e pastaj ta kthejë» është për ndalimin e kthimit të dhuratës.", "f": "٦٩"}, {"id": "D005", "k": 25, "lloji": "tf", "q": "يصحّ الوقف بالفعل الدالّ عليه، مثلَ أن يبني مسجداً ويأذن للناس في الصلاة فيه، ولو لم يتلفّظ بالوقف.", "a": 0, "q_sq": "Vakëfi është i vlefshëm me veprim që e tregon atë, si të ndërtojë një xhami dhe t'u japë leje njerëzve të falen në të, edhe nëse nuk e shqipton fjalën «vakëf».", "pse_ar": "لقول المؤلف: «ويصح الوقف بالقول والفعل الدالّ عليه، مثل أن يبني مسجداً ويأذن في الصلاة فيه، أو سقاية ويشرعها للناس».", "pse_sq": "Pohimi është i saktë. Autori thotë: «Vakëfi është i vlefshëm me fjalë dhe me veprim që e tregon atë, si të ndërtojë një xhami dhe të lejojë faljen në të, ose një çezmë (sikaje) dhe t'ua hapë njerëzve». Pra vakëfi lidhet në dy mënyra: me fjalë («E bëra këtë vakëf») ose me veprim të qartë. Shembull i sotëm: dikush ndërton një çezmë buzë rrugës dhe e lë të hapur për të gjithë; kjo është vakëf, edhe pa thënë asgjë.", "f": "٦٩"}, {"id": "D006", "k": 25, "lloji": "mcq", "q": "ما حكمُ أكلِ مَن وَلِيَ الوقفَ (الناظرِ) من غلّته؟", "o": ["لا يأكل منها شيئاً، ولو كان محتاجاً", "يأكل منها ويتّخذ منها مالاً لنفسه بقدر عمله", "يأكل بالمعروف ويُطعم صديقاً غيرَ متموِّل", "يأكل منها بالمعروف، ولا يجوز أن يُطعم منها أحداً"], "a": 2, "q_sq": "Cila është dispozita e ngrënies nga të ardhurat e vakëfit për atë që e administron (nadhirin)?", "o_sq": ["Nuk ha asgjë prej tyre, edhe nëse ka nevojë", "Ha prej tyre dhe grumbullon prej tyre pasuri për vete në masën e punës së tij", "Ha sipas zakonit të mirë dhe ushqen një mik, pa e bërë pasuri për vete", "Ha prej tyre sipas zakonit të mirë, por nuk lejohet të ushqejë askënd prej tyre"], "pse_ar": "لقول المؤلف: «ولا جناح على من وليها أن يأكل منها بالمعروف ويُطعم صديقاً غير متمول فيه».", "pse_sq": "E sakta: ha sipas zakonit të mirë dhe ushqen një mik, pa e bërë pasuri për vete. Autori thotë: «Nuk ka gjynah për atë që e administron që të hajë prej saj sipas zakonit të mirë dhe të ushqejë një mik, pa e bërë atë pasuri për vete». Pra ngrënia në masën e zakonshme lejohet (nuk është e ndaluar fare), edhe gostitja e një miku lejohet (jo si në opsionin e katërt), por grumbullimi i pasurisë për vete nuk lejohet (jo si në opsionin e dytë). Shembull: administruesi i një kopshti-vakëf ha nga frutat sa është e zakonshme dhe gostit ndonjë mik, por nuk i shet frutat për vete.", "f": "٦٩"}, {"id": "D007", "k": 25, "lloji": "mcq", "q": "وقف رجلٌ داراً على أولاده، وشرط أن يكون الناظرُ أكبرَهم، وأنّ مَن ترك طلبَ العلم منهم خرج من الوقف. فما الحكمُ في هذين الشرطين؟", "o": ["يُعمل بهما، لأنه يُرجع إلى شرط الواقف", "يُعمل بشرط الناظر، ويُلغى شرطُ الإخراج من الوقف", "يُعمل بشرط الإخراج، ويُلغى شرطُ الناظر في الوقف", "يُلغيان، ويُرجع في ذلك كلّه إلى اجتهاد الحاكم"], "a": 0, "q_sq": "Një njeri e bëri vakëf një shtëpi për fëmijët e tij, dhe kushtëzoi që administrues (nadhir) të jetë më i madhi prej tyre, dhe që kush prej tyre e lë kërkimin e dijes të dalë nga vakëfi. Cila është dispozita e këtyre dy kushteve?", "o_sq": ["Zbatohen të dyja, sepse i drejtohemi kushtit të vakifit", "Zbatohet kushti i administruesit, ndërsa kushti i përjashtimit nga vakëfi anulohet", "Zbatohet kushti i përjashtimit, ndërsa kushti i administruesit të vakëfit anulohet", "Anulohen të dyja, dhe për të gjitha këto i drejtohemi gjykimit të gjykatësit"], "pse_ar": "لقول المؤلف: «ويرجع في الوقف ومصرفه وشروطه وترتيبه وإدخال من شاء بصفة وإخراجه بها إلى شرط الواقف، وكذلك الناظر فيه والنفقة عليه».", "pse_sq": "E sakta: zbatohen të dyja. Autori thotë: «Në vakëf, në destinacionin e tij, në kushtet e tij, në radhitjen e tij, si dhe në përfshirjen e kujt të dojë me një cilësi e përjashtimin me të, i drejtohemi kushtit të vakëfdhënësit; po ashtu (në caktimin e) administruesit të tij dhe të shpenzimeve për të». Caktimi i administruesit (më i madhi i fëmijëve) dhe përjashtimi me një cilësi (lënia e dijes) janë të dyja të përmendura shprehimisht, prandaj asnjëra nuk anulohet dhe nuk i lihet gjykatësit. Edhe shpenzimet për mirëmbajtjen e vakëfit bëhen sipas kushtit të vakifit. Shembull: «Kush prej fëmijëve të mi studion, merr nga qiraja; kush e lë studimin, nuk merr».", "f": "٦٩"}, {"id": "D008", "k": 25, "lloji": "mcq", "q": "فرسٌ حبيسٌ (موقوفٌ للجهاد) كَبِرَ فلم يعد يصلح للغزو. فما الحكم؟", "o": ["يبقى موقوفاً على حاله، ولا يُباع", "يُباع، ويُصرف ثمنُه إلى المساكين", "يرجع إلى ورثة الواقف ملكاً لهم", "يُباع، ويُشترى بثمنه ما يصلح للجهاد"], "a": 3, "q_sq": "Një kalë habis (i lënë vakëf për xhihad) u plak dhe nuk është më i përshtatshëm për luftë. Cila është dispozita?", "o_sq": ["Mbetet vakëf siç është dhe nuk shitet", "Shitet dhe çmimi i tij u jepet të varfërve", "U kthehet trashëgimtarëve të vakifit si pronë e tyre", "Shitet dhe me çmimin e tij blihet ajo që është e përshtatshme për xhihad"], "pse_ar": "لقول المؤلف: «والفرس الحبيس إذا لم يصلح للغزو بِيع واشتري به ما يصلح للجهاد».", "pse_sq": "E sakta: shitet dhe me çmimin e tij blihet ajo që është e përshtatshme për xhihad. Rregulli i autorit është: «Shitja e tij nuk lejohet, përveç kur dobitë e tij ndërpriten plotësisht: atëherë shitet dhe me (çmimin e) tij blihet ajo që zë vendin e tij»; dhe si shembull thotë: «kali i vakëfuar (për luftë), kur nuk është më i përshtatshëm për luftë, shitet dhe me të blihet ajo që është e përshtatshme për xhihad». Mbajtja e tij pa dobi bie ndesh me qëllimin e vakëfit. Çmimi nuk shkon te të varfrit (qëllimi i vakëfit ishte xhihadi, jo të varfrit), dhe nuk u kthehet trashëgimtarëve, sepse baza e vakëfit «nuk trashëgohet».", "f": "٦٩"}, {"id": "D009", "k": 25, "lloji": "tf", "q": "المسجد إذا لم يُنتفع به في مكانه لا يجوز بيعُه بحال، بل يبقى في مكانه.", "a": 1, "q_sq": "Xhamia, kur nuk përfitohet prej saj në vendin e saj, nuk lejohet të shitet në asnjë mënyrë, por mbetet në vendin e saj.", "pse_ar": "بل يُباع ويُنقل، لقول المؤلف: «والمسجد إذا لم يُنتفع به في مكانه بيع ونُقل إلى مكان يُنتفع به».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «dhe xhamia, kur nuk përfitohet prej saj në vendin e saj, shitet dhe zhvendoset në një vend ku përfitohet prej saj». Kjo është pjesë e përjashtimit nga rregulli «Shitja e tij nuk lejohet, përveç kur dobitë e tij ndërpriten plotësisht». Shembull: banorët e një fshati u shpërngulën të gjithë dhe xhamia mbeti bosh; ajo shitet dhe me paratë ndërtohet një xhami aty ku ka njerëz që falen.", "f": "٦٩"}, {"id": "D010", "k": 25, "lloji": "mcq", "q": "وقف رجلٌ داراً على ولد زيدٍ ثم على المساكين، ولم يفضّل أحداً، ولزيدٍ بنون وبنات. فكيف تُقسم الغلّة، وإلى مَن تصير إذا لم يبقَ منهم أحد؟", "o": ["للذكر مثلُ حظّ الأنثيين، ثم إلى المساكين", "الذكرُ والأنثى بالسويّة، ثم إلى المساكين", "الذكرُ والأنثى بالسويّة، ثم إلى ورثة الواقف", "للذكر مثلُ حظّ الأنثيين، ثم إلى ورثة الواقف"], "a": 1, "q_sq": "Një njeri e bëri vakëf një shtëpi për fëmijët e Zejdit e pastaj për të varfrit, pa privilegjuar askënd; Zejdi ka djem dhe vajza. Si ndahen të ardhurat, dhe te kush kalojnë kur nuk mbetet asnjë prej tyre?", "o_sq": ["Mashkulli merr sa dy femra; pastaj kalojnë te të varfrit", "Mashkulli dhe femra njësoj; pastaj kalojnë te të varfrit", "Mashkulli dhe femra njësoj; pastaj kalojnë te trashëgimtarët e vakifit", "Mashkulli merr sa dy femra; pastaj kalojnë te trashëgimtarët e vakifit"], "pse_ar": "لقول المؤلف: «فلو وقف على ولد فلان ثم على المساكين كان الذكرُ والأنثى بالسوية إلا أن يفضِّل بعضهم، فإذا لم يَبق منهم أحد رجع إلى المساكين».", "pse_sq": "E sakta: mashkulli dhe femra njësoj, pastaj te të varfrit. Autori thotë: «Nëse e vakëfon për fëmijët e filanit e pastaj për të varfrit, mashkulli dhe femra janë të barabartë, përveç nëse ai ka privilegjuar disa prej tyre; e kur nuk mbetet asnjë prej tyre, kalon te të varfrit». Ndarja «mashkulli sa dy femra» është e trashëgimisë dhe e dhuratës për fëmijët, jo e vakëfit pa kusht privilegjimi. Kthimi te trashëgimtarët e vakifit është i gabuar, sepse vakifi vetë e caktoi destinacionin pas tyre (të varfrit), dhe vakëfit i drejtohemi kushtit të vakifit. Shembull: «Dyqani është vakëf për fëmijët e Ahmedit, pastaj për të varfrit»: djemtë e vajzat marrin njësoj; kur vdesin të gjithë, qiraja shkon për të varfrit.", "f": "٦٩"}, {"id": "D011", "k": 25, "lloji": "mcq", "q": "وقف رجلٌ على أولاد أخيه – وهم عشرةٌ يمكن حصرُهم – ولم يفضّل بعضَهم، فأراد الناظر أن يعطي الغلّةَ بعضَهم دون بعض. فما الحكم؟", "o": ["يجوز أن يخصّ بها واحداً منهم", "يجوز أن يفضّل أحوجَهم على غيره", "يلزم استيعابُهم بها والتسويةُ بينهم", "يُعطى الذكرُ منهم مثلَ حظّ الأنثيين"], "a": 2, "q_sq": "Një njeri bëri vakëf për fëmijët e vëllait të tij – që janë dhjetë dhe mund të numërohen – pa privilegjuar disa prej tyre; administruesi deshi t'ua japë të ardhurat disave e jo të tjerëve. Cila është dispozita?", "o_sq": ["Lejohet t'ia veçojë ato njërit prej tyre", "Lejohet ta privilegjojë më nevojtarin prej tyre mbi të tjerët", "Duhet t'i përfshijë të gjithë dhe t'i barazojë mes tyre", "Mashkulli prej tyre merr sa dy femra"], "pse_ar": "لقول المؤلف: «ومتى كان الوقف على من يمكن حصرُهم لزم استيعابهم به، والتسوية بينهم إذا لم يفضِّل بعضهم».", "pse_sq": "E sakta: duhet t'i përfshijë të gjithë dhe t'i barazojë. Autori thotë: «Kur vakëfi është për ata që mund të numërohen, duhet t'i përfshijë të gjithë dhe të barazojë mes tyre, kur (vakëfdhënësi) nuk ka privilegjuar disa prej tyre». Veçimi i njërit dhe privilegjimi i disave lejohen vetëm kur të përfshirët nuk mund të numërohen (si të varfrit në përgjithësi), jo këtu. Ndarja «mashkulli sa dy femra» nuk është rregulli i vakëfit pa kusht nga vakifi. Shembull: vakëf «për 10 nipërit e mi»: të ardhurat ndahen te të 10, në pjesë të barabarta.", "f": "٦٩"}, {"id": "D012", "k": 25, "lloji": "tf", "q": "إذا كان الوقف على قومٍ لا يمكن حصرُهم كالمساكين، جاز تفضيلُ بعضهم على بعض، وتخصيصُ واحدٍ منهم به.", "a": 0, "q_sq": "Kur vakëfi është për njerëz që nuk mund të numërohen, si të varfrit, lejohet privilegjimi i disave mbi të tjerët dhe veçimi i njërit prej tyre me të.", "pse_ar": "لقول المؤلف: «وإن لم يمكن حصرُهم جاز تفضيل بعضهم على بعض وتخصيص واحد منهم به».", "pse_sq": "Pohimi është i saktë. Autori thotë: «e nëse nuk mund të numërohen, lejohet privilegjimi i disave mbi të tjerët dhe veçimi i njërit prej tyre me të». Ndryshe është kur ata mund të numërohen: atëherë duhet t'i përfshijë të gjithë dhe t'i barazojë. Shembull: vakëf «për të varfrit»: administruesi mund t'u japë disave më shumë se të tjerëve, ose t'ia japë të gjitha të ardhurat e këtij viti një të varfri të vetëm.", "f": "٦٩"}, {"id": "D013", "k": 26, "lloji": "mcq", "q": "ما تعريفُ الهبة عند المؤلف؟", "o": ["تمليكُ المال بعد الموت بغير عوض", "تحبيسُ الأصل وتسبيلُ الثمرة", "تمليكُ المال في الحياة بعوضٍ معلوم", "تمليكُ المال في الحياة بغير عوض"], "a": 3, "q_sq": "Si e përkufizon autori hibenë (dhuratën)?", "o_sq": ["Dhënia e pronësisë së pasurisë pas vdekjes, pa kompensim", "Ndalimi i bazës dhe lëshimi i frytit në rrugën e mirë", "Dhënia e pronësisë së pasurisë gjatë jetës, me një kompensim të caktuar", "Dhënia e pronësisë së pasurisë gjatë jetës, pa kompensim"], "pse_ar": "لقول المؤلف: «وهي تمليك المال في الحياة بغير عوض».", "pse_sq": "E sakta: dhënia e pronësisë së pasurisë gjatë jetës, pa kompensim. Autori thotë: «Ajo është dhënia e pronësisë së pasurisë gjatë jetës, pa kompensim». Fjala «gjatë jetës» e dallon nga testamenti, i cili zbatohet pas vdekjes; fjala «pa kompensim» e dallon nga shitja, në të cilën merret çmimi. «Ndalimi i bazës dhe lëshimi i frytit» është përkufizimi i vakëfit. Shembull: i jep shokut një telefon dhuratë dhe nuk merr asgjë prej tij.", "f": "٧٠"}, {"id": "D014", "k": 26, "lloji": "tf", "q": "أعطى رجلٌ صديقَه هديّةً ملفوفةً مع ما يدلّ على أنها هبة، ولم يتلفّظا بإيجابٍ ولا قبول؛ فهذه الهبة لا تصحّ.", "a": 1, "q_sq": "Një njeri i dha mikut të tij një dhuratë të mbështjellë, bashkë me atë që tregon se është hibe, por asnjëri prej tyre nuk shqiptoi ofertë (ixhab) as pranim (kabul); kjo hibe nuk është e vlefshme.", "pse_ar": "بل تصح، لقول المؤلف: «وتصح بالإيجاب والقبول والعطية المقترنة بما يدل عليها».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «Ajo është e vlefshme me ofertë e pranim, si dhe me dhënien e shoqëruar me atë që e tregon atë». Pra hibeja bëhet ose me fjalë («Ta dhurova» – «E pranova»), ose me dhënie të shoqëruar me atë që tregon se është dhuratë. Këtu ka dhënie dhe tregues të qartë, prandaj hibeja vlen edhe pa fjalë. Shembull: ia jep dikujt në ditëlindje një pako të mbështjellë si dhuratë dhe ai e merr.", "f": "٧٠"}, {"id": "D015", "k": 26, "lloji": "mcq", "q": "قال رجلٌ لآخر: وهبتُك هذه الدار، فقال: قبلتُ، ولم يقبضها بعد. فمتى تصير الهبة لازمة؟", "o": ["إذا قبضها الموهوب له", "بمجرّد الإيجاب والقبول", "إذا أشهد عليها شاهدين", "إذا مات الواهب قبل الرجوع"], "a": 0, "q_sq": "Një njeri i tha tjetrit: «Ta dhurova këtë shtëpi», e ai tha: «E pranova», por ende nuk e ka marrë në dorë. Kur bëhet hibeja e detyrueshme (e pakthyeshme)?", "o_sq": ["Kur ai të cilit i dhurohet e merr në dorë", "Vetëm me ofertën dhe pranimin", "Kur dhuruesi merr dy dëshmitarë për të", "Kur dhuruesi vdes para se ta kthejë"], "pse_ar": "لقول المؤلف: «وتلزم بالقبض».", "pse_sq": "E sakta: kur e merr në dorë. Autori thotë: «bëhet e detyrueshme me marrjen në dorë». Oferta dhe pranimi e bëjnë hibenë të vlefshme, por ajo bëhet e detyrueshme vetëm me marrjen në dorë (kabd). Dëshmitarët dhe vdekja e dhuruesit nuk janë përmendur nga autori si shkak i detyrueshmërisë. Shembull: «Ta dhuroj makinën», por ende s'ia ka dhënë çelësat; hibeja bëhet e detyrueshme kur ai i merr çelësat dhe makinën.", "f": "٧٠"}, {"id": "D016", "k": 26, "lloji": "mcq", "q": "وهب رجلٌ أخاه سيّارةً فقبضها، ثم أراد الرجوع فيها. فما الحكم؟", "o": ["يجوز له الرجوع ما دامت باقية", "يجوز له الرجوع إن لم يكن أخوه محتاجاً", "لا يجوز له الرجوع فيها", "يجوز له الرجوع في نصفها دون نصفها"], "a": 2, "q_sq": "Një njeri i dhuroi vëllait të tij një makinë dhe ai e mori në dorë; pastaj deshi ta kthejë (ta marrë mbrapsht). Cila është dispozita?", "o_sq": ["Lejohet ta kthejë derisa ajo ekziston", "Lejohet ta kthejë nëse vëllai i tij nuk ka nevojë", "Nuk lejohet ta kthejë", "Lejohet ta kthejë gjysmën e saj, jo gjysmën tjetër"], "pse_ar": "لقول المؤلف: «ولا يجوز الرجوع فيها، إلا الأب»، ولقوله ﷺ: «لا يحلُّ لأحدٍ أن يُعطيَ عطيةً فيرجعَ فيها، إلا الوالدَ فيما يُعطي ولدَه».", "pse_sq": "E sakta: nuk lejohet ta kthejë. Autori thotë: «dhe nuk lejohet kthimi në të, përveç babait», për shkak të fjalës së të Dërguarit të Allahut ﷺ: «Askujt nuk i lejohet të japë një dhuratë e pastaj ta kthejë (ta marrë mbrapsht), përveç prindit në atë që i jep fëmijës së tij». Dhuruesi këtu është vëlla, jo baba, dhe dhurata është marrë në dorë, pra është bërë e detyrueshme. Autori nuk e lidh kthimin me ekzistencën e sendit, me nevojën e marrësit apo me gjysmën. Shembull: i dhurove vëllait një orë dhe ai e mori; nuk mund t'ia kërkosh mbrapsht.", "f": "٧٠"}, {"id": "D017", "k": 26, "lloji": "tf", "q": "يجوز للأب أن يرجع فيما وهبه لولده، ودليلُه قولُه ﷺ: «لا يحلُّ لأحدٍ أن يُعطيَ عطيةً فيرجعَ فيها، إلا الوالدَ فيما يُعطي ولدَه».", "a": 0, "q_sq": "Babai lejohet ta kthejë (ta marrë mbrapsht) atë që i ka dhuruar fëmijës së vet, dhe argumenti i kësaj është fjala e tij ﷺ: «Askujt nuk i lejohet të japë një dhuratë e pastaj ta kthejë (ta marrë mbrapsht), përveç prindit në atë që i jep fëmijës së tij».", "pse_ar": "لقول المؤلف: «ولا يجوز الرجوع فيها، إلا الأب، لقول رسول الله ﷺ: لا يحلُّ لأحدٍ أن يُعطيَ عطيةً فيرجعَ فيها، إلا الوالدَ فيما يُعطي ولدَه».", "pse_sq": "Pohimi është i saktë. Autori e përjashton babain nga ndalimi i kthimit të dhuratës dhe e argumenton me hadithin: «Askujt nuk i lejohet të japë një dhuratë e pastaj ta kthejë (ta marrë mbrapsht), përveç prindit në atë që i jep fëmijës së tij». Të gjithë të tjerët, pasi dhurata merret në dorë, nuk mund ta kthejnë. Shembull: babai i dhuroi djalit një makinë; ai mund ta marrë mbrapsht.", "f": "٧٠"}, {"id": "D018", "k": 26, "lloji": "mcq", "q": "أراد رجلٌ أن يعطي أولادَه عطيّةً، وله ابنٌ وبنت – وميراثُ الابن ضعفُ ميراث البنت – فأعطى الابنَ ألفَي درهم. فكم المشروعُ أن يعطي البنت؟", "o": ["ألفا درهم", "ألفُ درهم", "خمسمئةُ درهم", "أربعةُ آلاف درهم"], "a": 1, "q_sq": "Një njeri dëshiron t'u japë dhuratë fëmijëve të vet; ka një djalë dhe një vajzë – dhe trashëgimia e djalit është dyfishi i trashëgimisë së vajzës – dhe djalit i dha dy mijë dirhemë. Sa është e ligjësuar t'i japë vajzës?", "o_sq": ["Dy mijë dirhemë", "Një mijë dirhemë", "Pesëqind dirhemë", "Katër mijë dirhemë"], "pse_ar": "لقول المؤلف: «والمشروع في عطية الأولاد أن يسوى بينهم على قدر ميراثهم»، لقوله ﷺ: «اتقُوا الله واعدلُوا بين أولادِكم».", "pse_sq": "E sakta: një mijë dirhemë. Autori thotë: «E ligjësuara në dhuratën për fëmijët është të barazohen mes tyre sipas masës së trashëgimisë së tyre, për shkak të fjalës së të Dërguarit të Allahut ﷺ: ‹Frikësojuni Allahut dhe bëhuni të drejtë ndaj fëmijëve tuaj!›». Meqë trashëgimia e djalit është dyfishi i asaj të vajzës, raporti i dhuratës është 2 : 1; djali mori 2.000, pra vajza merr 1.000. Dy mijë do të ishte barazim në shumë, jo «sipas masës së trashëgimisë»; pesëqind dhe katër mijë e prishin raportin.", "f": "٧٠"}, {"id": "D019", "k": 26, "lloji": "mcq", "q": "قال رجلٌ لزيدٍ: أعمرتُك داري، وقال لعمرٍو: سُكنى داري الأخرى لك عمرَك. فما حكمُ الدارين؟", "o": ["الأولى للمعطي أخذُها متى شاء، والثانية لعمرٍو ولورثته", "كلتاهما للمعطَى ولورثته من بعده", "الأولى لزيدٍ ولورثته، والثانية للمعطي أخذُها متى شاء", "كلتاهما للمعطي أن يأخذها متى شاء"], "a": 2, "q_sq": "Një njeri i tha Zejdit: «Ta dhashë shtëpinë time si umra (për gjithë jetën tënde)», dhe i tha Amrit: «Banimi në shtëpinë time tjetër është i yti sa të jetosh». Cila është dispozita e dy shtëpive?", "o_sq": ["E para: dhënësi mund ta marrë kurdo; e dyta: është e Amrit dhe e trashëgimtarëve të tij", "Të dyja janë të marrësve dhe të trashëgimtarëve të tyre pas tyre", "E para është e Zejdit dhe e trashëgimtarëve të tij; e dyta: dhënësi mund ta marrë kurdo", "Të dyja: dhënësi mund t'i marrë kurdo"], "pse_ar": "لقول المؤلف: «إذا قال لرجل: أعمرتُك داري أو هي لك عمرك، فهي له ولورثته من بعده، وإن قال: سكناها لك عمرَك، فله أخذها متى شاء».", "pse_sq": "E sakta: e para është e Zejdit dhe e trashëgimtarëve të tij, ndërsa të dytën dhënësi mund ta marrë kurdo. Autori thotë: «Nëse i thotë një njeriu: ‹Ta dhashë shtëpinë time si umra›, ose: ‹Është e jotja sa të jetosh›, ajo është e tij dhe e trashëgimtarëve të tij pas tij; e nëse thotë: ‹Banimi në të është i yti sa të jetosh›, (dhuruesi) mund ta marrë (mbrapsht) sa herë të dojë». Dallimi: te umra ia ka dhënë vetë shtëpinë, ndërsa te «banimi» i ka dhënë vetëm dobinë e banimit, jo shtëpinë. Shembull: «Rri në apartamentin tim sa të jetosh»: pronari mund ta marrë mbrapsht kurdo.", "f": "٧٠"}, {"id": "D020", "k": 27, "lloji": "mcq", "q": "أيُّ هؤلاء ذكره المؤلف ممّن تبرّعاتُه كتبرّعات المريض مرضَ الموت المخوف، إذا اتّصل به الموت؟", "o": ["راكبُ البحر حالَ سكونه", "المسافرُ في طريقٍ آمن", "راكبُ البحر حالَ هيجانه", "مَن وقع الطاعون في غير بلده"], "a": 2, "q_sq": "Cilin nga këta e përmend autori si njeri, dhurimet e të cilit janë si dhurimet e të sëmurit në sëmundjen e vdekjes nga e cila ka frikë, kur vdekja i vjen pa ndërprerje (vdes në atë gjendje)?", "o_sq": ["Ai që lundron në det kur deti është i qetë", "Udhëtari në një rrugë të sigurt", "Ai që lundron në det kur deti është i trazuar", "Ai që ka murtajë (taun) në një vend tjetër, jo në vendin e tij"], "pse_ar": "لقول المؤلف: «ومن هو في الخوف كالمريض، وكالواقف بين صفين عند التحام القتال، ومن قُدِّم ليُقتل، وراكب البحر حالَ هيجانه، ومَن وقع الطاعون ببلده إذا اتصل بهم الموت».", "pse_sq": "E sakta: ai që lundron në det kur ai është i trazuar. Autori përmend, përveç të sëmurit, edhe ata që janë në rrezik si ai: «si ai që qëndron ndërmjet dy rreshtave kur përleshet lufta, ai që nxirret për t'u ekzekutuar, ai që lundron në det kur ai është i trazuar dhe ai në vendin e të cilit ka rënë murtaja – kur ata pastaj vdesin (nga ajo gjendje)». Kushti i lundruesit është trazimi i detit, jo deti i qetë; kushti i murtajës është që ajo të jetë në vendin e tij, jo në një vend tjetër; udhëtari në rrugë të sigurt nuk është në rrezik. Shembull i sotëm: një udhëtar në anije gjatë stuhisë dhuron pasuri dhe vdes në atë stuhi: dhurimi i tij trajtohet si testament.", "f": "٧٠"}, {"id": "D021", "k": 27, "lloji": "tf", "q": "وقف رجلٌ بين الصفّين عند التحام القتال فوهب مالاً، ثم سَلِم من المعركة وعاش بعدها زماناً طويلاً؛ فهبتُه حكمُها حكمُ الوصيّة.", "a": 1, "q_sq": "Një njeri qëndronte mes dy rreshtave kur u përlesh lufta dhe dhuroi pasuri; pastaj shpëtoi nga beteja dhe jetoi pas saj për një kohë të gjatë. Dhurata e tij e ka dispozitën e testamentit.", "pse_ar": "لأن المؤلف قيّد هذا الحكم بقوله: «إذا اتصل بهم الموت»، وهذا لم يتّصل به الموت.", "pse_sq": "Pohimi është i pasaktë. Autori, pasi i numëron ata që janë në rrezik si i sëmuri, e kushtëzon dispozitën me fjalët: «kur ata pastaj vdesin (nga ajo gjendje)». Ky njeri shpëtoi dhe jetoi, pra vdekja nuk i erdhi në atë gjendje; dhurata e tij nuk trajtohet si testament, por si dhurata e çdo njeriu të shëndoshë. Shembull: ushtari dhuroi diçka në mes të betejës, por u kthye shëndoshë në shtëpi: dhurata e tij nuk kufizohet me të tretën.", "f": "٧٠"}, {"id": "D022", "k": 27, "lloji": "mcq", "q": "وهب مريضٌ مرضَ الموت المخوف أجنبيًّا نصفَ ماله، ثم مات، ولم يُجز الورثةُ الزيادة. فما الحكم؟", "o": ["تنفذ الهبة في الثلث فقط", "تنفذ الهبة في النصف كلّه", "تبطل الهبة كلُّها", "تنفذ الهبة في السدس فقط"], "a": 0, "q_sq": "Një i sëmurë në sëmundjen e vdekjes nga e cila ka frikë i dhuroi një të huaji (jo-trashëgimtari) gjysmën e pasurisë së tij, pastaj vdiq, dhe trashëgimtarët nuk e miratuan tepricën. Cila është dispozita?", "o_sq": ["Dhurata zbatohet vetëm në të tretën", "Dhurata zbatohet në të gjithë gjysmën", "Dhurata prishet e tëra", "Dhurata zbatohet vetëm në të gjashtën"], "pse_ar": "لقول المؤلف: «أحدها: أنها لا تجوز لأجنبي بزيادة على الثلث، ولا لوارث بشيء إلا بإجازة الورثة».", "pse_sq": "E sakta: zbatohet vetëm në të tretën. Autori thotë për dhurimet e të sëmurit: «E para: nuk lejohen për një të huaj në më shumë se një të tretën, as për një trashëgimtar në asgjë, përveç me miratimin e trashëgimtarëve». Gjysma e tejkalon të tretën, dhe trashëgimtarët nuk e miratuan tepricën; prandaj vlen e treta, ndërsa teprica u kthehet trashëgimtarëve. Dhurata nuk prishet e tëra, sepse brenda së tretës vlen; e gjashta nuk ka lidhje me këtë rast. Shembull: ka 90.000 € dhe në sëmundjen e vdekjes i dhuron një të huaji 45.000 €: vlen vetëm 30.000 €.", "f": "٧٠"}, {"id": "D023", "k": 27, "lloji": "mcq", "q": "أعتق رجلٌ عند موته ستّةَ مملوكين – قيمتُهم متساوية – ولا مال له غيرهم، ولم يُجز الورثة. فما الحكم؟", "o": ["يُعتق من كلّ واحدٍ منهم ثلثُه", "يُعتق الستّةُ كلُّهم", "يُعتق ثلاثةٌ منهم بالقرعة", "يُعتق اثنان منهم بالقرعة"], "a": 3, "q_sq": "Një njeri në vdekjen e tij liroi gjashtë robër (memlukë) – me vlerë të barabartë – dhe nuk kishte pasuri tjetër përveç tyre, ndërsa trashëgimtarët nuk e miratuan. Cila është dispozita?", "o_sq": ["Lirohet një e treta e secilit prej tyre", "Lirohen të gjashtë", "Lirohen tre prej tyre me short", "Lirohen dy prej tyre me short"], "pse_ar": "لما روي «أن رجلاً أعتق ستة مملوكين عند موته لم يكن له مال غيرهم، فدعا بهم النبي ﷺ فجزَّأهم أثلاثاً فأعتق اثنين وأرقَّ أربعة»، ولقول المؤلف: «أن الحرية تُجمع في بعض العبيد بالقرعة إذا لم يف الثلثُ بالجميع».", "pse_sq": "E sakta: lirohen dy me short. Autori sjell hadithin: «se një njeri liroi gjashtë robër në vdekjen e tij, ndërsa nuk kishte pasuri tjetër përveç tyre; Pejgamberi ﷺ i thirri, i ndau në tri pjesë, liroi dy prej tyre dhe katër i la robër», dhe thotë: «E dyta: liria përqendrohet te disa nga robërit me short, kur e treta nuk i mjafton të gjithëve». E treta e gjashtë robërve me vlerë të barabartë është dy robër. Liria nuk shpërndahet si një e treta e secilit, por përqendrohet te dy robër të plotë që i zgjedh shorti. Lirimi i të gjashtëve ose i tre prej tyre e tejkalon të tretën pa miratim.", "f": "٧٠"}, {"id": "D024", "k": 27, "lloji": "mcq", "q": "قال مريضٌ مرضَ الموت: أعتقتُ أحدَ عبيدي، ولم يعيّنه، ثم مات. فكيف يُعيَّن المعتَق؟", "o": ["يختار الورثةُ منهم مَن شاؤوا", "يُخرج بالقرعة", "يُعتق من كلّ واحدٍ منهم جزء", "يعيّنه الحاكم باجتهاده"], "a": 1, "q_sq": "Një i sëmurë në sëmundjen e vdekjes tha: «E lirova njërin nga robërit e mi», pa e përcaktuar, pastaj vdiq. Si caktohet i liruari?", "o_sq": ["Trashëgimtarët zgjedhin cilin të duan prej tyre", "Nxirret me short", "Lirohet nga një pjesë e secilit prej tyre", "E cakton gjykatësi sipas gjykimit të tij"], "pse_ar": "لقول المؤلف: «الثالث: أنه إذا أعتق عبداً غير معين أو معيناً فأشكل، أُخرج بالقرعة».", "pse_sq": "E sakta: nxirret me short. Autori thotë: «E treta: kur liron një rob të papërcaktuar, ose të përcaktuar e pastaj ngatërrohet (cili ishte), ai nxirret me short». Zgjedhja nga trashëgimtarët është dispozita e testamentit me një send të papërcaktuar për dikë («si një rob nga robërit e tij, dhe trashëgimtarët i japin cilin të duan prej tyre»), jo e lirimit. Lirimi i një pjese nga secili dhe caktimi nga gjykatësi nuk përmenden. Po kështu, nëse e kishte caktuar një rob, por pastaj u harrua cili ishte, caktohet me short.", "f": "٧٠"}, {"id": "D025", "k": 27, "lloji": "mcq", "q": "أعتق مريضٌ عبداً قيمتُه ألفُ درهم، ولا مال له سواه، ثم ملك عند موته سوى العبد ألفَي درهم (ضِعفَ قيمته). فما الحكم؟", "o": ["يُعتق ثلثُه فقط، لأنه كان كلَّ ماله حين العتق", "يُعتق كلُّه من حين الموت، وكسبُه قبله للورثة", "يُعتق كلُّه من حين إعتاقه، وكسبُه بعد ذلك له", "يُعتق ثلثاه، ويبقى ثلثُه رقيقاً للورثة"], "a": 2, "q_sq": "Një i sëmurë liroi një rob me vlerë një mijë dirhemë, ndërsa nuk kishte pasuri tjetër përveç tij; pastaj në kohën e vdekjes zotëronte, përveç robit, dy mijë dirhemë (dyfishin e vlerës së tij). Cila është dispozita?", "o_sq": ["Lirohet vetëm një e treta e tij, sepse ishte e gjithë pasuria e tij në kohën e lirimit", "Lirohet i tëri që nga koha e vdekjes, dhe fitimi i tij para saj u takon trashëgimtarëve", "Lirohet i tëri që nga koha e lirimit të tij, dhe fitimi i tij pas kësaj është i tij", "Lirohen dy të tretat e tij, dhe një e treta mbetet rob për trashëgimtarët"], "pse_ar": "لقول المؤلف: «الرابع: أنه يُعتبر خروجُها من الثلث حال الموت، فلو أعتق عبداً لا مال له سواه... ثم ملك عند الموت ضِعفَ قيمته تبيَّنَّا أنه عتق كلُّه حين إعتاقه، وكان ما كسبه بعد ذلك له».", "pse_sq": "E sakta: lirohet i tëri që nga koha e lirimit, dhe fitimi i tij pas kësaj është i tij. Autori thotë: «E katërta: merret parasysh që ajo (dhurata) të përfshihet në të tretën në kohën e vdekjes; kështu, nëse liron një rob ndërsa nuk ka pasuri tjetër përveç tij... e pastaj në vdekje zotëron dyfishin e vlerës së tij, kuptojmë se ai (robi) është liruar i tëri në kohën e lirimit të tij, dhe ajo që ka fituar pas kësaj është e tij». Llogaria: pasuria në vdekje = 1.000 (robi) + 2.000 = 3.000; e treta = 1.000 = vlera e robit. E treta llogaritet në kohën e vdekjes, jo në kohën e lirimit (prandaj opsioni i parë është i gabuar), dhe lirimi vlen që nga dita e lirimit, jo nga vdekja (prandaj opsioni i dytë është i gabuar).", "f": "٧٠"}, {"id": "D026", "k": 27, "lloji": "tf", "q": "أعتق مريضٌ عبدَه، ثم صار عليه عند موته دَينٌ يستغرق مالَه كلَّه؛ فإنه يُعتق من العبد ثلثُه.", "a": 1, "q_sq": "Një i sëmurë e liroi robin e tij, pastaj në kohën e vdekjes i doli një borxh që ia përfshin të gjithë pasurinë; prej robit lirohet një e treta e tij.", "pse_ar": "بل لا يعتق منه شيء، لقول المؤلف: «وإن صار عليه دين يستغرقه لم يعتق منه شيء، ولا يصح تبرعه به».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «e nëse (dhuruesi) bie në një borxh që e përfshin të gjithë (pasurinë), nuk lirohet asgjë prej tij dhe dhurimi i tij nuk është i vlefshëm». Meqë e treta llogaritet në kohën e vdekjes, dhe në atë kohë borxhi e përfshin gjithë pasurinë, nuk mbetet e tretë nga e cila të zbatohet lirimi. Shembull: liroi robin në sëmundje, por në vdekje kishte borxhe sa e gjithë pasuria e tij: lirimi nuk vlen fare.", "f": "٧١"}, {"id": "D027", "k": 27, "lloji": "mcq", "q": "أوصى رجلٌ لآخر بأرض، فلم يأخذها الموصى له إلا بعد سنتين من موت الموصي، وقد زادت قيمتُها. فمتى تُقوَّم عليه؟", "o": ["وقتَ موت الموصي", "وقتَ أخذ الموصى له", "وقتَ كتابة الوصيّة", "بأكثر القيمتين"], "a": 0, "q_sq": "Një njeri ia la me testament tjetrit një tokë; ai të cilit iu la nuk e mori veçse dy vjet pas vdekjes së testamentlënësit, ndërkohë vlera e saj u rrit. Në cilën kohë vlerësohet ajo për të?", "o_sq": ["Në kohën e vdekjes së testamentlënësit", "Në kohën kur e merr ai të cilit iu la", "Në kohën e shkrimit të testamentit", "Me më të madhen nga dy vlerat"], "pse_ar": "لقول المؤلف: «ولو وصى له بشيء فلم يأخذه الموصى له زماناً قوِّم عليه وقت الموت لا وقت الأخذ».", "pse_sq": "E sakta: në kohën e vdekjes. Autori thotë: «Nëse ia lë me testament diçka dhe ai të cilit i është lënë nuk e merr për ca kohë, vlerësohet për të në kohën e vdekjes, e jo në kohën e marrjes». Kjo është pjesë e rregullit se e treta llogaritet në kohën e vdekjes. Koha e shkrimit të testamentit dhe «vlera më e madhe» nuk përmenden nga autori. Shembull: toka vlente 10.000 € ditën e vdekjes dhe 15.000 € kur u mor; në llogarinë e së tretës merret 10.000 €.", "f": "٧١"}, {"id": "D028", "k": 27, "lloji": "mcq", "q": "رجلٌ أعطى أخاه في مرض موته ولا ولد له، ثم وُلد له ابن. ورجلٌ آخر أعطى أخاه في مرض موته وله ابن، ثم مات الابنُ قبله. وكلُّ عطيّةٍ منهما دون الثلث، ولم يُجز الورثة – والابنُ يحجب الأخَ عن الميراث –. فما حكمُ العطيّتين؟", "o": ["تبطل الأولى، وتصحّ الثانية", "تصحّ العطيّتان جميعاً", "تبطل العطيّتان جميعاً", "تصحّ الأولى، وتبطل الثانية"], "a": 3, "q_sq": "Një njeri i dha vëllait të tij (dhuratë) në sëmundjen e vdekjes, ndërsa nuk kishte fëmijë, pastaj i lindi një djalë. Një tjetër i dha vëllait të tij në sëmundjen e vdekjes, ndërsa kishte një djalë, pastaj djali vdiq para tij. Secila dhuratë është nën të tretën, dhe trashëgimtarët nuk e miratuan – dhe djali e përjashton vëllanë nga trashëgimia –. Cila është dispozita e dy dhuratave?", "o_sq": ["E para prishet, e dyta është e vlefshme", "Të dyja janë të vlefshme", "Të dyja prishen", "E para është e vlefshme, e dyta prishet"], "pse_ar": "لقول المؤلف: «الخامس: أن كونه وارثاً يُعتبر حالة الموت فيها، فلو أعطى أخاه أو وصى له ولا ولد له فوُلد له ابن صحت العطية والوصية، ولو كان له ابن فمات بطلتا».", "pse_sq": "E sakta: e para është e vlefshme, e dyta prishet. Autori thotë: «E pesta: të qenët trashëgimtar (i marrësit) merret parasysh në kohën e vdekjes (së dhuruesit); kështu, nëse i jep vëllait të tij ose ia lë me testament, ndërsa nuk ka fëmijë, e pastaj i lind një djalë, dhurata dhe testamenti janë të vlefshme; e nëse kishte djalë dhe ai vdes, të dyja prishen». Te i pari: në kohën e vdekjes ka djalë, prandaj vëllai nuk është trashëgimtar dhe dhurata vlen (brenda së tretës). Te i dyti: në kohën e vdekjes djali s'është më, prandaj vëllai është trashëgimtar, dhe trashëgimtarit nuk i jepet asgjë pa miratim. Koha e dhënies nuk merret parasysh.", "f": "٧١"}, {"id": "D029", "k": 27, "lloji": "mcq", "q": "أعطى مريضٌ مرضَ الموت أحدَ أبنائه عطيّة، فأجازها بقيّةُ الأبناء في حياته، ثم ردّوها بعد موته. فما الحكم؟", "o": ["تنفذ، لأن إجازتهم الأولى معتبرة", "يُعتبر ردُّهم بعد الموت، فلا تنفذ", "تنفذ في قدر الثلث دون ما زاد عليه", "تنفذ في نصفها، ويبطل نصفُها الآخر"], "a": 1, "q_sq": "Një i sëmurë në sëmundjen e vdekjes i dha njërit prej djemve të tij një dhuratë; djemtë e tjerë e miratuan atë ndërsa ai ishte gjallë, pastaj e refuzuan pas vdekjes së tij. Cila është dispozita?", "o_sq": ["Zbatohet, sepse miratimi i tyre i parë merret parasysh", "Merret parasysh refuzimi i tyre pas vdekjes, prandaj nuk zbatohet", "Zbatohet në masën e së tretës, jo në atë që e tejkalon", "Zbatohet në gjysmën e saj, dhe gjysma tjetër prishet"], "pse_ar": "لقول المؤلف: «السادس: أنه لا يُعتبر ردُّ الورثة وإجازتهم إلا بعد الموت فيهما»، والعطية لا تجوز «لوارث بشيء إلا بإجازة الورثة».", "pse_sq": "E sakta: merret parasysh refuzimi pas vdekjes, prandaj nuk zbatohet. Autori thotë: «E gjashta: refuzimi dhe miratimi i trashëgimtarëve nuk merret parasysh veçse pas vdekjes, në të dyja», dhe më parë: dhurimet e të sëmurit nuk lejohen «as për një trashëgimtar në asgjë, përveç me miratimin e trashëgimtarëve». Miratimi i tyre gjatë jetës nuk ka vlerë; vlen ajo që thanë pas vdekjes, dhe ata refuzuan. Opsioni «zbatohet në masën e së tretës» është i gabuar, sepse e treta lejohet për të huajin; për trashëgimtarin nuk vlen asgjë pa miratim.", "f": "٧١"}, {"id": "D030", "k": 27, "lloji": "mcq", "q": "وهب مريضٌ مرضَ الموت أجنبيًّا عبداً – قيمتُه دون ثلث ماله – فقبضه، فكسب العبدُ مالاً قبل موت الواهب. فلمن هذا الكسب؟", "o": ["للموهوب له", "لورثة الواهب", "بين الموهوب له والورثة نصفين", "للعبد نفسه"], "a": 0, "q_sq": "Një i sëmurë në sëmundjen e vdekjes i dhuroi një të huaji një rob – vlera e të cilit është nën të tretën e pasurisë së tij – dhe ai e mori në dorë; pastaj robi fitoi pasuri para vdekjes së dhuruesit. I kujt është ky fitim?", "o_sq": ["I atij të cilit iu dhurua", "I trashëgimtarëve të dhuruesit", "Gjysmë për atë të cilit iu dhurua dhe gjysmë për trashëgimtarët", "I vetë robit"], "pse_ar": "لقول المؤلف: «أحدها: أن العطية تنفذ من حينها، فلو أعتق عبداً أو أعطاه إنساناً صار المعتَق حرًّا وملَكَه المعطَى وكسبُه له».", "pse_sq": "E sakta: i atij të cilit iu dhurua. Ky është dallimi i parë mes dhuratës dhe testamentit. Autori thotë: «E para: dhurata zbatohet që në çastin e saj; kështu, nëse liron një rob ose ia jep dikujt, i liruari bëhet i lirë, marrësi bëhet pronar i tij dhe fitimi i tij është i tij». Ndryshe te testamenti: «e nëse e lë me testament ose e bën mudebber (të lirë pas vdekjes së tij), nuk lirohet dhe ai të cilit i është lënë nuk bëhet pronar i tij veçse pas vdekjes; dhe ajo që fiton ose shtimi i ndarë që ndodh në të (para vdekjes) u takon trashëgimtarëve». Pra opsioni «i trashëgimtarëve» është dispozita e testamentit, jo e dhuratës.", "f": "٧١"}, {"id": "D031", "k": 27, "lloji": "mcq", "q": "في أيّ ما يلي تفارق العطيّةُ في مرض الموت الوصيّةَ؟", "o": ["أنّ العطية لا تجوز لوارثٍ إلا بإجازة الورثة", "أنّ العطية يُعتبر خروجُها من الثلث حالَ الموت", "أنّ العطية لازمةٌ لا يملك المعطي الرجوعَ فيها", "أنّ العطية لا يُعتبر ردُّ الورثة لها إلا بعد الموت"], "a": 2, "q_sq": "Në cilën nga këto dhurata në sëmundjen e vdekjes ndryshon nga testamenti?", "o_sq": ["Që dhurata nuk lejohet për trashëgimtarin, përveç me miratimin e trashëgimtarëve", "Që për dhuratën merret parasysh përfshirja e saj në të tretën në kohën e vdekjes", "Që dhurata është e detyrueshme dhe dhuruesi nuk ka të drejtë ta kthejë", "Që për dhuratën refuzimi i trashëgimtarëve nuk merret parasysh veçse pas vdekjes"], "pse_ar": "لقول المؤلف: «الثالث: أنها تقع لازمةً لا يملك المعطي الرجوع فيها، والوصيةُ له الرجوع فيها متى شاء»، وأما البواقي فمما تشبه فيه العطيةُ الوصيةَ.", "pse_sq": "E sakta: dhurata është e detyrueshme dhe nuk mund të kthehet. Autori thotë te dallimet: «E treta: ajo (dhurata) bëhet e detyrueshme dhe dhuruesi nuk mund të kthehet prej saj; ndërsa nga testamenti ai mund të kthehet sa herë të dojë». Tri opsionet e tjera janë nga gjashtë dispozitat në të cilat dhurata i ngjan testamentit: (1) asgjë për trashëgimtarin pa miratim, (4) e treta llogaritet në kohën e vdekjes, (6) refuzimi dhe miratimi vlejnë vetëm pas vdekjes. Shembull: i sëmuri i dhuroi dikujt një makinë dhe ai e mori; nuk mund ta kthejë. Por nëse ia la me testament, mund ta anulojë kurdo derisa është gjallë.", "f": "٧١"}, {"id": "D032", "k": 27, "lloji": "tf", "q": "العطيّة في مرض الموت يُعتبر قبولُها وردُّها حين وجودها، والوصيّة لا يُعتبر قبولُها ولا ردُّها إلا بعد موت الموصي.", "a": 0, "q_sq": "Për dhuratën në sëmundjen e vdekjes merren parasysh pranimi dhe refuzimi i saj kur ndodh, ndërsa për testamentin nuk merren parasysh as pranimi as refuzimi i tij veçse pas vdekjes së testamentlënësit.", "pse_ar": "لقول المؤلف: «الثاني: أن العطية يُعتبر قبولها وردها حين وجودها كعطية الصحيح، والوصية لا يُعتبر قبولها ولا ردها إلا بعد موت الموصي».", "pse_sq": "Pohimi është i saktë. Ky është dallimi i dytë që përmend autori: «E dyta: për dhuratën merren parasysh pranimi dhe refuzimi i saj kur ndodh, si dhurata e të shëndoshit; ndërsa për testamentin nuk merren parasysh as pranimi as refuzimi i tij veçse pas vdekjes së testamentlënësit». Shembull: i sëmuri i jep dikujt një dhuratë; ai e pranon ose e refuzon në atë çast. Por nëse dikush i thotë «Të kam lënë me testament shtëpinë», pranimi ose refuzimi i tij para vdekjes së testamentlënësit nuk ka vlerë.", "f": "٧١"}, {"id": "D033", "k": 27, "lloji": "mcq", "q": "مريضٌ مرضَ الموت ثلثُ ماله ألفُ درهم، فوهب زيداً ألفاً، ثم وهب بعد ذلك عمراً ألفاً، ولم يُجز الورثة. فما الحكم؟", "o": ["لكلّ واحدٍ منهما خمسمئة", "لعمرٍو الألف، ولا شيء لزيد", "تبطل العطيّتان جميعاً", "لزيدٍ الألف، ولا شيء لعمرو"], "a": 3, "q_sq": "Një i sëmurë në sëmundjen e vdekjes, e treta e pasurisë së të cilit është një mijë dirhemë, i dhuroi Zejdit një mijë, pastaj më vonë i dhuroi Amrit një mijë, dhe trashëgimtarët nuk e miratuan. Cila është dispozita?", "o_sq": ["Secili prej tyre merr pesëqind", "Amri merr një mijë, Zejdi asgjë", "Të dyja dhuratat prishen", "Zejdi merr një mijë, Amri asgjë"], "pse_ar": "لقول المؤلف: «الرابع: أن يبدأ بالأول فالأول منها إذا ضاق الثلث عن جميعها، والوصية يسوَّى بين الأول منها والآخر».", "pse_sq": "E sakta: Zejdi merr një mijë, Amri asgjë. Ky është dallimi i katërt: «E katërta: (në dhurata) fillohet me të parën e me radhë, kur e treta nuk mjafton për të gjitha; ndërsa në testament barazohen e para dhe e fundit, dhe mangësia bie mbi secilin sipas masës së testamentit të tij». Dhurata e Zejdit erdhi e para dhe e mbushi të tretën, prandaj për Amrin nuk mbeti asgjë. Ndarja 500 / 500 është dispozita e testamenteve (dhe e dhuratave që bëhen njëherësh), jo e dhuratave të njëpasnjëshme.", "f": "٧١"}, {"id": "D034", "k": 27, "lloji": "tf", "q": "وهب مريضٌ مرضَ الموت زيداً ألفاً وعمراً ألفاً دفعةً واحدة، وثلثُ ماله ألف، ولم يُجز الورثة؛ فيُقدَّم زيدٌ بالألف لأنه ذُكر أولاً.", "a": 1, "q_sq": "Një i sëmurë në sëmundjen e vdekjes i dhuroi Zejdit një mijë dhe Amrit një mijë njëherësh (në të njëjtën kohë), e treta e pasurisë së tij është një mijë, dhe trashëgimtarët nuk e miratuan; Zejdi paraprin me një mijë, sepse u përmend i pari.", "pse_ar": "بل يُسوّى بينهما كالوصايا، لقول المؤلف: «وكذلك الحكم في العطايا إذا وقعت دفعة واحدة».", "pse_sq": "Pohimi është i pasaktë. Autori, pasi thotë se në testamente «barazohen e para dhe e fundit, dhe mangësia bie mbi secilin sipas masës së testamentit të tij», shton: «dhe e njëjta është dispozita për dhuratat kur ndodhin njëherësh». Këtu dhuratat ndodhën njëherësh, prandaj nuk ka «të parë»: e treta (1.000) ndahet mes tyre në përpjesëtim, secili merr 500. Radha (e para, pastaj tjetra) vlen vetëm kur dhuratat bëhen njëra pas tjetrës.", "f": "٧١"}, {"id": "D035", "k": 28, "lloji": "mcq", "q": "بكم يُستحبّ أن يوصي مَن ترك خيراً (مالاً) من ماله؟", "o": ["بالثلث", "بالخُمس", "بالنصف", "بالربع"], "a": 1, "q_sq": "Me sa nga pasuria e tij është e pëlqyer të lërë testament ai që lë pasuri (hajr)?", "o_sq": ["Me të tretën", "Me të pestën", "Me gjysmën", "Me të katërtën"], "pse_ar": "لقول المؤلف: «ويستحب لمن ترك خيراً الوصيةُ بخُمس ماله».", "pse_sq": "E sakta: me të pestën. Autori thotë: «Për atë që lë pasuri është e pëlqyer testamenti me të pestën e pasurisë së tij». E treta është kufiri më i lartë i lejuar, jo masa e pëlqyer; madje për të Pejgamberi ﷺ tha: «Të tretën, por edhe e treta është shumë». Gjysma nuk lejohet pa miratimin e trashëgimtarëve (në hadithin e Sa'dit Pejgamberi ﷺ e refuzoi). E katërta nuk është masa që përmend autori. Shembull: ka 100.000 €; e pëlqyer është të lërë 20.000 € për vepra të mira.", "f": "٧٣"}, {"id": "D036", "k": 28, "lloji": "mcq", "q": "في حديث سعدٍ الذي صدّر به المؤلفُ كتابَ الوصايا – وكان لا يرثه إلا ابنة – بماذا أجابه النبي ﷺ؟", "o": ["أذن له في الثلث، وقال: والثلث كثير", "منعه من الثلث كما منعه من الشطر", "أذن له في الشطر دون الثلثين", "أذن له في الثلثين لأنه لا يرثه إلا ابنة"], "a": 0, "q_sq": "Në hadithin e Sa'dit, me të cilin autori e nis Librin e testamenteve – dhe atë nuk e trashëgonte askush përveç një vajze – si iu përgjigj Pejgamberi ﷺ?", "o_sq": ["Ia lejoi të tretën dhe tha: edhe e treta është shumë", "Ia ndaloi të tretën, ashtu siç ia ndaloi gjysmën", "Ia lejoi gjysmën, por jo dy të tretat", "Ia lejoi dy të tretat, sepse nuk e trashëgonte askush përveç një vajze"], "pse_ar": "لقول سعد في الحديث: «قلت: فالثلث؟ قال: الثلثُ والثلثُ كثيرٌ، إنك أن تَدعَ ورثتَك أغنياءَ خيرٌ من أن تدعَهم عالةً يتكفَّفونَ الناسَ».", "pse_sq": "E sakta: ia lejoi të tretën dhe tha se edhe ajo është shumë. Në hadith Sa'di thotë: «Thashë: ‹O i Dërguari i Allahut! Mundimi (i sëmundjes) më ka arritur aty ku po e sheh; unë kam pasuri dhe nuk më trashëgon askush përveç një vajze; a t'i jap sadaka dy të tretat e pasurisë sime?› Tha: ‹Jo.› Thashë: ‹Po gjysmën?› Tha: ‹Jo.› Thashë: ‹Po të tretën?› Tha: ‹Të tretën, por edhe e treta është shumë. Që t'i lësh trashëgimtarët e tu të pasur është më mirë se t'i lësh të varfër duke shtrirë dorën te njerëzit.›» Pra dy të tretat dhe gjysma u refuzuan, ndërsa e treta u lejua. Prej këtu kufiri i testamentit është e treta.", "f": "٧٣"}, {"id": "D037", "k": 28, "lloji": "mcq", "q": "أوصى رجلٌ لأجنبيٍّ بنصف ماله، فلمّا مات أجاز الورثةُ الوصيّةَ كلَّها. فما الحكم؟", "o": ["تنفذ في الثلث فقط، وإن أجازوا", "تبطل الوصيّة كلُّها", "تنفذ في السدس فقط", "تنفذ في النصف كلّه"], "a": 3, "q_sq": "Një njeri i la me testament një të huaji (jo-trashëgimtari) gjysmën e pasurisë së tij; kur vdiq, trashëgimtarët e miratuan të gjithë testamentin. Cila është dispozita?", "o_sq": ["Zbatohet vetëm në të tretën, edhe nëse e miratuan", "Testamenti prishet i tëri", "Zbatohet vetëm në të gjashtën", "Zbatohet në të gjithë gjysmën"], "pse_ar": "لأن المؤلف قال فيما تشبه فيه العطيةُ الوصيةَ: «أنها لا تجوز لأجنبي بزيادة على الثلث، ولا لوارث بشيء إلا بإجازة الورثة»، وقد أجازوا بعد الموت.", "pse_sq": "E sakta: zbatohet në të gjithë gjysmën. Autori thotë në kapitullin e dhuratës së të sëmurit se ajo e ka dispozitën e testamentit, dhe se «nuk lejohen për një të huaj në më shumë se një të tretën, as për një trashëgimtar në asgjë, përveç me miratimin e trashëgimtarëve»; dhe se «refuzimi dhe miratimi i trashëgimtarëve nuk merret parasysh veçse pas vdekjes». Këtu trashëgimtarët e miratuan pas vdekjes, prandaj zbatohet edhe teprica mbi të tretën. Pa miratim do të zbatohej vetëm e treta. Shembull: pasuria 60.000 €, testamenti 30.000 € për një mik; trashëgimtarët pas vdekjes thonë «E miratojmë»: miku merr 30.000 €.", "f": "٧٠"}, {"id": "D038", "k": 28, "lloji": "tf", "q": "لا تصحّ الوصيّة من الصبيّ العاقل، ولا من المحجور عليه لسفه.", "a": 1, "q_sq": "Testamenti nuk është i vlefshëm prej fëmijës me mend, as prej atij që është nën ndalim (haxhr) për shkak të mendjelehtësisë (sefeh – shpërdorimit të pasurisë).", "pse_ar": "بل تصح منهما، لقول المؤلف: «وتصح الوصية والتدبير من كل من تصح هبته، ومن الصبي العاقل والمحجور عليه لسفهٍ».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «Testamenti dhe tedbiri janë të vlefshëm prej kujtdo dhurata e të cilit është e vlefshme, si dhe prej fëmijës me mend dhe atij që i është vënë ndalim (në disponim) për shkak të mendjelehtësisë». (Tedbir = t'i thuash robit: «Je i lirë pas vdekjes sime».) Testamenti zbatohet pas vdekjes dhe nuk ua pakëson pasurinë gjatë jetës. Shembull: një djalë i vogël që kupton mirë ose një i rritur të cilit gjykatësi ia ka ndaluar disponimin: testamenti i tyre vlen.", "f": "٧٣"}, {"id": "D039", "k": 28, "lloji": "mcq", "q": "أوصى رجلٌ لحملِ امرأةٍ (الجنين في بطنها). فمتى تصحّ الوصيّة له؟", "o": ["إذا وُلد حيًّا قبل موت الموصي", "إذا كان الحمل ذكراً", "إذا عُلم أنه كان موجوداً حين الوصيّة", "لا تصحّ الوصيّة للحمل بحال"], "a": 2, "q_sq": "Një njeri la testament për fetusin e një gruaje (fëmijën në barkun e saj). Kur është i vlefshëm testamenti për të?", "o_sq": ["Kur lind i gjallë para vdekjes së testamentlënësit", "Kur fetusi është mashkull", "Kur dihet se ka qenë ekzistues në kohën e testamentit", "Testamenti për fetusin nuk vlen në asnjë mënyrë"], "pse_ar": "لقول المؤلف: «وللحمل إذا عُلم أنه كان موجوداً حين الوصية له».", "pse_sq": "E sakta: kur dihet se ka qenë ekzistues në kohën e testamentit. Autori thotë: testamenti është i vlefshëm «për këdo të cilit dhurata i vlen, si dhe për fetusin, kur dihet se ka qenë ekzistues në kohën e testamentit për të». Kushti nuk është lindja para vdekjes së testamentlënësit, as gjinia e fetusit; dhe testamenti për fetusin vlen, pra nuk është i ndaluar. Shembull: «I lë 10.000 € fëmijës që mban në bark nusja e djalit tim»: vlen nëse dihet se ishte ngjizur kur u bë testamenti.", "f": "٧٣"}, {"id": "D040", "k": 28, "lloji": "mcq", "q": "أوصى رجلٌ لآخر بكلبِ صيد. فما حكمُ الوصيّة؟", "o": ["تصحّ، لأن فيه نفعاً مباحاً", "لا تصحّ، لأنه نجس", "لا تصحّ، لأنه لا يُملك بالشراء", "تصحّ إن أجازها الورثة فقط"], "a": 0, "q_sq": "Një njeri i la me testament tjetrit një qen gjuetie. Cila është dispozita e testamentit?", "o_sq": ["Është i vlefshëm, sepse ka dobi të lejuar", "Nuk është i vlefshëm, sepse është i papastër (nexhis)", "Nuk është i vlefshëm, sepse nuk fitohet në pronësi me blerje", "Është i vlefshëm vetëm nëse e miratojnë trashëgimtarët"], "pse_ar": "لقول المؤلف: «وتصح بكل ما فيه نفع مباح ككلب الصيد والغنم، وبما فيه نفع من النجاسات».", "pse_sq": "E sakta: është i vlefshëm, sepse ka dobi të lejuar. Autori thotë: «Ai është i vlefshëm me çdo gjë që ka dobi të lejuar, si qeni i gjuetisë dhe i deleve, me ato nga papastërtitë që kanë dobi...». Testamenti është më i gjerë se shitja: edhe ajo që ka papastërti, kur ka dobi, mund të lihet me testament; prandaj as papastërtia, as mosshitja nuk e prishin këtu. Miratimi i trashëgimtarëve kërkohet vetëm për trashëgimtarin ose për tepricën mbi të tretën. Shembull: plehu i kafshëve për bujqësi (papastërti me dobi) mund të lihet me testament.", "f": "٧٣"}, {"id": "D041", "k": 28, "lloji": "tf", "q": "تصحّ الوصيّة بالمعدوم، كالذي تحمل أمتُه أو شجرتُه.", "a": 0, "q_sq": "Testamenti është i vlefshëm me atë që nuk ekziston ende, si ajo që do të mbartë robëresha e tij (ame – shërbëtorja në pronësi) ose pema e tij.", "pse_ar": "لقول المؤلف: «وبالمعدوم كالذي تحمل أمته أو شجرته».", "pse_sq": "Pohimi është i saktë. Autori thotë se testamenti është i vlefshëm «me atë që nuk ekziston ende, si ajo që do të mbartë robëresha ose pema e tij». Testamenti nuk kërkon q
