fillimi", "Blerësi ka zgjedhje ndërmjet kthimit dhe mbajtjes"], "pse_ar": "لقول المؤلف: «وإن بان أنه مؤجَّل ولم يخبره بتأجيله فله الخيار بين رده وإمساكه».", "pse_sq": "E sakta: blerësi zgjedh ndërmjet kthimit dhe mbajtjes. Autori thotë: «e nëse del se (çmimi i blerjes së tij) ka qenë me afat pagese dhe nuk ia ka treguar afatin, ka zgjedhje ndërmjet kthimit dhe mbajtjes së tij». Çmimi me afat zakonisht është më i lartë se çmimi në dorë, prandaj fshehja e afatit e mashtron blerësin. Kërkimi i diferencës me pjesën e fitimit është dispozita kur shitësi e shton çmimin; dhe shitja nuk prishet vetvetiu.", "f": "٥٦"}, {"id": "A060", "k": 6, "lloji": "mcq", "q": "اختلف البائع والمشتري في قدر الثمن، فقال البائع: بمئة، وقال المشتري: بثمانين. فما الحكم عند المؤلف؟", "o": ["يُقسَم الفرق بينهما نصفين", "القول قول المشتري بيمينه، ويلزم البيع", "يتحالفان، ثم لكلٍّ منهما الفسخ", "القول قول البائع بيمينه، ويلزم البيع"], "a": 2, "q_sq": "Shitësi dhe blerësi ranë në kundërshtim për sasinë e çmimit: shitësi tha «për njëqind», e blerësi tha «për tetëdhjetë». Cila është dispozita sipas autorit?", "o_sq": ["Diferenca ndahet ndërmjet tyre përgjysmë", "Merret fjala e blerësit me betimin e tij dhe shitja mbetet", "Betohen të dy, pastaj secili ka të drejtë ta prishë shitjen", "Merret fjala e shitësit me betimin e tij dhe shitja mbetet"], "pse_ar": "لقول المؤلف: «وإن اختلف البيِّعان في قدر الثمن تحالفا، ولكل واحد منهما الفسخ إلا أن يرضى بما قال صاحبه».", "pse_sq": "E sakta: betohen të dy dhe pastaj secili mund ta prishë shitjen. Autori thotë: «Nëse shitësi dhe blerësi bien në kundërshtim për sasinë e çmimit, betohen të dy, dhe secili prej tyre ka të drejtë ta prishë shitjen, përveç nëse pranon atë që ka thënë tjetri». Pra nuk merret vetëm fjala e njërit dhe diferenca nuk ndahet. Nëse blerësi pranon 100, ose shitësi pranon 80, shitja mbetet.", "f": "٥٦"}, {"id": "A061", "k": 7, "lloji": "mcq", "q": "ماذا اشترط الحديثُ الذي أورده المؤلف فيمن أسلف في تمر؟", "o": ["أن يكون التمرُ موجوداً في ملك البائع عند العقد", "كيلاً معلوماً أو وزناً معلوماً إلى أجلٍ معلوم", "كيلاً معلوماً أو وزناً معلوماً ولو بلا أجل", "أجلاً معلوماً ولو كان القدرُ مجهولاً"], "a": 1, "q_sq": "Çfarë kushtëzoi hadithi që e sjell autori për atë që paguan paraprakisht për hurma?", "o_sq": ["Që hurmat të jenë në pronësi të shitësit në kohën e kontratës", "Masë vëllimi të njohur ose peshë të njohur, deri në një afat të njohur", "Masë vëllimi të njohur ose peshë të njohur, edhe pa afat", "Afat të njohur, edhe nëse sasia është e panjohur"], "pse_ar": "لقوله ﷺ: «مَن أسلفَ في تمرٍ فليُسلِف في كيلٍ معلومٍ أو وزنٍ معلومٍ إلى أجلٍ معلومٍ».", "pse_sq": "E sakta: masë ose peshë e njohur, deri në afat të njohur. Hadithi i Ibn Abbasit: «Kush paguan paraprakisht për hurma, le të paguajë për një masë të njohur ose peshë të njohur, deri në një afat të njohur.» Pra sasia dhe afati duhet të jenë të dyja të njohura. Hadithi nuk kushtëzon që malli të jetë në pronësi të shitësit në kohën e kontratës; përkundrazi, ata paguanin paraprakisht për frutat një dhe dy vjet. Shembull: tregtari i jep bujkut sot 500 € për 1 ton grurë që do t'ia dorëzojë pas 6 muajsh.", "f": "٥٦"}, {"id": "A062", "k": 7, "lloji": "mcq", "q": "أيُّ ما يلي من شروط صحة السَّلَم التي ذكرها المؤلف؟", "o": ["أن تكون مدة الأجل دون سنة", "أن يُسلِّم الثمنَ عند حلول الأجل", "أن يكون المسلَمُ فيه من الأصناف الستة", "أن يضبط المسلَمَ فيه بالصفة"], "a": 3, "q_sq": "Cili nga këto është nga kushtet e vlefshmërisë së selemit që përmend autori?", "o_sq": ["Afati të jetë më pak se një vit", "Ta dorëzojë çmimin kur të vijë afati", "Malli i selemit të jetë nga gjashtë llojet (e kamatës)", "Ta përcaktojë mallin e selemit me përshkrim"], "pse_ar": "لقول المؤلف: «ويصح السَّلَم في كل ما ينضبط بالصفة إذا ضبطه بها وذكر قدره... وجعل له أجلاً معلوماً وأعطاه الثمن قبل تفرقهما».", "pse_sq": "E sakta: ta përcaktojë mallin me përshkrim. Autori thotë: «Selemi është i vlefshëm në çdo gjë që mund të përcaktohet saktë me përshkrim, kur e përcakton me të, përmend sasinë e tij me atë me të cilën matet – vëllim, peshë, pash (dhira') ose numër –, i cakton një afat të njohur dhe ia jep çmimin para se të ndahen». Çmimi jepet para ndarjes, jo kur vjen afati; afati duhet të jetë i njohur, jo patjetër më pak se një vit (në hadith paguanin për një e dy vjet); dhe selemi s'kufizohet te gjashtë llojet, por vlen në çdo gjë që përshkruhet saktë. Shembull: «grurë i bardhë, i klasit të parë, i korrjes së këtij viti».", "f": "٥٦"}, {"id": "A063", "k": 7, "lloji": "mcq", "q": "اتّفق رجلان على سَلَمٍ في قمحٍ موصوفٍ إلى أجلٍ معلوم، ثم تفرّقا قبل أن يُعطيَه الثمن. فما الحكم؟", "o": ["يصحّ إن أعطاه الثمن في اليوم التالي", "يصحّ، ويبقى الثمن ديناً إلى الأجل", "لا يصحّ، لعدم قبض الثمن قبل التفرّق", "يصحّ، لأن القدر والأجل معلومان"], "a": 2, "q_sq": "Dy njerëz ranë dakord për një selem në grurë të përshkruar, deri në një afat të njohur, pastaj u ndanë para se ai t'ia jepte çmimin. Cila është dispozita?", "o_sq": ["Është i vlefshëm nëse ia jep çmimin ditën tjetër", "Është i vlefshëm dhe çmimi mbetet borxh deri në afat", "Nuk është i vlefshëm, sepse çmimi nuk u mor para ndarjes", "Është i vlefshëm, sepse sasia dhe afati janë të njohura"], "pse_ar": "لأن من شروطه عند المؤلف: «وأعطاه الثمن قبل تفرقهما».", "pse_sq": "E sakta: nuk është i vlefshëm. Ndër kushtet e selemit autori përmend: «...dhe ia jep çmimin para se të ndahen». Përshkrimi, sasia dhe afati nuk mjaftojnë nëse mungon ky kusht; pagesa ditën tjetër apo lënia e çmimit borxh deri në afat nuk e plotësojnë, sepse kushti është dhënia e çmimit para ndarjes.", "f": "٥٦"}, {"id": "A064", "k": 7, "lloji": "tf", "q": "يصحّ بيعُ المسلَم فيه قبل قبضه.", "a": 1, "q_sq": "Është e vlefshme shitja e mallit të selemit para se të merret në dorë.", "pse_ar": "لقول المؤلف: «ولا يصح بيع المسلَم فيه قبل قبضه».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «Nuk është e vlefshme shitja e mallit të selemit para se të merret në dorë». Malli i selemit ende s'është në dorën e blerësit, por është borxh te shitësi. Shembull: ke paguar paraprakisht për 1 ton grurë; nuk mund t'ia shesësh dikujt tjetër para se ta marrësh.", "f": "٥٦"}, {"id": "A065", "k": 7, "lloji": "tf", "q": "لا تصحّ الحوالةُ بالمسلَم فيه.", "a": 0, "q_sq": "Nuk është e vlefshme havaleja (transferimi i borxhit) me mallin e selemit.", "pse_ar": "لقول المؤلف: «ولا يصح بيع المسلَم فيه قبل قبضه ولا الحوالةُ به».", "pse_sq": "Pohimi është i saktë. Autori thotë: «Nuk është e vlefshme shitja e mallit të selemit para se të merret në dorë, as transferimi (havaleja) i tij». Havale = transferimi i borxhit nga përgjegjësia e njërit te përgjegjësia e tjetrit. Shembull: ke paguar paraprakisht për 1 ton grurë dhe i ke borxh dikujt 1 ton grurë; nuk mund t'i thuash: «Merre grurin tim te bujku».", "f": "٥٦"}, {"id": "A066", "k": 7, "lloji": "mcq", "q": "أسلم رجلٌ في مئة صاعٍ من التمر الموصوف، على أن يقبض منها عشرة آصُعٍ كلَّ شهرٍ في أوقاتٍ معلومة. فما الحكم؟", "o": ["يجوز، لأنه يقبضه أجزاءً في أوقاتٍ معلومة", "لا يجوز إلا أن يقبضه جملةً واحدة", "لا يجوز، لأنه بمنزلة سلمٍ في أشياء كثيرة", "يجوز إن كانت الأوقات غير محدّدة"], "a": 0, "q_sq": "Një njeri pagoi paraprakisht për njëqind sa' hurma të përshkruara, me kusht që të marrë prej tyre dhjetë sa' çdo muaj në kohë të caktuara. Cila është dispozita?", "o_sq": ["Lejohet, sepse e merr në pjesë në kohë të caktuara", "Nuk lejohet, përveç nëse e merr të gjithin njëherësh", "Nuk lejohet, sepse është si selem në shumë gjëra", "Lejohet nëse kohët nuk janë të përcaktuara"], "pse_ar": "لقول المؤلف: «ويجوز السَّلم في شيء يقبضه أجزاء متفرقة في أوقات معلومة».", "pse_sq": "E sakta: lejohet. Autori thotë: «Lejohet selemi në diçka që e merr në pjesë të ndara në kohë të caktuara». Kushti është që kohët të jenë të caktuara; prandaj opsioni «nëse kohët nuk janë të përcaktuara» është i gabuar. Shembull: paguan sot për 300 litra qumësht që do t'i marrësh 10 litra në ditë gjatë një muaji.", "f": "٥٦"}, {"id": "A067", "k": 7, "lloji": "mcq", "q": "أسلم رجلٌ ألفاً في قمحٍ وشعيرٍ معاً، ولم يبيّن ثمن كلِّ واحدٍ منهما. فما الحكم؟", "o": ["يجوز إن كانا متقاربين في القيمة", "يجوز، لأن الثمن جملةً معلوم", "يجوز، ويُقسم الثمن بينهما نصفين", "لا يجوز حتى يبيّن ثمن كلِّ جنس"], "a": 3, "q_sq": "Një njeri pagoi paraprakisht një mijë për grurë dhe elb bashkë, dhe nuk e sqaroi çmimin e secilit prej tyre. Cila është dispozita?", "o_sq": ["Lejohet nëse janë të përafërt në vlerë", "Lejohet, sepse çmimi në tërësi është i njohur", "Lejohet, dhe çmimi ndahet ndërmjet tyre përgjysmë", "Nuk lejohet derisa të sqarojë çmimin e secilit lloj"], "pse_ar": "لقول المؤلف: «وإن أسلم ثمناً واحداً في شيئين لم يجز حتى يبيِّن ثمنَ كل جنس».", "pse_sq": "E sakta: nuk lejohet derisa të sqarojë çmimin e secilit lloj. Autori thotë: «Nëse jep një çmim të vetëm (paraprakisht) për dy gjëra, nuk lejohet derisa ta sqarojë çmimin e secilit lloj». Njohja e çmimit në tërësi nuk mjafton, sepse nëse njëri prej tyre nuk dorëzohet, duhet të dihet sa i takon atij. Shembull: 1.000 € për grurë dhe oriz – duhet të thuhet p.sh. 600 € për grurin dhe 400 € për orizin.", "f": "٥٦"}, {"id": "A068", "k": 7, "lloji": "tf", "q": "إذا حلّ أجلُ السَّلَم في قمحٍ جاز للمسلِم أن يأخذ بدلَه أرزاً.", "a": 1, "q_sq": "Kur vjen afati i selemit në grurë, i lejohet atij që ka paguar paraprakisht të marrë oriz në vend të grurit.", "pse_ar": "لقول المؤلف: «ومن أسلف في شيء لم يصرفه إلى غيره».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «dhe kush paguan paraprakisht për diçka, nuk e ndërron atë me diçka tjetër». Pra merr atë për të cilën ka paguar (grurin), jo një send tjetër në vend të tij, edhe kur vjen afati.", "f": "٥٦"}, {"id": "A069", "k": 7, "lloji": "mcq", "q": "أقال المسلِمُ المسلَمَ إليه في نصف المسلَم فيه. فما حكم هذه الإقالة؟", "o": ["لا تجوز، لأنها بيعٌ للمسلَم فيه قبل قبضه", "تجوز، لأن الإقالة فسخ", "لا تجوز، لأنها صرفٌ له إلى غيره", "لا تجوز إلا في المسلَم فيه كلِّه"], "a": 1, "q_sq": "Ai që pagoi paraprakisht (muslimi) i bëri ikale (prishje me pëlqim) shitësit të selemit (muslem ilejhi) në gjysmën e mallit të selemit. Cila është dispozita e kësaj ikaleje?", "o_sq": ["Nuk lejohet, sepse është shitje e mallit të selemit para marrjes në dorë", "Lejohet, sepse ikaleja është prishje (e kontratës)", "Nuk lejohet, sepse është ndërrim i tij me diçka tjetër", "Nuk lejohet, përveç në të gjithë mallin e selemit"], "pse_ar": "لقول المؤلف: «وتجوز الإقالة فيه أو في بعضه، لأنها فسخ».", "pse_sq": "E sakta: lejohet. Autori thotë: «ndërsa lejohet ikaleja për të ose për një pjesë të tij, sepse ajo është prishje (e kontratës)». Meqë ikaleja është prishje e shitjes së parë dhe jo shitje e re, nuk hyn te ndalimi i shitjes para marrjes në dorë, as te ndalimi i ndërrimit me diçka tjetër; dhe lejohet edhe në një pjesë. Shembull: bujku i thotë tregtarit: «Merri paratë e gjysmës, nuk mund ta dorëzoj gjithë grurin», dhe tregtari pranon.", "f": "٥٦"}, {"id": "A070", "k": 8, "lloji": "mcq", "q": "اقترض رجلٌ عشرةَ آصُعٍ من القمح. فماذا يجب عليه أن يردّ؟", "o": ["قيمتَها يومَ القرض دراهم", "عشرةَ آصُعٍ من القمح مثلَها", "ما شاء من الطعام بقيمتها", "أحدَ عشرَ صاعاً من القمح"], "a": 1, "q_sq": "Një njeri mori hua dhjetë sa' grurë. Çfarë ka për detyrë të kthejë?", "o_sq": ["Vlerën e tyre në dirhemë në ditën e huas", "Dhjetë sa' grurë të ngjashëm me to", "Çfarëdo ushqimi që do, sa vlera e tyre", "Njëmbëdhjetë sa' grurë"], "pse_ar": "لقول المؤلف: «ومن اقترض شيئاً فعليه رد مثله إن كان مثليًّا».", "pse_sq": "E sakta: dhjetë sa' grurë të ngjashëm. Autori thotë: «Kush merr hua diçka, ka për detyrë të kthejë të njëjtën gjë nëse ajo ka të ngjashme (mithlij)». Gruri ka të ngjashëm, prandaj kthehet i njëjti lloj dhe sasi, jo vlera e tij dhe jo një ushqim tjetër. Kushtëzimi i një sa' më shumë do të ishte përfitim i kushtëzuar për huadhënësin, që autori e ndalon. Shembull: merr 100 € → kthen 100 €.", "f": "٥٧"}, {"id": "A071", "k": 8, "lloji": "mcq", "q": "اقترض رجلٌ بَكْراً، فردّ عند القضاء جملاً رَباعيًّا خيراً منه من غير شرط. فما الحكم؟", "o": ["يجب على المقرض أن يردّ الفضل", "يجوز إن أذن فيه الحاكم", "لا يجوز، لأنه زيادة في القرض", "يجوز، لحديث أبي رافع"], "a": 3, "q_sq": "Një njeri mori hua një bekr (deve e re mashkull), dhe në shlyerje ktheu një deve rebai, më të mirë se ajo, pa qenë e kushtëzuar. Cila është dispozita?", "o_sq": ["Huadhënësi e ka detyrë ta kthejë tepricën", "Lejohet nëse e lejon gjykatësi", "Nuk lejohet, sepse është shtesë në hua", "Lejohet, për shkak të hadithit të Ebu Rafi'ut"], "pse_ar": "لقول المؤلف: «ويجوز أن يرُدَّ خيراً منه، للخبر»، وهو قوله ﷺ: «أعطُوه فإن خيرَ الناسِ أحسنُهم قضاءً».", "pse_sq": "E sakta: lejohet. Autori thotë: «dhe lejohet të kthejë më të mirë se ajo, për shkak të hadithit (të përmendur)», d.m.th. hadithi i Ebu Rafi'ut: I Dërguari i Allahut ﷺ mori hua një bekr dhe, kur s'u gjetën veçse deve të zgjedhura rebai, tha: «Jepjani atë, sepse më të mirët e njerëzve janë ata që shlyejnë (borxhin) më mirë.» Autori e ndalon përfitimin kur kushtëzohet nga huadhënësi; këtu nuk ishte kusht.", "f": "٥٧"}, {"id": "A072", "k": 8, "lloji": "tf", "q": "يجوز أن يقترض تفاريقَ ويردَّ جملةً، إذا لم يكن ذلك شرطاً.", "a": 0, "q_sq": "Lejohet të marrë hua pjesë-pjesë dhe ta kthejë njëherësh, nëse kjo nuk ka qenë kusht.", "pse_ar": "لقول المؤلف: «وأن يقترض تفاريق ويردَّ جملة إذا لم يكن شرط».", "pse_sq": "Pohimi është i saktë. Autori thotë: «dhe (lejohet) të marrë hua pjesë-pjesë dhe ta kthejë njëherësh, nëse nuk ka pasur kusht». Shembull: merr hua 50 € sot dhe 50 € pas një jave, e pastaj i kthen 100 € njëherësh.", "f": "٥٧"}, {"id": "A073", "k": 8, "lloji": "mcq", "q": "أقرض رجلٌ آخرَ ألفاً وأجّلها ستة أشهر، ثم طالبه بها بعد شهر. فما حكم مطالبته؟", "o": ["ليس له ذلك حتى يحلّ الأجل", "له ذلك، لأن القرض لا يتأجّل بالتأجيل", "ليس له ذلك إلا أن يرضى المقترض", "ليس له ذلك إلا إذا كان المقترض موسراً"], "a": 1, "q_sq": "Një njeri i dha tjetrit hua një mijë dhe i vuri afat gjashtë muaj, pastaj ia kërkoi pas një muaji. Cila është dispozita e kërkesës së tij?", "o_sq": ["Nuk ka të drejtë derisa të vijë afati", "Ka të drejtë, sepse huaja nuk bëhet me afat edhe nëse i vihet afat", "Nuk ka të drejtë, përveç nëse pajtohet huamarrësi", "Nuk ka të drejtë, përveç nëse huamarrësi është në gjendje të mirë"], "pse_ar": "لقول المؤلف: «وإن أجله لم يتأجل».", "pse_sq": "E sakta: ka të drejtë ta kërkojë. Autori thotë: «e nëse i vë afat (huasë), ajo nuk bëhet me afat». Pra afati i vënë huasë nuk e detyron huadhënësin, dhe ai mund ta kërkojë huanë para tij, pa pasur nevojë për pëlqimin e huamarrësit. Shembull: «Ma kthe pas 6 muajsh» – huadhënësi mund ta kërkojë edhe pas një muaji.", "f": "٥٧"}, {"id": "A074", "k": 8, "lloji": "mcq", "q": "أيُّ ما يلي يجوز للمقرض أن يشترطه على المقترض؟", "o": ["أن يردّ عليه أكثر مما أخذ", "أن يعطيه رهناً بالقرض", "أن يسكن داره بلا أجرة", "أن يهدي إليه هديةً"], "a": 1, "q_sq": "Cilën nga këto lejohet që huadhënësi t'ia kushtëzojë huamarrësit?", "o_sq": ["T'i kthejë më shumë se ç'ka marrë", "T'i japë një peng për huanë", "Të banojë në shtëpinë e tij pa qira", "T'i japë një dhuratë"], "pse_ar": "لقول المؤلف: «ولا يجوز شرط شيء لينتفع به المقرض إلا أن يشترط رهنًا أو كفيلاً».", "pse_sq": "E sakta: pengu. Autori thotë: «Nuk lejohet kushtëzimi i ndonjë gjëje nga e cila përfiton huadhënësi, përveç kur kushtëzon një peng ose një dorëzanë». Pengu dhe dorëzani vetëm e sigurojnë kthimin e borxhit, pa i sjellë fitim huadhënësit. Banimi falas, kthimi i më shumë se ç'u mor dhe dhurata e kushtëzuar janë përfitime për huadhënësin, prandaj ndalohen. Shembull: «Të jap hua 1.000 € me kusht që të më lësh peng orën tënde» lejohet.", "f": "٥٧"}, {"id": "A075", "k": 8, "lloji": "tf", "q": "يقبل المقرضُ هديةَ المقترض، وإن لم تكن بينهما عادةٌ بالإهداء قبل القرض.", "a": 1, "q_sq": "Huadhënësi e pranon dhuratën e huamarrësit, edhe nëse nuk kanë pasur zakon të dhurojnë njëri-tjetrit para huasë.", "pse_ar": "لقول المؤلف: «ولا يقبل هدية المقترض إلا أن يكون بينهما عادة بها قبل القرض».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «(Huadhënësi) nuk e pranon dhuratën e huamarrësit, përveç nëse kanë pasur zakon të dhurojnë njëri-tjetrit para huasë». Dhurata e huamarrësit gjatë huas mund të jetë përfitim i fshehur për shkak të huas. Shembull: fqinji që të ka marrë hua të sjell një dhuratë të shtrenjtë; nuk e pranon, përveç nëse ta sillte rregullisht edhe para huasë.", "f": "٥٧"}, {"id": "B001", "k": 9, "lloji": "tf", "q": "مَن لزمه دَينٌ مؤجَّل، جاز لغريمه أن يطالبه به قبل حلول أجله.", "a": 1, "q_sq": "Kush ka një borxh me afat, kreditori i tij lejohet t'ia kërkojë atë para se t'i vijë afati.", "pse_ar": "لقول المؤلف: «من لزمه دين مؤجل لم يطالب به قبل أجله».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «Kush ka një borxh me afat, nuk i kërkohet para afatit të tij». Afati është pjesë e marrëveshjes dhe i takon borxhliut, prandaj kreditori duhet të presë derisa të vijë koha e pagesës. Shembull: ke blerë mallra me pagesë pas 6 muajsh; shitësi s'mund të t'i kërkojë paratë në muajin e tretë.", "f": "٥٧"}, {"id": "B002", "k": 9, "lloji": "mcq", "q": "اشترى رجلٌ بضاعةً بثمنٍ مؤجَّلٍ إلى سنة، ثم طلب البائعُ من الحاكم بعد شهرين أن يحجر عليه من أجل هذا الدَّين. فما الحكم؟", "o": ["يُحجَر عليه إن كان مالُه أقلَّ من هذا الدَّين", "لا يُحجَر عليه من أجله، لأنه لم يحلّ", "يُحجَر عليه إن أراد سفراً بعيداً", "يُحجَر عليه إن طلب ذلك سائرُ غرمائه"], "a": 1, "q_sq": "Një njeri bleu mall me çmim që paguhet pas një viti; pas dy muajsh shitësi i kërkoi gjykatësit (hakimit) t'i vërë ndalim (haxhr) në pasuri për shkak të këtij borxhi. Cila është dispozita?", "o_sq": ["I vihet ndalim nëse pasuria e tij është më e vogël se ky borxh", "Nuk i vihet ndalim për shkak të tij, sepse s'i ka ardhur koha", "I vihet ndalim nëse dëshiron të udhëtojë larg", "I vihet ndalim nëse e kërkojnë këtë edhe kreditorët e tjerë"], "pse_ar": "لقول المؤلف في الدين المؤجل: «ولم يُحجر عليه من أجله».", "pse_sq": "E sakta: nuk i vihet ndalim për shkak të tij. Autori thotë për borxhin me afat: «...nuk i vihet ndalim (haxhr) për shkak të tij». Ky borxh ende nuk kërkohet, prandaj as madhësia e tij krahasuar me pasurinë, as kërkesa e kreditorëve nuk e lejojnë ndalimin për shkak të tij; ndalimi që përmend autori është për borxhin që i ka ardhur koha, kur pasuria s'mjafton dhe kreditorët e kërkojnë. Udhëtimi para afatit i jep kreditorit të drejtën ta ndalojë nga udhëtimi (përveç nëse e siguron borxhin), jo t'i bllokojë pasurinë. Shembull: blerësi i makinës me pagesë pas një viti nuk mund të bllokohet në gjykatë që në muajin e dytë.", "f": "٥٧"}, {"id": "B003", "k": 9, "lloji": "mcq", "q": "أيُّ ما يلي صحيحٌ في الدَّين المؤجَّل على قول المؤلف؟", "o": ["يحلّ بتفليس المدين، ولا يحلّ بموته إذا وثّقه الورثةُ برهنٍ أو كفيل", "لا يحلّ بتفليس المدين، ولا بموته إذا وثّقه الورثةُ برهنٍ أو كفيل", "لا يحلّ بتفليس المدين، ويحلّ بموته ولو وثّقه الورثةُ برهنٍ أو كفيل", "يحلّ بتفليس المدين، ويحلّ بموته ولو وثّقه الورثةُ برهنٍ أو كفيل"], "a": 1, "q_sq": "Cila nga këto është e saktë për borxhin me afat sipas fjalës së autorit?", "o_sq": ["Bëhet i menjëhershëm me falimentimin e borxhliut, por jo me vdekjen e tij kur trashëgimtarët e sigurojnë me peng ose me dorëzanë", "Nuk bëhet i menjëhershëm me falimentimin e borxhliut, as me vdekjen e tij kur trashëgimtarët e sigurojnë me peng ose me dorëzanë", "Nuk bëhet i menjëhershëm me falimentimin e borxhliut, por bëhet i menjëhershëm me vdekjen e tij edhe nëse trashëgimtarët e sigurojnë me peng ose me dorëzanë", "Bëhet i menjëhershëm me falimentimin e borxhliut dhe me vdekjen e tij, edhe nëse trashëgimtarët e sigurojnë me peng ose me dorëzanë"], "pse_ar": "لقول المؤلف: «ولم يحلَّ بتفليسه ولا بموته إذا وثَّقه الورثة برهن أو كفيل».", "pse_sq": "E sakta: nuk bëhet i menjëhershëm (s'i vjen koha para afatit) as me falimentimin, as me vdekjen kur trashëgimtarët e sigurojnë. Autori thotë: «...dhe ai nuk bëhet i menjëhershëm me falimentimin e tij, as me vdekjen e tij, kur trashëgimtarët e garantojnë me peng ose me dorëzanë». Afati është e drejtë e borxhliut dhe nuk bie me falimentimin; te vdekja, afati mbetet kur e drejta e kreditorit sigurohet me peng ose me dorëzanë. Opsionet e tjera e kthejnë njërën ose të dyja gjendjet në të kundërtën. Shembull: babai vdes me një borxh që paguhet pas dy vjetësh; trashëgimtarët japin një tokë peng, dhe borxhi mbetet me afat siç ishte.", "f": "٥٧"}, {"id": "B004", "k": 9, "lloji": "mcq", "q": "أراد رجلٌ عليه دَينٌ مؤجَّل أن يخرج إلى الغزو تطوُّعاً. فمتى يكون لغريمه منعُه؟", "o": ["إذا لم يوثِّق الدَّينَ برهنٍ أو كفيل", "مطلقاً، ولو وثّق الدَّينَ برهنٍ أو كفيل", "لا يملك منعَه، لأن الدَّين لم يحلّ", "إذا كان الدَّين قرضاً لا ثمنَ مبيع"], "a": 0, "q_sq": "Një njeri që ka një borxh me afat dëshiron të dalë në luftë (xhihad) vullnetarisht. Kur ka të drejtë kreditori ta ndalojë?", "o_sq": ["Kur nuk e siguron borxhin me peng ose me dorëzanë", "Gjithmonë, edhe nëse e siguron borxhin me peng ose me dorëzanë", "Nuk ka të drejtë ta ndalojë, sepse borxhit s'i ka ardhur koha", "Kur borxhi është hua, jo çmim i një malli të shitur"], "pse_ar": "لقول المؤلف: «وإن أراد سفراً يحل قبل مدته، أو الغزو تطوعاً، فلغريمه منعه إلا أن يوثق بذلك».", "pse_sq": "E sakta: kur nuk e siguron borxhin me peng ose me dorëzanë. Autori thotë: «Nëse dëshiron të udhëtojë ... ose të shkojë në luftë vullnetarisht, kreditori i tij ka të drejtë ta ndalojë, përveç nëse e garanton atë (borxhin)». Në luftë ka rrezik vdekjeje, e me të mund t'i humbasë e drejta kreditorit; prandaj ai e ndalon, por kur borxhi sigurohet me peng ose me dorëzanë, ndalimi s'ka më vend. «Gjithmonë» është e gabuar për shkak të përjashtimit; «s'ka të drejtë, sepse s'i ka ardhur koha» bie ndesh me tekstin; dallimi mes huasë dhe çmimit të shitjes nuk përmendet. Shembull: borxhliu që i lë kreditorit arin e vet peng mund të dalë vullnetar.", "f": "٥٧"}, {"id": "B005", "k": 9, "lloji": "tf", "q": "عليه دَينٌ مؤجَّل يحلّ بعد شهرين، فأراد سفراً يستغرق ستةَ أشهر ولم يوثِّق الدَّين؛ فليس لغريمه منعُه، لأن الدَّين لم يحلّ بعدُ.", "a": 1, "q_sq": "Ai ka një borxh me afat që i vjen koha pas dy muajsh, dhe dëshiron një udhëtim që zgjat gjashtë muaj, pa e siguruar borxhin; kreditori i tij nuk ka të drejtë ta ndalojë, sepse borxhit ende s'i ka ardhur koha.", "pse_ar": "لقول المؤلف: «وإن أراد سفراً يحل قبل مدته ... فلغريمه منعه إلا أن يوثق بذلك».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «Nëse dëshiron të udhëtojë në një udhëtim që zgjat përtej afatit (të borxhit) ... kreditori i tij ka të drejtë ta ndalojë, përveç nëse e garanton atë (borxhin)». Këtu borxhit i vjen koha (pas dy muajsh) para se të mbarojë udhëtimi (gjashtë muaj), dhe borxhi s'është siguruar; prandaj kreditori ka të drejtë ta ndalojë, që të mos i humbasë e drejta kur t'i vijë koha. Nëse borxhliu jep peng ose dorëzanë, atëherë nuk ndalohet.", "f": "٥٧"}, {"id": "B006", "k": 9, "lloji": "mcq", "q": "حلّ الدَّينُ على رجلٍ مُعسِرٍ لا يجد ما يقضي به. فما الحكم؟", "o": ["يُحبَس حتى يوفيه", "يُطالَب به في الحال", "يجب على غريمه إنظارُه", "يُسقَط عنه نصفُ الدَّين"], "a": 2, "q_sq": "Borxhit i erdhi koha te një njeri në vështirësi (mu'sir) që s'ka me çfarë ta shlyejë. Cila është dispozita?", "o_sq": ["Burgoset derisa ta shlyejë", "I kërkohet (borxhi) menjëherë", "Kreditori e ka detyrë t'i japë afat (ta presë)", "I hiqet gjysma e borxhit"], "pse_ar": "لقول المؤلف: «وإن كان الدين حالاً على معسر وجب إنظاره».", "pse_sq": "E sakta: është detyrë t'i jepet afat. Autori thotë: «Nëse borxhi është i menjëhershëm, por (borxhliu) është në vështirësi, është detyrë t'i jepet kohë». Burgosja është dispozita e atij që ka mundësi (musir) dhe refuzon, jo e atij që s'ka. Kërkimi i menjëhershëm bie ndesh me detyrimin e pritjes. Heqja e gjysmës së borxhit nuk përmendet. Shembull: borxhliu mbeti pa punë dhe s'ka asgjë; kreditori duhet ta presë, edhe pse koha e pagesës ka ardhur.", "f": "٥٧"}, {"id": "B007", "k": 9, "lloji": "mcq", "q": "ادّعى رجلان الإعسارَ: أحدهما لم يُعرف له مالٌ قبل ذلك، والآخر عُرف له مالٌ قبل ذلك. فما الحكم؟", "o": ["الأول يحلف ويُخلّى سبيلُه، والثاني لا يُقبل قولُه إلا ببيّنة", "الأول لا يُقبل قولُه إلا ببيّنة، والثاني يحلف ويُخلّى سبيلُه", "كلاهما يحلف ويُخلّى سبيلُه", "كلاهما لا يُقبل قولُه إلا ببيّنة"], "a": 0, "q_sq": "Dy veta pretendojnë vështirësinë (s'kemi me çfarë të paguajmë): për të parin nuk dihet të ketë pasur pasuri më parë, ndërsa për të dytin dihet se ka pasur pasuri më parë. Cila është dispozita?", "o_sq": ["I pari betohet dhe lihet i lirë, ndërsa të dytit fjala nuk i pranohet veçse me provë (bejjine)", "Të parit fjala nuk i pranohet veçse me provë, ndërsa i dyti betohet dhe lihet i lirë", "Të dy betohen dhe lihen të lirë", "Asnjërit nuk i pranohet fjala veçse me provë"], "pse_ar": "لقول المؤلف: «فإن ادعى الإعسار حلف وخلِّي سبيله إلا أن يُعرف له مال قبل ذلك فلا يُقبل قوله إلا ببينة».", "pse_sq": "E sakta: i pari betohet dhe lihet i lirë, kurse i dyti duhet të sjellë provë. Autori thotë: «nëse pretendon vështirësinë, betohet dhe lihet i lirë, përveç nëse dihet që ka pasur pasuri më parë: atëherë fjala e tij nuk pranohet veçse me provë». Ai që dihej se kishte pasuri pretendon diçka që bie ndesh me atë që dihet për të, prandaj s'i mjafton betimi. Opsionet e tjera ose i ndërrojnë vendet, ose i barazojnë të dy. Shembull: dikush që dihej se kishte dyqan e makina thotë «S'kam asgjë»: duhet të sjellë dëshmitarë që e vërtetojnë këtë.", "f": "٥٧"}, {"id": "B008", "k": 9, "lloji": "mcq", "q": "حلّ الدَّينُ على رجلٍ موسِرٍ قادرٍ على الوفاء، فأبى أن يوفيه. فما الحكم عند المؤلف؟", "o": ["يجب إنظارُه كالمُعسِر", "يحلف ويُخلّى سبيلُه", "يُحبَس حتى يوفيَ دَينَه", "يُحبَس شهراً ثم يُخلّى سبيلُه"], "a": 2, "q_sq": "Borxhit i erdhi koha te një njeri që ka mundësi (musir) ta shlyejë, por ai refuzon ta shlyejë. Cila është dispozita sipas autorit?", "o_sq": ["Është detyrë t'i jepet afat, si atij në vështirësi", "Betohet dhe lihet i lirë", "Burgoset derisa ta shlyejë borxhin", "Burgoset një muaj, pastaj lihet i lirë"], "pse_ar": "لقول المؤلف: «فإن كان موسراً لزمه وفاؤه، فإن أبى حُبس حتى يوفيه».", "pse_sq": "E sakta: burgoset derisa ta shlyejë. Autori thotë: «Nëse ka mundësi, e ka detyrë ta shlyejë; e nëse refuzon, burgoset derisa ta shlyejë». Afati (inzari) është vetëm për atë në vështirësi; betimi dhe lirimi janë për atë që pretendon vështirësi dhe s'dihet të ketë pasur pasuri. Burgimi nuk ka kohë të caktuar, por zgjat derisa të shlyejë. Shembull: ka para në bankë, por s'do ta paguajë borxhin që i ka ardhur koha.", "f": "٥٧"}, {"id": "B009", "k": 9, "lloji": "mcq", "q": "متى يلزم الحاكمَ أن يحجر على المدين عند المؤلف؟", "o": ["إذا كان مالُه لا يفي بدينه كلِّه، وسأل غرماؤه الحجرَ عليه", "إذا كان دَينُه مؤجَّلاً، وسأل غرماؤه الحجرَ عليه", "إذا كان مالُه يفي بدينه، وامتنع من الوفاء", "إذا كان مالُه لا يفي بدينه كلِّه، ولو لم يسأل غرماؤه ذلك"], "a": 0, "q_sq": "Kur e ka detyrë gjykatësi (hakimi) t'i vërë ndalim (haxhr) borxhliut sipas autorit?", "o_sq": ["Kur pasuria e tij nuk mjafton për gjithë borxhin e tij dhe kreditorët e tij kërkojnë t'i vihet ndalim", "Kur borxhi i tij është me afat dhe kreditorët e tij kërkojnë t'i vihet ndalim", "Kur pasuria e tij mjafton për borxhin, por ai refuzon ta shlyejë", "Kur pasuria e tij nuk mjafton për gjithë borxhin e tij, edhe nëse kreditorët nuk e kërkojnë këtë"], "pse_ar": "لقول المؤلف: «فإن كان ماله لا يفي بدينه كله فسأل غرماؤه الحاكمَ الحجرَ عليه لزمه إجابتهم».", "pse_sq": "E sakta: kur pasuria s'mjafton për gjithë borxhin dhe kreditorët e kërkojnë ndalimin. Autori thotë: «Nëse pasuria e tij nuk mjafton për të gjithë borxhin e tij dhe kreditorët e tij i kërkojnë gjykatësit t'i vërë ndalim, ai e ka detyrë t'u përgjigjet». Duhen dy gjëra bashkë: (1) borxhet më të mëdha se pasuria dhe (2) kërkesa e kreditorëve. Për borxhin me afat autori thotë qartë se «nuk i vihet ndalim për shkak të tij»; ai që ka mjaft pasuri dhe refuzon, burgoset derisa të shlyejë; dhe detyrimi i gjykatësit lidhet me kërkesën e kreditorëve. Shembull: pasuria 20.000 €, borxhet 50.000 €, dhe kreditorët shkojnë te gjykatësi dhe kërkojnë bllokimin e pasurisë.", "f": "٥٧"}, {"id": "B010", "k": 9, "lloji": "mcq", "q": "حُجِر على مُفلِسٍ لحقّ غرمائه. فأيُّ ما يلي صحيحٌ في حكمه بعد الحجر؟", "o": ["يجوز تصرّفُه في ماله، ولا يُقبل إقرارُه عليه", "لا يجوز تصرّفُه في ماله، ويُقبل إقرارُه عليه", "يجوز تصرّفُه في ماله، ويُقبل إقرارُه عليه", "لا يجوز تصرّفُه في ماله، ولا يُقبل إقرارُه عليه"], "a": 3, "q_sq": "Një të falimentuari (muflis) iu vu ndalim (haxhr) për të drejtën e kreditorëve të tij. Cila nga këto është e saktë për dispozitën e tij pas ndalimit?", "o_sq": ["I lejohet disponimi me pasurinë e tij, por nuk i pranohet pohimi mbi të", "Nuk i lejohet disponimi me pasurinë e tij, por i pranohet pohimi mbi të", "I lejohet disponimi me pasurinë e tij dhe i pranohet pohimi mbi të", "Nuk i lejohet disponimi me pasurinë e tij dhe nuk i pranohet pohimi (ikrari) mbi të"], "pse_ar": "لقول المؤلف: «فإذا حجر عليه لم يجز تصرفه في ماله، ولم يُقبل إقراره عليه».", "pse_sq": "E sakta: nuk i lejohet disponimi dhe nuk i pranohet pohimi mbi pasurinë. Autori thotë: «kur i vihet ndalimi, nuk i lejohet disponimi i pasurisë së tij dhe nuk i pranohet pohimi (ikrari) i tij mbi të». Ndalimi bëhet që pasuria të ruhet për kreditorët: nëse do t'i lejohej ta shiste ose ta dhuronte, ose nëse do t'i pranohej pohimi «I kam borxh filanit», pasuria do t'u humbiste atyre. Opsionet e tjera e lejojnë njërën ose të dyja. Shembull: pas bllokimit ai thotë «Kjo makinë është e vëllait tim»: kjo fjalë nuk pranohet mbi pasurinë e bllokuar.", "f": "٥٧"}, {"id": "B011", "k": 9, "lloji": "mcq", "q": "إذا تولّى الحاكمُ قضاءَ دَين المفلس، فبمَن يبدأ؟", "o": ["بمَن له رهنٌ فيأخذ من ثمن رهنه", "بمَن له أرشُ جنايةٍ من رقيق المفلس", "بمَن وجد متاعَه الذي باعه بعينه", "بسائر الغرماء على قدر ديونهم"], "a": 1, "q_sq": "Kur gjykatësi merr përsipër shlyerjen e borxhit të të falimentuarit, me kë fillon?", "o_sq": ["Me atë që ka peng, i cili merr nga çmimi i pengut të tij", "Me atë që ka të drejtë dëmshpërblimi (ersh) për krimin e kryer nga robi i të falimentuarit", "Me atë që e gjen po atë mall që ia ka shitur", "Me kreditorët e tjerë, në përpjesëtim me borxhet e tyre"], "pse_ar": "لقول المؤلف: «ويتولى الحاكم قضاء دينه، ويبدأ بمن له أرشُ جناية من رقيقه».", "pse_sq": "E sakta: me atë që ka dëmshpërblim për krimin e robit të tij. Autori e rendit kështu: «fillon me atë që ka të drejtë dëmshpërblimi (ersh) për një krim të kryer nga robi i tij ... pastaj me atë që ka peng ... pastaj ai që e gjen mallin që ka shitur po atë send ... Pjesa tjetër ndahet ndërmjet kreditorëve në përpjesëtim me borxhet e tyre». Pra pengmarrësi është i dyti, pronari i mallit të gjetur i treti, dhe kreditorët e tjerë të fundit. (Robëria sot nuk ekziston; rregulli tregon radhën e të drejtave që lidhen me një send të caktuar.)", "f": "٥٧"}, {"id": "B012", "k": 9, "lloji": "mcq", "q": "جنى عبدٌ للمفلس على رجلٍ، وكان أرشُ الجناية ثلاثةَ آلاف، وقيمةُ العبد ألفين. فكم يُدفع إلى المجنيّ عليه؟", "o": ["ثلاثة آلاف", "ألفان", "ألف", "ألفان وخمسمئة"], "a": 1, "q_sq": "Robi i një të falimentuari bëri krim ndaj (plagosi) një njeriu; dëmshpërblimi (ershi) i krimit është 3.000, ndërsa vlera e robit është 2.000. Sa i jepet të dëmtuarit?", "o_sq": ["3.000", "2.000", "1.000", "2.500"], "pse_ar": "لقول المؤلف: «فيَدفع إلى المجني عليه أقل الأمرين من أرشها أو قيمة الجاني»، والأقلّ هنا قيمة العبد.", "pse_sq": "E sakta: 2.000. Autori thotë se gjykatësi «i jep të dëmtuarit më të voglën nga dy gjërat: dëmshpërblimin ose vlerën e robit që ka kryer krimin». Këtu dëmshpërblimi është 3.000 dhe vlera e robit 2.000, pra më e vogla është 2.000. 3.000 do të ishte dëmshpërblimi i plotë, por i dëmtuari merr më të voglën; 2.500 dhe 1.000 nuk kanë bazë në llogari. Nëse dëmshpërblimi do të ishte 1.000, do t'i jepej 1.000.", "f": "٥٧"}, {"id": "B013", "k": 9, "lloji": "mcq", "q": "لرجلٍ على المفلس ألفٌ، وله به رهنٌ بِيع بثمانمئة. فما حكمه في قسمة مال المفلس؟", "o": ["يأخذ الثمانمئة، وتسقط المئتان الباقيتان", "يأخذ الثمانمئة، ويُقدَّم في المئتين على سائر الغرماء", "يقاسم الغرماءَ في الثمانمئة على قدر الديون", "يأخذ الثمانمئة، ويكون في المئتين الباقيتين أسوةَ الغرماء"], "a": 3, "q_sq": "Një njeri ka te i falimentuari 1.000 dhe për të ka një peng, i cili u shit për 800. Cila është dispozita e tij në ndarjen e pasurisë së të falimentuarit?", "o_sq": ["Merr 800, dhe 200 që mbeten i bien poshtë", "Merr 800, dhe për 200 që mbeten ka përparësi ndaj kreditorëve të tjerë", "I ndan 800 me kreditorët e tjerë në përpjesëtim me borxhet", "Merr 800, dhe për 200 që mbeten është si kreditorët e tjerë (usvetu'l-guremai)"], "pse_ar": "لقول المؤلف: «ثم بمن له رهن فيدفع إليه أقل الأمرين من دينه أو ثمن رهنه وله أسوة الغرماء في بقية دينه».", "pse_sq": "E sakta: merr 800 dhe për 200 të mbetura është si kreditorët e tjerë. Autori thotë: «pastaj me atë që ka peng: i jep më të voglën nga dy gjërat, borxhin e tij ose çmimin e pengut të tij, ndërsa për pjesën tjetër të borxhit ai është si kreditorët e tjerë». Këtu më e vogla është çmimi i pengut (800). Përparësia e pengmarrësit kufizohet te çmimi i pengut, prandaj për 200 të tjera s'ka përparësi, por as nuk i humbasin: hyn bashkë me kreditorët e tjerë. As nuk e ndan çmimin e pengut me ta, sepse ai merr para tyre. Shembull: nëse ora e lënë peng do të shitej 1.200, ai do të merrte 1.000, ndërsa 200 do të mbeteshin për të tjerët.", "f": "٥٧"}, {"id": "B014", "k": 9, "lloji": "mcq", "q": "باع رجلٌ متاعاً لآخر، ثم أفلس المشتري. أيُّ ما يلي **ليس** من شروط أخذ البائع متاعَه من المفلس عند المؤلف؟", "o": ["أن يكون باعه بثمنٍ حالّ", "أن يجده بعينه", "ألّا يكون زاد زيادةً متّصلة", "ألّا يكون أخذ من ثمنه شيئاً"], "a": 0, "q_sq": "Një njeri i shiti një mall dikujt, pastaj blerësi falimentoi. Cila nga këto **NUK** është nga kushtet që shitësi ta marrë mallin e vet nga i falimentuari sipas autorit?", "o_sq": ["Ta ketë shitur me çmim të menjëhershëm (jo me afat)", "Ta gjejë po atë send", "Të mos i ketë ardhur shtesë e bashkuar (si majmja e kafshës)", "Të mos ketë marrë asgjë nga çmimi i tij"], "pse_ar": "لقول المؤلف: «ثم من وجد متاعه الذي باعه بعينه ولم يزد زيادة متصلة ولم يأخذ من ثمنه شيئاً فله أخذه».", "pse_sq": "E sakta: shitja me çmim të menjëhershëm nuk është kusht. Autori thotë: «pastaj ai që e gjen mallin që ka shitur po atë send, pa i ardhur shtesë e bashkuar dhe pa marrë asgjë nga çmimi i tij, ka të drejtë ta marrë», dhe argumenton me hadithin: «Kush e gjen mallin e vet, po atë send, te një njeri që ka falimentuar, ai ka më shumë të drejtë për të se të tjerët.» Pra kushtet janë tri: po ai send, pa shtesë të bashkuar, pa marrë gjë nga çmimi; mënyra e pagesës nuk përmendet si kusht. Shembull: i shite dikujt një makinë me pagesë të mëvonshme dhe ai falimentoi pa të dhënë asgjë; nëse makina është ende te ai, po ajo, pa shtesë të bashkuar, e merr mbrapsht. Por nëse të ka paguar qoftë edhe një pjesë të çmimit, kushti i tretë mungon.", "f": "٥٧"}, {"id": "B015", "k": 9, "lloji": "tf", "q": "استدلّ المؤلف لأحقّيّة مَن وجد متاعَه بعينه عند المفلس بقول رسول الله ﷺ: «مَن أدركَ متاعَه بعينِه عند إنسانٍ قد أفلسَ فهو أحقُّ بهِ من غيرِه».", "a": 0, "q_sq": "Autori argumenton se ai që e gjen po atë mall të vetin te i falimentuari ka më shumë të drejtë për të, me fjalën e të Dërguarit të Allahut ﷺ: «Kush e gjen mallin e vet, po atë send, te një njeri që ka falimentuar, ai ka më shumë të drejtë për të se të tjerët.»", "pse_ar": "هذا هو الحديث الذي ذكره المؤلف دليلاً على قوله: «فله أخذه»، وهو في البخاري ومسلم من حديث أبي هريرة.", "pse_sq": "Pohimi është i saktë. Pasi i përmend kushtet (po ai send, pa shtesë të bashkuar, pa marrë asgjë nga çmimi), autori thotë: «ka të drejtë ta marrë, për shkak të fjalës së të Dërguarit të Allahut ﷺ» dhe sjell këtë hadith. E transmetojnë Buhariu dhe Muslimi nga Ebu Hurejra. Fjala «po atë send» (bi ajnihi) është baza e kushtit të parë.", "f": "٥٧"}, {"id": "B016", "k": 9, "lloji": "mcq", "q": "بقي من مال المفلس ستةُ آلاف، وعليه لزيدٍ ستةُ آلاف، ولعمرٍو ثلاثةُ آلاف، ولبكرٍ ثلاثةُ آلاف، وليس لأحدهم رهنٌ ولا متاعٌ بعينه. فكم يأخذ زيد؟", "o": ["ثلاثة آلاف", "ألفان", "ستة آلاف", "أربعة آلاف"], "a": 0, "q_sq": "Nga pasuria e të falimentuarit mbetën 6.000; ai i ka borxh Zejdit 6.000, Amrit 3.000 dhe Bekrit 3.000, dhe asnjëri prej tyre s'ka peng, as mall të vetin të gjetur te ai. Sa merr Zejdi?", "o_sq": ["3.000", "2.000", "6.000", "4.000"], "pse_ar": "لقول المؤلف: «ويُقسم الباقِي بين الغرماء على قدر ديونهم»، والمال نصف الديون، فيأخذ زيد نصف دينه.", "pse_sq": "E sakta: 3.000. Autori thotë: «Pjesa tjetër ndahet ndërmjet kreditorëve në përpjesëtim me borxhet e tyre». Borxhet gjithsej janë 12.000 dhe pasuria 6.000, pra mbulohet gjysma e çdo borxhi: Zejdi 3.000, Amri 1.500, Bekri 1.500. 2.000 do të ishte ndarje e barabartë për kokë, që s'është rregulli i librit; 6.000 do t'i jepte Zejdit përparësi pa bazë; 4.000 s'ka bazë në llogari.", "f": "٥٧"}, {"id": "B017", "k": 9, "lloji": "tf", "q": "يُنفَق على المفلس وعلى مَن تلزمه مؤنتُه من ماله إلى أن يُقسَم.", "a": 0, "q_sq": "I falimentuari dhe ata që ai është i detyruar t'i mbajë mbahen nga pasuria e tij derisa të ndahet.", "pse_ar": "لقول المؤلف: «ويُنفق على المفلس وعلى من تلزمه مؤنته من ماله إلى أن يقسم».", "pse_sq": "Pohimi është i saktë. Autori thotë: «...dhe i falimentuari dhe ata që ai i mban, mbahen nga pasuria e tij derisa të ndahet». Ndalimi nuk ia heq atij dhe familjes nevojat e jetesës; ato paguhen nga pasuria e bllokuar deri në ndarjen e saj mes kreditorëve. Shembull: gjatë kohës sa gjykatësi përgatit ndarjen, nga pasuria e bllokuar paguhen ushqimi dhe shpenzimet e jetesës së tij, të gruas dhe të fëmijëve.", "f": "٥٨"}, {"id": "B018", "k": 9, "lloji": "mcq", "q": "ثبت للمفلس حقٌّ على رجلٍ بشاهدٍ واحد، فأبى المفلس أن يحلف مع شاهده. فما حكم غرمائه؟", "o": ["ليس لهم أن يحلفوا عنه", "لهم أن يحلفوا بدلاً منه", "يحلف أحدُهم عن جميعهم", "لهم أن يحلفوا إن أذن الحاكم"], "a": 0, "q_sq": "I falimentuari ka një të drejtë te dikush, për të cilën ka vetëm një dëshmitar, dhe refuzon të betohet bashkë me dëshmitarin e tij. Cila është dispozita për kreditorët e tij?", "o_sq": ["Ata nuk mund të betohen në vend të tij", "Ata mund të betohen në vend të tij", "Betohet njëri prej tyre për të gjithë", "Ata mund të betohen nëse u jep leje gjykatësi"], "pse_ar": "لقول المؤلف: «وإن وجب له حق بشاهد فأبى أن يحلف لم يكن لغرمائه أن يحلفوا».", "pse_sq": "E sakta: ata nuk mund të betohen. Autori thotë: «Nëse ai ka një të drejtë (të vërtetuar) me një dëshmitar dhe refuzon të betohet, kreditorët e tij nuk mund të betohen (në vend të tij)». Betimi bashkë me një dëshmitar është i vetë pronarit të së drejtës, dhe askush nuk betohet për diçka që s'e di vetë. Opsionet e tjera i lejojnë kreditorët të betohen në një formë ose në një tjetër, gjë që bie ndesh me tekstin. Shembull: i falimentuari pretendon se dikush i ka borxh 3.000 € dhe ka vetëm një dëshmitar; nëse ai s'betohet, kreditorët s'betohen në vend të tij.", "f": "٥٨"}, {"id": "B019", "k": 10, "lloji": "mcq", "q": "لزيدٍ على عمرٍو مئةُ دينار، ولعمرٍو على بكرٍ مئةُ دينارٍ مثلُها، فأحال عمرٌو زيداً على بكر، فرضي زيد. فما الحكم؟", "o": ["لا يبرأ عمرٌو حتى يقبض زيدٌ من بكر", "برئ عمرٌو من دَين زيد", "صار الدَّين على عمرٍو وبكرٍ معاً", "لزيدٍ أن يطالب أيَّهما شاء"], "a": 1, "q_sq": "Zejdi ka te Amri 100 dinarë, ndërsa Amri ka te Bekri 100 dinarë të njëjtë. Amri e transferoi (havale) Zejdin te Bekri, dhe Zejdi pranoi. Cila është dispozita?", "o_sq": ["Amri nuk lirohet derisa Zejdi t'i marrë nga Bekri", "Amri lirohet nga borxhi i Zejdit", "Borxhi bëhet mbi Amrin dhe Bekrin bashkë", "Zejdi mund t'ia kërkojë cilit të dojë prej tyre"], "pse_ar": "لقول المؤلف: «ومن أُحيل بدينه على من عليه مثلُه فرضي فقد برئ المحيل».", "pse_sq": "E sakta: Amri (muhili) lirohet. Autori thotë: «Kush transferohet me borxhin e tij te dikush që i ka borxh të njëjtën sasi dhe pranon, transferuesi (muhil) lirohet (nga borxhi)». Këtu plotësohen të dyja: borxhi i Bekrit është i njëjtë me borxhin e Amrit, dhe Zejdi pranoi. Lirimi nuk pret marrjen e parave nga Bekri. Ndërsa «borxhi mbi të dy» dhe «kërkon cilit të dojë» janë dispozita të garancisë (damanit), jo të havales. Shembull: i thua kreditorit «Merri 100 € te Bekri, që më ka borxh 100 €» dhe ai pranon: ti s'ke më borxh ndaj tij.", "f": "٥٨"}, {"id": "B020", "k": 10, "lloji": "mcq", "q": "ما الدليل الذي ذكره المؤلف على أن مَن أُحيل على مليءٍ لزمه أن يحتال؟", "o": ["«مَن أدركَ متاعَه بعينِه عند إنسانٍ قد أفلسَ فهو أحقُّ بهِ من غيرِه»", "«إذا أُتبعَ أحدُكم على مليءٍ فليتبعْ»", "«أعطُوه فإن خيرَ الناسِ أحسنُهم قضاءً»", "«مَن أحيَا أرضاً ميتةً فهي له»"], "a": 1, "q_sq": "Cili është argumenti që përmend autori se kush transferohet te një meli' (që ka mundësi të paguajë) e ka detyrë ta pranojë transferimin?", "o_sq": ["«Kush e gjen mallin e vet, po atë send, te një njeri që ka falimentuar, ai ka më shumë të drejtë për të se të tjerët.»", "«Kur ndonjëri prej jush transferohet (për të marrë borxhin) te një i pasur, le ta pranojë.»", "«Jepjani atë, sepse më të mirët e njerëzve janë ata që shlyejnë (borxhin) më mirë.»", "«Kush e ringjall një tokë të vdekur, ajo është e tij.»"], "pse_ar": "لقول المؤلف: «ومن أحيل على مليءٍ لزمه أن يحتال، لقول رسول الله ﷺ: إذا أُتبعَ أحدُكم على مليءٍ فليتبعْ».", "pse_sq": "E sakta: hadithi «Kur ndonjëri prej jush transferohet (për të marrë borxhin) te një i pasur, le ta pranojë.» Autori thotë: «kush transferohet te një i pasur (që paguan), e ka detyrë ta pranojë transferimin, për shkak të fjalës së të Dërguarit të Allahut ﷺ» dhe sjell këtë hadith (Buhariu dhe Muslimi). Urdhri «le ta pranojë» tregon detyrimin. Hadithet e tjera janë argumente të autorit në vende të tjera: hadithi i mallit të gjetur te i falimentuari (radha e shlyerjes së borxheve të tij), hadithi «Jepjani atë...» (kthimi i huasë me diçka më të mirë) dhe hadithi i tokës së vdekur (ringjallja e mevatit).", "f": "٥٨"}, {"id": "B021", "k": 10, "lloji": "tf", "q": "أحال مدينٌ غريمَه على رجلٍ مليءٍ عليه للمدين مثلُ دينه، فأبى الغريمُ وقال: لا آخذ إلا منك؛ فله ذلك عند المؤلف.", "a": 1, "q_sq": "Një borxhli e transferoi kreditorin e tij te një njeri meli' (që ka mundësi të paguajë), i cili i ka borxhliut një borxh të njëjtë; kreditori refuzoi dhe tha: «Nuk e marr veçse prej teje». Sipas autorit, ai ka të drejtë për këtë.", "pse_ar": "لقول المؤلف: «ومن أحيل على مليءٍ لزمه أن يحتال».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «kush transferohet te një i pasur (që paguan), e ka detyrë ta pranojë transferimin», për shkak të hadithit «Kur ndonjëri prej jush transferohet (për të marrë borxhin) te një i pasur, le ta pranojë.» Meqë ai te i cili u transferua është meli', kreditori nuk mund të refuzojë. Shembull: Bekri ka mundësi të paguajë; Ahmedi s'mund të thotë «Jo, i dua vetëm prej teje».", "f": "٥٨"}, {"id": "B022", "k": 10, "lloji": "mcq", "q": "اقترض عليٌّ من أحمد ألفاً، وضمنه بكرٌ في هذا الدَّين. فممّن يطالب أحمدُ بالدَّين؟", "o": ["من أيّهما شاء", "من عليٍّ وحده", "من بكرٍ وحده", "من بكرٍ إذا عجز عليٌّ عن الوفاء"], "a": 0, "q_sq": "Aliu mori hua 1.000 nga Ahmedi, dhe Bekri u bë garantues (damin) për këtë borxh. Kujt mund t'ia kërkojë Ahmedi borxhin?", "o_sq": ["Cilit të dojë prej tyre", "Vetëm Aliut", "Vetëm Bekrit", "Bekrit, kur Aliu s'ka mundësi ta shlyejë"], "pse_ar": "لقول المؤلف: «وإن ضمنه عنه ضامن لم يبرأ وصار الدين عليهما، ولصاحبه مطالبة من شاء منهما».", "pse_sq": "E sakta: cilit të dojë prej tyre. Autori thotë: «Nëse dikush garanton për të, ai (borxhliu) nuk lirohet, por borxhi bëhet mbi të dy, dhe pronari i tij mund t'ia kërkojë cilitdo prej tyre». Pra Ahmedi s'është i kufizuar vetëm te Aliu, sepse garancia e shton Bekrin; as vetëm te Bekri, sepse Aliu s'lirohet; dhe s'ka nevojë të presë derisa Aliu të mos ketë mundësi. Shembull: Ahmedi mund t'i shkojë drejt e Bekrit, edhe pse Aliu ka mundësi të paguajë.", "f": "٥٨"}, {"id": "B023", "k": 10, "lloji": "tf", "q": "إذا ضمن رجلٌ دَيناً على غيره، برئ المضمونُ عنه وانتقل الدَّينُ إلى الضامن.", "a": 1, "q_sq": "Kur një njeri garanton (daman) borxhin e tjetrit, lirohet ai për të cilin u garantua dhe borxhi kalon te garantuesi.", "pse_ar": "لقول المؤلف: «وإن ضمنه عنه ضامن لم يبرأ وصار الدين عليهما».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «Nëse dikush garanton për të, ai (borxhliu) nuk lirohet, por borxhi bëhet mbi të dy». Kalimi i borxhit dhe lirimi i borxhliut të parë janë dispozita e havales (transferimit), jo e garancisë. Te garancia borxhi mbetet mbi borxhliun dhe shtohet edhe mbi garantuesin. Shembull: Bekri garantoi për Aliun, por Aliu mbetet borxhli.", "f": "٥٨"}, {"id": "B024", "k": 10, "lloji": "mcq", "q": "ضمن رجلٌ دَيناً، ثم أبرأ صاحبُ الحقّ المضمونَ عنه (المدينَ الأصيل). فما حكم الضامن؟", "o": ["يبقى الدَّينُ على الضامن", "يبرأ الضامنُ أيضاً", "يبقى ضامناً لنصف الدَّين", "لا يبرأ حتى يُبرئه صاحبُ الحقّ"], "a": 1, "q_sq": "Një njeri garantoi një borxh, pastaj pronari i së drejtës e liroi (ia fali borxhin) atë për të cilin u garantua (borxhliun kryesor). Cila është dispozita e garantuesit?", "o_sq": ["Borxhi mbetet mbi garantuesin", "Lirohet edhe garantuesi", "Mbetet garantues për gjysmën e borxhit", "Nuk lirohet derisa ta lirojë edhe atë pronari i së drejtës"], "pse_ar": "لقول المؤلف: «فإن استوفى من المضمون عنه أو أبرأه برئ ضامنُه».", "pse_sq": "E sakta: lirohet edhe garantuesi. Autori thotë: «nëse e merr nga ai për të cilin është garantuar ose e liron atë, lirohet edhe garantuesi i tij». Garancia e ndjek borxhin kryesor: kur borxhi bie nga borxhliu kryesor, me pagesë ose me falje, s'mbetet asgjë për të garantuar. Prandaj s'mbetet borxh mbi garantuesin, as gjysma e tij, dhe s'ka nevojë për lirim të veçantë. Shembull: Ahmedi i thotë Aliut «Ta fala borxhin», ose Aliu e paguan: lirohet edhe Bekri, garantuesi.", "f": "٥٨"}, {"id": "B025", "k": 10, "lloji": "tf", "q": "أبرأ صاحبُ الحقّ الضامنَ، فبرئ بذلك المدينُ الأصيلُ أيضاً.", "a": 1, "q_sq": "Pronari i së drejtës e liroi garantuesin, dhe me këtë u lirua edhe borxhliu kryesor.", "pse_ar": "لقول المؤلف: «وإن أبرأ الضامن لم يبرأ الأصيل».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «nëse e liron garantuesin, nuk lirohet borxhliu kryesor». Garancia është e shtuar mbi borxhin kryesor: rënia e borxhit kryesor e rrëzon garancinë, por rënia e garancisë s'e rrëzon borxhin kryesor. Shembull: Ahmedi i thotë vetëm Bekrit «Të liroj nga garancia»; Aliu mbetet borxhli.", "f": "٥٨"}, {"id": "B026", "k": 10, "lloji": "mcq", "q": "استوفى صاحبُ الحقّ الدَّينَ من الضامن. فما الحكم بعد ذلك؟", "o": ["لا يرجع الضامنُ بشيءٍ لأنه التزمه", "يرجع الضامنُ على صاحب الحقّ بما دفع", "يرجع الضامنُ على المدين الأصيل بما دفع", "يرجع الضامنُ على المدين الأصيل بنصف ما دفع"], "a": 2, "q_sq": "Pronari i së drejtës e mori borxhin nga garantuesi. Cila është dispozita pas kësaj?", "o_sq": ["Garantuesi nuk kërkon asgjë, sepse e mori vetë përsipër", "Garantuesi ia kërkon pronarit të së drejtës atë që pagoi", "Garantuesi ia kërkon borxhliut kryesor atë që pagoi", "Garantuesi ia kërkon borxhliut kryesor gjysmën e asaj që pagoi"], "pse_ar": "لقول المؤلف: «وإن استوفى من الضامن رجع عليه».", "pse_sq": "E sakta: garantuesi ia kërkon borxhliut kryesor atë që pagoi. Autori thotë: «e nëse e merr nga garantuesi, ky ia kërkon atij (borxhliut)». Garantuesi e pagoi borxhin e tjetrit, prandaj ka të drejtë ta kthejë prej tij; pronari i së drejtës mori vetëm të drejtën e vet, prandaj s'i kërkohet asgjë. Kthimi i gjysmës nuk ka bazë. Shembull: Bekri ia paguan Ahmedit 1.000 €, pastaj ia kërkon këto 1.000 € Aliut.", "f": "٥٨"}, {"id": "B027", "k": 10, "lloji": "mcq", "q": "مَن تكفّل بإحضار مَن عليه دَينٌ فلم يُحضره، فما الذي يلزمه عند المؤلف؟", "o": ["لا شيء عليه لأنه لم يضمن المال", "يلزمه ما على المدين", "يُحبَس حتى يُحضره", "يلزمه نصفُ ما على المدين"], "a": 1, "q_sq": "Kush merr përsipër (kefale) ta sjellë atë që ka borxh dhe nuk e sjell, çfarë i bie sipas autorit?", "o_sq": ["Asgjë, sepse nuk e garantoi pasurinë", "I bie ajo (borxhi) që ka borxhliu", "Burgoset derisa ta sjellë", "I bie gjysma e asaj që ka borxhliu"], "pse_ar": "لقول المؤلف: «ومن تكفل بإحضار من عليه دين فلم يُحضره لزمه ما عليه».", "pse_sq": "E sakta: i bie borxhi i atij që garantoi ta sjellë. Autori thotë: «Kush merr përsipër (kefale) ta sjellë atë që ka borxh dhe nuk e sjell, i bie atij ajo që ka ky». Edhe pse kefili e mori përsipër vetëm sjelljen e personit, kur s'e sjell, e paguan vetë borxhin; prandaj s'është e saktë se s'ka asgjë mbi të. Burgosja dhe gjysma e borxhit nuk përmenden. Shembull: Bekri i tha Ahmedit «Unë marr përsipër ta sjell Aliun kur ta kërkosh»; nëse s'e sjell, paguan vetë borxhin e Aliut.", "f": "٥٨"}, {"id": "B028", "k": 10, "lloji": "tf", "q": "مَن تكفّل بإحضار مدينٍ فمات المدين، برئ الكفيل.", "a": 0, "q_sq": "Kush merr përsipër (kefale) ta sjellë një borxhli, e borxhliu vdes, kefili (dorëzani) lirohet.", "pse_ar": "لقول المؤلف في الكفالة: «فإن مات برئ كفيله».", "pse_sq": "Pohimi është i saktë. Pasi thotë se kefili që nuk e sjell borxhliun e paguan vetë borxhin, autori shton: «e nëse (borxhliu) vdes, dorëzani i tij lirohet». Kefili e mori përsipër sjelljen e personit, dhe me vdekjen e tij sjellja s'është më e mundur, prandaj detyrimi bie. Kjo e dallon kefalen nga garancia (damani), ku borxhi bëhet mbi garantuesin dhe borxhliun bashkë.", "f": "٥٨"}, {"id": "B029", "k": 11, "lloji": "mcq", "q": "أراد رجلٌ أن يرهن عند غريمه كلبَ صيد. فما الحكم؟", "o": ["يجوز رهنُه، لأن فيه نفعاً مباحاً", "يجوز رهنُه إذا كان الدَّين قرضاً", "لا يجوز رهنُه، لأنه لا يجوز بيعُه", "يجوز رهنُه، ولا يُباع عند حلول الدَّين"], "a": 2, "q_sq": "Një njeri dëshiron t'ia lërë peng kreditorit të tij një qen gjuetie. Cila është dispozita?", "o_sq": ["Lejohet të lihet peng, sepse ka dobi të lejuar", "Lejohet të lihet peng kur borxhi është hua", "Nuk lejohet të lihet peng, sepse nuk lejohet të shitet", "Lejohet të lihet peng, por nuk shitet kur borxhit i vjen koha"], "pse_ar": "لقول المؤلف في الرهن: «وكل ما جاز بيعه جاز رهنه، وما لا فلا»، وقد قال في البيع: «إلا الكلبَ، فإنه لا يجوز بيعه».", "pse_sq": "E sakta: nuk lejohet të lihet peng, sepse nuk lejohet të shitet. Autori thotë: «Çdo gjë që lejohet të shitet, lejohet të lihet peng; e ajo që nuk lejohet (të shitet), nuk lejohet (të lihet peng)». Ndërsa në kapitullin e shitjes e ka përjashtuar qenin: «përveç qenit: shitja e tij nuk lejohet». Pengu shitet kur borxhi s'shlyhet, prandaj ajo që s'shitet s'mund të jetë peng. Dobia e lejuar e qenit të gjuetisë lejon mbajtjen e tij, jo shitjen; lloji i borxhit nuk e ndryshon dispozitën; dhe një peng që s'shitet kur vjen koha e borxhit s'e kryen qëllimin e pengut. Shembull: makina, ari, shtëpia lihen peng; alkooli s'lihet peng.", "f": "٥٨"}, {"id": "B030", "k": 11, "lloji": "tf", "q": "يلزم الرهنُ بمجرّد العقد، وإن لم يقبضه المرتهن.", "a": 1, "q_sq": "Pengu bëhet i detyrueshëm (i prerë) me vetë kontratën, edhe nëse pengmarrësi nuk e ka marrë në dorë.", "pse_ar": "لقول المؤلف: «ولا يلزم إلا بالقبض».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «Pengu nuk bëhet i detyrueshëm veçse me marrjen në dorë (kabd)». Pra para marrjes në dorë pengu s'është i prerë; pasi e merr pengmarrësi (ose i besuari i tij), bëhet i detyrueshëm. Shembull: ke rënë dakord t'ia lësh kreditorit orën peng, por ende s'ia ke dorëzuar: pengu s'është bërë ende i detyrueshëm.", "f": "٥٨"}, {"id": "B031", "k": 11, "lloji": "mcq", "q": "ما القبضُ الذي يلزم به الرهن عند المؤلف؟", "o": ["التخليةُ إن كان منقولاً، ونقلُه فيما سواه", "نقلُه في المنقول وفي غيره", "التخليةُ في المنقول وفي غيره", "نقلُه إن كان منقولاً، والتخليةُ فيما سواه"], "a": 3, "q_sq": "Cila është marrja në dorë (kabdi) me të cilën bëhet i detyrueshëm pengu sipas autorit?", "o_sq": ["Lënia e lirë nëse është i luajtshëm, dhe zhvendosja e tij për të tjerat", "Zhvendosja e tij, si te i luajtshmi ashtu edhe te tjetri", "Lënia e lirë, si te i luajtshmi ashtu edhe te tjetri", "Zhvendosja e tij nëse është i luajtshëm, dhe lënia e lirë (në dispozicion) për të tjerat"], "pse_ar": "لقول المؤلف: «ولا يلزم إلا بالقبض، وهو نقلُه إن كان منقولاً والتخليةُ فيما سواه».", "pse_sq": "E sakta: zhvendosja te i luajtshmi dhe lënia e lirë te të tjerat. Autori thotë: «...marrja në dorë, që është zhvendosja e tij nëse është i luajtshëm dhe lënia e lirë (në dispozicion) për të tjerat». Sendi i luajtshëm (ora, makina) merret duke u zhvendosur te pengmarrësi, ndërsa i paluajtshmi (shtëpia, toka) s'zhvendoset dot, prandaj marrja e tij është heqja e pengesave dhe vënia në dispozicion. Opsionet e tjera i ndërrojnë ose i barazojnë dy llojet. Shembull: për shtëpinë i jep kreditorit çelësat dhe ia lë të lirë.", "f": "٥٨"}, {"id": "B032", "k": 11, "lloji": "tf", "q": "إذا قبض الرهنَ أمينُ المرتهن (مَن يأتمنه المرتهن على حفظه)، قام ذلك مقامَ قبض المرتهن نفسه.", "a": 0, "q_sq": "Kur pengun e merr në dorë i besuari i pengmarrësit (ai të cilit pengmarrësi ia beson ruajtjen), kjo është si marrja nga vetë pengmarrësi.", "pse_ar": "لقول المؤلف: «وقبض أمين المرتهن يقوم مقام قبضه».", "pse_sq": "Pohimi është i saktë. Autori thotë: «marrja nga i besuari i pengmarrësit është si marrja e tij». Pra pengu bëhet i detyrueshëm edhe kur i dorëzohet një personi të tretë të besuar që e ruan për kreditorin. Prandaj autori thotë më pas: «Pengu është amanet te pengmarrësi ose te i besuari i tij». Shembull: ari i lënë peng i dorëzohet një personi të besuar që e ruan për kreditorin.", "f": "٥٨"}, {"id": "B033", "k": 11, "lloji": "mcq", "q": "رهن رجلٌ ساعةً عند غريمه، فسُرقت من بيت المرتهن من غير تعدٍّ منه. فما الحكم؟", "o": ["يضمنها المرتهن بقيمتها كاملة", "يضمن المرتهن نصفَ قيمتها", "لا يضمنها المرتهن، لأنها أمانة", "يضمنها المرتهن إن كان الدَّين حالًّا"], "a": 2, "q_sq": "Një njeri ia la peng kreditorit të tij një orë, e cila u vodh nga shtëpia e pengmarrësit pa tejkalim nga ana e tij. Cila është dispozita?", "o_sq": ["Pengmarrësi e garanton me gjithë vlerën e saj", "Pengmarrësi e garanton gjysmën e vlerës së saj", "Pengmarrësi nuk e garanton (s'e paguan), sepse është amanet", "Pengmarrësi e garanton nëse borxhit i ka ardhur koha"], "pse_ar": "لقول المؤلف: «والرهن أمانة عند المرتهن أو أمينه لا يضمنه إلا أن يتعدى».", "pse_sq": "E sakta: pengmarrësi nuk e garanton. Autori thotë: «Pengu është amanet te pengmarrësi ose te i besuari i tij; ai nuk e garanton (nëse shkatërrohet) përveç nëse e tejkalon kufirin». Ora u vodh pa tejkalim, prandaj ai s'paguan asgjë, as të plotë, as gjysmën. Koha e borxhit nuk ka lidhje me këtë: rregulli varet vetëm nga tejkalimi. Shembull: nëse ai e kishte përdorur orën ose e kishte lënë pa ruajtje, atëherë do ta paguante.", "f": "٥٨"}, {"id": "B034", "k": 11, "lloji": "tf", "q": "للمرتهن أن ينتفع بالدار المرهونة بالسُّكنى ما دامت في يده.", "a": 1, "q_sq": "Pengmarrësi ka të drejtë të përfitojë nga shtëpia e lënë peng duke banuar në të, për sa kohë që është në dorën e tij.", "pse_ar": "لقول المؤلف: «ولا ينتفع المرتهن بشيء منه إلا ما كان مركوباً أو محلوباً».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «pengmarrësi nuk përfiton asgjë prej tij, përveç asaj që hipet ose mjelet». Shtëpia nuk është nga këto dy, prandaj pengmarrësi s'ka të drejtë të banojë në të. Pengu është siguri për borxhin, jo burim përfitimi për kreditorin. Shembull: kreditori s'mund as ta ngasë makinën e lënë peng.", "f": "٥٨"}, {"id": "B035", "k": 11, "lloji": "mcq", "q": "رهن رجلٌ بقرةً حلوباً عند غريمه، وكان المرتهن يعلفها. فما حكم حلبه لها؟", "o": ["لا يحلبها مطلقاً", "يحلبها ويأخذ لبنها كلَّه", "يحلبها ويُحسَب لبنُها من دَينه", "يحلبها بمقدار العلف"], "a": 3, "q_sq": "Një njeri ia la peng kreditorit të tij një lopë që mjelet, dhe pengmarrësi e ushqente. Cila është dispozita e mjeljes së saj prej tij?", "o_sq": ["Nuk e mjel fare", "E mjel dhe e merr gjithë qumështin e saj", "E mjel, dhe qumështi i saj llogaritet nga borxhi i tij", "E mjel në masën e ushqimit (që i jep)"], "pse_ar": "لقول المؤلف: «إلا ما كان مركوباً أو محلوباً فللمرتهن أن يركب ويحلب بمقدار العلف».", "pse_sq": "E sakta: e mjel në masën e ushqimit. Autori thotë: «pengmarrësi nuk përfiton asgjë prej tij, përveç asaj që hipet ose mjelet: pengmarrësi mund ta hipë dhe ta mjelë në masën e ushqimit (që i jep)». Përfitimi lejohet vetëm aq sa është ushqimi që i jep, jo më shumë; prandaj s'merr gjithë qumështin, por as s'ndalohet fare. Llogaritja e qumështit nga borxhi nuk përmendet. Shembull: kali i lënë peng që kreditori e ushqen mund ta hipë aq sa vlen ushqimi.", "f": "٥٨"}, {"id": "B036", "k": 11, "lloji": "mcq", "q": "رهن رجلٌ شاةً عند غريمه فولدت. فلمَن ولدُها، وعلى مَن مؤنتُها ومخزنُها؟", "o": ["الولد للمرتهن ويُحسب من دَينه، والمؤنة والمخزن على المرتهن", "الولد للراهن ويكون رهناً معها، والمؤنة والمخزن على الراهن", "الولد للراهن ولا يدخل في الرهن، والمؤنة والمخزن على المرتهن", "الولد للمرتهن عوضاً عن علفه، والمؤنة والمخزن على الراهن"], "a": 1, "q_sq": "Një njeri ia la peng kreditorit të tij një dele dhe ajo polli. I kujt është qengji, dhe kush i paguan mbajtjen dhe vendin e ruajtjes së saj?", "o_sq": ["Qengji është i pengmarrësit dhe llogaritet nga borxhi i tij; mbajtja dhe ruajtja janë mbi pengmarrësin", "Qengji është i pengdhënësit dhe bëhet peng bashkë me të; mbajtja dhe ruajtja janë mbi pengdhënësin", "Qengji është i pengdhënësit dhe nuk hyn në peng; mbajtja dhe ruajtja janë mbi pengmarrësin", "Qengji është i pengmarrësit në këmbim të ushqimit që i jep; mbajtja dhe ruajtja janë mbi pengdhënësin"], "pse_ar": "لقول المؤلف: «وللراهن غنمه من غلَّته وكسبه ونمائه لكنَّه يكون رهناً معه، وعليه غرمه من مؤنته ومخزنه وكفنه إن مات».", "pse_sq": "E sakta: qengji është i pengdhënësit dhe bëhet peng bashkë me delen, ndërsa shpenzimet janë mbi pengdhënësin. Autori thotë: «pengdhënësit i takon fitimi i tij – të ardhurat, fitimi dhe shtimi i tij –, por ky bëhet peng bashkë me të; dhe ai ka për detyrë shpenzimet e tij, mbajtjen, ruajtjen dhe qefinin e tij nëse vdes». Pengdhënësi mbetet pronar, prandaj i takon edhe shtimi i pronës (pjella, qiraja), edhe barra e saj; por shtimi mbahet peng bashkë me të. Pengmarrësi s'ka pronësi mbi pjellën, dhe shpenzimet s'janë mbi të. Shembull: shtëpia e lënë peng jep qira: qiraja është e pronarit, por mbahet peng bashkë me shtëpinë.", "f": "٥٨"}, {"id": "B037", "k": 11, "lloji": "mcq", "q": "أتلف الراهنُ السيارةَ المرهونة عمداً. فما الذي يلزمه؟", "o": ["قضاءُ الدَّين كلِّه في الحال", "لا شيء عليه لأنها ملكُه", "قيمتُها تكون رهناً مكانها", "قيمتُها تُدفع إلى المرتهن ملكاً له"], "a": 2, "q_sq": "Pengdhënësi e shkatërroi qëllimisht makinën e lënë peng. Çfarë ka për detyrë?", "o_sq": ["Ta shlyejë gjithë borxhin menjëherë", "Asgjë, sepse është pronë e tij", "Vlerën e saj, e cila bëhet peng në vend të saj", "Vlerën e saj, që i jepet pengmarrësit si pronë e tij"], "pse_ar": "لقول المؤلف: «وإن أتلفه أو أخرجه من الرهن بعتق أو استيلاد فعليه قيمته تكون رهناً مكانه».", "pse_sq": "E sakta: vlera e saj, që bëhet peng në vend të saj. Autori thotë: «Nëse (pengdhënësi) e shkatërron ose e nxjerr nga pengu me lirim apo duke e bërë nënë të fëmijës së tij (robëreshën), ka për detyrë vlerën e tij, e cila bëhet peng në vend të tij». Edhe pse makina është pronë e tij, ai e prishi sigurinë e kreditorit, prandaj s'del pa gjë. Vlera nuk i jepet kreditorit si pronë, as borxhi s'bëhet i menjëhershëm, por vlera zë vendin e pengut. I njëjti rregull vlen kur pengu është rob dhe pronari e liron, ose kur robëresha e lënë peng i lind fëmijë (istiladh); këto sot s'ekzistojnë.", "f": "٥٨"}, {"id": "B038", "k": 11, "lloji": "mcq", "q": "إذا جنى غيرُ الراهن والمرتهن على الرهن فأتلفه، فمَن الخصمُ فيه، وما حكم ما يُقبض بسببه؟", "o": ["المرتهنُ هو الخصم، وما قُبض فهو له", "الراهنُ هو الخصم، وما قُبض فهو له خالصاً", "المرتهنُ هو الخصم، وما قُبض فهو رهن", "الراهنُ هو الخصم، وما قُبض فهو رهن"], "a": 3, "q_sq": "Kur dikush tjetër, jo pengdhënësi as pengmarrësi, bën krim ndaj pengut dhe e shkatërron, kush është pala në gjyq për të, dhe cila është dispozita e asaj që merret (si kompensim) për shkak të tij?", "o_sq": ["Pengmarrësi është pala në gjyq, dhe ajo që merret është e tij", "Pengdhënësi është pala në gjyq, dhe ajo që merret është plotësisht e tij (jashtë pengut)", "Pengmarrësi është pala në gjyq, dhe ajo që merret bëhet peng", "Pengdhënësi është pala në gjyq, dhe ajo që merret bëhet peng"], "pse_ar": "لقول المؤلف: «وإن جنى عليه غيره فهو الخصم فيه، وما قُبض بسببه فهو رهن».", "pse_sq": "E sakta: pengdhënësi është pala në gjyq dhe kompensimi bëhet peng. Autori thotë: «Nëse dikush tjetër bën krim ndaj tij, ai (pengdhënësi) është pala në gjyq për të, dhe ajo që merret për shkak të tij bëhet peng». Pengdhënësi është pronari, prandaj ai e padit dëmtuesin; por kompensimi zë vendin e pengut, ndaj nuk i del atij i lirë, dhe as nuk bëhet pronë e kreditorit. Shembull: dikush e përplas makinën e lënë peng; pronari e padit, dhe dëmshpërblimi mbahet peng.", "f": "٥٨"}, {"id": "B039", "k": 11, "lloji": "mcq", "q": "جنى العبدُ المرهونُ على رجلٍ. فما الحكم عند المؤلف؟", "o": ["المرتهنُ أحقُّ برقبته من المجنيّ عليه", "يُقسم ثمنُه بين المرتهن والمجنيّ عليه", "تُهدَر الجنايةُ لأن العبد مرهون", "المجنيُّ عليه أحقُّ برقبته من المرتهن"], "a": 3, "q_sq": "Robi i lënë peng bëri krim ndaj një njeriu. Cila është dispozita sipas autorit?", "o_sq": ["Pengmarrësi ka më shumë të drejtë mbi vetë robin se i dëmtuari", "Çmimi i robit ndahet ndërmjet pengmarrësit dhe të dëmtuarit", "Krimi shkon kot (pa dëmshpërblim), sepse robi është peng", "I dëmtuari ka më shumë të drejtë mbi vetë robin se pengmarrësi"], "pse_ar": "لقول المؤلف: «وإن جنى الرهن فالمجنيُّ عليه أحق برقبته».", "pse_sq": "E sakta: i dëmtuari ka përparësi mbi vetë robin. Autori thotë: «Nëse pengu (robi) bën krim, i dëmtuari ka më shumë të drejtë mbi vetë atë», dhe shton se nëse shpengohet (paguhet dëmshpërblimi për të), mbetet peng si më parë. E drejta e të dëmtuarit lidhet me vetë robin që bëri krimin, prandaj del para të drejtës së pengmarrësit; kjo përputhet me radhën te i falimentuari, ku dëmshpërblimi për krimin e robit paguhet para pengmarrësit. Prandaj as pengmarrësi s'ka përparësi, as çmimi s'ndahet mes tyre, as krimi s'shkon kot. (Robëria sot s'ekziston.)", "f": "٥٨"}, {"id": "B040", "k": 11, "lloji": "mcq", "q": "رهن رجلٌ ساعةً بدَينٍ قدرُه خمسمئة، فحلّ الدَّين ولم يوفِه، فبِيعت الساعة بسبعمئة. فما الحكم؟", "o": ["يأخذ المرتهن السبعمئة كلَّها", "يتملّك المرتهن الساعةَ بدينه ولا تُباع", "يأخذ المرتهن خمسمئة، والمئتان تُقسمان بينهما", "يأخذ المرتهن خمسمئة، والمئتان للراهن"], "a": 3, "q_sq": "Një njeri la peng një orë për një borxh prej 500; borxhit i erdhi koha dhe ai s'e pagoi, dhe ora u shit për 700. Cila është dispozita?", "o_sq": ["Pengmarrësi merr gjithë 700", "Pengmarrësi e merr orën në pronësi për borxhin e tij, pa u shitur", "Pengmarrësi merr 500, ndërsa 200 ndahen ndërmjet tyre", "Pengmarrësi merr 500, ndërsa 200 janë të pengdhënësit"], "pse_ar": "لقول المؤلف: «وإذا حل الدين فلم يوفه الراهن بِيعَ ووفِّيَ الحقُّ من ثمنه وباقيه للراهن».", "pse_sq": "E sakta: pengmarrësi merr 500 dhe 200 i kthehen pengdhënësit. Autori thotë: «Kur bëhet i menjëhershëm borxhi dhe pengdhënësi nuk e shlyen, pengu shitet dhe e drejta paguhet nga çmimi i tij, ndërsa pjesa tjetër i takon pengdhënësit». Pengmarrësi s'merr më shumë se e drejta e tij, as e merr pengun në pronësi pa u shitur, sepse autori thotë se pengu shitet. Teprica i takon e gjitha pronarit, nuk ndahet. Shembull i sotëm: makina e lënë peng shitet, kreditori merr borxhin dhe pjesa tjetër i kthehet pronarit.", "f": "٥٨"}, {"id": "B041", "k": 11, "lloji": "tf", "q": "باع رجلٌ سلعةً بشرط أن يعطيه المشتري رهناً، فأبى المشتري أن يسلّم الرهن؛ فالبائع مخيَّرٌ بين فسخ البيع وإقامته بلا رهن.", "a": 0, "q_sq": "Një njeri shiti një mall me kusht që blerësi t'i japë peng, por blerësi refuzoi ta dorëzojë pengun; shitësi ka zgjedhje ndërmjet prishjes së shitjes dhe mbajtjes së saj pa peng.", "pse_ar": "لقول المؤلف: «وإذا شُرط الرهن أو الضمين في بيع فأبى الراهن أن يسلِّمه وأبى الضمين أن يضمن خيِّر البائع بين الفسخ أو إقامته بلا رهن ولا ضمين».", "pse_sq": "Pohimi është i saktë. Autori thotë: «Kur në një shitje kushtëzohet pengu ose garantuesi, e pengdhënësi refuzon ta dorëzojë dhe garantuesi refuzon të garantojë, shitësi ka zgjedhje ndërmjet prishjes (së shitjes) dhe mbajtjes së saj pa peng e pa garantues». Shitësi pranoi të shesë duke u mbështetur te siguria e kushtëzuar; kur kjo s'realizohet, i jepet zgjedhja. Po kështu kur kushtëzohet garantues (damin) dhe ai refuzon të garantojë. Shembull: shet një makinë me këste me kusht që blerësi të japë peng; nëse s'e jep, ti zgjedh ta prishësh shitjen ose ta vazhdosh pa peng.", "f": "٥٨"}, {"id": "B042", "k": 12, "lloji": "mcq", "q": "لرجلٍ على آخر ألفٌ حالّة، والمدين مُقرٌّ بها مستعدٌّ لوفائها، فقال له الدائن متبرّعاً من غير شرط: «أسقطتُ عنك مئتين». فما الحكم؟", "o": ["لا يجوز، لأنه ربا", "يجوز، وهو إسقاطٌ صحيح", "لا يجوز إلا بإذن الحاكم", "لا يجوز في الدَّين، وإنما يجوز في العين"], "a": 1, "q_sq": "Një njeri ka te tjetri 1.000 të menjëhershme; borxhliu e pranon borxhin dhe është gati ta paguajë, ndërsa kreditori i thotë me vullnet të lirë, pa asnjë kusht: «Ta fala 200». Cila është dispozita?", "o_sq": ["Nuk lejohet, sepse është kamatë", "Lejohet, dhe falja është e vlefshme", "Nuk lejohet veçse me lejen e gjykatësit", "Nuk lejohet te borxhi, por vetëm te sendi i caktuar (ajn)"], "pse_ar": "لقول المؤلف: «ومن أسقط بعضَ دينه أو وهب غريمَه بعضَ العين التي في يده جاز».", "pse_sq": "E sakta: lejohet. Autori thotë: «Kush ia fal (borxhliut) një pjesë të borxhit të tij, ose ia dhuron borxhliut një pjesë të sendit që është në dorën e tij, lejohet», pastaj përmend rastet kur nuk lejohet (p.sh. kur shlyerja e pjesës tjetër bëhet kusht). Këtu falja është me vullnet të lirë, pa kusht, prandaj është bamirësi e lejuar, jo kamatë; nuk kërkohet leja e gjykatësit, dhe lejohet si te borxhi ashtu edhe te sendi. Shembull: «Më ke 1.000 €; ta fal 200 €». Po ashtu: shoku ka te vetja dhjetë thasë miell që janë të tutë, dhe ti i dhuron dy prej tyre.", "f": "٥٨"}, {"id": "B043", "k": 12, "lloji": "mcq", "q": "قال الدائن لمدينه: «أُبرئك من مئتين بشرط أن تعطيني الثمانمئة الباقية». فما حكم هذا الإبراء؟", "o": ["يجوز، لأنه إسقاطٌ لبعض الدَّين", "يجوز إن كان الدَّين حالًّا", "لا يجوز هذا الإبراء", "يجوز إن أشهد عليه"], "a": 2, "q_sq": "Kreditori i tha borxhliut: «Të liroj nga 200, me kusht që të më japësh 800 që mbeten». Cila është dispozita e këtij lirimi?", "o_sq": ["Lejohet, sepse është falje e një pjese të borxhit", "Lejohet nëse borxhi është i menjëhershëm", "Ky lirim nuk lejohet", "Lejohet nëse merr dëshmitarë për të"], "pse_ar": "لقول المؤلف: «جاز، ما لم يجعل وفاء الباقي شرطاً في الهبة والإبراء».", "pse_sq": "E sakta: nuk lejohet. Autori, pasi e lejon faljen e një pjese të borxhit, thotë: «...për sa kohë që nuk e bën shlyerjen e pjesës tjetër kusht për dhurimin dhe faljen». Këtu falja u lidh me kushtin e pagesës së 800-ve, prandaj nuk është më falje e lirë. Fakti që është falje e një pjese, që borxhi është i menjëhershëm, apo që merren dëshmitarë, nuk e ndryshon dispozitën, sepse ndalimi vjen nga kushti. Shembull: «Ta fal 200 €, me kusht që të m'i japësh 800 €».", "f": "٥٩"}, {"id": "B044", "k": 12, "lloji": "mcq", "q": "لرجلٍ على آخر ألفٌ مؤجَّلةٌ إلى سنة، فقال الدائن: «عجِّل لي تسعمئةٍ الآن، وأضعُ عنك الباقي». فما الحكم؟", "o": ["يجوز، لأنه إسقاطٌ لبعض الدَّين", "يجوز إن رضي المدين", "لا يجوز هذا الصلح", "يجوز إن كان المدين مُعسِراً"], "a": 2, "q_sq": "Një njeri ka te tjetri 1.000 me afat një vit, dhe kreditori i thotë: «Më jep 900 tani, e pjesën tjetër ta fal». Cila është dispozita?", "o_sq": ["Lejohet, sepse është falje e një pjese të borxhit", "Lejohet nëse borxhliu pranon", "Kjo marrëveshje nuk lejohet", "Lejohet nëse borxhliu është në vështirësi"], "pse_ar": "لقول المؤلف: «...أو يضع بعض المؤجل ليعجِّل له الباقي».", "pse_sq": "E sakta: nuk lejohet. Ndër rastet kur falja e një pjese nuk lejohet, autori përmend: «...ose ia ul një pjesë të borxhit me afat që t'ia paguajë pjesën tjetër menjëherë». Këtu 100 u hoqën në këmbim të shpejtimit të pagesës, pra s'është falje e lirë. Pëlqimi i borxhliut nuk e bën të lejuar, sepse vetë kjo marrëveshje është rasti i ndaluar; dhe vështirësia e borxhliut s'përmendet si përjashtim. Shembull: borxhi 1.000 € paguhet pas një viti, dhe kreditori thotë «Më jep 900 € sot dhe ta fal pjesën tjetër».", "f": "٥٩"}, {"id": "B045", "k": 12, "lloji": "mcq", "q": "لرجلٍ على آخر دنانيرُ ذهب، فأراد أن يأخذ عنها دراهمَ فضة. فما الشرط في ذلك عند المؤلف؟", "o": ["أن يأخذها بسعر يوم ثبوت الدَّين، ويتقابضا في المجلس", "أن يأخذها بسعر يومها، ويتقابضا في المجلس", "أن يأخذها بسعر يومها، ولو تأخّر القبض", "أن يتساويا في الوزن، ويتقابضا في المجلس"], "a": 1, "q_sq": "Një njeri ka te tjetri dinarë ari, dhe dëshiron të marrë në vend të tyre dirhemë argjendi. Cili është kushti për këtë sipas autorit?", "o_sq": ["Ta marrë me kursin e ditës kur lindi borxhi dhe ta marrin në dorë në të njëjtin takim", "Ta marrë me kursin e asaj dite dhe ta marrin në dorë në të njëjtin takim", "Ta marrë me kursin e asaj dite, edhe nëse marrja në dorë vonohet", "Të jenë të barabarta në peshë dhe ta marrin në dorë në të njëjtin takim"], "pse_ar": "لقول المؤلف: «ويجوز اقتضاءُ الذهب عن الورِق والورِق عن الذهب إذا أخذها بسعر يومها وتقابضا في المجلس».", "pse_sq": "E sakta: me kursin e asaj dite dhe me marrje në dorë në të njëjtin takim. Autori thotë: «Lejohet marrja e arit në vend të argjendit dhe e argjendit në vend të arit, kur e merr me kursin e asaj dite dhe e marrin në dorë në të njëjtin takim». Kursi i ditës kur lindi borxhi nuk është ai që përmend autori; vonimi i marrjes në dorë e prish kushtin e dytë; ndërsa barazia në peshë kërkohet kur këmbehet ar me ar ose argjend me argjend, jo ar me argjend. Shembull i sotëm: dikush të ka borxh 100 dollarë dhe të jep euro në vend të tyre me kursin e asaj dite, dhe ti e merr gjithë shumën para se të ndaheni.", "f": "٥٩"}, {"id": "B046", "k": 12, "lloji": "tf", "q": "ادّعى رجلٌ على آخر دَيناً لا يعلمه المدّعى عليه، فصالحه على شيء؛ فالصلح لا يجوز، لأن المدّعى عليه لا يعلم الدَّين.", "a": 1, "q_sq": "Një njeri i pretendoi tjetrit një borxh që i padituri nuk e di, dhe u pajtua me të për diçka; pajtimi nuk lejohet, sepse i padituri nuk e di borxhin.", "pse_ar": "لقول المؤلف: «ومن كان له دين على غيره لا يعلمه المدعى عليه فصالحه على شيء جاز».", "pse_sq": "Pohimi është i pasaktë. Autori thotë: «Kush ka një borxh te dikush tjetër për të cilin i padituri nuk di, dhe pajtohet me të për diçka, lejohet». Mosdija e të paditurit nuk e pengon pajtimin; përkundrazi, pajtimi u jep fund grindjes kur e vërteta s'është e qartë. Shembull: dikush thotë «Më ke 1.000 €», tjetri thotë «Nuk e di», dhe pajtohen që t'i japë 600 €.", "f": "٥٩"}, {"id": "B047", "k": 12, "lloji": "mcq", "q": "ادّعى رجلٌ على آخر ألفاً وهو يعلم أنه لا حقّ له، والمدّعى عليه لا يعلم، فاصطلحا على ستمئة. فما حكم الصلح في حقّ المدّعي؟", "o": ["صحيح، لأن المدّعى عليه رضي به", "صحيح، لأن الصلح يقطع النزاع", "الصلح باطلٌ في حقّه", "صحيح إن حكم به الحاكم"], "a": 2, "q_sq": "Një njeri i pretendoi tjetrit 1.000 duke e ditur se nuk ka të drejtë, ndërsa i padituri nuk e di, dhe u pajtuan për 600. Cila është dispozita e pajtimit për pretenduesin?", "o_sq": ["I vlefshëm, sepse i padituri e pranoi", "I vlefshëm, sepse pajtimi i jep fund grindjes", "Pajtimi është i pavlefshëm për të", "I vlefshëm nëse e vendos gjykatësi"], "pse_ar": "لقول المؤلف: «وإن كان أحدهما يعلم كذبَ نفسه فالصلح في حقه باطل».", "pse_sq": "E sakta: i pavlefshëm. Autori thotë: «e nëse njëri prej tyre e di se po gënjen, pajtimi për të është i pavlefshëm». Pretenduesi e di se s'ka të drejtë, prandaj pajtimi s'ia bën të lejuar atë që merr: as pëlqimi i tjetrit, as mbyllja e grindjes, as vendimi i gjykatësit nuk e ndryshojnë dispozitën që autori e jep pa përjashtim. E njëjta vlen për të paditurin që e di se e ka borxhin dhe e mohon. Shembull: dikush shpik një borxh dhe e shtyn tjetrin të pajtohet: ajo që merr s'është e tija.", "f": "٥٩"}, {"id": "B048", "k": 12, "lloji": "tf", "q": "مَن كان له حقٌّ على رجلٍ لا يعلمان قدرَه، فاصطلحا عليه، جاز الصلح.", "a": 0, "q_sq": "Kush ka një të drejtë te një njeri, sasinë e së cilës nuk e dinë (të dy), dhe pajtohen për të, pajtimi lejohet.", "pse_ar": "لقول المؤلف: «ومن كان له حق على رجل لا يعلمان قدرَه فاصطلحا عليه جاز».", "pse_sq": "Pohimi është i saktë. Autori thotë: «Kush ka një të drejtë te një njeri, sasinë e së cilës nuk e dinë as njëri as tjetri, dhe pajtohen për të, lejohet». Kur sasia s'dihet nga asnjëra palë, pajtimi është rruga për ta mbyllur çështjen. Shembull: dy ortakë kanë llogari të vjetra dhe asnjëri s'e di saktë sa i detyrohet tjetrit; pajtohen për një shumë.", "f": "٥٩"}, {"id": "B049", "k": 13, "lloji": "mcq", "q": "ما الضابط الذي ذكره المؤلف لِما تجوز فيه الوكالة؟", "o": ["كلُّ ما يجوز بيعُه", "كلُّ ما فيه عِوَضٌ مالي", "كلُّ عقدٍ لازم", "كلُّ ما تجوز النيابةُ فيه"], "a": 3, "q_sq": "Cili është kriteri që përmend autori për atë në të cilën lejohet vekaleja (autorizimi)?", "o_sq": ["Çdo gjë që lejohet të shitet", "Çdo gjë në të cilën ka kundërvlerë pasurore", "Çdo kontratë e detyrueshme (lazim)", "Çdo gjë në të cilën lejohet zëvendësimi (nijabeja)"], "pse_ar": "لقول المؤلف: «وهي جائزة في كل ما تجوز النيابة فيه إذا كان الموكل والوكيل ممن يصح ذلك منه».", "pse_sq": "E sakta: çdo gjë në të cilën lejohet zëvendësimi. Autori thotë: «Ajo lejohet në çdo gjë në të cilën lejohet zëvendësimi, kur autorizuesi dhe i autorizuari janë nga ata prej të cilëve kjo është e vlefshme». Pra duhen dy gjëra: veprimi të pranojë zëvendësimin, dhe të dy palët të jenë nga ata që u vlen ky veprim. «Çdo gjë që lejohet të shitet» është kriteri i pengut, jo i vekales; kundërvlera pasurore s'është kusht; dhe kontrata e detyrueshme s'është kriter (vetë vekaleja është kontratë jo-detyruese). Shembull: autorizon vëllanë të ta shesë makinën ose t'ia paguajë dikujt borxhin tënd.", "f": "٥٩"}, {"id": "B050", "k": 13, "lloji": "mcq", "q": "وكّل رجلٌ آخرَ في بيع داره، ثم جُنَّ الموكِّل قبل أن يبيعها الوكيل. فما حكم الوكالة؟", "o": ["تبقى حتى يُفيق الموكِّل", "تبقى، لأنها عقدٌ لازم", "تبقى إن كانت بجُعل", "تبطل الوكالة بجنونه"], "a": 3, "q_sq": "Një njeri autorizoi tjetrin ta shesë shtëpinë e tij, pastaj autorizuesi u çmend para se i autorizuari ta shiste. Cila është dispozita e vekales?", "o_sq": ["Mbetet (pezull) derisa autorizuesi të vijë në vete", "Mbetet, sepse është kontratë e detyrueshme", "Mbetet nëse është me shpërblim (xhu'l)", "Vekaleja prishet me çmendurinë e tij"], "pse_ar": "لقول المؤلف: «وهي عقد جائز تبطل بموت كل واحد منهما وفسخِه لها وجنونِه والحجر عليه لسفه».", "pse_sq": "E sakta: prishet. Autori thotë: «Ajo është kontratë jo-detyruese, që prishet me vdekjen e secilit prej tyre, me anulimin e saj nga ai, me çmendurinë e tij dhe me ndalimin e tij (në disponim) për shkak të mendjelehtësisë (sefeh)». Çmenduria e autorizuesit është ndër shkaqet e përmendura, prandaj vekaleja prishet dhe s'mbetet pezull. Vekaleja s'është kontratë e detyrueshme (lazim), por jo-detyruese (xha'iz), dhe autori s'bën dallim mes asaj me shpërblim e asaj pa shpërblim. Shembull: e autorizove dikë të ta shesë shtëpinë dhe ai vdes, ose ti vdes, ose njëri prej jush e anulon: autorizimi mbaron.", "f": "٥٩"}, {"id": "B051", "k": 13, "lloji": "tf", "q": "ذكر المؤلف أن الشركة والمساقاة والمزارعة والجعالة والمسابقة عقودٌ جائزة، حكمُها حكمُ الوكالة في البطلان بالموت والفسخ والجنون والحجر للسَّفَه.", "a": 0, "q_sq": "Autori përmend se ortakëria, musakati, muzaraa, xhialeja (shpërblimi për kryerjen e një pune) dhe gara me shpërblim janë kontrata jo-detyruese, dispozita e të cilave është si e vekales në prishjen me vdekje, anulim, çmenduri dhe ndalim për sefeh (shpërdorim të pasurisë).", "pse_ar": "لقول المؤلف بعد ذكر ما تبطل به الوكالة: «وكذلك في كل عقد جائز كالشركة والمساقاة والمزارعة والجعالة والمسابقة».", "pse_sq": "Pohimi është i saktë. Pasi përmend shkaqet e prishjes së vekales, autori thotë: «po ashtu në çdo kontratë jo-detyruese, si ortakëria, musakati, muzaraa, xhialeja dhe garat». Kontrata jo-detyruese është ajo që secila palë mund ta prishë; prandaj ajo mbaron edhe kur njëra palë vdes, çmendet ose i vihet ndalim për shpërdorim të pasurisë. Shembull i xhiales: «Kush ma gjen telefonin e humbur, i jap 50 €».", "f": "٥٩"}, {"id": "B052", "k": 13, "lloji": "mcq", "q": "أيُّ ما يلي يجوز للوكيل فعلُه وإن لم يُصرِّح له الموكِّل به لفظاً؟", "o": ["ما تناوله الإذنُ عرفاً", "أن يوكِّل غيرَه فيما وُكِّل فيه", "أن يشتري لموكِّله من مال نفسه", "أن يبيع مالَ موكِّله لنفسه"], "a": 0, "q_sq": "Cilën nga këto i lejohet të autorizuarit ta bëjë, edhe nëse autorizuesi nuk ia ka shprehur me fjalë?", "o_sq": ["Atë që e përfshin leja sipas zakonit (urfit)", "Të autorizojë dikë tjetër në atë për të cilën u autorizua", "T'i blejë autorizuesit nga pasuria e vet", "Ta shesë pasurinë e autorizuesit te vetja"], "pse_ar": "لقول المؤلف: «وليس للوكيل أن يفعل إلا ما تناوله الإذن لفظاً أو عرفاً. وليس له توكيل غيره ولا الشراء من نفسه ولا البيع لها إلا بإذن موكله».", "pse_sq": "E sakta: atë që e përfshin leja sipas zakonit. Autori thotë: «I autorizuari nuk mund të bëjë veçse atë që e përfshin leja, me fjalë ose sipas zakonit», pastaj: «Nuk mund të autorizojë dikë tjetër, as të blejë nga vetja, as t'i shesë vetes, përveç me lejen e autorizuesit të tij». Pra leja kuptohet edhe nga zakoni, jo vetëm nga fjalët; ndërsa tri veprimet e tjera kërkojnë lejen e autorizuesit, sepse në to i autorizuari mund të ketë interesin e vet (p.sh. ta blejë lirë). Shembull: të thonë «Shite», dhe sipas zakonit kuptohet me çmimin e tregut.", "f": "٥٩"}, {"id": "B053", "k": 13, "lloji": "mcq", "q": "وكّل رجلٌ آخرَ في بيع سيارته بعشرة آلاف. فهل للوكيل أن يشتريها لنفسه بهذا الثمن؟", "o": ["نعم، لأنه باعها بالثمن الذي سمّاه", "نعم، إن لم يجد مشترياً غيره", "لا، إلا بإذن موكِّله", "لا، ولو أذن له موكِّله"], "a": 2, "q_sq": "Një njeri autorizoi tjetrin ta shesë makinën e tij për 10.000. A mund ta blejë i autorizuari për vete me këtë çmim?", "o_sq": ["Po, sepse e shiti me çmimin që ai caktoi", "Po, nëse nuk gjen blerës tjetër", "Jo, përveç me lejen e autorizuesit", "Jo, edhe nëse autorizuesi i jep leje"], "pse_ar": "لقول المؤلف: «وليس له توكيل غيره ولا الشراء من نفسه ولا البيع لها إلا بإذن موكله».", "pse_sq": "E sakta: jo, përveç me lejen e autorizuesit. Autori thotë: «Nuk mund të autorizojë dikë tjetër, as të blejë nga vetja, as t'i shesë vetes, përveç me lejen e autorizuesit të tij». Blerja e makinës për vete është shitje e pasurisë së autorizuesit te vetja, prandaj kërkon leje, edhe nëse çmimi është ai i caktuari; mungesa e blerësve të tjerë nuk e bën të lejuar. Por me lejen e autorizuesit lejohet, prandaj «jo, edhe me leje» është e gabuar. Shembull: agjenti i shitjes së një banese s'mund ta blejë vetë pa pëlqimin e pronarit.", "f": "٥٩"}, {"id": "B054", "k": 13, "lloji": "mcq", "q": "اشترى رجلٌ لصديقه حاسوباً لم يأذن له في شرائه، فلم يُجِزه الصديق. فما الحكم؟", "o": ["يلزم الصديقَ لأنه اشتُري له", "يلزمهما الحاسوبُ نصفين", "يلزم الصديقَ إن كان الثمن مثلَ ثمن السوق", "يلزم الحاسوبُ مَن اشتراه"], "a": 3, "q_sq": "Një njeri i bleu shokut një kompjuter pa leje për blerjen e tij, dhe shoku nuk e miratoi. Cila është dispozita?", "o_sq": ["I bie shokut, sepse u ble për të", "U bie të dyve përgjysmë", "I bie shokut nëse çmimi është sa i tregut", "Kompjuteri i bie atij që e bleu"], "pse_ar": "لقول المؤلف: «وإن اشترى لإنسان ما لم يأذن له فيه فأجازه جاز، وإلا لزم من اشتراه».", "pse_sq": "E sakta: i bie atij që e bleu. Autori thotë: «e nëse blen për dikë diçka për të cilën ky nuk i ka dhënë leje, e ai e miraton, vlen; përndryshe i bie atij që e ka blerë». Shoku s'e miratoi, prandaj blerja s'i kalon atij, as përgjysmë, as për shkak se çmimi ishte i drejtë: vetëm miratimi e kalon te ai. Shembull: nëse shoku do ta pranonte, blerja do të ishte e tij.", "f": "٥٩"}, {"id": "B055", "k": 13, "lloji": "tf", "q": "الوكيلُ أمينٌ، لا ضمانَ عليه فيما يتلف في يده إذا لم يتعدَّ.", "a": 0, "q_sq": "I autorizuari është i besuar (emin) dhe nuk e garanton atë që shkatërrohet në dorën e tij, kur nuk e tejkalon kufirin.", "pse_ar": "لقول المؤلف: «والوكيل أمين لا ضمان عليه فيما يَتلف إذا لم يتعد».", "pse_sq": "Pohimi është i saktë. Autori thotë: «I autorizuari është i besuar dhe nuk e garanton atë që shkatërrohet, kur nuk e ka tejkaluar kufirin». Malli është te ai me lejen e pronarit, prandaj ai paguan vetëm kur tejkalon (del jashtë lejes ose bën pakujdesi). Shembull: telefoni që duhej ta shiste i vidhet, edhe pse e ruante mirë: s'paguan asgjë.", "f": "٥٩"}, {"id": "B056", "k": 13, "lloji": "tf", "q": "إذا اختلف الوكيلُ والموكِّل في ردّ المال، فقال الوكيل: «رددتُه»، وأنكر الموكِّل، فالقولُ قولُ الموكِّل.", "a": 1, "q_sq": "Kur i autorizuari dhe autorizuesi nuk pajtohen për kthimin e pasurisë: i autorizuari thotë «E ktheva», ndërsa aut
